# Base de données de développement : docker compose up -d
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: epp
      POSTGRES_PASSWORD: epp
      POSTGRES_DB: epp_dev
    ports:
      - "5432:5432"
    volumes:
      - epp-db:/var/lib/postgresql/data
      - ./docker/init-bases.sql:/docker-entrypoint-initdb.d/init-bases.sql:ro
volumes:
  epp-db:
