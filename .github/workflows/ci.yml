name: Vérifications

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verifications:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: epp
          POSTGRES_PASSWORD: epp
          POSTGRES_DB: epp_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U epp" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://epp:epp@localhost:5432/epp_test
      TEST_DATABASE_URL: postgresql://epp:epp@localhost:5432/epp_test
      SESSION_SECRET: secret-de-ci-uniquement-0123456789abcdef
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx eslint .
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
