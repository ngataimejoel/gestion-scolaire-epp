name: Installateur Windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Construire l'installateur
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: Gestion-Scolaire-EPP-Setup
          path: dist/*.exe
          if-no-files-found: error
      - name: Publier la version (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: gh release create "$GITHUB_REF_NAME" dist/*.exe --title "Gestion Scolaire EPP $GITHUB_REF_NAME" --notes "Installateur Windows (64 bits)."
        env:
          GH_TOKEN: ${{ github.token }}
