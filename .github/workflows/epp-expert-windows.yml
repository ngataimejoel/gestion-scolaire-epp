name: EPP EXPERT (Python) - Windows

on:
  push:
    branches: [main, "claude/**"]
    paths: ["epp-expert/**", ".github/workflows/epp-expert-windows.yml"]
    tags: ["expert-v*"]
  pull_request:
    paths: ["epp-expert/**", ".github/workflows/epp-expert-windows.yml"]
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

defaults:
  run:
    shell: pwsh
    working-directory: epp-expert

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: epp-expert/requirements-dev.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Installer les dépendances
        run: python -m pip install -r requirements-dev.txt

      - name: Tests du service d'activation (Node)
        working-directory: epp-expert/activation
        run: |
          npm ci --no-audit --no-fund
          npm test

      - name: Tests automatiques
        run: python -m pytest -q -rs

      - name: Construire l'exécutable (PyInstaller)
        run: pyinstaller --noconfirm --clean packaging/gestion_scolaire.spec

      - name: Auto-test de l'exécutable (sans Python)
        run: |
          $p = Start-Process dist\GestionScolaireEPP\GestionScolaireEPP.exe -ArgumentList "--selftest","--rapport","$pwd\selftest_exe.txt" -Wait -PassThru
          Get-Content selftest_exe.txt
          if ($p.ExitCode -ne 0) { throw "auto-test de l'exécutable en échec ($($p.ExitCode))" }

      - name: Construire l'installateur (Inno Setup)
        run: |
          if (-not (Get-Command ISCC.exe -ErrorAction SilentlyContinue)) { choco install innosetup -y --no-progress }
          $iscc = (Get-Command ISCC.exe -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc packaging\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC en échec" }
          Get-ChildItem dist\*.exe

      - name: Installation silencieuse, auto-test, mise à jour, désinstallation
        run: |
          $setup = (Get-ChildItem dist\AkwaSchool-Setup-*.exe).FullName
          $dir = "$env:RUNNER_TEMP\EPPInstall"
          $data = "$env:LOCALAPPDATA\GestionScolaireEPP"
          # 1. installation
          $p = Start-Process $setup -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/CURRENTUSER","/DIR=`"$dir`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "installation en échec" }
          if (-not (Test-Path "$dir\GestionScolaireEPP.exe")) { throw "exécutable absent après installation" }
          if (Test-Path "$dir\*.sqlite") { throw "la base ne doit pas être dans le dossier d'installation" }
          $menu = "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\AKWA SCHOOL\AKWA SCHOOL.lnk"
          if (-not (Test-Path $menu)) { throw "raccourci AKWA SCHOOL absent du menu Démarrer" }
          $p = Start-Process "$dir\GestionScolaireEPP.exe" -ArgumentList "--selftest","--rapport","$pwd\selftest_installe.txt" -Wait -PassThru
          Get-Content selftest_installe.txt
          if ($p.ExitCode -ne 0) { throw "auto-test après installation en échec" }
          # 2. données de l'utilisateur simulées
          New-Item -ItemType Directory -Force $data | Out-Null
          Set-Content "$data\temoin.txt" "données de l'école"
          # 3. mise à jour (réinstallation par-dessus)
          $p = Start-Process $setup -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/CURRENTUSER","/DIR=`"$dir`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "mise à jour en échec" }
          if (-not (Test-Path "$data\temoin.txt")) { throw "données perdues lors de la mise à jour" }
          # 4. désinstallation silencieuse : les données doivent rester
          $p = Start-Process "$dir\unins000.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait -PassThru
          Start-Sleep -Seconds 5
          if (Test-Path "$dir\GestionScolaireEPP.exe") { throw "programme non supprimé par la désinstallation" }
          if (-not (Test-Path "$data\temoin.txt")) { throw "données supprimées par la désinstallation" }
          Write-Host "Installation, mise à jour et désinstallation : OK (données conservées)"

      - uses: actions/upload-artifact@v4
        with:
          name: AkwaSchool-Setup
          path: |
            epp-expert/dist/AkwaSchool-Setup-*.exe
            epp-expert/selftest_*.txt
          if-no-files-found: error

  # Étiquette expert-vX.Y.Z (poussée, ou créée en publiant une version sur la page GitHub) : l'installateur
  # testé ci-dessus est publié en version publique (téléchargeable sans compte GitHub), sous son nom
  # versionné et sous le nom fixe AkwaSchool-Setup.exe (lien « latest »).
  publier:
    needs: windows
    if: startsWith(github.ref, 'refs/tags/expert-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
        working-directory: .
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: AkwaSchool-Setup
          path: setup
      - name: Publier la version
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          exe=$(ls setup/dist/AkwaSchool-Setup-*.exe 2>/dev/null || ls setup/AkwaSchool-Setup-*.exe)
          cp "$exe" AkwaSchool-Setup.exe
          version="${TAG#expert-v}"
          cat > notes.md <<NOTES
          AKWA SCHOOL – Gestion scolaire EPP, version ${version}, pour Windows 10 et 11.

          Téléchargez **AkwaSchool-Setup.exe** ci-dessous, puis lancez-le. Si l'application est déjà installée,
          ce même fichier la met à jour : les données de l'école sont conservées.
          NOTES
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # version créée depuis la page GitHub (Releases › Draft a new release) : on y joint l'installateur
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber AkwaSchool-Setup.exe "$exe"
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file notes.md --latest
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "AKWA SCHOOL ${version}" \
              --notes-file notes.md --latest AkwaSchool-Setup.exe "$exe"
          fi
