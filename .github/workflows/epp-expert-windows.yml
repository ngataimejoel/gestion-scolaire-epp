name: EPP EXPERT (Python) - Windows

on:
  push:
    branches: [main, "claude/**"]
    paths: ["epp-expert/**", ".github/workflows/epp-expert-windows.yml"]
    tags: ["expert-v*"]
  pull_request:
    paths: ["epp-expert/**", ".github/workflows/epp-expert-windows.yml"]
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

defaults:
  run:
    shell: pwsh
    working-directory: epp-expert

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: epp-expert/requirements-dev.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Installer les dépendances
        run: python -m pip install -r requirements-dev.txt

      - name: Tests du service d'activation (Node)
        working-directory: epp-expert/activation
        run: |
          npm ci --no-audit --no-fund
          npm test

      - name: Tests automatiques
        run: python -m pytest -q -rs

      # Outil du fournisseur (création des codes) : fichier de compilation seulement, jamais publié
      - name: Construire le générateur de codes (outil du fournisseur)
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name GenerateurCodes --icon epp\resources\app.ico `
            --distpath dist_fournisseur --workpath build_fournisseur outils\generateur_codes.py
          if (-not (Test-Path dist_fournisseur\GenerateurCodes.exe)) { throw "GenerateurCodes.exe absent" }

      - uses: actions/upload-artifact@v4
        with:
          name: GenerateurCodes-fournisseur
          path: epp-expert/dist_fournisseur/GenerateurCodes.exe
          if-no-files-found: error

  # Application Android (android/) : client de synchronisation testé contre le vrai serveur Python, puis APK signé.
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: epp-expert
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Dépendances du serveur de synchronisation (sans l'interface Qt)
        run: grep -v '^PySide6' requirements.txt | python -m pip install -r /dev/stdin

      - name: Client Java du téléphone contre le serveur de l'ordinateur
        run: |
          javac -encoding UTF-8 -d build/jvm android/app/src/main/java/com/akwaschool/mobile/synchro/*.java \
            android/test-jvm/TestSynchro.java
          mkfifo arret
          python outils/serveur_synchro_test.py info.json < arret > serveur.log 2>&1 &
          serveur=$!
          exec 3> arret                      # entrée du serveur ouverte tant que le test tourne
          for i in $(seq 90); do [ -s info.json ] && break; sleep 1; done
          java -Dfile.encoding=UTF-8 -cp build/jvm TestSynchro info.json
          exec 3>&-                          # fin du test : le serveur s'arrête et vérifie la note reçue
          wait $serveur
          cat serveur.log

      - name: Noyau Java du téléphone seul (licence, lecture des fichiers, sauvegarde) comparé au code Python
        run: |
          javac -encoding UTF-8 -d build/jvm-noyau android/app/src/main/java/com/akwaschool/mobile/synchro/*.java \
            android/app/src/main/java/com/akwaschool/mobile/noyau/*.java android/test-jvm/TestNoyau.java
          python outils/fixtures_noyau.py preparer build/noyau
          java -Dfile.encoding=UTF-8 -cp build/jvm-noyau TestNoyau build/noyau
          python outils/fixtures_noyau.py verifier build/noyau

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Construire l'APK signé
        working-directory: epp-expert/android
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # clé privée uniquement dans les secrets GitHub : pas de clé dans le dépôt public
          if [ -z "$ANDROID_KEYSTORE_B64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "::error::Secrets de signature Android manquants (ANDROID_KEYSTORE_B64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD)"
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/akwa.p12"
          export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/akwa.p12"
          trap 'rm -f "$RUNNER_TEMP/akwa.p12"' EXIT
          gradle --no-daemon --stacktrace assembleRelease
          cp app/build/outputs/apk/release/app-release.apk AkwaSchool.apk
          outils=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$outils/apksigner" verify --print-certs AkwaSchool.apk
          "$outils/aapt2" dump badging AkwaSchool.apk | head -3
          unzip -l AkwaSchool.apk | grep -E "assets/www/(index.html|pont_android.js)"
          ls -l AkwaSchool.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AkwaSchool-Android
          path: epp-expert/android/AkwaSchool.apk
          if-no-files-found: error

  # AKWA SCHOOL v8 : application distincte (interface du prototype HTML v8 dans le moteur web de Qt)
  windows_v8:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: epp-expert/requirements-dev.txt

      - name: Installer les dépendances
        run: python -m pip install -r requirements-dev.txt

      - name: Tests de l'application v8
        run: python -m pytest -q -rs tests/test_v8.py

      - name: Construire l'exécutable v8 (PyInstaller)
        run: pyinstaller --noconfirm --clean packaging/akwa_v8.spec

      - name: Auto-test de l'exécutable v8 (sans Python)
        run: |
          $p = Start-Process dist\AkwaSchoolV8\AkwaSchoolV8.exe -ArgumentList "--selftest","--rapport","$pwd\selftest_v8.txt" -Wait -PassThru
          Get-Content selftest_v8.txt
          if ($p.ExitCode -ne 0) { throw "auto-test de l'exécutable v8 en échec ($($p.ExitCode))" }

      - name: Construire l'installateur v8 (Inno Setup)
        run: |
          if (-not (Get-Command ISCC.exe -ErrorAction SilentlyContinue)) { choco install innosetup -y --no-progress }
          $iscc = (Get-Command ISCC.exe -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc packaging\installer_v8.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC en échec" }

      - name: Installation silencieuse, auto-test, désinstallation
        run: |
          $setup = (Get-ChildItem dist\AkwaSchool-v8-Setup-*.exe).FullName
          $dir = "$env:RUNNER_TEMP\AkwaV8"
          $p = Start-Process $setup -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/CURRENTUSER","/DIR=`"$dir`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "installation en échec" }
          $menu = "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\AKWA SCHOOL v8\AKWA SCHOOL v8.lnk"
          if (-not (Test-Path $menu)) { throw "raccourci AKWA SCHOOL v8 absent du menu Démarrer" }
          $p = Start-Process "$dir\AkwaSchoolV8.exe" -ArgumentList "--selftest","--rapport","$pwd\selftest_v8_installe.txt" -Wait -PassThru
          Get-Content selftest_v8_installe.txt
          if ($p.ExitCode -ne 0) { throw "auto-test après installation en échec" }
          $p = Start-Process "$dir\unins000.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait -PassThru
          Start-Sleep -Seconds 5
          if (Test-Path "$dir\AkwaSchoolV8.exe") { throw "programme non supprimé par la désinstallation" }

      - uses: actions/upload-artifact@v4
        with:
          name: AkwaSchool-v8-Setup
          path: |
            epp-expert/dist/AkwaSchool-v8-Setup-*.exe
            epp-expert/selftest_v8*.txt
          if-no-files-found: error

  # Étiquette expert-vX.Y.Z (poussée, ou créée en publiant une version sur la page GitHub) : l'installateur
  # testé ci-dessus est publié en version publique (téléchargeable sans compte GitHub), sous son nom
  # versionné et sous le nom fixe AkwaSchool-Setup.exe (lien « latest »), avec l'application Android
  # (AkwaSchool.apk).
  publier:
    needs: [windows, windows_v8, android]
    if: startsWith(github.ref, 'refs/tags/expert-v')
    runs-on: ubuntu-latest
    concurrency:                 # étiquette et version publiée déclenchent chacune une exécution : l'une après l'autre
      group: publier-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
        working-directory: .
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: AkwaSchool-v8-Setup
          path: setup_v8
      - uses: actions/download-artifact@v4
        with:
          name: AkwaSchool-Android
          path: android
      - name: Publier la version
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # une seule application Windows : AKWA SCHOOL v8 ; AkwaSchool-Setup.exe (ancien lien public) donne aussi la v8
          exe8=$(ls setup_v8/dist/AkwaSchool-v8-Setup-*.exe 2>/dev/null || ls setup_v8/AkwaSchool-v8-Setup-*.exe)
          cp "$exe8" AkwaSchool-v8-Setup.exe
          cp "$exe8" AkwaSchool-Setup.exe
          version="${TAG#expert-v}"
          cp android/AkwaSchool.apk AkwaSchool.apk
          cp android/AkwaSchool.apk "AkwaSchool-${version}.apk"
          cat > notes.md <<NOTES
          AKWA SCHOOL – Gestion scolaire EPP, version ${version}, pour Windows 10 et 11.

          Téléchargez **AkwaSchool-v8-Setup.exe** ci-dessous, puis lancez-le. Si l'application est déjà installée,
          ce même fichier la met à jour : les données de l'école sont conservées.
          (AkwaSchool-Setup.exe est le même installateur, gardé pour les anciens liens.)

          **Téléphones Android (8 ou plus récent)** : téléchargez **AkwaSchool.apk** sur le téléphone et ouvrez-le
          pour l'installer. Il fonctionne seul, sans Internet ; il échange ses données avec l'ordinateur par la sauvegarde.
          NOTES
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # version créée depuis la page GitHub (Releases › Draft a new release) : on y joint l'installateur
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber AkwaSchool-Setup.exe AkwaSchool-v8-Setup.exe "$exe8" \
              AkwaSchool.apk "AkwaSchool-${version}.apk"
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file notes.md --latest
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "AKWA SCHOOL ${version}" \
              --notes-file notes.md --latest AkwaSchool-Setup.exe AkwaSchool-v8-Setup.exe "$exe8" AkwaSchool.apk "AkwaSchool-${version}.apk"
          fi
