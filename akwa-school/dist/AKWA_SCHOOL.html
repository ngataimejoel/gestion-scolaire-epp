</script>
<script>
/* =====================================================================================
   QR codes des documents : contenu minimal, canonique et vérifiable.

   Format (version 1), champs dans cet ordre, séparés par « ; » :
     AKS1 ; T=<type> ; R=<référence> ; E=<émission AAAA-MM-JJ> ; X=<expiration> ; H=<empreinte>
          [; N=<NOM PRÉNOMS>] [; M=<matricule>] ; K=<clé> ; S=<signature>
   - Jamais de photo, de téléphone, de donnée médicale ni de détail d'acte de naissance.
   - N et M (nom et matricule, déjà imprimés sur le document) seulement si le modèle le prévoit
     (cartes d'identification par défaut) : ils permettent une vérification hors ligne sans base.
   - H : empreinte SHA-256 (80 bits, base 32) des données du titulaire au moment de l'émission.
   - S : signature ECDSA P-256 du texte qui précède « ;S= » (absente si aucune clé n'est créée).
   ===================================================================================== */
(function (AK) {
  'use strict';
  const u = AK.u;
  const PREFIXE = 'AKS1';
  const ORDRE = ['T', 'R', 'E', 'X', 'H', 'N', 'M', 'K'];

  /** Valeur sûre dans le QR : majuscules sans accents, sans « ; » ni « = ». */
  const propre = (v) => u.sansAccents(String(v || '')).toUpperCase().replace(/[;=\r\n]/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 60);

  /** Données canoniques du titulaire → empreinte H (texte de 16 caractères). */
  async function empreinteTitulaire(canon) {
    const t = ['type', 'ref', 'nom', 'prenoms', 'matricule', 'classe', 'annee', 'ecole', 'extra'].map((k) => propre(canon[k])).join('|');
    if (!AK.crypto.dispo()) return '';
    return AK.crypto.b32((await AK.crypto.sha256(t)).slice(0, 10));
  }

  /** Texte signé (sans la signature). */
  function message(c) {
    const parts = [PREFIXE];
    ORDRE.forEach((k) => {
      if (c[k] != null && c[k] !== '') parts.push(`${k}=${k === 'R' ? String(c[k]).toUpperCase() : propre(c[k])}`);
    });
    return parts.join(';');
  }
  function texte(c) {
    const m = message(c);
    return c.S ? `${m};S=${c.S}` : m;
  }
  /** Lecture tolérante (espaces, minuscules, saisie au clavier) ; null si ce n'est pas un QR AKWA. */
  function lire(brut) {
    let s = String(brut || '').trim();
    try {
      if (/%[0-9A-F]{2}/i.test(s)) s = decodeURIComponent(s);
    } catch (e) { /* texte laissé tel quel */ }
    const i = s.toUpperCase().indexOf(PREFIXE + ';');
    if (i < 0) return null;
    s = s.slice(i);
    const champs = {};
    const morceaux = s.split(';');
    for (const p of morceaux.slice(1)) {
      const k = p.indexOf('=');
      if (k < 1) continue;
      const cle = p.slice(0, k).trim().toUpperCase();
      champs[cle] = p.slice(k + 1).trim();
    }
    if (!champs.T || !champs.R) return null;
    const sansSig = { ...champs };
    delete sansSig.S;
    return { champs, message: message(sansSig), signature: champs.S || null };
  }

  /** Matrice → SVG vectoriel (zone de silence de 4 modules), net à toutes les tailles. */
  function svg(texteQR, { niveau = 'M', titre = 'QR code' } = {}) {
    const m = AK.vendor.qr.matrix(texteQR, niveau);
    const n = m.size;
    let d = '';
    for (let r = 0; r < n; r++) {
      let c = 0;
      while (c < n) {
        if (m.rows[r][c]) {
          let l = 1;
          while (c + l < n && m.rows[r][c + l]) l++;
          d += `M${c + 4} ${r + 4}h${l}v1h-${l}z`;
          c += l;
        } else c++;
      }
    }
    const t = n + 8;
    return u.raw(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${t} ${t}" shape-rendering="crispEdges" role="img" aria-label="${u.esc(titre)}"><rect width="${t}" height="${t}" fill="#fff"/><path d="${d}" fill="#000"/></svg>`);
  }

  AK.qr = { PREFIXE, propre, empreinteTitulaire, message, texte, lire, svg };
})(window.AK);

//# sourceURL=akwa/js/docs/qr.js
</script>
<script>
/* =====================================================================================
   Lecture de QR codes à partir d'une image (caméra ou photo), entièrement hors ligne.
   Écrit pour AKWA SCHOOL (aucune bibliothèque téléchargeable) ; s'appuie sur les tables
   éprouvées de la bibliothèque de génération (blocs Reed-Solomon, codes BCH, masques).

   Étapes : niveaux de gris → seuillage adaptatif → repérage des trois motifs de position →
   motif d'alignement → transformation perspective → échantillonnage → format et version →
   démasquage → codes correcteurs (Reed-Solomon) → segments (numérique, alphanumérique, octets).
   Si l'API BarcodeDetector du navigateur existe, elle est essayée d'abord (plus rapide).
   ===================================================================================== */
(function (AK) {
  'use strict';
  const Q = () => AK.vendor.qr;

  /* ---------- Image → matrice binaire ---------- */
  function binariser(img) {
    const { data, width: w, height: h } = img;
    const lum = new Uint8ClampedArray(w * h);
    for (let i = 0, p = 0; i < lum.length; i++, p += 4) lum[i] = (data[p] * 77 + data[p + 1] * 150 + data[p + 2] * 29) >> 8;
    const B = 8, bw = Math.ceil(w / B), bh = Math.ceil(h / B);
    const seuils = new Float32Array(bw * bh);
    for (let by = 0; by < bh; by++)
      for (let bx = 0; bx < bw; bx++) {
        let min = 255, max = 0, som = 0, n = 0;
        for (let y = by * B; y < Math.min(h, by * B + B); y++)
          for (let x = bx * B; x < Math.min(w, bx * B + B); x++) {
            const v = lum[y * w + x];
            som += v;
            n++;
            if (v < min) min = v;
            if (v > max) max = v;
          }
        let moy = som / n;
        if (max - min <= 24) {
          moy = min / 2;
          if (by > 0 && bx > 0) {
            const voisins = (seuils[(by - 1) * bw + bx] + 2 * seuils[by * bw + bx - 1] + seuils[(by - 1) * bw + bx - 1]) / 4;
            if (min < voisins) moy = voisins;
          }
        }
        seuils[by * bw + bx] = moy;
      }
    const noir = new Uint8Array(w * h);
    for (let by = 0; by < bh; by++)
      for (let bx = 0; bx < bw; bx++) {
        let s = 0, n = 0;
        for (let dy = -2; dy <= 2; dy++)
          for (let dx = -2; dx <= 2; dx++) {
            const yy = by + dy, xx = bx + dx;
            if (yy >= 0 && xx >= 0 && yy < bh && xx < bw) {
              s += seuils[yy * bw + xx];
              n++;
            }
          }
        const t = s / n;
        for (let y = by * B; y < Math.min(h, by * B + B); y++)
          for (let x = bx * B; x < Math.min(w, bx * B + B); x++) noir[y * w + x] = lum[y * w + x] <= t ? 1 : 0;
      }
    return { w, h, noir, inverse: false, get(x, y) { return x >= 0 && y >= 0 && x < w && y < h ? noir[y * w + x] ^ (this.inverse ? 1 : 0) : 0; } };
  }

  /* ---------- Motifs de position (1:1:3:1:1) ---------- */
  function ratioOk(c, tol = 0.5) {
    const total = c[0] + c[1] + c[2] + c[3] + c[4];
    if (total < 7) return false;
    const m = total / 7, v = m * tol;
    return Math.abs(m - c[0]) < v && Math.abs(m - c[1]) < v && Math.abs(3 * m - c[2]) < 3 * v && Math.abs(m - c[3]) < v && Math.abs(m - c[4]) < v;
  }
  const centreDe = (c, fin) => fin - c[4] - c[3] - c[2] / 2;
  function croiserVertical(M, cx, cy, maxCompte, total) {
    const c = [0, 0, 0, 0, 0];
    let y = cy;
    while (y >= 0 && M.get(cx, y)) { c[2]++; y--; }
    if (y < 0) return NaN;
    while (y >= 0 && !M.get(cx, y) && c[1] <= maxCompte) { c[1]++; y--; }
    if (y < 0 || c[1] > maxCompte) return NaN;
    while (y >= 0 && M.get(cx, y) && c[0] <= maxCompte) { c[0]++; y--; }
    if (c[0] > maxCompte) return NaN;
    y = cy + 1;
    while (y < M.h && M.get(cx, y)) { c[2]++; y++; }
    if (y === M.h) return NaN;
    while (y < M.h && !M.get(cx, y) && c[3] < maxCompte) { c[3]++; y++; }
    if (y === M.h || c[3] >= maxCompte) return NaN;
    while (y < M.h && M.get(cx, y) && c[4] < maxCompte) { c[4]++; y++; }
    if (c[4] >= maxCompte) return NaN;
    const t = c[0] + c[1] + c[2] + c[3] + c[4];
    if (5 * Math.abs(t - total) >= 2 * total) return NaN;
    return ratioOk(c) ? centreDe(c, y) : NaN;
  }
  function croiserHorizontal(M, cx, cy, maxCompte, total) {
    const c = [0, 0, 0, 0, 0];
    let x = cx;
    while (x >= 0 && M.get(x, cy)) { c[2]++; x--; }
    if (x < 0) return NaN;
    while (x >= 0 && !M.get(x, cy) && c[1] <= maxCompte) { c[1]++; x--; }
    if (x < 0 || c[1] > maxCompte) return NaN;
    while (x >= 0 && M.get(x, cy) && c[0] <= maxCompte) { c[0]++; x--; }
    if (c[0] > maxCompte) return NaN;
    x = cx + 1;
    while (x < M.w && M.get(x, cy)) { c[2]++; x++; }
    if (x === M.w) return NaN;
    while (x < M.w && !M.get(x, cy) && c[3] < maxCompte) { c[3]++; x++; }
    if (x === M.w || c[3] >= maxCompte) return NaN;
    while (x < M.w && M.get(x, cy) && c[4] < maxCompte) { c[4]++; x++; }
    if (c[4] >= maxCompte) return NaN;
    const t = c[0] + c[1] + c[2] + c[3] + c[4];
    if (5 * Math.abs(t - total) >= total) return NaN;
    return ratioOk(c) ? centreDe(c, x) : NaN;
  }
  function chercherMotifs(M) {
    const cands = [];
    const ajouter = (x, y, taille) => {
      const ex = cands.find((p) => Math.abs(p.x - x) <= taille && Math.abs(p.y - y) <= taille && Math.abs(p.m - taille) <= Math.max(1, p.m) * 0.7);
      if (ex) {
        ex.x = (ex.x * ex.n + x) / (ex.n + 1);
        ex.y = (ex.y * ex.n + y) / (ex.n + 1);
        ex.m = (ex.m * ex.n + taille) / (ex.n + 1);
        ex.n++;
      } else cands.push({ x, y, m: taille, n: 1 });
    };
    const pas = Math.max(1, Math.floor(M.h / 300));
    for (let y = 0; y < M.h; y += pas) {
      const c = [0, 0, 0, 0, 0];
      let etat = 0;
      for (let x = 0; x < M.w; x++) {
        const n = M.get(x, y);
        if (n) {
          if (etat & 1) etat++;
          c[etat]++;
        } else if (!(etat & 1)) {
          if (etat === 4) {
            if (ratioOk(c)) {

    if (!TYPES.some(([k]) => k === o.type)) o.type = 'aucun';
    o.texte = String(o.texte || '').slice(0, 60);
    o.opacite = borne(o.opacite, 2, 30, DEFAUT.opacite);
    o.taille = borne(o.taille, 20, 100, DEFAUT.taille);
    o.rotation = borne(o.rotation, -90, 90, DEFAUT.rotation);
    o.position = ['centre', 'haut', 'bas'].includes(o.position) ? o.position : 'centre';
    o.couleur = /^#[0-9a-f]{6}$/i.test(o.couleur) ? o.couleur : DEFAUT.couleur;
    o.repetition = !!o.repetition;
    o.logo = ['ecole', 'iepp', 'armoiries', 'akwa'].includes(o.logo) ? o.logo : 'ecole';
    o.ecran = o.ecran !== false;
    o.impression = o.impression !== false;
    return o;
  }

  const imageLogo = (cle) => {
    const sc = AK.store.etat ? AK.store.etat.school : {};
    return cle === 'iepp' ? sc.logoIepp : cle === 'armoiries' ? sc.armoiries || AK.assets.armoiries : cle === 'akwa' ? AK.assets.logo : sc.logoEcole || AK.assets.logo;
  };

  /** Texte en diagonale ou répété ; largeur/hauteur en mm de la zone. */
  function svgTexte(t, { couleur, opacite, taille, rotation, position, repetition }, l, h) {
    const cx = l / 2, cy = position === 'haut' ? h * 0.3 : position === 'bas' ? h * 0.72 : h / 2;
    const fs = (Math.min(l, h) * (taille / 100)) / Math.max(4, t.length * 0.55);
    const style = `font-family:Arial,'Liberation Sans',sans-serif;font-weight:800;letter-spacing:${fs * 0.06}`;
    if (repetition) {
      const pas = fs * 4.2, lignes = [];
      for (let y = -h; y < h * 2; y += pas)
        for (let x = -l; x < l * 2; x += t.length * fs * 0.75 + fs * 2) lignes.push(`<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" font-size="${(fs * 0.5).toFixed(2)}" style="${style}">${u.esc(t)}</text>`);
      return `<g fill="${couleur}" fill-opacity="${opacite / 100}" transform="rotate(${rotation} ${cx} ${cy})">${lignes.join('')}</g>`;
    }
    return `<text x="${cx}" y="${cy}" text-anchor="middle" dominant-baseline="middle" font-size="${fs.toFixed(2)}" fill="${couleur}" fill-opacity="${opacite / 100}" style="${style}" transform="rotate(${rotation} ${cx} ${cy})">${u.esc(t)}</text>`;
  }

  /**
   * Calques de filigrane d'une feuille (Html) : décoratif (réglages du modèle) puis statut.
   * l, h : dimensions de la feuille en mm.
   */
  function calques(reglages, statut, l, h) {
    const f = normaliser(reglages);
    const out = [];
    const sc = AK.store.etat ? AK.store.etat.school : {};
    const classes = (o) => `filigrane${o.ecran ? '' : ' fil-ecran-non'}${o.impression ? '' : ' fil-impr-non'}`;
    if (f.type !== 'aucun') {
      let corps = '';
      if (f.type === 'logo') {
        const src = imageLogo(f.logo);
        const t = Math.min(l, h) * (f.taille / 100);
        const y = f.position === 'haut' ? h * 0.3 - t / 2 : f.position === 'bas' ? h * 0.72 - t / 2 : (h - t) / 2;
        if (src && u.IMG_OK.test(src)) corps = `<image href="${src}" x="${(l - t) / 2}" y="${y}" width="${t}" height="${t}" opacity="${f.opacite / 100}" preserveAspectRatio="xMidYMid meet"/>`;
      } else {
        const t = f.type === 'nom' ? sc.name || 'AKWA SCHOOL' : f.type === 'officiel' ? 'DOCUMENT OFFICIEL' : f.texte;
        if (t) corps = svgTexte(t, f, l, h);
      }
      if (corps) out.push(`<div class="${classes(f)}" aria-hidden="true"><svg viewBox="0 0 ${l} ${h}" preserveAspectRatio="none">${corps}</svg></div>`);
    }
    const st = statut && STATUTS[statut];
    if (st) {
      const o = { couleur: st.couleur, opacite: st.opacite, taille: 92, rotation: -32, position: 'centre', repetition: false };
      out.push(`<div class="filigrane statut" aria-hidden="true"><svg viewBox="0 0 ${l} ${h}" preserveAspectRatio="none">${svgTexte(st.texte, o, l, h)}</svg></div>`);
    }
    return u.raw(out.join(''));
  }

  AK.filigrane = { DEFAUT, TYPES, STATUTS, normaliser, calques, libelleStatut: (s) => (STATUTS[s] ? STATUTS[s].texte : '') };
})(window.AK);

<script>
/* =====================================================================================
   Registre des documents émis : référence unique, empreinte, signature, statut, historique.

   Deux politiques d'émission :
   - « registre » (certificats, attestations, cartes, exeat…) : chaque émission crée une
     nouvelle référence. Réimpression = COPIE ; duplicata = nouvelle référence, l'original
     peut être invalidé (carte perdue).
   - « unique » (bulletins, fiches) : une référence par élève et par période. Si le contenu
     change (note corrigée), une nouvelle version est enregistrée ; la vérification d'un
     exemplaire ancien signale qu'il n'est plus la version en vigueur.
   Rien n'est jamais effacé : un document annulé reste au registre avec son motif.
   ===================================================================================== */
(function (AK) {
  'use strict';
  const u = AK.u, V = AK.valid;
  const S = () => AK.store.etat;
  const E = (m) => new AK.ErreurMetier(m);

  const TYPES = {
    CEL: 'Carte d’identité scolaire',
    CPE: 'Carte professionnelle',
    CSC: 'Certificat de scolarité',
    ATF: 'Attestation de fréquentation',
    CTR: 'Certificat de transfert (exeat)',
    FIS: 'Fiche scolaire',
    FII: 'Fiche individuelle de l’élève',
    FIN: 'Fiche d’inscription',
    BUL: 'Bulletin de notes',
    BUA: 'Bulletin annuel',
    ATS: 'Attestation de service',
    REC: 'Reçu de versement'
  };

  const statutEffectif = (d) => {
    if (!d) return 'inconnu';
    if (d.statut === 'annule') return 'annule';
    if (d.statut === 'remplace') return 'remplace';
    if (d.expire && d.expire < u.aujourdhui()) return 'expire';
    return 'valide';
  };
  const trouver = (ref) => (S().docs.items || []).find((d) => d.ref === V.normRef(ref)) || null;
  const auteur = () => AK.session.libelle();

  function nouvelleReference(type) {
    const an = new Date().getFullYear();
    const cle = `${type}-${an}`;
    const n = (S().docs.seq[cle] || 0) + 1;
    return { ref: V.reference(type, an, n), cle, n };
  }

  /** Construit et signe le contenu du QR d'un document. */
  async function contenuQR(d, canon, identite) {
    const c = { T: d.type, R: d.ref, E: d.emisLe.slice(0, 10), X: d.expire || '', H: d.H };
    if (identite) {
      c.N = [canon.nom, canon.prenoms].filter(Boolean).join(' ');
      c.M = canon.matricule || '';
    }
    let sig = null;
    if (AK.cles.active() && AK.crypto.dispo() && !S().meta.demo) {
      c.K = AK.cles.active().id;
      sig = await AK.cles.signer(AK.qr.message(c));
      if (!sig) delete c.K; // signature refusée (mot de passe non saisi) : document non signé
      else c.S = sig.sig;
    }
    return { texte: AK.qr.texte(c), kid: sig ? sig.kid : null };
  }

  const registre = {
    TYPES,
    statutEffectif,
    trouver,
    libelleType: (t) => TYPES[t] || t,
    /** Documents d'un sujet (élève ou membre du personnel). */
    duSujet: (id) => (S().docs.items || []).filter((d) => d.sujet && d.sujet.id === id),
    /**
     * Émet (ou réutilise, pour la politique « unique ») un document.
     * o = { type, modele, version, politique: 'registre'|'unique', cleUnique, sujet: {type, id, libelle},
     *       canon: { nom, prenoms, matricule, classe, annee, ecole, extra }, expire, qr: { actif, identite }, duplicataDe }
     * Renvoie { doc, qrTexte, statutFiligrane, nouveau }.
     */
    async emettre(o) {
      const demo = !!S().meta.demo;
      if (!AK.perm.peut('document.emettre') && !(o.politique === 'unique' && AK.perm.peut('document.imprimerClasse', { classe: o.canon && o.canon.classe })))
        throw new AK.ErreurDroits('L’émission de ce document est réservée au directeur.');
      if (!TYPES[o.type]) throw E('Type de document inconnu.');
      const qrActif = o.qr ? o.qr.actif !== false : true;

      // politique « unique » : même référence pour le même élève et la même période
      if (o.politique === 'unique') {
        const exist = (S().docs.items || []).find((d) => d.cleUnique === o.cleUnique && d.statut === 'valide');
        if (exist) {
          const H = await AK.qr.empreinteTitulaire({ ...o.canon, type: o.type, ref: exist.ref });
          let qrTexte = exist.qr;
          let nouvelleVersion = false;
          if (H !== exist.H || !qrTexte || (qrActif && !exist.qr)) {
            nouvelleVersion = true;
            const v = { ...exist, H, emisLe: new Date().toISOString() };
            const q = qrActif ? await contenuQR(v, o.canon, o.qr && o.qr.identite) : { texte: '', kid: null };
            qrTexte = q.texte;
            AK.store.modifier(`${TYPES[o.type]} ${exist.ref} : nouvelle version`, () => {
              exist.versions = exist.versions || [];
              exist.versions.push({ H: exist.H, le: exist.emisLe, qr: exist.qr });
              Object.assign(exist, { H, emisLe: v.emisLe, qr: qrTexte, kid: q.kid, signe: !!q.kid, modeleVersion: o.version });
              exist.impressions.push({ t: Date.now(), type: 'original', par: auteur() });
            }, { rendu: false, categorie: 'documents' });
          } else {
            AK.store.modifier(`${TYPES[o.type]} ${exist.ref} réimprimé`, () => exist.impressions.push({ t: Date.now(), type: 'reimpression', par: auteur() }), { rendu: false, categorie: 'documents' });
          }
          return { doc: exist, qrTexte, statutFiligrane: demo ? 'specimen' : null, nouveau: false, nouvelleVersion };
        }
      }

      const { ref, cle, n } = nouvelleReference(o.type);
      const emisLe = new Date().toISOString();
      const H = await AK.qr.empreinteTitulaire({ ...o.canon, type: o.type, ref });
      const doc = {
        ref, type: o.type, modele: o.modele, modeleVersion: o.version, politique: o.politique || 'registre', cleUnique: o.cleUnique || null,
        sujet: o.sujet || null, emisLe, emisPar: auteur(), annee: S().school.year, expire: o.expire || null, H,
        statut: 'valide', impressions: [{ t: Date.now(), type: o.duplicataDe ? 'duplicata' : 'original', par: auteur() }],
        duplicataDe: o.duplicataDe || null, demo, qrIdentite: !!(o.qr && o.qr.identite)
      };
      const q = qrActif ? await contenuQR(doc, o.canon, o.qr && o.qr.identite) : { texte: '', kid: null };
      doc.qr = q.texte;
      doc.kid = q.kid;
      doc.signe = !!q.kid;
      AK.store.modifier(`${TYPES[o.type]} émis : ${ref}${o.sujet ? ' · ' + o.sujet.libelle : ''}${o.duplicataDe ? ' (duplicata de ' + o.duplicataDe + ')' : ''}`, (s) => {
        s.docs.seq[cle] = n;
        s.docs.items.push(doc);
      }, { rendu: false, categorie: 'documents' });
      return { doc, qrTexte: doc.qr, statutFiligrane: demo ? 'specimen' : o.duplicataDe ? 'duplicata' : null, nouveau: true };
    },
    /** Réimpression d'un document du registre : « copie » (mention COPIE) ; annulé → mention ANNULÉ. */
    reimprimer(ref, type = 'copie') {
      const d = trouver(ref);
      if (!d) throw E('Document introuvable.');
      AK.perm.exiger('document.registre');
      AK.store.modifier(`${TYPES[d.type]} ${d.ref} : ${type === 'copie' ? 'copie imprimée' : 'réimpression'}`, () => d.impressions.push({ t: Date.now(), type, par: auteur() }), { rendu: false, categorie: 'documents' });
      const st = statutEffectif(d);
      return { doc: d, qrTexte: d.qr, statutFiligrane: d.demo ? 'specimen' : st === 'annule' || st === 'remplace' ? 'annule' : type === 'copie' ? 'copie' : null };
    },
    /** Annulation : le document reste au registre ; la vérification le signale comme annulé. */
    annuler(ref, motif) {
      AK.perm.exiger('document.annuler');
      const d = trouver(ref);
      if (!d) throw E('Document introuvable.');
      if (d.statut !== 'valide') throw E('Ce document n’est déjà plus valide.');
      const m = String(motif || '').trim();
      if (m.length < 3) throw new AK.ErreurMetier('Indiquez le motif de l’annulation.', 'motif');
      AK.store.modifier(`${TYPES[d.type]} ${d.ref} annulé : ${m.slice(0, 100)}`, () => {
        d.statut = 'annule';
        d.annulation = { le: new Date().toISOString(), par: auteur(), motif: m.slice(0, 300) };
      }, { categorie: 'documents' });
      return d;
    },
    /** Duplicata (perte) : l'original est marqué « remplacé » si demandé. */
    remplacer(ref, nouveauRef) {
      const d = trouver(ref);
      if (!d) return;
      AK.store.modifier(`${TYPES[d.type]} ${d.ref} remplacé par ${nouveauRef}`, () => {
        d.statut = 'remplace';
        d.remplacePar = nouveauRef;
        d.annulation = { le: new Date().toISOString(), par: auteur(), motif: 'Remplacé par le duplicata ' + nouveauRef };
      }, { categorie: 'documents' });
    },
    /** Liste minimale pour l'outil de vérification hors ligne (aucune donnée personnelle sensible). */
    exportVerification({ avecNoms = false } = {}) {
      return (S().docs.items || []).filter((d) => !d.demo).map((d) => ({
        r: d.ref, t: d.type, e: d.emisLe.slice(0, 10), x: d.expire || null, h: d.H, s: statutEffectif(d) === 'expire' ? 'valide' : d.statut,
        a: d.annulation ? d.annulation.le.slice(0, 10) : null, v: (d.versions || []).map((v) => v.H), n: avecNoms && d.sujet ? AK.qr.propre(d.sujet.libelle) : undefined
      }));
    }
  };
  AK.registre = registre;
})(window.AK);

//# sourceURL=akwa/js/docs/registre.js
</script>
<script>
/* =====================================================================================
   Bibliothèque de modèles de documents (versionnée) et personnalisation par l'école.

   Un modèle déclare : identifiant, version, format de page, réglages par défaut (titre, texte
   rédigé avec des champs dynamiques, en-tête, champs affichés, signatures, filigrane, QR,
   pied de page) et une fonction de rendu. L'école enregistre seulement ses différences
   (S.modeles[id]) ; « Restaurer le modèle par défaut » les efface.

   Sécurité : le texte personnalisé n'accepte AUCUN HTML. Seuls les champs dynamiques listés
   ({eleve.nom}…) et le gras (**texte**) sont interprétés ; tout le reste est échappé.
   Un modèle ne peut ni modifier les données ni changer les droits : il ne fait que dessiner.
   ===================================================================================== */
(function (AK) {
  'use strict';
  const u = AK.u, { html, raw } = u;
  const S = () => AK.store.etat;
  const X = () => AK.calc;
  const defs = new Map();

  /* ---------- Champs dynamiques (jetons) documentés ---------- */
  const JETONS = {
    ecole: [
      ['ecole', 'Nom de l’école'], ['ecole.nomLong', 'Nom développé (École primaire publique de …)'], ['ecole.code', 'Code de l’école'], ['iepp', 'IEPP'], ['drenaet', 'DRENAET'],
      ['localite', 'Localité'], ['annee', 'Année scolaire'], ['directeur', 'Directeur (civilité et nom)'], ['directeur.titre', '« Directeur » ou « Directrice »'],
      ['date', 'Date du jour en toutes lettres'], ['date.courte', 'Date du jour (jj/mm/aaaa)'], ['reference', 'Référence du document']
    ],
    eleve: [
      ['eleve.nomComplet', 'Nom et prénoms'], ['eleve.nom', 'Nom'], ['eleve.prenoms', 'Prénoms'], ['eleve.matricule', 'Matricule'], ['eleve.classe', 'Classe'],
      ['eleve.naissance', 'Date de naissance'], ['eleve.lieuNaissance', 'Lieu de naissance'], ['eleve.ne', '« né » ou « née »'], ['eleve.sexe', 'Sexe'],
      ['eleve.nationalite', 'Nationalité'], ['eleve.entree', 'Date d’entrée à l’école'], ['eleve.statut', 'Statut'], ['eleve.motifDepart', 'Motif de départ'],
      ['eleve.lelui', '« le » ou « la » (l’élève)'], ['eleve.inscrit', '« inscrit » ou « inscrite »']
    ],
    agent: [['agent.nom', 'Nom et prénoms (avec civilité)'], ['agent.fonction', 'Fonction'], ['agent.matricule', 'Matricule'], ['agent.emploi', 'Emploi / grade'], ['agent.classes', 'Classe(s) tenue(s)'], ['agent.entree', 'Date de prise de service']]
  };
  function valeursJetons(ctx) {
    const sc = S().school, s = ctx.eleve, t = ctx.agent, x = X();
    const directrice = /^(mme|mlle)/i.test(sc.director || '');
    const v = {
      ecole: sc.name || '', 'ecole.nomLong': String(sc.name || '').replace(/^EPP\s+/i, 'École primaire publique ') || '', 'ecole.code': sc.codeecole || '', iepp: sc.iepp || '', drenaet: sc.drenaet || '',
      localite: u.capitale(sc.localite || sc.sp || ''), annee: sc.year || '', directeur: sc.director || '', 'directeur.titre': directrice ? 'Directrice' : 'Directeur',
      date: u.fmtDateLongue(u.aujourdhui()), 'date.courte': u.fmtDate(u.aujourdhui()), reference: ctx.ref || '[référence]'
    };
    if (s) {
      const fille = s.sexe === 'Féminin';
      Object.assign(v, {
        'eleve.nomComplet': x.nomComplet(s), 'eleve.nom': s.nom, 'eleve.prenoms': s.prenoms, 'eleve.matricule': x.matOf(s), 'eleve.classe': s.classe,
        'eleve.naissance': s.ageEstime ? x.fmtNaissance(s) : u.fmtDateLongue(s.naissance), 'eleve.lieuNaissance': s.lieu || '…', 'eleve.ne': fille ? 'née' : 'né', 'eleve.sexe': s.sexe,
        'eleve.nationalite': u.capitale(s.nationalite || ''), 'eleve.entree': s.entree ? u.fmtDateLongue(s.entree) : '…', 'eleve.statut': s.statut, 'eleve.motifDepart': s.motifDepart || '',
        'eleve.lelui': fille ? 'la' : 'le', 'eleve.inscrit': fille ? 'inscrite' : 'inscrit'
      });
    }
    if (t) Object.assign(v, { 'agent.nom': t.nom, 'agent.fonction': t.fonction || '', 'agent.matricule': t.matricule || '', 'agent.emploi': x.emploiGrade(t), 'agent.classes': x.clsTxt(t), 'agent.entree': t.dateEntree ? u.fmtDateLongue(t.dateEntree) : '…' });
    return v;
  }
  /** Texte rédigé → Html sûr : échappement, jetons connus remplacés, **gras**, paragraphes. */
  function rediger(texte, ctx) {
    const v = valeursJetons(ctx);
    const parts = String(texte || '').split(/\n{2,}/).map((p) => {
      let h = u.esc(p).replace(/\{([a-zA-Z.]+)\}/g, (m, k) => (k in v ? `<b class="jeton">${u.esc(v[k])}</b>` : ''));
      h = h.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>').replace(/\n/g, '<br>');
      return `<p>${h}</p>`;
    });
    return raw(parts.join(''));
  }
  function jetonsInconnus(texte, sujet) {
    const ok = new Set([...JETONS.ecole, ...(JETONS[sujet] || [])].map(([k]) => k));
    return [...String(texte || '').matchAll(/\{([^}]*)\}/g)].map((m) => m[1]).filter((k) => !ok.has(k));
  }
  /** Remplacement simple (texte brut) pour les noms de signataires : « {directeur} ». */
  const texteJetons = (t, ctx) => {
    const v = valeursJetons(ctx || {});
    return String(t || '').replace(/\{([a-zA-Z.]+)\}/g, (m, k) => (k in v ? v[k] : ''));
  };

  /* ---------- Réglages ---------- */
  const fusion = (a, b) => {
    if (Array.isArray(b)) return b.slice();
    if (!b || typeof b !== 'object') return b === undefined ? a : b;
    const o = { ...(a && typeof a === 'object' && !Array.isArray(a) ? a : {}) };
    Object.keys(b).forEach((k) => {
      if (k === '__proto__' || k === 'constructor') return;
      o[k] = fusion(o[k], b[k]);
    });
    return o;
  };
  const DEFAUT_COMMUN = {
    titre: '', sousTitre: '', texte: '',
    page: { orientation: 'portrait', marges: { h: 14, d: 14, b: 12, g: 14 } },
    entete: { officiel: true, logos: true, armoiries: true, compact: false, ligneSup: '' },
    champs: {},
    lieuDate: true,
    signatures: [{ role: 'Le Directeur', nom: '{directeur}', cachet: true }],
    hauteurSignature: 24,
    filigrane: { type: 'aucun' },
    qr: { actif: true, identite: false, taille: 22 },
    pied: { texte: '', reference: true, numeros: true },
    couleur: '#1f4e8c'
  };
  function reglages(id) {
    const d = defs.get(id);
    if (!d) throw new Error('Modèle inconnu : ' + id);
    const perso = (S() && S().modeles[id]) || null;
    const base = fusion(DEFAUT_COMMUN, d.defauts || {});
    return fusion(base, perso ? perso.reglages : {});
  }
  const borne = (v, a, b, def) => {
    const n = Number(v);
    return Number.isFinite(n) ? Math.min(b, Math.max(a, n)) : def;
  };
  /** Contrôle et normalisation des réglages avant enregistrement. */
  function valider(id, r) {
    const d = defs.get(id);
    const E = (m, c) => new AK.ErreurMetier(m, c);
    const o = fusion(fusion(DEFAUT_COMMUN, d.defauts || {}), r);
    o.titre = String(o.titre || '').trim().slice(0, 90);
    o.sousTitre = String(o.sousTitre || '').trim().slice(0, 140);
    o.texte = String(o.texte || '').slice(0, 4000);
    const inc = jetonsInconnus(o.texte, d.sujet);
    if (inc.length) throw E(`Champ dynamique inconnu : {${inc[0]}}. Utilisez les champs proposés sous le texte.`, 'texte');
    if (/<[a-z!/]/i.test(o.texte) || /<[a-z!/]/i.test(o.titre)) throw E('Le HTML n’est pas accepté dans les modèles : utilisez **texte** pour le gras.', 'texte');
    o.page.orientation = d.orientations && d.orientations.includes(o.page.orientation) ? o.page.orientation : (d.defauts && d.defauts.page && d.defauts.page.orientation) || 'portrait';
    o.page.papier = (d.papiers || ['A4']).includes(o.page.papier) ? o.page.papier : (d.defauts && d.defauts.page && d.defauts.page.papier) || 'A4';
    ['h', 'd', 'b', 'g'].forEach((k) => (o.page.marges[k] = borne(o.page.marges[k], 5, 35, 14)));
    o.entete.ligneSup = String(o.entete.ligneSup || '').slice(0, 140);
    o.signatures = (Array.isArray(o.signatures) ? o.signatures : []).slice(0, 4).map((s) => ({ role: String(s.role || '').slice(0, 60), nom: String(s.nom || '').slice(0, 80), cachet: !!s.cachet, cadre: !!s.cadre }));
    o.hauteurSignature = borne(o.hauteurSignature, 10, 50, 24);
    o.filigrane = AK.filigrane.normaliser(o.filigrane);
    o.qr = { actif: o.qr.actif !== false, identite: !!o.qr.identite, taille: borne(o.qr.taille, 14, 40, 22) };
    o.pied = { texte: String(o.pied.texte || '').slice(0, 160), reference: o.pied.reference !== false, numeros: o.pied.numeros !== false };
    o.couleur = /^#[0-9a-f]{6}$/i.test(o.couleur) ? o.couleur : '#1f4e8c';
    Object.keys(o.champs || {}).forEach((k) => (o.champs[k] = !!o.champs[k]));
    if (d.valider) d.valider(o);
    return o;
  }
  /** Différences par rapport au modèle par défaut (seules elles sont enregistrées). */
  function differences(base, o) {
    if (Array.isArray(o) || typeof o !== 'object' || o == null) return JSON.stringify(base) === JSON.stringify(o) ? undefined : o;
    const r = {};
    Object.keys(o).forEach((k) => {
      const v = differences(base ? base[k] : undefined, o[k]);
      if (v !== undefined) r[k] = v;
    });
    return Object.keys(r).length ? r : undefined;
  }

  const modeles = {
    JETONS, rediger, texteJetons, jetonsInconnus, valeursJetons,
    /** Déclare un modèle (fichiers docs/modeles/*.js). */
    def(d) {
      defs.set(d.id, { categorie: 'eleve', sujet: 'eleve', version: 1, ...d });
    },
    get: (id) => defs.get(id),
    liste: () => [...defs.values()],
    reglages,
    valider,
    estPersonnalise: (id) => !!(S().modeles[id] && S().modeles[id].reglages && Object.keys(S().modeles[id].reglages).length),
    enregistrer(id, r) {
      AK.perm.exiger('modeles.gerer');
      const d = defs.get(id);
      const o = valider(id, r);
      const diff = differences(fusion(DEFAUT_COMMUN, d.defauts || {}), o) || {};
      const prec = S().modeles[id];
      AK.store.modifier(`Modèle « ${d.lib} » enregistré`, (s) => (s.modeles[id] = { version: d.version, rev: ((prec && prec.rev) || 0) + 1, maj: new Date().toISOString(), par: AK.session.libelle(), reglages: diff }), { categorie: 'modeles' });
      return o;
    },
    reinitialiser(id) {
      AK.perm.exiger('modeles.gerer');
      const d = defs.get(id);
      AK.store.modifier(`Modèle « ${d.lib} » remis par défaut`, (s) => delete s.modeles[id], { categorie: 'modeles' });
    },
    /** Le modèle par défaut a évolué depuis la personnalisation ? */
    aJour(id) {
      const p = S().modeles[id];
      return !p || p.version >= defs.get(id).version;
    }
  };
  AK.modeles = modeles;
})(window.AK);

//# sourceURL=akwa/js/docs/modeles.js
</script>
<script>
/* =====================================================================================
   Mise en page des documents : feuille aux dimensions physiques, en-tête officiel, titre,
   signatures, bloc de vérification (QR), pied de page, pagination des longs tableaux
   (en-tête de tableau répété, signatures jamais orphelines), ajustement sur une page.
   ===================================================================================== */
(function (AK) {
  'use strict';
  const u = AK.u, { html, raw } = u;
  const S = () => AK.store.etat;
  const FORMATS = { A4: { l: 210, h: 297 }, A5: { l: 148, h: 210 } };

  const dims = (r) => {
    const f = FORMATS[r.page && r.page.papier] || FORMATS.A4;
    return r.page && r.page.orientation === 'paysage' ? { l: f.h, h: f.l } : { l: f.l, h: f.h };
  };

  /** En-tête officiel (lignes modifiables dans Paramètres › École). */
  function entete(r = {}) {
    const sc = S().school, e = r.entete || {};
    if (e.officiel === false) {
      return html`<div class="doc-entete${e.compact ? ' compact' : ''}"><div class="ge"><span class="ecole">${sc.name}</span>${sc.adresse || sc.telephone ? html`<span style="font-weight:400;text-transform:none">${[sc.adresse, sc.telephone].filter(Boolean).join(' · ')}</span>` : ''}</div><div class="dr"><span class="annee">Année scolaire ${sc.year || '…'}</span></div></div>`;
    }
    const logos = e.logos === false ? [] : [sc.logoIepp, sc.logoEcole].filter((x) => x && u.IMG_OK.test(x));
    const sep = raw('<span class="sep"></span>');
    return html`<div class="doc-entete${e.compact ? ' compact' : ''}"><div class="ge"><span>${sc.ministere}</span>${sep}<span>${sc.direction}</span>${sep}<span>${sc.inspection}</span>${sep}<span class="ecole">${sc.name}</span>${logos.length ? html`<span class="logos">${logos.map((x) => html`<img src="${x}" alt="">`)}</span>` : ''}</div>
      <div class="dr"><span class="rep">${sc.republique || AK.cfg.ENTETE.republique}</span><span class="devise">${sc.devise || AK.cfg.ENTETE.devise}</span>${e.armoiries === false ? '' : html`<img src="${sc.armoiries && u.IMG_OK.test(sc.armoiries) ? sc.armoiries : AK.assets.armoiries}" alt="Armoiries">`}<span class="annee">Année scolaire ${sc.year || '…'}</span></div></div>${e.ligneSup || sc.entete ? html`<div class="doc-entete-x">${e.ligneSup || sc.entete}</div>` : ''}`;
  }
  const titre = (t, sous, { cadre = false } = {}) => html`<div class="doc-titre${cadre ? ' cadre' : ''}"><h1>${t}</h1>${sous ? html`<div class="sous">${sous}</div>` : ''}${cadre ? '' : raw('<div class="filet"></div>')}</div>`;
  const infos = (paires, { une = false } = {}) => html`<div class="doc-infos${une ? ' une' : ''}">${paires.filter(Boolean).map(([l, v]) => html`<div class="c"><span class="l">${l} :</span><span class="v">${v || '—'}</span></div>`)}</div>`;
  const lieuDate = () => {
    const sc = S().school;
    return html`<div class="doc-fait">Fait à ${u.capitale(sc.localite || sc.sp || (String(sc.name).match(/EPP\s+(\S+)/i) || [, '……'])[1])}, le ${u.fmtDate(u.aujourdhui())}</div>`;
  };
  /** Signatures : zones vides pour signature manuscrite et cachet (jamais d'imitation). */
  function signatures(r, ctx) {
    const L = (r.signatures || []).filter((s) => s.role);
    if (!L.length) return '';
    return html`${r.lieuDate !== false ? lieuDate() : ''}<div class="doc-signatures" style="--n:${L.length};--h-sig:${r.hauteurSignature || 24}mm">${L.map((s) => html`<div class="doc-sig"><span class="role">${s.role}</span><span class="espace${s.cadre ? ' cadre' : ''}">${s.cachet ? raw('<span class="cachet">Cachet de l’établissement</span>') : ''}</span><span class="nom">${AK.modeles.texteJetons(s.nom, ctx)}</span></div>`)}</div>`;
  }
  /** Bloc de vérification : QR + référence + état de la signature électronique. */
  function verification(qrTexte, doc, taille = 22) {
    if (!qrTexte) return '';
    const cle = doc && doc.kid ? AK.cles.liste().find((c) => c.id === doc.kid) : null;
    return html`<div class="doc-verif"><div class="qr" style="width:${taille}mm;height:${taille}mm">${AK.qr.svg(qrTexte, { titre: 'QR code de vérification ' + (doc ? doc.ref : '') })}</div><div class="txt"><b>Document vérifiable</b><br>Réf. <span class="ref">${doc ? doc.ref : ''}</span><br>${cle ? html`Signé électroniquement (clé ${cle.id} · ${cle.empreinte})` : 'Contrôle par le registre de l’école'}<br>AKWA SCHOOL › Vérifier un document</div></div>`;
  }
  function pied(r, { ref, page, total, statut } = {}) {
    const sc = S().school, p = r.pied || {};
    const gauche = [p.reference !== false && ref ? `Réf. ${ref}` : '', statut ? '' : ''].filter(Boolean).join(' · ');
    return html`<div class="doc-pied"><span>${gauche}${statut ? html` · <span class="statut">${statut}</span>` : ''}</span><span class="m">${p.texte || [sc.adresse, sc.telephone, sc.email].filter(Boolean).join(' · ')}</span><span>${p.numeros !== false && total > 1 ? `Page ${page} / ${total}` : ''}</span></div>`;
  }

  /**
   * Feuille complète. o = { reglages, contenu (Html), statut (filigrane de statut), ref, page, total, classe }
   */
  function feuille(o) {
    const r = o.reglages, d = dims(r), m = (r.page && r.page.marges) || { h: 14, d: 14, b: 12, g: 14 };
    const paysage = r.page && r.page.orientation === 'paysage';
    const a5 = r.page && r.page.papier === 'A5';
    const st = o.statut ? AK.filigrane.libelleStatut(o.statut) : '';
    return html`<section class="feuille${paysage ? ' paysage' : ''}${a5 ? ' a5' : ''}${o.classe ? ' ' + o.classe : ''}" style="--mt:${m.h}mm;--mr:${m.d}mm;--mb:${m.b}mm;--ml:${m.g}mm;--doc-accent:${r.couleur || '#1f4e8c'}${a5 ? ';width:' + d.l + 'mm;height:' + d.h + 'mm' : ''}" data-l="${d.l}" data-h="${d.h}">${AK.filigrane.calques(r.filigrane, o.statut, d.l, d.h)}<div class="zone"><div class="corps">${o.contenu}</div>${o.sansPied ? '' : pied(r, { ref: o.ref, page: o.page || 1, total: o.total || 1, statut: st })}</div></section>`;
  }

  /* ---------- Mesure hors écran (mêmes styles que l'impression) ---------- */
  let mesureur = null;
  function zoneMesure(r) {
    if (!mesureur) {
      mesureur = document.createElement('div');
      mesureur.setAttribute('aria-hidden', 'true');
      mesureur.style.cssText = 'position:absolute;left:-10000px;top:0;visibility:hidden;pointer-events:none;contain:layout';
      document.body.appendChild(mesureur);
    }
    u.poser(mesureur, feuille({ reglages: r, contenu: '', ref: 'AK-XXX-0000-000000-X', total: 2 }));
    return mesureur.querySelector('.corps');
  }

  /**
   * Pagination d'un document « liste » : avant (en-tête, titre, infos), tableau (tête + lignes),
   * apres (récapitulatif, signatures : gardés ensemble sur la dernière page).
   * Renvoie la liste des contenus de page (Html).
   */
  function paginer(r, { avant = '', tete = '', lignes = [], apres = '', classeTab = 'doc-tab', suite = '' }) {
    const corps = zoneMesure(r);
    const max = corps.clientHeight;
    const pages = [];
    const tableau = (L) => (L.length ? html`<table class="${classeTab}"><thead>${tete}</thead><tbody>${L}</tbody></table>` : '');
    let courant = [];
    let entetePage = avant;
    const tient = (contenu) => {
      u.poser(corps, contenu);
      return corps.scrollHeight <= max + 1;
    };
    for (let i = 0; i < lignes.length; i++) {
      const essai = [...courant, lignes[i]];
      if (tient(html`${entetePage}${tableau(essai)}`)) courant = essai;
      else {
        if (!courant.length) {
          courant = [lignes[i]]; // ligne plus haute qu'une page : forcée
          pages.push(html`${entetePage}${tableau(courant)}`);
          courant = [];
        } else {
          pages.push(html`${entetePage}${tableau(courant)}`);
          courant = [lignes[i]];
        }
        entetePage = suite;
      }
    }
    // fin : tableau restant + bloc final ; si le bloc final ne tient pas, il passe seul page suivante
    if (tient(html`${entetePage}${tableau(courant)}${apres}`)) pages.push(html`${entetePage}${tableau(courant)}${apres}`);
    else {
      // garder au moins 3 lignes avec le bloc final pour éviter une page de signature seule
      let reste = [];
      while (courant.length > 3 && !tient(html`${suite}${tableau(reste)}${apres}`)) reste.unshift(courant.pop());
      while (courant.length > 0 && reste.length < 3) {
        reste.unshift(courant.pop());
        if (!tient(html`${suite}${tableau(reste)}${apres}`)) {
          courant.push(reste.shift());
          break;
        }
      }
      if (courant.length || entetePage !== suite) pages.push(html`${entetePage}${tableau(courant)}`);
      pages.push(html`${suite}${tableau(reste)}${apres}`);
    }
    u.poser(corps, '');
    return pages;
  }

  /**
   * Répartition de blocs (Html) sur des pages successives : un bloc n'est jamais coupé ;
   * « garder » : nombre de blocs finaux à garder ensemble (signatures avec la conclusion).
   */
  function decouper(r, blocs, { suite = '', garder = 1 } = {}) {
    const corps = zoneMesure(r);
    const max = corps.clientHeight;
    const tient = (L) => {
      u.poser(corps, L);
      return corps.scrollHeight <= max + 1;
    };
    const pages = [];
    let courant = [];
    const fin = blocs.length - garder;
    for (let i = 0; i < blocs.length; i++) {
      const lot = i === fin && garder > 1 ? blocs.slice(i) : [blocs[i]];
      const entete = pages.length ? [suite] : [];
      if (tient([...entete, ...courant, ...lot])) courant.push(...lot);
      else if (!courant.length) courant.push(...lot);
      else {
        pages.push(html`${entete}${courant}`);
        courant = [...lot];
      }
      if (lot.length > 1) break;
    }
    if (courant.length) pages.push(html`${pages.length ? suite : ''}${courant}`);
    u.poser(corps, '');
    return pages;
  }

  /** Mise à l'échelle d'un contenu pour tenir sur une seule page (réduction plafonnée à 72 %). */
  const ZMIN = 0.72;
  function ajuster(r, contenu) {
    const corps = zoneMesure(r);
    const max = corps.clientHeight, larg = corps.clientWidth;
    const essai = (z) => {
      u.poser(corps, html`<div class="ajuste-interne" style="width:${larg / z}px;transform:scale(${z})">${contenu}</div>`);
      return corps.firstElementChild.scrollHeight * z <= max + 1;
    };
    let z = 1;
    if (!essai(1)) {
      if (!essai(ZMIN)) z = ZMIN;
      else {
        let a = ZMIN, b = 1;
        for (let i = 0; i < 9; i++) {
          const c = (a + b) / 2;
          if (essai(c)) a = c;
          else b = c;
        }
        z = a;
      }
    }
    u.poser(corps, '');
    return { z, contenu: z < 0.999 ? html`<div class="ajuste-interne" style="width:${(100 / z).toFixed(3)}%;transform:scale(${z.toFixed(4)})">${contenu}</div>` : contenu, deborde: z <= ZMIN + 0.001 };
  }

  AK.mise = { FORMATS, dims, entete, titre, infos, lieuDate, signatures, verification, pied, feuille, paginer, decouper, ajuster, ZMIN };
})(window.AK);

//# sourceURL=akwa/js/docs/mise-en-page.js
</script>
<script>
/* =====================================================================================
   Aperçu avant impression et impression.
   L'aperçu montre les vraies feuilles (dimensions physiques), réduites à l'écran.
   L'impression n'envoie que ces feuilles (zone #impression) : jamais les menus ni les boutons.

   PDF : le navigateur ne sait pas écrire un fichier PDF seul. Le bouton « PDF » ouvre la boîte
   d'impression où l'on choisit « Enregistrer au format PDF » (Chrome, Edge) ou « Microsoft
   Print to PDF » (Windows). Ce n'est pas présenté comme une génération directe de PDF.
   ===================================================================================== */
(function (AK) {
  'use strict';
  const u = AK.u, { html, $, $$ } = u, ic = AK.ic, ui = AK.ui;
  const MM = 96 / 25.4;
  let enCours = false;

  function zoneImpression() {
    let z = document.getElementById('impression');
    if (!z) {
      z = document.createElement('div');
      z.id = 'impression';
      z.className = 'zone-impression';
      document.body.appendChild(z);
    }
    return z;
  }
  async function attendreImages(racine) {
    const imgs = $$('img', racine).filter((i) => !i.complete).map((i) => new Promise((r) => (i.onload = i.onerror = r)));
    await Promise.race([Promise.all([...imgs, document.fonts ? document.fonts.ready : null]), u.attendre(4000)]);
  }
  /** Envoie des feuilles à l'imprimante (ou au PDF) sans aperçu. */
  async function imprimer(feuilles) {
    if (enCours) return;
    enCours = true;
    const z = zoneImpression();
    u.poser(z, feuilles);
    try {
      await attendreImages(z);
      const paysage = !!z.querySelector('.feuille.paysage');
      AK.hote.imprimer(paysage);
    } finally {
      enCours = false;
    }
  }
  addEventListener('afterprint', () => setTimeout(() => u.poser(zoneImpression(), ''), 300));

  function ajusterZoom(racine, facteur) {
    const pages = $('.pages', racine);
    if (!pages) return;
    const dispo = pages.clientWidth - 8;
    $$('.feuille-cadre', racine).forEach((c) => {
      const f = c.firstElementChild;
      const l = Number(f.dataset.l || 210) * MM;
      const z = Math.min(facteur || 1, dispo / l);
      c.style.zoom = z.toFixed(4);
    });
  }

  /**
   * Aperçu : o = { titre, feuilles: [Html], resume, exporter: [{ lib, f }], copie: f (imprimer une copie) }
   */
  function apercu(o) {
    let facteur = 1;
    const n = o.feuilles.length;
    const f = ui.fenetre({
      titre: o.titre || 'Aperçu avant impression', icone: 'print', taille: 'plein dlg-apercu', sansPied: true, proteger: false,
      corps: html`<div class="pile">
        <div class="barre-apercu">
          <span class="puce">${ic('file')}${u.pluriel(n, 'page')}${o.format ? ' · ' + o.format : ''}</span>${o.resume ? html`<span class="mut petit">${o.resume}</span>` : ''}
          <span class="espace"></span>
          <div class="groupe-btn"><button type="button" class="btn btn-sm" data-z="-" aria-label="Réduire">${ic('zoomOut')}</button><button type="button" class="btn btn-sm" data-z="0" aria-label="Ajuster à la largeur">Ajuster</button><button type="button" class="btn btn-sm" data-z="+" aria-label="Agrandir">${ic('zoomIn')}</button></div>
          ${(o.exporter || []).map((x, i) => html`<button type="button" class="btn btn-sm" data-exp="${i}">${ic('down')}${x.lib}</button>`)}
          ${o.copie ? html`<button type="button" class="btn btn-sm" data-copie>${ic('copy')}Imprimer une copie</button>` : ''}
          <button type="button" class="btn btn-sm" data-pdf data-bulle="Ouvre la boîte d’impression : choisissez « Enregistrer au format PDF »">${ic('down')}PDF</button>
          <button type="button" class="btn btn-pri" data-imprimer>${ic('print')}Imprimer</button>
        </div>
        ${o.avertissement ? ui.encadre(o.avertissement, 'avert') : ''}
        <div class="apercu"><div class="pages">${o.feuilles.map((p, i) => html`<div class="feuille-cadre"><span class="num-page">Page ${i + 1} / ${n}</span>${p}</div>`)}</div></div>
        <p class="mut petit mb0">${ic('info', 'i-sm')} Réglages d’impression conseillés : papier ${o.papier || 'A4'}, échelle 100 %, marges « Aucune » ou « Par défaut », « Graphiques d’arrière-plan » activé pour les couleurs et filigranes.</p>
      </div>`,
      apres(racine) {
        const corps = $('.dlg-corps', racine);
        requestAnimationFrame(() => ajusterZoom(corps));
        racine.addEventListener('click', async (e) => {
          const b = e.target.closest('button');
          if (!b) return;
          if (b.dataset.z) {
            facteur = b.dataset.z === '0' ? 1 : Math.max(0.3, Math.min(2, facteur * (b.dataset.z === '+' ? 1.2 : 1 / 1.2)));
            if (b.dataset.z === '0') ajusterZoom(corps);
            else $$('.feuille-cadre', corps).forEach((c) => (c.style.zoom = facteur.toFixed(3)));
          } else if (b.hasAttribute('data-pdf') && typeof AK.hote.exporterPdf === 'function') {
            // vrai fichier PDF produit par l'emballage natif (APK / .exe)
            const z = zoneImpression();
            u.poser(z, o.feuilles);
            await attendreImages(z);
            try {
              const nom = (o.nomFichier || o.titre || 'document').replace(/[^\p{L}\p{N} _.-]+/gu, '_').slice(0, 80) + '.pdf';
              const ou = await AK.hote.exporterPdf(nom, !!z.querySelector('.feuille.paysage'));
              if (ou) ui.toast('PDF enregistré : ' + ou);
            } catch (err) {
              ui.erreur(err);
            } finally {
              u.poser(z, '');
            }
          } else if (b.hasAttribute('data-imprimer') || b.hasAttribute('data-pdf')) {
            if (b.hasAttribute('data-pdf')) ui.toast('Dans la fenêtre qui s’ouvre, choisissez l’imprimante « Enregistrer au format PDF » (ou « Microsoft Print to PDF »).', { type: 'attente', duree: 7000 });
            if (o.avantImpression) await o.avantImpression();
            imprimer(o.feuilles);
          } else if (b.hasAttribute('data-copie')) {
            const copies = await o.copie();
            if (copies) imprimer(copies);
          } else if (b.dataset.exp != null) {
            try {
              await o.exporter[+b.dataset.exp].f();
            } catch (err) {
              ui.erreur(err);
            }
          }
        });
        addEventListener('resize', () => ajusterZoom(corps), { once: true });
      }
    });
    return f;
  }

  AK.impression = { apercu, imprimer, zoneImpression, attendreImages };
})(window.AK);

//# sourceURL=akwa/js/docs/impression.js
</script>
<script>
/* =====================================================================================
   Cartes d'identification : formats, planches A4 avec traits de coupe, recto-verso.
   ID-1 (85,6 × 53,98 mm) : 10 cartes par feuille A4 (2 × 5), gouttière de 2 mm.
   Impression « à l'unité » : une carte par page au format exact (imprimante à cartes).
   ===================================================================================== */
(function (AK) {
  'use strict';
  const u = AK.u, { html, raw } = u;
  const FORMATS = {
    id1: { lib: 'ID-1 paysage · 85,6 × 54 mm (format carte bancaire)', l: 85.6, h: 53.98, classe: '', page: 'carte' },
    id1p: { lib: 'ID-1 portrait · 54 × 85,6 mm', l: 53.98, h: 85.6, classe: 'portrait', page: 'carteP' },
    badge: { lib: 'Badge portrait · 70 × 100 mm', l: 70, h: 100, classe: 'portrait', page: 'badge' },
    perso: { lib: 'Dimensions personnalisées', l: 85.6, h: 53.98, classe: '', page: 'cperso' }
  };
  /** Format effectif (personnalisé : bornes 40–150 mm). */
  function format(r) {
    const c = (r && r.carte) || {};
    const f = FORMATS[c.format] || FORMATS.id1;
    if (c.format !== 'perso') return { ...f, cle: c.format || 'id1' };
    const l = Math.min(150, Math.max(40, Number(c.l) || 85.6)), h = Math.min(150, Math.max(40, Number(c.h) || 53.98));
    return { ...f, l, h, classe: h > l ? 'portrait' : '', cle: 'perso' };
  }

  const TRAIT = 3.5, ECART_TRAIT = 1;
  function traits(x, y, l, h) {
    const T = [];
    const add = (x1, y1, w, hh) => T.push(`<span class="trait" style="left:${x1.toFixed(2)}mm;top:${y1.toFixed(2)}mm;width:${w}mm;height:${hh}mm"></span>`);
    [[x, y], [x + l, y], [x, y + h], [x + l, y + h]].forEach(([cx, cy], i) => {
      const gauche = i % 2 === 0, haut = i < 2;
      add(gauche ? cx - ECART_TRAIT - TRAIT : cx + ECART_TRAIT, cy - 0.1, TRAIT, 0.2);
      add(cx - 0.1, haut ? cy - ECART_TRAIT - TRAIT : cy + ECART_TRAIT, 0.2, TRAIT);
    });
    return T.join('');
  }

  /**
   * Assemble les cartes en feuilles.
   * cartes : [{ html, verso, statut, format }] ; o = { mode: 'planche'|'unitaire', traits: true, verso: false, debut: 0 }
   */
  function planches(cartes, o = {}) {
    const f = cartes[0] && cartes[0].format ? cartes[0].format : FORMATS.id1;
    if (o.mode === 'unitaire') {
      const perso = f.cle === 'perso' ? raw(`<style>@page cperso { size: ${f.l}mm ${f.h}mm; margin: 0 }</style>`) : '';
      const pages = [];
      cartes.forEach((c) => {
        pages.push(html`<section class="feuille carte-seule${f.classe ? ' portrait-c' : ''}${f.cle === 'badge' ? ' badge-c' : ''}" style="width:${f.l}mm;height:${f.h}mm;page:${f.page}" data-l="${f.l}" data-h="${f.h}">${c.html}</section>`);
        if (o.verso && c.verso) pages.push(html`<section class="feuille carte-seule${f.classe ? ' portrait-c' : ''}" style="width:${f.l}mm;height:${f.h}mm;page:${f.page}" data-l="${f.l}" data-h="${f.h}">${c.verso}</section>`);
      });
      if (pages.length) pages[0] = html`${perso}${pages[0]}`;
      return pages;
    }
    const A4 = { l: 210, h: 297 }, gout = 2, marge = 8;
    const col = Math.max(1, Math.floor((A4.l - 2 * marge + gout) / (f.l + gout)));
    const lig = Math.max(1, Math.floor((A4.h - 2 * marge - 6 + gout) / (f.h + gout)));
    const parPage = col * lig;
    const x0 = (A4.l - (col * f.l + (col - 1) * gout)) / 2, y0 = (A4.h - (lig * f.h + (lig - 1) * gout)) / 2 - 2;
    const debut = Math.min(parPage - 1, Math.max(0, Number(o.debut) || 0));
    const pages = [];
    const cases = [...Array(debut).fill(null), ...cartes];
    for (let p = 0; p < cases.length; p += parPage) {
      const lot = cases.slice(p, p + parPage);
      const pose = (verso) => lot.map((c, i) => {
        if (!c) return '';
        const r = Math.floor(i / col);
        let k = i % col;
        if (verso) k = col - 1 - k; // retournement sur le bord long
        const x = x0 + k * (f.l + gout), y = y0 + r * (f.h + gout);
        return html`<div class="emplacement" style="left:${x.toFixed(2)}mm;top:${y.toFixed(2)}mm;width:${f.l}mm;height:${f.h}mm">${verso ? c.verso || '' : c.html}</div>${o.traits !== false ? raw(traits(x, y, f.l, f.h)) : ''}`;
      });
      const leg = `AKWA SCHOOL · planche de ${u.pluriel(lot.filter(Boolean).length, 'carte')} ${f.l.toString().replace('.', ',')} × ${f.h.toString().replace('.', ',')} mm · imprimer à 100 % (sans ajustement)`;
      pages.push(html`<section class="feuille planche" data-l="210" data-h="297">${pose(false)}<div class="legende-planche">${leg}</div></section>`);
      if (o.verso && lot.some((c) => c && c.verso)) pages.push(html`<section class="feuille planche" data-l="210" data-h="297">${pose(true)}<div class="legende-planche">Verso · insérer la feuille imprimée côté recto, retournement sur le bord long</div></section>`);
    }
    return pages;
  }

  /** Validité d'une carte : fin d'année scolaire (31 juillet), date fixe ou aucune. */
  function expiration(r) {
    const c = (r && r.carte) || {};
    if (c.expiration === 'aucune') return null;
    if (c.expiration === 'date' && u.estISO(c.dateExpiration)) return c.dateExpiration;
    const an = AK.calc.anneeRentree();
    return `${an + 1}-07-31`;
  }

  AK.cartes = { FORMATS, format, planches, expiration };
})(window.AK);

</script>
<script>
/* =====================================================================================
   Blocs des rapports officiels (mêmes calculs que 1.7.0) : chaque tableau est une fonction,

(function (AK) {
  'use strict';
  const u = AK.u, { html, raw } = u, C = AK.cfg;
  const S = () => AK.store.etat;
  const X = () => AK.calc;

  const sx = (L) => X().compteSexe(L).map((v, i) => html`<td${i === 2 ? raw(' style="font-weight:800"') : ''}>${v}</td>`);
  const sxHead = (labels, premier) => html`<tr><th rowspan="2">${premier}</th>${labels.map((l) => html`<th colspan="3">${l}</th>`)}</tr><tr>${labels.map(() => html`<th>G</th><th>F</th><th>T</th>`)}</tr>`;
  const taux = (a, p) => X().compteSexe(a).map((v, i) => {

    return html`<td${i === 2 ? raw(' style="font-weight:800"') : ''}>${d ? Math.round((v / d) * 100) : '—'}</td>`;
  });

  /** Zone à rédiger : champ à l'écran (edit), texte à l'impression. */
  function zone(rap, cle, champ, titre, lignes = 3, edit = false) {
    const k = `${rap}|${cle}|${champ}`, v = S().redac[k] || '';
    return html`<div class="doc-zone">${titre ? html`<b>${titre}</b>` : ''}${edit ? html`<textarea rows="${lignes}" data-change="redac" data-input="redac-frappe" data-k="${k}" placeholder="À rédiger…" aria-label="${titre || 'Zone à rédiger'}">${v}</textarea>` : html`<div class="z" style="min-height:${lignes * 1.5}em">${v}</div>`}</div>`;
  }
  AK.actions.defChange({

  /* ---------- Personnel ---------- */
  function fonctStats() {

      <p class="doc-note">Personnel enseignant : <b>${ens.length}</b> dont <b>${fem}</b> femme(s).</p>${blocFonct()}`;
  }

  /* ---------- Effectifs, compositions ---------- */
  function blocEffectifs() {
    const x = X(), act = x.actifs(), nv = x.niveaux();
    const f = { nred: (c) => act.filter((s) => s.classe === c && !s.redoublant), red: (c) => act.filter((s) => s.classe === c && s.redoublant), tot: (c) => act.filter((s) => s.classe === c) };

    return html`<table class="${T}"><thead>${sxHead([...nv, 'TOTAL'], 'COURS')}</thead><tbody>${ligne('N.RED', f.nred)}${ligne('RED', f.red)}${ligne('TOTAL', f.tot)}</tbody></table><p class="doc-note">Contrôle : non redoublants + redoublants = ${act.length} = effectif inscrit.</p>`;
  }
  function blocCompo(n) {
    const x = X(), act = x.actifs(), nv = x.niveaux(), cls = (c) => act.filter((s) => s.classe === c);
    const M = [['INSCRITS', (L) => L], ['PRÉSENTS', (L) => L.filter((s) => !x.estAbsent(s.id, n) && x.moyEval(s, n) != null)], ['ABSENTS', (L) => L.filter((s) => x.estAbsent(s.id, n))], ['ADMIS', (L) => L.filter((s) => !x.estAbsent(s.id, n) && (x.moyEval(s, n) ?? -1) >= x.info(s.classe).seuil)]];
    const lignes = M.map(([lib, g]) => html`<tr><td><b>${lib}</b></td>${nv.map((c) => sx(g(cls(c))))}${sx(g(act))}</tr>`);
    return html`<table class="${T}"><thead>${sxHead([...nv, 'TOTAL'], '')}</thead><tbody>${lignes}<tr><td><b>TAUX D’ADMIS (%)</b></td>${[...nv.map(cls), act].map((L) => taux(M[3][1](L), M[1][1](L)))}</tr></tbody></table>
      <p class="doc-note">Admis : moyenne de la composition égale ou supérieure au seuil de la classe (5/10 du CP1 au CM1, 10/20 au CM2).</p>`;
  }
  function blocTop3(n) {
    const x = X();
    const L = x.niveaux().map((c) => {
      const w = x.classement(c, n).w.slice(0, 3);
      return html`<tr><td><b>${c}</b></td>${[0, 1, 2].map((i) => (w[i] ? html`<td class="nom">${x.nomComplet(w[i].s)}</td><td>${u.fmtNote(w[i].avg)}</td>` : html`<td></td><td></td>`))}</tr>`;
    });
    return html`<table class="${T}"><thead><tr><th rowspan="2"></th><th colspan="2">PREMIER</th><th colspan="2">DEUXIÈME</th><th colspan="2">TROISIÈME</th></tr><tr>${[0, 1, 2].map(() => html`<th>NOM ET PRÉNOMS</th><th>MOY</th>`)}</tr></thead><tbody>${L}</tbody></table>`;
  }
  const absMois = (L, mm) => Object.entries(S().att).filter(([d]) => d.startsWith(mm)).reduce((k, [, o]) => k + L.filter((s) => o[s.id]).length, 0);
  function blocFreq(m) {
    const x = X(), { mm, jours } = x.moisInfo(m), act = x.actifs();
    const ligne = (c) => {
      const ins = S().students.filter((s) => s.classe === c), ab = ins.filter((s) => s.statut !== 'Inscrit'), pr = ins.filter((s) => s.statut === 'Inscrit');
      const abs = absMois(pr, mm), t = pr.length && jours ? Math.max(0, 1 - abs / (pr.length * jours)) : null;
      return html`<tr><td><b>${c}</b></td>${sx(ins)}${sx(ab)}<td>${t == null ? '—' : (t * 100).toFixed(1).replace('.', ',')}</td><td class="g">${abs ? u.pluriel(abs, 'jour') + ' d’absence' : ''}</td></tr>`;
    };
    const a = absMois(act, mm);
    return html`<table class="${T}"><thead><tr><th rowspan="2">COURS</th><th colspan="3">EFFECTIFS / RENTRÉE</th><th colspan="3">ABANDONS</th><th rowspan="2">TAUX DE FRÉQUENTATION (%)</th><th rowspan="2">OBSERVATIONS</th></tr><tr>${[0, 1].map(() => html`<th>G</th><th>F</th><th>T</th>`)}</tr></thead>
      <tbody>${['PS', 'MS', 'GS'].map((c) => html`<tr><td><b>${c}</b></td>${raw('<td>—</td>'.repeat(6))}<td>—</td><td></td></tr>`)}${x.niveaux().map(ligne)}<tr><td><b>TOTAL</b></td>${sx(S().students)}${sx(S().students.filter((s) => s.statut !== 'Inscrit'))}<td>${act.length && jours ? (Math.max(0, 1 - a / (act.length * jours)) * 100).toFixed(1).replace('.', ',') : '—'}</td><td></td></tr></tbody></table>
      <p class="doc-note">Taux de fréquentation = 1 − jours d’absence ÷ (effectif présent × jours de classe du mois : ${jours}).</p>`;
  }
  function blocPersonnel(m) {
    const x = X(), { mm } = x.moisInfo(m);
    const absP = (t) => S().auth.filter((a) => a.pid === t.id && a.statut === 'Accordée').reduce((k, a) => k + x.joursClasse(a.du, a.au).filter((d) => d.startsWith(mm)).length, 0);
    return html`<table class="${T}"><thead><tr><th>N°</th><th class="g">Nom et prénoms</th><th>Cours tenu</th><th>Jours d’absence autorisés</th><th>Observations</th></tr></thead><tbody>${S().teachers.filter((t) => t.actif !== false).map((t, i) => html`<tr><td>${i + 1}</td><td class="nom">${t.nom}</td><td>${x.clsTxt(t) || '—'}</td><td>${absP(t)}</td><td></td></tr>`)}</tbody></table>`;

  function blocEvalsMois(m) {
    const x = X(), { mm } = x.moisInfo(m);

      const n = [1, 2, 3, 4].find((k) => x.evalDate(c, k).startsWith(mm)), L = x.actifsDe(c);
      if (!n) return html`<tr><td><b>${c}</b></td><td>${L.length}</td><td colspan="3">Pas d’évaluation ce mois</td></tr>`;
      const v = L.map((s) => x.score(s, n)).filter((z) => z != null);
      return html`<tr><td><b>${c}</b></td><td>${L.length}</td><td>${v.length}</td><td>${u.fmtNote(v.length ? u.moyenne(v) : null)} / ${x.echelle(c)}</td><td>${u.pct(v.filter((z) => z >= x.info(c).seuil).length, v.length)}</td></tr>`;
    })}</tbody></table>`;
  }
  function blocSynthese(edit) {
    const x = X(), nv = x.niveaux(), nouveaux = Number(S().redac['FIN||nouveauxCP1'] || 0);
    const D = (c) => {
      const ins = S().students.filter((s) => s.classe === c), pr = ins.filter((s) => s.statut === 'Inscrit');
      return { ins, pr, ab: ins.filter((s) => s.statut !== 'Inscrit'), adm: pr.filter((s) => x.decision(s) === 'Admis'), red: pr.filter((s) => x.decision(s) === 'Redoublant') };
    };
    const prob = (c) => {

    const lignes = nv.map((c) => {

    });
    const Tt = nv.map(D).reduce((a, d) => ({ ins: [...a.ins, ...d.ins], pr: [...a.pr, ...d.pr], ab: [...a.ab, ...d.ab], adm: [...a.adm, ...d.adm], red: [...a.red, ...d.red] }), { ins: [], pr: [], ab: [], adm: [], red: [] });
    return html`<table class="${T}"><thead><tr><th rowspan="2">COURS</th><th colspan="3">INSCRITS</th><th colspan="3">EFFECTIF PRÉSENT</th><th rowspan="2">ABAN-DONS</th><th rowspan="2">SEUIL MGA</th><th colspan="3">ADMIS</th><th colspan="3">TAUX D’ADMISSION (%)</th><th colspan="3">REDOUBLANTS</th><th rowspan="2">EFFECTIF PROBABLE ANNÉE SUIVANTE</th></tr><tr>${[0, 1, 2, 3, 4].map(() => html`<th>G</th><th>F</th><th>T</th>`)}</tr></thead>
      <tbody>${lignes}<tr><td><b>TOTAL</b></td>${sx(Tt.ins)}${sx(Tt.pr)}<td>${Tt.ab.length}</td><td></td>${sx(Tt.adm)}${taux(Tt.adm, Tt.pr)}${sx(Tt.red)}<td><b>${nv.reduce((k, c) => k + prob(c), 0)}</b></td></tr></tbody></table>
      <p class="doc-note">• Taux d’admission = admis ÷ effectif présent. • Effectif probable = redoublants + admis de la classe précédente ; CP1 = redoublants + nouveaux CP1 attendus (${edit ? html`<input type="number" min="0" max="999" value="${nouveaux}" data-change="redac" data-k="FIN||nouveauxCP1" style="width:60px" aria-label="Nouveaux CP1 attendus">` : nouveaux}). • Les admis du CM2 entrent en 6e.</p>`;
  }
  function blocDecisions() {
    const x = X();
    return html`<table class="${T}"><thead><tr><th>COURS</th>${C.DECISIONS.map((d) => html`<th>${d.toUpperCase()}</th>`)}<th>MGA INCOMPLÈTE</th></tr></thead><tbody>${x.niveaux().map((c) => {
      const pr = x.actifsDe(c);
      return html`<tr><td><b>${c}</b></td>${C.DECISIONS.map((d) => html`<td>${(d === 'Admis' || d === 'Redoublant' ? pr : S().students.filter((s) => s.classe === c)).filter((s) => x.decision(s) === d).length}</td>`)}<td>${pr.filter((s) => !x.decision(s)).length}</td></tr>`;
    })}</tbody></table>`;
  }
  function blocCM2() {
    const x = X(), L = S().students.filter((s) => s.classe === 'CM2').sort(x.parNom), { w } = x.classement('CM2', 'A'), pr = L.filter((s) => s.statut === 'Inscrit'), adm = pr.filter((s) => x.decision(s) === 'Admis');
    return html`<table class="${T}"><thead><tr><th>N°</th><th>Matricule</th><th class="g">Nom et prénoms</th><th>Sexe</th><th>Statut</th>${[1, 2, 3, 4].map((n) => html`<th>${x.evalLabel('CM2', n)} (/20)</th>`)}<th>MGA (/20)</th><th>Décision</th><th>Rang</th><th>Observation</th></tr></thead>
      <tbody>${L.map((s, i) => {
        const m = s.statut === 'Inscrit' ? x.mga(s) : null, r = w.find((z) => z.s.id === s.id), d = x.decision(s);
        return html`<tr><td>${i + 1}</td><td>${x.matOf(s)}</td><td class="nom">${x.nomComplet(s)}</td><td>${s.sexe ? s.sexe[0] : ''}</td><td>${s.statut === 'Inscrit' ? 'PRÉSENT' : s.statut.toUpperCase()}</td>${[1, 2, 3, 4].map((n) => html`<td>${s.statut !== 'Inscrit' ? '' : x.estAbsent(s.id, n) ? 'Abs.' : u.fmtNote(x.moyEval(s, n))}</td>`)}<td><b>${u.fmtNote(m)}</b></td><td>${(d || '').toUpperCase()}</td><td>${r ? x.rangTxt(r.rank) : ''}</td><td>${d === 'Admis' ? x.mention(m, 'CM2') : d === 'Redoublant' ? 'Insuffisant' : ''}</td></tr>`;
      })}</tbody></table>
      <p class="doc-note">Présents : <b>${pr.length}</b> (${x.compteSexe(pr)[0]} G, ${x.compteSexe(pr)[1]} F) · Admis en 6e : <b>${adm.length}</b> · Taux d’admission : <b>${u.pct(adm.length, pr.length)}</b>. MGA = moyenne des 4 évaluations (toutes saisies) ; admis si MGA ≥ 10/20.</p>`;
  }
  function blocResClasse(c, n) {
    const x = X(), M = x.matieres(c, n).slice().sort((a, b) => {
      const i = C.ORDRE_MAT.indexOf(a[0]), j = C.ORDRE_MAT.indexOf(b[0]);
      return (i < 0 ? 99 : i) - (j < 0 ? 99 : j);
    });
    const L = x.actifsDe(c).sort(x.parNom), e = x.echelle(c), seuil = x.info(c).seuil;
    const lignes = L.map((s, i) => {
      const r = x.resultat(s, n), ab = x.estAbsent(s.id, n);
      return html`<tr><td>${i + 1}</td><td>${x.matOf(s)}</td><td class="nom">${x.nomComplet(s)}</td>${M.map(([m]) => html`<td>${ab ? '' : u.fmtSaisie(x.note(s.id, n, m))}</td>`)}<td>${ab ? '' : r ? u.fmtSaisie(r.total) : ''}</td><td><b>${ab ? 'Abs.' : r ? u.fmtNote(r.moy) : ''}</b></td><td>${ab ? 'Absent' : r ? (r.moy >= seuil ? x.mention(r.moy, c) : 'Insuffisant') : ''}</td></tr>`;

    const [ig, ifi, it] = x.compteSexe(L), [pg, pf, pt] = x.compteSexe(pres), [ag, af, at] = x.compteSexe(adm);
    const pc = (a, b) => (b ? Math.round((a / b) * 100) + ' %' : '—');
    const recap = html`<table class="${T}"><thead><tr><th></th><th>Garçons</th><th>Filles</th><th>TOTAL</th></tr></thead><tbody><tr><td class="g"><b>Inscrits</b></td>${sx(L)}</tr><tr><td class="g"><b>Présents</b></td>${sx(pres)}</tr><tr><td class="g"><b>Absents</b></td>${sx(L.filter((s) => !pres.includes(s)))}</tr><tr><td class="g"><b>Taux de présence</b></td><td>${pc(pg, ig)}</td><td>${pc(pf, ifi)}</td><td><b>${pc(pt, it)}</b></td></tr><tr><td class="g"><b>Admis</b></td>${sx(adm)}</tr><tr><td class="g"><b>Non admis</b></td>${sx(pres.filter((s) => !adm.includes(s)))}</tr><tr><td class="g"><b>Taux d’admission</b></td><td>${pc(ag, pg)}</td><td>${pc(af, pf)}</td><td><b>${pc(at, pt)}</b></td></tr></tbody></table>`;
    return {
      table: html`<table class="${T}"><thead><tr><th>N°</th><th>MATRICULE</th><th class="g">NOM ET PRÉNOMS</th>${M.map(([m, w]) => html`<th>${C.MAT_COURT[m] || m}<br><span style="font-weight:400">/${x.noteMax(c, w)}</span></th>`)}<th>TOTAL</th><th>MOYENNE<br><span style="font-weight:400">/${e}</span></th><th>OBS</th></tr></thead><tbody>${lignes.length ? lignes : html`<tr><td colspan="${M.length + 6}">Aucun élève inscrit.</td></tr>`}</tbody></table>`,
      recap

  }

  /* ---------- Âges et extraits ---------- */
  const groupes = () => {
    const nv = X().niveaux(), cp = nv.filter((c) => c === 'CP1' || c === 'CP2');
    return [...nv.map((c) => [c, [c]]), ...(cp.length ? [['Total CP', cp]] : []), ['Total école', nv]];
  };
  const tranche = (a) => (a == null ? null : a <= 5 ? '≤5' : a >= 13 ? '≥13' : String(a));
  function donneesAges() {
    const x = X(), act = x.actifs(), G = groupes();
    return C.BINS.map((b) => [b, ...G.flatMap(([, cl]) => x.compteSexe(act.filter((s) => cl.includes(s.classe) && tranche(x.ageDe(s)) === b)))]);
  }
  function tableAges(cls = 'doc-tab serre') {
    const G = groupes(), rows = donneesAges(), tot = G.flatMap((_, gi) => [0, 1, 2].map((k) => rows.reduce((n, r) => n + r[1 + gi * 3 + k], 0)));
    return html`<table class="${cls}"><thead><tr><th rowspan="2">Âge</th>${G.map(([l]) => html`<th colspan="3">${l}</th>`)}</tr><tr>${G.map(() => html`<th>G</th><th>F</th><th>T</th>`)}</tr></thead><tbody>${rows.map((r) => html`<tr><td><b>${r[0]} ans</b></td>${r.slice(1).map((v, i) => html`<td${i % 3 === 2 ? raw(' style="font-weight:800"') : ''}>${v || '·'}</td>`)}</tr>`)}</tbody><tfoot><tr><td>Total</td>${tot.map((v) => html`<td>${v}</td>`)}</tr></tfoot></table>`;

  function tableExtraits(cls = 'doc-tab serre') {
    const x = X(), act = x.actifs(), cell = (cl, ex) => x.compteSexe(act.filter((s) => cl.includes(s.classe) && s.extrait === ex));
    return html`<table class="${cls}"><thead><tr><th rowspan="2">Niveau</th><th colspan="3">Avec extrait</th><th colspan="3">Sans extrait</th><th rowspan="2">Effectif</th></tr><tr>${[0, 1].map(() => html`<th>G</th><th>F</th><th>T</th>`)}</tr></thead><tbody>${groupes().map(([l, cl]) => {

  const iTab = (h, rows) => html`<table class="${T}">${h ? html`<thead><tr>${h.map((z) => html`<th>${z}</th>`)}</tr></thead>` : ''}<tbody>${rows.map((r) => html`<tr>${r.map((z, i) => (i ? html`<td>${z}</td>` : html`<td class="g"><b>${z}</b></td>`))}</tr>`)}</tbody></table>`;
  const iVide = (v) => html`<p class="doc-note">${v === 'non' ? 'Aucun à l’école.' : 'Non renseigné.'}</p>`;
  function sectionsInfra(I) {
    const x = X(), act = x.actifs(), eff = act.length, fil = act.filter((s) => s.sexe === 'Féminin').length, ens = S().teachers.filter((t) => t.actif !== false && x.clsDe(t).length).length, Tt = I.toil, E = I.eau, el = Tt.eleves;
    const sal = iSom(I.salles.agglo, I.salles.prov), tb = iN(I.mob.tb), bon = iN(I.mob.tbBon), cab = Tt.existe === 'oui' ? iN(el.fonct) : null;
    const sep = (o, a, b, cnt) => (o.sep === 'oui' ? `Oui (${a} / ${b}${cnt ? ` : ${iT(o.nf)} / ${iT(o.ng)}` : ''})` : iL(C.ON, o.sep));
    const nv = x.niveaux();
    const man = nv.map((c) => {
      const m = I.manuels[c] || {}, n = x.actifsDe(c).length;
      return [c, n, iT(m.lec), iRat(n, iN(m.lec)), iT(m.mat), iRat(n, iN(m.mat))];

    const ml = iSom(...nv.map((c) => (I.manuels[c] || {}).lec)), mm = iSom(...nv.map((c) => (I.manuels[c] || {}).mat));
    const R = [['Élèves par salle de classe', iRat(eff, sal)], ['Élèves par enseignant', iRat(eff, ens)], ['Élèves par table-banc', iRat(eff, tb)], ['Élèves par cabine fonctionnelle', iRat(eff, cab)]];
    if (Tt.existe === 'oui' && el.sep === 'oui') R.push(['Filles par cabine des filles', iRat(fil, iN(el.nf))], ['Garçons par cabine des garçons', iRat(eff - fil, iN(el.ng))]);
    R.push(['Élèves par manuel de lecture', iRat(eff, ml)], ['Élèves par manuel de mathématiques', iRat(eff, mm)]);
    return [
      ['Bâtiments et salles de classe', iTab(['', 'En dur (agglos)', 'Matériaux provisoires', 'Total'], [['Bâtiments', iT(I.bat.agglo), iT(I.bat.prov), iT(iSom(I.bat.agglo, I.bat.prov))], ['Salles de classe', iT(I.salles.agglo), iT(I.salles.prov), iT(sal)]])],
      ['Toilettes', Tt.existe !== 'oui' ? iVide(Tt.existe) : iTab(['Pour', 'Type', 'Cabines', 'Fonctionnelles', 'Non fonctionnelles', 'Séparées'], [['Élèves', el.type || '—', ...iNF(el.n, el.fonct), sep(el, 'filles', 'garçons', 1)], ['Enseignants', Tt.ens.type || '—', ...iNF(Tt.ens.n, Tt.ens.fonct), sep(Tt.ens, 'hommes', 'femmes')]])],
      ['Points d’eau', E.existe !== 'oui' ? iVide(E.existe) : iTab(['Type', 'Nombre', 'Fonctionnels', 'Non fonctionnels'], [...C.EAUX.map(([k, l]) => [l, ...iNF(E[k].n, E[k].fonct)]), ['Total', ...iNF(iSom(...C.EAUX.map(([k]) => E[k].n)), iSom(...C.EAUX.map(([k]) => E[k].fonct)))]])],
      ['Électricité', iTab(null, [['Dans le village', iL(C.ON, I.elec.village)], ['À l’école', iL(C.ON, I.elec.ecole)], ['Dans les salles de classe', iL(C.ONP, I.elec.salles)]])],
      ['Logements des enseignants', iTab(null, [['Logements', I.loge.existe === 'oui' ? `Oui : ${iT(I.loge.n)}` : iL(C.ON, I.loge.existe)]])],
      ['Mobilier', iTab(null, [['Tables-bancs', iT(tb)], ['Dont en bon état', iT(bon)], ['Dont en mauvais état', tb != null && bon != null ? Math.max(0, tb - bon) : '—'], ['Bureaux de maître', iT(I.mob.bureaux)], ['Tableaux', iT(I.mob.tableaux)]])],
      ['Cantine scolaire', I.cant.existe !== 'oui' ? iVide(I.cant.existe) : iTab(null, [['Fonctionnelle', iL(C.ON, I.cant.fonct)], ['Rationnaires', iT(I.cant.ration)], ['Partenaire', I.cant.partenaire || '—']])],
      ['Autres locaux', iTab(null, C.LOCAUX.map(([k, l, p]) => [l, iL(p ? C.ONP : C.ON, I.locaux[k])]))],
      ['Manuels scolaires', iTab(['Niveau', 'Élèves', 'Manuels de lecture', 'Élèves par manuel', 'Manuels de mathématiques', 'Élèves par manuel'], [...man, ['Total', eff, iT(ml), iRat(eff, ml), iT(mm), iRat(eff, mm)]])],
      ['Accès et sécurité', iTab(null, [['Distance jusqu’à l’IEPP', I.acces.dist === '' ? '—' : `${iT(I.acces.dist)} km`], ['État de la route', iL(C.ROUTES, I.acces.route)], ['Réseau téléphone', iL(C.RESEAUX, I.acces.reseau)], ['Rampe pour handicapés', iL(C.ON, I.acces.rampe)], ['Boîte à pharmacie', iL(C.ON, I.acces.pharma)]])],
      ['Ratios', iTab(['Indicateur', 'Valeur'], R)]

  }
  /** Lecture du formulaire d'infrastructures : objet complet ou ErreurMetier. */
  function lireInfra(d) {
    const I = infra();
    Object.entries(d).forEach(([k, v]) => {
      const p = k.split('.');
      if (p.some((z) => z === '__proto__' || z === 'constructor')) return;

    for (const [o, l, ch] of L) if ((iN(o.fonct) || 0) > (iN(o.n) || 0)) throw new AK.ErreurMetier(`${l} : le nombre « dont fonctionnels » dépasse le nombre total.`, ch);

    if ((iN(I.mob.tbBon) || 0) > (iN(I.mob.tb) || 0)) throw new AK.ErreurMetier('Tables-bancs : plus en bon état que le total.', 'mob.tbBon');
