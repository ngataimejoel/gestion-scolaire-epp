.carte-id.verso .v-texte { font-size: 5.6pt; line-height: 1.38; position: relative; z-index: 2; color: #222; }
.carte-id.verso .v-texte p { margin: 0 0 1.2mm; }
.carte-id.verso .v-pied { position: absolute; left: 3mm; right: 3mm; bottom: 3mm; display: flex; justify-content: space-between; align-items: flex-end; font-size: 5pt; color: var(--c-gris); z-index: 2; }

/* Planche A4 de cartes avec traits de coupe */
.planche { position: relative; }
.planche .emplacement { position: absolute; }
.planche .trait { position: absolute; background: #000; }
.planche .legende-planche { position: absolute; left: 0; right: 0; bottom: 3mm; text-align: center; font: 6.5pt Arial, sans-serif; color: #777; }

/* ==== styles/07-impression.css ==== */
/* =====================================================================================
   Impression : seules les feuilles préparées sont imprimées (jamais les menus ou boutons).
   Chaque feuille porte son format (pages nommées) ; marges gérées dans la feuille, donc
   @page sans marge. Réglez la boîte d'impression sur « Marges : aucune » ou « par défaut »
   et « Échelle : 100 % » (voir docs/GUIDE.md).
   ===================================================================================== */
@page { size: A4 portrait; margin: 0; }
@page a4 { size: A4 portrait; margin: 0; }
@page a4p { size: A4 landscape; margin: 0; }
@page a5 { size: A5 portrait; margin: 0; }
@page carte { size: 85.6mm 53.98mm; margin: 0; }
@page carteP { size: 53.98mm 85.6mm; margin: 0; }
@page badge { size: 70mm 100mm; margin: 0; }

@media print {
  html, body { height: auto !important; overflow: visible !important; background: #fff !important; }
  body > *:not(.zone-impression) { display: none !important; }

<script>
/* =====================================================================================
   Validation des données : chaque règle renvoie '' (valide) ou un message compréhensible.
   Les formulaires affichent le message sous le champ concerné ; la logique métier
   revalide toujours avant d'enregistrer (un bouton masqué n'est pas une protection).
   ===================================================================================== */
(function (AK) {
  'use strict';
  const C = AK.cfg, u = AK.u;
  const V = {};

  /* ---------- Noms ---------- */
  const CIVIL = /^(M\.?|MR\.?|MME\.?|MLLE\.?|DR\.?)$/i;
  const motOk = (w) => /^[A-Za-zÀ-ÖØ-öø-ÿ][A-Za-zÀ-ÖØ-öø-ÿ'’-]+$/.test(w) && !/^(.)\1*$/i.test(w.replace(/['’-]/g, ''));
  /** Nom de personne : mots de 2 lettres au moins ; min = nombre de mots exigés (2 pour « nom et prénoms »). */
  V.nom = function (v, lib, min = 2, max = 80) {
    const s = String(v || '').trim();
    if (s.length > max) return `${lib} : ${max} caractères au maximum.`;
    const m = s.split(/\s+/).filter((w) => w && !CIVIL.test(w));
    if (m.length < min) return min > 1 ? `${lib} : nom et prénoms en entier (ex. KOFFI KOUADIO).` : `${lib} : à renseigner.`;
    return m.every(motOk) ? '' : `${lib} : lettres uniquement, 2 au moins par mot (ex. KOFFI KOUADIO).`;
  };
  V.civ = {
    de(n) {
      const m = String(n || '').trim().match(/^(MLLE|MME|MR|M)\.?\s+/i);
      return m ? { mlle: 'Mlle', mme: 'Mme' }[m[1].toLowerCase()] || 'M.' : '';
    },
    sans: (n) => String(n || '').trim().replace(/^(MLLE|MME|MR|M)\.?\s+/i, ''),
    avec: (c, n) => (C.CIVS.includes(c) ? c + ' ' : '') + u.majNomComplet(V.civ.sans(n))
  };

  /* ---------- Téléphones (Côte d'Ivoire) ---------- */
  V.telCI = (v) => {
    const n = String(v || '').replace(/[\s.\-()/]/g, '').replace(/^(?:\+|00)?225(?=\d{10}$)/, '');
    return /^0[157]\d{8}$/.test(n) ? '+225 ' + n.replace(/(\d\d)(?=\d)/g, '$1 ') : null;
  };
  V.tel = (v, lib) => (!String(v || '').trim() || V.telCI(v) ? '' : `${lib} : ${C.TEL_ERR}`);
  V.telPropre = (v) => V.telCI(v) || String(v || '').trim();

  /* ---------- Dates ---------- */
  V.date = (v, lib, { requise = false, min, max } = {}) => {
    if (!v) return requise ? `${lib} : date à renseigner.` : '';
    if (!u.estISO(v)) return `${lib} : date invalide.`;
    if (min && v < min) return `${lib} : la date doit être postérieure au ${u.fmtDate(min)}.`;
    if (max && v > max) return `${lib} : la date ne peut pas dépasser le ${u.fmtDate(max)}.`;
    return '';
  };
  V.periode = (du, au) => (du && au && au < du ? 'La date de fin est avant la date de début.' : '');
  /** Naissance plausible pour un élève du primaire (2 à 20 ans à la rentrée). */
  V.naissanceEleve = (v, anneeRentree) => {
    const e = V.date(v, 'Date de naissance', { requise: true, max: u.aujourdhui() });
    if (e) return e;
    const age = anneeRentree - Number(v.slice(0, 4));
    return age < 2 || age > 20 ? 'Date de naissance improbable pour un élève du primaire (âge entre 2 et 20 ans).' : '';
  };

  /* ---------- Scolarité ---------- */
  V.classe = (v, niveaux) => ((niveaux || C.TOUS_NIVEAUX).includes(v) ? '' : 'Classe inconnue : choisissez un niveau ouvert dans l’école.');
  V.anneeScolaire = (v) => {
    const m = String(v || '').match(/^(\d{4})\s*[–-]\s*(\d{4})$/);
    return m && Number(m[2]) === Number(m[1]) + 1 ? '' : 'Année scolaire au format 2026–2027.';
  };
  V.normAnnee = (v) => {
    const m = String(v || '').match(/^(\d{4})\s*[–-]\s*(\d{4})$/);
    return m ? `${m[1]}–${m[2]}` : String(v || '');
  };
  /** Matricule national (DESPS) : 6 à 12 caractères, lettres et chiffres (ex. 12345678A). */
  V.matNat = (v) => {
    const s = String(v || '').replace(/\s/g, '').toUpperCase();
    if (!s) return '';
    return /^[0-9A-Z]{6,12}$/.test(s) ? '' : 'Matricule national : 6 à 12 lettres ou chiffres, sans espace (ex. 12345678A).';
  };
  V.matriculeAgent = (v) => (!String(v || '').trim() || /^[0-9A-Za-z][0-9A-Za-z \-/.]{2,19}$/.test(String(v).trim()) ? '' : 'Matricule : 3 à 20 caractères (lettres, chiffres, espaces, - / .).');

/* =====================================================================================
   Journalisation technique et diagnostic.
   - Erreurs JavaScript et promesses rejetées capturées (sans données personnelles).
   - Rapport de diagnostic exportable (version, stockage, quotas, erreurs récentes).
   Le journal des opérations métier (qui a fait quoi) est dans AK.audit (data/store.js).

(function (AK) {
  'use strict';
  const MAX = 200;
  const tampon = [];

  /* Retire les éléments personnels possibles d'un message (adresses de fichiers, nombres longs). */
  const nettoyer = (s) =>
    String(s || '')
      .replace(/data:[^\s"')]+/g, 'data:…')
      .replace(/file:\/\/\/[^\s"')]+/g, 'file:…')
      .replace(/\b\d{8,}\b/g, '…')
      .slice(0, 600);

  function noter(niveau, message, contexte) {
    tampon.push({ t: Date.now(), niveau, message: nettoyer(message), contexte: contexte ? nettoyer(contexte) : '' });
    if (tampon.length > MAX) tampon.shift();
  }

  const diag = {
    info: (m, c) => noter('info', m, c),
    avert: (m, c) => noter('avert', m, c),
    erreur(e, contexte) {
      const msg = e && e.message ? e.message : String(e);
      const pile = e && e.stack ? String(e.stack).split('\n').slice(0, 4).join(' | ') : '';
      noter('erreur', msg, (contexte || '') + (pile ? ' :: ' + pile : ''));
      if (window.console) console.error('[AKWA]', contexte || '', e);
    },
    liste: () => tampon.slice().reverse(),
    vider: () => (tampon.length = 0),
    async rapport() {
      const S = AK.store && AK.store.etat;
      const est = navigator.storage && navigator.storage.estimate ? await navigator.storage.estimate().catch(() => null) : null;
      const persiste = navigator.storage && navigator.storage.persisted ? await navigator.storage.persisted().catch(() => null) : null;

        application: AK.NOM + ' ' + AK.VERSION,
        genere: new Date().toISOString(),
        navigateur: navigator.userAgent,
        adresse: location.protocol,
        contexteSecurise: window.isSecureContext,
        webCrypto: !!(window.crypto && crypto.subtle),
        stockage: AK.stockage ? AK.stockage.description() : 'inconnu',
        quota: est ? { utilise: est.usage, total: est.quota } : null,
        persistant: persiste,
        hote: AK.hote ? AK.hote.type : 'inconnu',
        schema: S && S.meta ? S.meta.schema : null,
        volumes: S ? { eleves: S.students.length, personnel: S.teachers.length, notes: Object.keys(S.grades).length, documents: (S.docs && S.docs.items.length) || 0 } : null,

<script>
/* =====================================================================================
   Schéma des données, assainissement, migration et contrôle d'intégrité.

   Compatibilité : la structure reste celle d'AKWA SCHOOL 1.x (v: 5 : élèves, personnel,
   notes « id|évaluation|matière », appels, demandes…), complétée de rubriques nouvelles
   (meta, securite, docs, modeles, cles, corbeille). Une sauvegarde 1.x s'ouvre sans perte ;
   l'export « format 1.x » permet de revenir vers les applications existantes.
   ===================================================================================== */
(function (AK) {
  'use strict';
  const C = AK.cfg, u = AK.u;
  const SCHEMA = 6;

  function proVide() {
    return {
      edt: {}, cahier: [], incidents: [], soins: [], events: [],
      frais: {}, paiements: [], depenses: [],
      cantine: { inscrits: {}, prix: 100, menu: C.JOURS_EDT.map(([, j]) => ({ j, p: '' })), repas: {} },
      livres: [], prets: [], cepe: {}, sms: [], annonces: [], transmis: [],
      seq: { rec: 1 }, journal: []
    };
  }

  /** État vierge d'une nouvelle école. */
  function vierge() {
    return {
      v: 5,
      meta: { schema: SCHEMA, app: AK.VERSION, cree: new Date().toISOString(), installId: u.uid() + u.uid(), migreDe: null, demo: false },
      school: { ...u.clone(C.ECOLE) },
      students: [], teachers: [], grades: {}, compAbs: {}, att: {}, appel: {}, auth: [], conges: [],
      redac: {}, persoReps: [], archives: {}, lastBackup: '', log: [], messages: [], attente: {}, saisie: {},
      cpMat: {}, cpExtra: [], pro: proVide(),
      securite: { admin: null, secours: null, comptes: {}, verrouMin: C.SECU.VERROU_MIN, forcerChangement: false, aSecourir: false },
      docs: { seq: {}, items: [] },
      modeles: {},
      cles: { liste: [], active: null },
      corbeille: []
    };
  }

  /* ---------- Assainissement des données venues d'ailleurs (sauvegarde, import, migration) ----------
     Rien ne doit pouvoir s'exécuter : images limitées aux images intégrées (PNG, JPEG, GIF, WebP),
     identifiants limités aux lettres, chiffres, - et _, clés dangereuses (__proto__…) écartées.
     Le texte est conservé tel quel : l'affichage échappe systématiquement le HTML. */
  const CH_IMG = new Set(['photo', 'extraitPhoto', 'avis', 'logoEcole', 'logoIepp', 'armoiries', 'signatureImg']);
  const CH_ID = new Set(['id', 'tid', 'sid', 'pid', 'livre']);
  const INTERDITES = new Set(['__proto__', 'constructor', 'prototype']);
  const MAX_TEXTE = 20000;
  function assainir(v, cle, profondeur = 0) {
    if (profondeur > 40) return null;
    if (typeof v === 'string') {
      if (CH_IMG.has(cle)) return u.IMG_OK.test(v) ? v : '';
      if (CH_ID.has(cle)) return v.replace(/[^\w-]/g, '').slice(0, 64);
      return v.length > MAX_TEXTE ? v.slice(0, MAX_TEXTE) : v;
    }
    if (typeof v === 'number') return Number.isFinite(v) ? v : null;
    if (typeof v === 'boolean' || v == null) return v;
    if (Array.isArray(v)) return v.map((x) => assainir(x, cle, profondeur + 1));
    if (typeof v === 'object') {
      const out = {};
      for (const k of Object.keys(v)) {
        if (INTERDITES.has(k)) continue;
        out[k] = assainir(v[k], k, profondeur + 1);
      }
      return out;
    }
    return null;
  }

  const SANS_PARENT = { nom: '', prenoms: '', profession: '', tel: '', domicile: '' };
  const tableau = (x) => (Array.isArray(x) ? x : []);
  const objet = (x) => (x && typeof x === 'object' && !Array.isArray(x) ? x : {});

  /** Complète un élève (champs ajoutés au fil des versions). */
  function completerEleve(s) {
    s.id = s.id || u.uid();
    s.nom = String(s.nom || '');
    s.prenoms = String(s.prenoms || '');
    s.pere = { ...SANS_PARENT, ...objet(s.pere) };
    s.mere = { ...SANS_PARENT, ...objet(s.mere) };
    ['sang', 'allergies', 'entree', 'motifDepart', 'lieu', 'parent', 'tel', 'mat', 'photo', 'decision'].forEach((k) => {
      if (s[k] == null) s[k] = '';
    });
    const natRef = AK.ref.NATIONALITES.find((x) => u.norm(x[1]) === u.norm(s.nationalite));
    s.nationalite = natRef ? natRef[1] : String(s.nationalite || '').trim().toUpperCase() || C.NAT_DEFAUT;
    if (s.matNat == null) s.matNat = /^AK-/i.test(s.mat || '') ? '' : s.mat || '';
    s.parcours = tableau(s.parcours);
    s.acte = { num: '', date: '', centre: '', sp: '', ...objet(s.acte) };
    s.extrait = !!s.extrait;
    s.redoublant = !!s.redoublant;
    if (!C.STATUTS.includes(s.statut)) s.statut = 'Inscrit';
    if (s.sexe !== 'Masculin' && s.sexe !== 'Féminin') s.sexe = s.sexe ? (/^m/i.test(s.sexe) ? 'Masculin' : 'Féminin') : '';
    return s;
  }
  function completerAgent(t) {
    t.id = t.id || u.uid();
    t.nom = String(t.nom || '');
    if (!Array.isArray(t.classes)) t.classes = t.classe ? [t.classe] : [];
    t.classes = t.classes.filter((c) => C.TOUS_NIVEAUX.includes(c));
    t.classe = t.classes[0] || '';
    if (t.compte === undefined) t.compte = null;
    if (t.actif == null) t.actif = true;
    ['matricule', 'fonction', 'grade', 'echelon', 'tel', 'fonct', 'fonctAutre', 'photo'].forEach((k) => {
      if (t[k] == null) t[k] = '';
    });
    return t;
  }

  /**
   * Migration contrôlée vers le schéma courant. Ne supprime aucune donnée métier.
   * Renvoie { etat, notes } ; « notes » décrit ce qui a été transformé (affiché à l'utilisateur).
   * Les secrets en clair (mot de passe « adminPwd », code de secours) sont retirés ici et
   * convertis en empreintes par AK.auth.migrerSecrets() (opération asynchrone).
   */
  function migrer(source) {
    const notes = [];
    if (!source || typeof source !== 'object' || !Array.isArray(source.students)) throw new AK.ErreurMetier('Données illisibles : ce fichier ne contient pas de liste d’élèves.');
    const o = assainir(source);
    const base = vierge();
    const ancien = !o.meta || !o.meta.schema;
    if (o.meta && o.meta.schema > SCHEMA) throw new AK.ErreurMetier(`Ces données viennent d’une version plus récente d’AKWA SCHOOL (schéma ${o.meta.schema}). Mettez l’application à jour avant de les ouvrir.`);

    const S = { ...base, ...o };
    S.v = 5;
    S.meta = { ...base.meta, ...objet(o.meta), schema: SCHEMA, app: AK.VERSION };
    if (ancien) {
      S.meta.migreDe = '1.x';
      S.meta.installId = base.meta.installId;
      notes.push('Données AKWA SCHOOL 1.x converties au format 2.0.');
    }
    S.school = { ...u.clone(C.ECOLE), ...objet(o.school) };
    if (!Array.isArray(S.school.niveaux) || !S.school.niveaux.length) S.school.niveaux = C.TOUS_NIVEAUX.slice();
    S.school.niveaux = C.TOUS_NIVEAUX.filter((c) => S.school.niveaux.includes(c));
    if (!S.school.year) S.school.year = '';
    if (S.school.accent && !C.ACCENTS.some((a) => a[0] === S.school.accent)) S.school.accent = 'navy';
    if (![1, 2, 3, 4].includes(Number(S.school.evalCourante))) S.school.evalCourante = 1;
    S.school.evalCourante = Number(S.school.evalCourante);

    /* Secrets en clair d'AKWA SCHOOL 1.x : mis de côté pour être convertis en empreintes. */
    S.securite = { ...base.securite, ...objet(o.securite) };
    S.securite.comptes = objet(S.securite.comptes);
    const ancienMdp = typeof S.school.adminPwd === 'string' ? S.school.adminPwd : null;
    if (ancienMdp != null) {
      S._mdpEnClair = ancienMdp; // retiré par AK.auth.migrerSecrets(), jamais enregistré
      notes.push('Mot de passe administrateur converti en empreinte (il n’est plus conservé en clair).');
    }
    if (S.school.secours) notes.push('Ancien code de secours retiré : un nouveau code personnel sera créé.');
    delete S.school.adminPwd;
    delete S.school.secours;
    delete S.session;

    S.students = tableau(o.students).map(completerEleve);
    S.teachers = tableau(o.teachers).map(completerAgent);
    S.grades = objet(o.grades);
    Object.keys(S.grades).forEach((k) => {
      if (typeof S.grades[k] !== 'number') delete S.grades[k];
    });
    ['compAbs', 'att', 'appel', 'redac', 'archives', 'attente', 'saisie', 'cpMat'].forEach((k) => (S[k] = objet(o[k])));
    ['auth', 'conges', 'persoReps', 'log', 'messages', 'cpExtra', 'corbeille'].forEach((k) => (S[k] = tableau(o[k])));
    S.messages.forEach((m) => (m.lus = objet(m.lus)));
    S.auth.forEach((a) => {
      if (!a.id) a.id = u.uid();
    });
    S.conges.forEach((c) => {
      if (!c.id) c.id = u.uid();
      c.lib = c.lib || c.motif || c.nom || 'Congé';
    });
    const pv = proVide(), po = objet(o.pro);
    S.pro = { ...pv, ...po };
    S.pro.cantine = { ...pv.cantine, ...objet(po.cantine) };
    S.pro.cantine.inscrits = objet(S.pro.cantine.inscrits);
    S.pro.cantine.repas = objet(S.pro.cantine.repas);
    if (!Array.isArray(S.pro.cantine.menu) || S.pro.cantine.menu.length !== C.JOURS_EDT.length) S.pro.cantine.menu = pv.cantine.menu;
    ['cahier', 'incidents', 'soins', 'events', 'paiements', 'depenses', 'livres', 'prets', 'sms', 'annonces', 'transmis', 'journal'].forEach((k) => (S.pro[k] = tableau(S.pro[k])));
    ['edt', 'frais', 'cepe'].forEach((k) => (S.pro[k] = objet(S.pro[k])));
    S.pro.seq = { rec: 1, ...objet(S.pro.seq) };
    // numéro de reçu suivant : jamais en dessous du plus grand numéro existant
    const maxRec = S.pro.paiements.reduce((m, p) => Math.max(m, parseInt(String(p.ref || '').split('-').pop(), 10) || 0), 0);
    if (S.pro.seq.rec <= maxRec) S.pro.seq.rec = maxRec + 1;

    S.docs = { seq: objet(objet(o.docs).seq), items: tableau(objet(o.docs).items) };
    S.modeles = objet(o.modeles);
    S.cles = { liste: tableau(objet(o.cles).liste), active: objet(o.cles).active || null };
    if (o.infra) S.infra = objet(o.infra);
    return { etat: S, notes };
  }

  /**
   * Contrôle d'intégrité : signale sans rien supprimer.
   * Chaque problème : { code, gravite: 'erreur'|'avert', message, ids }
   */
  function verifier(S) {
    const P = [];
    const niveaux = S.school.niveaux || C.TOUS_NIVEAUX;
    const vus = new Map(), matsNat = new Map();
    S.students.forEach((s) => {
      if (vus.has(s.id)) P.push({ code: 'id-double', gravite: 'erreur', message: `Identifiant d’élève en double (${s.nom} ${s.prenoms}).`, ids: [s.id] });
      vus.set(s.id, s);
      if (s.statut === 'Inscrit' && !niveaux.includes(s.classe))
        P.push({ code: 'classe-invalide', gravite: 'erreur', message: `${s.nom} ${s.prenoms} : classe « ${s.classe || 'aucune'} » absente des niveaux de l’école.`, ids: [s.id] });
      const m = u.norm(s.matNat);
      if (m) {
        if (matsNat.has(m)) P.push({ code: 'matricule-double', gravite: 'avert', message: `Matricule national ${s.matNat} attribué à deux élèves.`, ids: [matsNat.get(m), s.id] });
        else matsNat.set(m, s.id);
      }
      if (!s.sexe) P.push({ code: 'sexe-manquant', gravite: 'avert', message: `${s.nom} ${s.prenoms} : sexe non renseigné.`, ids: [s.id] });
    });
    let orphelines = 0;
    Object.keys(S.grades).forEach((k) => {
      if (!vus.has(k.split('|')[0])) orphelines++;
    });
    if (orphelines) P.push({ code: 'notes-orphelines', gravite: 'avert', message: `${u.pluriel(orphelines, 'note')} sans élève correspondant (élèves supprimés).`, ids: [] });
    const agents = new Set(S.teachers.map((t) => t.id));
    S.auth.forEach((a) => {
      const ok = a.qui === 'eleve' ? vus.has(a.pid) : agents.has(a.pid);
      if (!ok) P.push({ code: 'demande-orpheline', gravite: 'avert', message: `Demande ${a.ref} : personne introuvable (supprimée ?).`, ids: [a.id] });
    });
    const refs = new Set();
    (S.docs.items || []).forEach((d) => {
      if (refs.has(d.ref)) P.push({ code: 'reference-double', gravite: 'erreur', message: `Référence documentaire en double : ${d.ref}.`, ids: [d.ref] });
      refs.add(d.ref);
    });
    return P;
  }

  AK.schema = { SCHEMA, vierge, proVide, assainir, migrer, verifier, completerEleve, completerAgent };
})(window.AK);

<script>
/* =====================================================================================
   Persistance locale.

   Choix : IndexedDB (base du navigateur, plusieurs centaines de Mo, écritures transactionnelles)
   plutôt que localStorage (5 Mo environ, écriture d'un bloc, dépassement silencieux dans
   la version 1.7.0). Les images (photos, extraits, logos) sont rangées à part, une seule fois
   par contenu : l'enregistrement courant ne réécrit que le texte des données.

   Base « akwa-school » :
     kv        : 'etat' (texte JSON, images remplacées par « @img:<empreinte> »), 'info'
     images    : <empreinte> → image intégrée (data:)
     copies    : copies de sécurité locales (une par jour + avant chaque opération à risque)

   Repli : si IndexedDB est indisponible (navigation privée, réglages), localStorage puis,
   en dernier recours, la mémoire seule — avec un avertissement permanent à l'écran.
   ===================================================================================== */
(function (AK) {
  'use strict';
  const u = AK.u;
  const NOM_BASE = 'akwa-school';
  const VERSION_BASE = 1;
  const CLE_LS = 'akwa_school_2';
  const CLE_LS_1X = 'akwa_school_v5'; // AKWA SCHOOL 1.x (même navigateur) : lu, jamais effacé
  const PREFIXE_IMG = '@img:';
  const COPIES_JOUR = 14, COPIES_OPERATION = 10;

  /* ---------- Sérialisation : images à part ---------- */
  function serialiser(S) {
    const images = new Map();
    const texte = JSON.stringify(S, function (k, v) {
      if (this === S && k.startsWith('_')) return undefined; // champs transitoires
      if (typeof v === 'string' && v.length > 256 && v.startsWith('data:image/')) {
        const e = u.empreinte(v);
        images.set(e, v);
        return PREFIXE_IMG + e;
      }
      return v;
    });
    return { texte, images };
  }
  function reconstituer(texte, lireImage) {
    const manquantes = [];
    const S = JSON.parse(texte, (k, v) => {
      if (typeof v === 'string' && v.startsWith(PREFIXE_IMG)) {
        const img = lireImage(v.slice(PREFIXE_IMG.length));
        if (img == null) manquantes.push(k);
        return img || '';
      }
      return v;
    });
    return { S, manquantes };
  }

  /* ---------- IndexedDB (promesses) ---------- */
  const req = (r) => new Promise((ok, ko) => {
    r.onsuccess = () => ok(r.result);
    r.onerror = () => ko(r.error);
  });
  const finTx = (tx) => new Promise((ok, ko) => {
    tx.oncomplete = () => ok();
    tx.onerror = () => ko(tx.error);
    tx.onabort = () => ko(tx.error || new Error('Transaction annulée'));
  });
  function ouvrir() {
    return new Promise((ok, ko) => {
      if (!window.indexedDB) return ko(new Error('IndexedDB absent'));
      let r;
      try {
        r = indexedDB.open(NOM_BASE, VERSION_BASE);
      } catch (e) {
        return ko(e);
      }
      const minuterie = setTimeout(() => ko(new Error('IndexedDB ne répond pas')), 6000);
      r.onupgradeneeded = () => {
        const db = r.result;
        if (!db.objectStoreNames.contains('kv')) db.createObjectStore('kv');
        if (!db.objectStoreNames.contains('images')) db.createObjectStore('images');
        if (!db.objectStoreNames.contains('copies')) db.createObjectStore('copies', { keyPath: 'id' });
      };
      r.onsuccess = () => {
        clearTimeout(minuterie);
        const db = r.result;
        db.onversionchange = () => db.close();
        ok(db);
      };
      r.onerror = () => {
        clearTimeout(minuterie);
        ko(r.error);
      };
      r.onblocked = () => {
        clearTimeout(minuterie);
        ko(new Error('Base bloquée par une autre fenêtre d’AKWA SCHOOL'));
      };
    });
  }

  function adaptateurIDB(db) {
    const connues = new Set(); // images déjà écrites
    let cacheImages = new Map();
    return {
      nom: 'IndexedDB',
      async charger() {
        const tx = db.transaction(['kv', 'images'], 'readonly');
        const texte = await req(tx.objectStore('kv').get('etat'));
        if (texte == null) return null;
        const cles = await req(tx.objectStore('images').getAllKeys());
        const vals = await req(tx.objectStore('images').getAll());
        cacheImages = new Map(cles.map((k, i) => [k, vals[i]]));
        cles.forEach((k) => connues.add(k));
        return reconstituer(texte, (e) => cacheImages.get(e));
      },
      async enregistrer(S) {
        const { texte, images } = serialiser(S);
        const tx = db.transaction(['kv', 'images'], 'readwrite');
        const st = tx.objectStore('images');
        images.forEach((v, k) => {
          if (!connues.has(k)) st.put(v, k);
        });
        tx.objectStore('kv').put(texte, 'etat');
        tx.objectStore('kv').put({ maj: Date.now(), octets: texte.length, schema: S.meta && S.meta.schema }, 'info');
        await finTx(tx);
        images.forEach((v, k) => {
          connues.add(k);
          cacheImages.set(k, v);
        });
        return texte.length;
      },
      async copie(S, motif) {
        const { texte, images } = serialiser(S);
        const tx = db.transaction(['copies', 'images'], 'readwrite');
        const st = tx.objectStore('images');
        images.forEach((v, k) => {
          if (!connues.has(k)) st.put(v, k);
        });
        const id = (motif === 'jour' ? 'J' : 'O') + '-' + new Date().toISOString();
        tx.objectStore('copies').put({ id, motif, t: Date.now(), texte, eleves: S.students.length, octets: texte.length });
        await finTx(tx);
        images.forEach((v, k) => connues.add(k));
        await this.elaguerCopies();
        return id;
      },
      async listeCopies() {
        const tx = db.transaction('copies', 'readonly');
        const L = await req(tx.objectStore('copies').getAll());
        return L.map(({ id, motif, t, eleves, octets }) => ({ id, motif, t, eleves, octets })).sort((a, b) => b.t - a.t);
      },
      async lireCopie(id) {
        const tx = db.transaction(['copies', 'images'], 'readonly');
        const c = await req(tx.objectStore('copies').get(id));
        if (!c) throw new AK.ErreurMetier('Copie de sécurité introuvable.');
        const imgs = new Map();
        const st = tx.objectStore('images');
        const cles = await req(st.getAllKeys());
        const vals = await req(st.getAll());
        cles.forEach((k, i) => imgs.set(k, vals[i]));
        return reconstituer(c.texte, (e) => imgs.get(e)).S;
      },
      async elaguerCopies() {
        const L = await this.listeCopies();
        const jours = L.filter((c) => c.motif === 'jour').slice(COPIES_JOUR);
        const ops = L.filter((c) => c.motif !== 'jour').slice(COPIES_OPERATION);
        if (!jours.length && !ops.length) return;
        const tx = db.transaction('copies', 'readwrite');
        [...jours, ...ops].forEach((c) => tx.objectStore('copies').delete(c.id));
        await finTx(tx);
      },
      /** Supprime les images qui ne servent plus ni aux données ni aux copies. */
      async menage(S) {
        const utiles = new Set(serialiser(S).images.keys());
        const tx0 = db.transaction('copies', 'readonly');
        const copies = await req(tx0.objectStore('copies').getAll());
        copies.forEach((c) => (c.texte.match(/@img:[0-9a-f]{16}-[0-9a-z]+/g) || []).forEach((x) => utiles.add(x.slice(PREFIXE_IMG.length))));
        const tx = db.transaction('images', 'readwrite');
        const cles = await req(tx.objectStore('images').getAllKeys());
        let n = 0;
        cles.forEach((k) => {
          if (!utiles.has(k)) {
            tx.objectStore('images').delete(k);
            connues.delete(k);
            n++;
          }
        });
        await finTx(tx);
        return n;
      },
      async effacerTout() {
        const tx = db.transaction(['kv', 'images', 'copies'], 'readwrite');
        ['kv', 'images', 'copies'].forEach((s) => tx.objectStore(s).clear());
        await finTx(tx);
        connues.clear();
      }
    };
  }

  /* ---------- localStorage (repli) : images incluses, quota limité ---------- */
  function adaptateurLS() {
    return {
      nom: 'localStorage (capacité limitée)',
      async charger() {
        const t = localStorage.getItem(CLE_LS);
        return t ? { S: JSON.parse(t), manquantes: [] } : null;
      },
      async enregistrer(S) {
        const t = JSON.stringify(S, function (k, v) {
          return this === S && k.startsWith('_') ? undefined : v;
        });
        try {
          localStorage.setItem(CLE_LS, t);
        } catch (e) {
          throw new AK.ErreurMetier('Espace de stockage du navigateur plein : les dernières modifications ne sont PAS enregistrées. Faites une sauvegarde sur clé USB, puis retirez des photos ou utilisez un navigateur qui accepte IndexedDB.');
        }
        return t.length;
      },
      async copie() {
        return null;
      },
      async listeCopies() {
        return [];
      },
      async lireCopie() {
        throw new AK.ErreurMetier('Copies de sécurité indisponibles avec ce stockage.');
      },
      async elaguerCopies() {},
      async menage() {
        return 0;
      },
      async effacerTout() {
        localStorage.removeItem(CLE_LS);
      }
    };
  }
  function adaptateurMemoire() {
    let memo = null;
    return {
      nom: 'mémoire seule (rien n’est conservé à la fermeture)',
      ephemere: true,
      async charger() {
        return memo ? { S: JSON.parse(memo), manquantes: [] } : null;
      },
      async enregistrer(S) {
        memo = JSON.stringify(S);
        return memo.length;
      },
      async copie() {
        return null;
      },
      async listeCopies() {
        return [];
      },
      async lireCopie() {
        throw new AK.ErreurMetier('Copies de sécurité indisponibles.');
      },
      async elaguerCopies() {},
      async menage() {
        return 0;
      },
      async effacerTout() {
        memo = null;
      }
    };
  }
  function lsDisponible() {
    try {
      const k = '__akwa_test__';
      localStorage.setItem(k, '1');
      localStorage.removeItem(k);
      return true;
    } catch (e) {
      return false;
    }
  }

  let actif = null;
  const stockage = {
    /** Choisit le meilleur stockage disponible. */
    async initialiser(prefere) {
      if (prefere) return (actif = prefere);
      try {
        actif = adaptateurIDB(await ouvrir());
      } catch (e) {
        AK.diag.avert('IndexedDB indisponible : ' + e.message);
        actif = lsDisponible() ? adaptateurLS() : adaptateurMemoire();
      }
      // demande au navigateur de ne pas effacer la base en cas de manque de place
      if (navigator.storage && navigator.storage.persist && actif.nom === 'IndexedDB') {
        navigator.storage.persist().then((ok) => AK.diag.info('Stockage persistant : ' + ok)).catch(() => {});
      }
      return actif;
    },
    get actif() {
      return actif;
    },
    description: () => (actif ? actif.nom : 'non initialisé'),
    /** Données d'AKWA SCHOOL 1.x laissées par l'ancienne version dans ce navigateur (lecture seule). */
    ancienneVersion() {
      try {
        const t = localStorage.getItem(CLE_LS_1X);
        if (!t) return null;
        const o = JSON.parse(t);
        return o && Array.isArray(o.students) ? o : null;
      } catch (e) {
        return null;
      }
    },
    serialiser,
    reconstituer
  };
  AK.stockage = stockage;
  AK.stockage._adaptateurs = { adaptateurIDB, adaptateurLS, adaptateurMemoire, ouvrir };
})(window.AK);

//# sourceURL=akwa/js/data/storage.js
</script>
<script>
/* =====================================================================================
   Hôte d'exécution : ce qui dépend de l'endroit où tourne la page.
     - « navigateur » : fichier HTML ouvert directement (stockage IndexedDB, téléchargements,
       impression du navigateur ; l'export PDF passe par la boîte d'impression).
     - « bureau » : application Windows AKWA SCHOOL (PySide6, QWebChannel) : données dans la
       base SQLite de l'application, connexion et mots de passe gérés par l'application,
       fichiers enregistrés par une boîte de dialogue Windows. Même contrat que pont_v8.js.
   Le reste de l'application ne connaît que AK.hote.
   ===================================================================================== */
(function (AK) {
  'use strict';
  const u = AK.u;

  function hoteNavigateur() {
    return {
      type: 'navigateur',
      libelle: 'Navigateur (fichier HTML local)',
      authentificationLocale: true,  // comptes et mots de passe gérés par la page
      pdfDirect: false,              // PDF : seulement via « Enregistrer au format PDF » de l'impression
      async demarrer() {
        await AK.stockage.initialiser();
        return null; // l'état est chargé par AK.store depuis le stockage
      },
      async enregistrer(S) {
        return AK.stockage.actif.enregistrer(S);
      },
      async fichier(nom, contenu, type) {
        u.telechargerNavigateur(nom, contenu, type);
        return nom;
      },
      imprimer() {
        window.print();
      }
    };
  }

  function hoteBureau() {
    const D = window.APP_DATA || {};
    let py = null;
    const attente = [];
    const pret = (f) => (py ? f() : attente.push(f));
    const appel = (nom, ...args) => new Promise((ok) => pret(() => py[nom](...args, ok)));
    return {
      type: 'bureau',
      libelle: 'Application Windows AKWA SCHOOL',
      authentificationLocale: false,
      pdfDirect: false,
      session: D.session || { role: 'dir' },
      licence: D.licence || null,
      async demarrer() {
        await new Promise((ok) => {
          /* global QWebChannel */
          new QWebChannel(window.qt.webChannelTransport, (ch) => {
            py = ch.objects.pont;
            attente.splice(0).forEach((f) => f());
            ok();
          });
        });
        await AK.stockage.initialiser({
          nom: 'Base SQLite de l’application Windows',
          async enregistrer() {
            return 0;
          },
          async charger() {
            return null;
          },
          async copie() {
            return null;
          },
          async listeCopies() {
            return [];
          },
          async lireCopie() {
            throw new AK.ErreurMetier('Les copies quotidiennes sont gérées par l’application Windows.');
          },
          async elaguerCopies() {},
          async menage() {
            return 0;
          },
          async effacerTout() {}
        });
        return D.etat || null;
      },
      async enregistrer(S) {
        const o = JSON.parse(JSON.stringify(S, function (k, v) {
          return this === S && (k.startsWith('_') || k === 'securite') ? undefined : v;
        }));
        const err = await appel('enregistrer', JSON.stringify(o));
        if (err) throw new AK.ErreurMetier(err);
        return 0;
      },
      verifierAdmin: (mdp) => appel('verifierAdmin', mdp),
      async fichier(nom, contenu, type) {
        const texte = typeof contenu === 'string' ? contenu : await contenu.text();
        return appel('telecharger', nom, texte, type || 'text/plain');
      },
      imprimer(paysage) {
        appel('imprimer', !!paysage);
      },
      appel
    };
  }

  /**
   * Emballage natif (APK Android, application Windows .exe) : contrat « AkwaNatif ».
   * L'emballage expose window.AkwaNatif (Android : addJavascriptInterface ; Electron : preload) avec :
   *   enregistrerFichier(nom, contenuBase64, typeMime) → chemin enregistré, ou '' si annulé   (obligatoire)
   *   imprimer(paysage)                                → impression native de la page          (facultatif)
   *   exporterPdf(nom, paysage)                        → vrai fichier PDF, chemin ou ''        (facultatif)
   *   version()                                        → texte affiché dans Diagnostic         (facultatif)
   * Les données restent dans IndexedDB (activer le stockage DOM et les bases dans la WebView).
   * Voir packaging/ et docs/EMBALLAGE.md.
   */
  function hoteNatif() {
    const N = window.AkwaNatif;
    const base = hoteNavigateur();
    const b64 = (blob) => new Promise((ok, ko) => {
      const r = new FileReader();
      r.onload = () => ok(String(r.result).split(',')[1] || '');
      r.onerror = () => ko(r.error);
      r.readAsDataURL(blob);
    });
    const appel = async (f, ...a) => {
      const r = f.apply(N, a);
      return r && typeof r.then === 'function' ? r : r;
    };
    return {
      ...base,
      type: 'natif',
      libelle: 'Application installée' + (typeof N.version === 'function' ? ' ' + N.version() : ''),
      pdfDirect: typeof N.exporterPdf === 'function',
      async fichier(nom, contenu, type) {
        const blob = contenu instanceof Blob ? contenu : new Blob([contenu], { type: (type || 'text/plain') + ';charset=utf-8' });
        const chemin = await appel(N.enregistrerFichier, nom, await b64(blob), type || blob.type || 'application/octet-stream');
        return chemin == null ? '' : String(chemin);
      },
      imprimer(paysage) {
        if (typeof N.imprimer === 'function') appel(N.imprimer, !!paysage);
        else window.print();
      },
      async exporterPdf(nom, paysage) {
        return String((await appel(N.exporterPdf, nom, !!paysage)) || '');
      }
    };
  }

  AK.hote = window.qt && window.qt.webChannelTransport && window.APP_DATA && typeof window.QWebChannel === 'function'
    ? hoteBureau()
    : window.AkwaNatif && typeof window.AkwaNatif.enregistrerFichier === 'function'
      ? hoteNatif()
      : hoteNavigateur();
})(window.AK);

<script>
/* =====================================================================================
   Magasin de données : l'état de l'école en mémoire, ses modifications, son enregistrement.

   AK.store.modifier(libellé, f) est la seule porte d'écriture :
     1. f(S) applique la modification (les règles métier ont été vérifiées avant) ;
     2. l'opération est inscrite au journal (date, auteur, libellé sans donnée sensible) ;
     3. l'enregistrement est programmé (regroupé : une écriture toutes les 0,3 s au plus) ;
     4. l'écran est redessiné.
   Un échec d'enregistrement n'est jamais silencieux : bandeau rouge et notification.
   ===================================================================================== */
(function (AK) {
  'use strict';
  const u = AK.u;
  let S = null;
  let etatSauvegarde = { statut: 'ok', t: 0, message: '' };
  let enCours = null, enAttente = false, jourCopie = '', sale = false;
  const MAX_JOURNAL = 2000;

  function definirStatut(statut, message = '') {
    etatSauvegarde = { statut, t: Date.now(), message };
    AK.bus.emit('sauvegarde', etatSauvegarde);
  }

  async function ecrire() {
    if (!S) return;
    if (enCours) {
      enAttente = true;
      return enCours;
    }
    definirStatut('encours');
    sale = false;
    enCours = (async () => {
      try {
        S.meta.majLe = Date.now();
        await AK.hote.enregistrer(S);
        definirStatut(AK.stockage.actif && AK.stockage.actif.ephemere ? 'ephemere' : 'ok');
        const j = u.aujourdhui();
        if (jourCopie !== j && AK.stockage.actif && AK.hote.type !== 'bureau') {
          jourCopie = j;
          AK.stockage.actif.copie(S, 'jour').catch((e) => AK.diag.erreur(e, 'copie du jour'));
        }
      } catch (e) {
        sale = true;
        AK.diag.erreur(e, 'enregistrement');
        definirStatut('erreur', e && e.name === 'ErreurMetier' ? e.message : 'L’enregistrement a échoué : ' + (e && e.message ? e.message : e));
        AK.bus.emit('erreur-sauvegarde', etatSauvegarde);
      } finally {
        enCours = null;
        if (enAttente) {
          enAttente = false;
          ecrire();
        }
      }
    })();
    return enCours;
  }
  const programmer = u.differer(ecrire, 300);

  function auteur() {
    const s = AK.session && AK.session.courante();
    if (!s) return 'Système';
    return s.role === 'ens' ? 'Enseignant' + (s.login ? ' · ' + s.login : '') : 'Direction';
  }

  const store = {
    get etat() {
      return S;
    },
    get sauvegarde() {
      return etatSauvegarde;
    },
    installer(etat) {
      S = etat;
      jourCopie = '';
      AK.bus.emit('etat-installe', S);
    },
    /**
     * Modifie les données. libelle : texte du journal (null = pas d'entrée).
     * options : { rendu: false } pour ne pas redessiner l'écran ; { journal: false }.
     */
    modifier(libelle, f, options = {}) {
      if (!S) throw new Error('Données non chargées');
      const r = f(S);
      if (libelle && options.journal !== false) store.journaliser(libelle, options.categorie);
      sale = true;
      programmer();
      if (options.rendu !== false) AK.bus.emit('change', { libelle });
      return r;
    },
    journaliser(m, categorie) {
      const e = { t: Date.now(), m: String(m).slice(0, 300), qui: auteur(), c: categorie || '' };
      S.pro.journal.unshift(e);
      if (S.pro.journal.length > MAX_JOURNAL) S.pro.journal.length = MAX_JOURNAL;
      S.log.unshift({ t: e.t, m: e.m });
      if (S.log.length > 40) S.log.length = 40;
    },
    /** Enregistre immédiatement (fermeture, avant une opération à risque). */
    async maintenant() {
      programmer.annuler();
      await ecrire();
      if (enCours) await enCours;
      return etatSauvegarde.statut !== 'erreur';
    },
    /** Copie de sécurité locale avant une opération à risque (restauration, passage d'année…). */
    async copieAvant(motif) {
      if (!S || !AK.stockage.actif) return null;
      try {
        return await AK.stockage.actif.copie(S, motif);
      } catch (e) {
        AK.diag.erreur(e, 'copie avant ' + motif);
        return null;
      }
    },
    reessayer: () => ecrire()
  };
  AK.store = store;

  // enregistrement dès que la fenêtre passe en arrière-plan ; alerte si une écriture n'est pas finie
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden' && S) {
      programmer.annuler();
      ecrire();
    }
  });
  window.addEventListener('beforeunload', (e) => {
    if (sale || enCours) {
      ecrire();
      e.preventDefault();
      e.returnValue = '';
    }
  });
})(window.AK);

<script>
/* =====================================================================================
   Primitives cryptographiques : uniquement l'API Web Crypto du navigateur (implémentation
   éprouvée du navigateur ; aucun algorithme maison).
     - Empreintes de mots de passe : PBKDF2-SHA-256 (sel aléatoire de 16 octets).
     - Chiffrement de la clé privée de signature : AES-GCM 256 bits, clé dérivée par PBKDF2.
     - Signature des documents : ECDSA P-256 / SHA-256.
     - Empreintes de contrôle : SHA-256.
   ===================================================================================== */
(function (AK) {
  'use strict';
  const enc = new TextEncoder();

  const dispo = () => !!(window.crypto && crypto.subtle && window.isSecureContext !== false);
  const exiger = () => {
    if (!dispo()) throw new AK.ErreurMetier('La cryptographie du navigateur (Web Crypto) est indisponible ici : ouvrez AKWA SCHOOL dans Chrome, Edge ou Firefox récent.');
  };

  /* ---------- Encodages ---------- */
  const b64 = (buf) => {
    const b = new Uint8Array(buf);
    let s = '';
    for (let i = 0; i < b.length; i += 0x8000) s += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000));
    return btoa(s);
  };
  const deB64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  const b64url = (buf) => b64(buf).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  const deB64url = (s) => deB64(String(s).replace(/-/g, '+').replace(/_/g, '/') + '==='.slice((String(s).length + 3) % 4));
  const B32 = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';
  const b32 = (buf) => {
    const b = new Uint8Array(buf);
    let bits = 0, val = 0, out = '';
    for (const x of b) {
      val = (val << 8) | x;
      bits += 8;
      while (bits >= 5) {
        out += B32[(val >>> (bits - 5)) & 31];
        bits -= 5;
      }
    }
    if (bits > 0) out += B32[(val << (5 - bits)) & 31];
    return out;
  };
  const hex = (buf) => [...new Uint8Array(buf)].map((x) => x.toString(16).padStart(2, '0')).join('');
  const aleatoire = (n) => crypto.getRandomValues(new Uint8Array(n));
  /** Comparaison à temps constant de deux tableaux d'octets. */
  const egaux = (a, b) => {
    if (a.length !== b.length) return false;
    let d = 0;
    for (let i = 0; i < a.length; i++) d |= a[i] ^ b[i];
    return d === 0;
  };

  async function sha256(texte) {
    exiger();
    return new Uint8Array(await crypto.subtle.digest('SHA-256', typeof texte === 'string' ? enc.encode(texte) : texte));
  }

  /* ---------- Mots de passe ---------- */
  async function pbkdf2(secret, sel, iterations, octets = 32) {
    const cle = await crypto.subtle.importKey('raw', enc.encode(String(secret).normalize('NFC')), 'PBKDF2', false, ['deriveBits']);
    return new Uint8Array(await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: sel, iterations }, cle, octets * 8));
  }
  /** Empreinte d'un mot de passe (ou d'un code de secours) : { algo, iter, sel, empreinte }. */
  async function empreinteSecret(secret) {
    exiger();
    const sel = aleatoire(16), iter = AK.cfg.SECU.PBKDF2_ITER;
    const h = await pbkdf2(secret, sel, iter);
    return { algo: 'PBKDF2-SHA256', iter, sel: b64(sel), empreinte: b64(h) };
  }
  async function verifierSecret(secret, rec) {
    if (!rec || rec.algo !== 'PBKDF2-SHA256') return false;
    exiger();
    const h = await pbkdf2(secret, deB64(rec.sel), rec.iter);
    return egaux(h, deB64(rec.empreinte));
  }

  /* ---------- Chiffrement d'une donnée par un secret (clé privée de signature) ---------- */
  async function cleDeSecret(secret, sel, iter) {
    const bits = await pbkdf2(secret, sel, iter);
    return crypto.subtle.importKey('raw', bits, 'AES-GCM', false, ['encrypt', 'decrypt']);
  }
  async function chiffrer(octets, secret) {
    exiger();
    const sel = aleatoire(16), iv = aleatoire(12), iter = AK.cfg.SECU.PBKDF2_ITER;
    const k = await cleDeSecret(secret, sel, iter);
    const c = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, k, octets);
    return { algo: 'PBKDF2-AESGCM', iter, sel: b64(sel), iv: b64(iv), donnees: b64(c) };
  }
  async function dechiffrer(paquet, secret) {
    exiger();
    try {
      const k = await cleDeSecret(secret, deB64(paquet.sel), paquet.iter);
      return new Uint8Array(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: deB64(paquet.iv) }, k, deB64(paquet.donnees)));
    } catch (e) {
      return null; // secret incorrect ou donnée altérée
    }
  }

  /* ---------- Signature ECDSA P-256 ---------- */
  const ALG = { name: 'ECDSA', namedCurve: 'P-256' };
  const SIG = { name: 'ECDSA', hash: 'SHA-256' };
  async function nouvellePaire() {
    exiger();
    const p = await crypto.subtle.generateKey(ALG, true, ['sign', 'verify']);
    const pub = await crypto.subtle.exportKey('jwk', p.publicKey);
    const priv = new Uint8Array(await crypto.subtle.exportKey('pkcs8', p.privateKey));
    return { pub: { kty: pub.kty, crv: pub.crv, x: pub.x, y: pub.y }, priv };
  }
  async function importerPrivee(pkcs8) {
    return crypto.subtle.importKey('pkcs8', pkcs8, ALG, false, ['sign']);
  }
  async function importerPublique(jwk) {
    return crypto.subtle.importKey('jwk', { ...jwk, ext: true }, ALG, false, ['verify']);
  }
  async function signer(clePrivee, message) {
    return b64url(await crypto.subtle.sign(SIG, clePrivee, enc.encode(message)));
  }
  async function verifierSignature(jwk, message, signature) {
    exiger();
    try {
      const k = await importerPublique(jwk);
      return await crypto.subtle.verify(SIG, k, deB64url(signature), enc.encode(message));
    } catch (e) {
      return false;
    }
  }
  /** Empreinte lisible d'une clé publique : 4 groupes de 4 caractères (à comparer à voix haute). */
  async function empreinteCle(jwk) {
    const h = await sha256(`${jwk.crv}|${jwk.x}|${jwk.y}`);
    return b32(h.slice(0, 10)).match(/.{4}/g).join('-');
  }
  /** Code aléatoire lisible (ni 0/O ni 1/I) : XXXX-XXXX-XXXX… */
  function codeLisible(groupes = 3) {
    const A = AK.cfg.SECU.ALPHABET_CODE;
    const r = aleatoire(groupes * 4);
    let s = '';
    for (let i = 0; i < r.length; i++) s += A[r[i] % A.length];
    return s.match(/.{4}/g).join('-');
  }
  const normCode = (c) => String(c || '').toUpperCase().replace(/[^0-9A-Z]/g, '');

  AK.crypto = {
    dispo, sha256, b64, deB64, b64url, deB64url, b32, hex, aleatoire, egaux,
    empreinteSecret, verifierSecret, chiffrer, dechiffrer,
    nouvellePaire, importerPrivee, importerPublique, signer, verifierSignature, empreinteCle,
    codeLisible, normCode
  };
})(window.AK);

</script>
<script>
/* =====================================================================================
   Comptes, session et confirmation par mot de passe.

   Version navigateur : les mots de passe du directeur et des enseignants sont conservés sous
   forme d'empreintes PBKDF2 dans les données (jamais en clair, jamais dans les sauvegardes
   en clair). LIMITE : tout est dans le navigateur de cet ordinateur ; une personne qui a accès
   à la session Windows et aux outils du navigateur peut lire les données. Les mots de passe
   protègent l'usage de l'application, pas les fichiers. Voir docs/SECURITE.md.

   Version bureau : la connexion et les mots de passe sont gérés par l'application Windows.
   ===================================================================================== */
(function (AK) {
  'use strict';
  const C = AK.cfg, K = AK.crypto, V = AK.valid;
  const S = () => AK.store.etat;
  const bureau = () => AK.hote.type === 'bureau';

  /* ---------- Session ---------- */
  let session = null;
  let derniereConfirmation = 0;
  let derniereActivite = Date.now();

  const sessionApi = {
    courante: () => session,
    ouverte: () => !!session,
    estDirecteur: () => !!session && session.role === 'dir',
    estEnseignant: () => !!session && session.role === 'ens',
    solo: () => !!session && session.role === 'ens' && !!(S() && S().school.solo),
    agent() {
      if (!session || session.role !== 'ens') return null;
      return S().teachers.find((t) => t.id === session.tid) || null;
    },
    /** Classes visibles : toutes pour le directeur, les siennes pour un enseignant. */
    classes() {
      const niveaux = AK.calc.niveaux();
      if (!session || session.role === 'dir') return niveaux;
      const a = sessionApi.agent();
      return a ? niveaux.filter((c) => AK.calc.clsDe(a).includes(c)) : [];
    },
    ouvrir(s) {
      session = { ...s, depuis: Date.now() };
      derniereActivite = Date.now();
      AK.bus.emit('session', session);
    },
    fermer() {
      session = null;
      derniereConfirmation = 0;
      AK.bus.emit('session', null);
    },
    activite() {
      derniereActivite = Date.now();
    },
    inactifDepuis: () => Date.now() - derniereActivite,
    libelle() {
      if (!session) return '';
      if (session.role === 'dir') return S().school.director || 'Directeur';
      const a = sessionApi.agent();
      return a ? a.nom : 'Enseignant';
    }
  };
  AK.session = sessionApi;

  /* ---------- Directeur (administrateur) ---------- */
  const auth = {
    /** Création de l'école : mot de passe du directeur et code de secours (affiché une seule fois). */
    async configurerAdmin(mdp) {
      const e = V.motDePasse(mdp);
      if (e) throw new AK.ErreurMetier(e, 'mdp');
      const code = K.codeLisible(3);
      const [h, hs] = await Promise.all([K.empreinteSecret(mdp), K.empreinteSecret(K.normCode(code))]);
      AK.store.modifier('Compte administrateur créé', (s) => {
        s.securite.admin = h;
        s.securite.secours = hs;
        s.securite.forcerChangement = false;
        s.securite.aSecourir = false;
      }, { rendu: false });
      return code;
    },
    aUnAdmin: () => bureau() || !!(S() && S().securite.admin),
    async verifierAdmin(mdp) {
      if (bureau()) return !!(await AK.hote.verifierAdmin(mdp));
      return K.verifierSecret(mdp, S().securite.admin);
    },
    async changerAdmin(ancien, nouveau) {
      if (bureau()) {
        const err = await AK.hote.appel('changerAdmin', ancien, nouveau);
        if (err) throw new AK.ErreurMetier(err);
        await AK.cles.rechiffrer(ancien, nouveau).catch(() => {});
        return;
      }
      if (!(await auth.verifierAdmin(ancien))) throw new AK.ErreurMetier('Mot de passe actuel incorrect.', 'old');
      const e = V.motDePasse(nouveau, 'Nouveau mot de passe');
      if (e) throw new AK.ErreurMetier(e, 'nw');
      if (ancien === nouveau) throw new AK.ErreurMetier('Le nouveau mot de passe doit être différent de l’ancien.', 'nw');
      const h = await K.empreinteSecret(nouveau);
      await AK.cles.rechiffrer(ancien, nouveau);
      AK.store.modifier('Mot de passe administrateur changé', (s) => {
        s.securite.admin = h;
        s.securite.forcerChangement = false;
      });
      derniereConfirmation = Date.now();
    },
    /** Nouveau code de secours (l'ancien ne sert plus) : renvoie le code à montrer une fois. */
    async nouveauSecours(mdp) {
      if (bureau()) {
        if (!(await auth.verifierAdmin(mdp))) throw new AK.ErreurMetier('Mot de passe incorrect.', 'pwd');
        const r = JSON.parse(await AK.hote.appel('nouveauSecours'));
        if (r.erreur) throw new AK.ErreurMetier(r.erreur);
        return r.code;
      }
      if (!(await auth.verifierAdmin(mdp))) throw new AK.ErreurMetier('Mot de passe incorrect.', 'pwd');
      const code = K.codeLisible(3);
      const hs = await K.empreinteSecret(K.normCode(code));
      AK.store.modifier('Nouveau code de secours créé', (s) => {
        s.securite.secours = hs;
        s.securite.aSecourir = false;
      });
      return code;
    },
    /** Mot de passe oublié : code de secours + nouveau mot de passe. Renvoie le nouveau code. */
    async recupererAdmin(code, nouveau) {
      if (bureau()) {
        const r = JSON.parse(await AK.hote.appel('recupererAdmin', code, nouveau));
        if (r.erreur) throw new AK.ErreurMetier(r.erreur);
        return r.code;
      }
      const sec = S().securite.secours;
      if (!sec || !(await K.verifierSecret(K.normCode(code), sec))) throw new AK.ErreurMetier('Code de secours incorrect.', 'code');
      const e = V.motDePasse(nouveau, 'Nouveau mot de passe');
      if (e) throw new AK.ErreurMetier(e, 'nw');
      const nouveauCode = K.codeLisible(3);
      const [h, hs] = await Promise.all([K.empreinteSecret(nouveau), K.empreinteSecret(K.normCode(nouveauCode))]);
      await AK.cles.recupererParSecours(code, nouveau, nouveauCode);
      AK.store.modifier('Mot de passe administrateur changé avec le code de secours', (s) => {
        s.securite.admin = h;
        s.securite.secours = hs;
        s.securite.forcerChangement = false;
        s.securite.aSecourir = false;
      });
      return nouveauCode;
    },

    /* ---------- Comptes des enseignants (version navigateur) ---------- */
    loginDe(nom) {
      const p = V.civ.sans(nom).split(/\s+/);
      return (((p[1] || '')[0] || '') + (p[0] || '')).toLowerCase().normalize('NFD').replace(/[^a-z]/g, '').slice(0, 24);
    },
    async creerCompte(tid, login) {
      AK.perm.exiger('comptes.gerer');
      const t = S().teachers.find((x) => x.id === tid);
      if (!t) throw new AK.ErreurMetier('Enseignant introuvable.');
      login = String(login || '').trim().toLowerCase();
      if (!/^[a-z][a-z0-9._-]{2,23}$/.test(login)) throw new AK.ErreurMetier('Identifiant : 3 à 24 caractères (lettres minuscules, chiffres, . _ -), commençant par une lettre.', 'login');
      if (S().teachers.some((x) => x !== t && x.compte && x.compte.login === login)) throw new AK.ErreurMetier('Identifiant déjà utilisé.', 'login');
      if (bureau()) {
        const r = JSON.parse(await AK.hote.appel('creerCompte', tid, login));
        if (r.erreur) throw new AK.ErreurMetier(r.erreur);
        AK.store.modifier(`Compte enseignant créé : ${login}`, () => (t.compte = { login, actif: true, cree: AK.u.aujourdhui() }));
        return r.mdp;
      }
      const mdp = 'Prov-' + K.codeLisible(2).replace('-', '');
      const h = await K.empreinteSecret(mdp);
      AK.store.modifier(`Compte enseignant créé : ${login}`, (s) => {
        t.compte = { login, actif: true, cree: AK.u.aujourdhui() };
        s.securite.comptes[tid] = { ...h, provisoire: true };
      });
      return mdp;
    },
    async reinitCompte(tid) {
      AK.perm.exiger('comptes.gerer');
      const t = S().teachers.find((x) => x.id === tid);
      if (!t || !t.compte) throw new AK.ErreurMetier('Ce membre du personnel n’a pas de compte.');
      if (bureau()) {
        const r = JSON.parse(await AK.hote.appel('reinitCompte', tid));
        if (r.erreur) throw new AK.ErreurMetier(r.erreur);
        AK.store.journaliser(`Mot de passe réinitialisé : ${t.compte.login}`);
        return r.mdp;
      }
      const mdp = 'Prov-' + K.codeLisible(2).replace('-', '');
      const h = await K.empreinteSecret(mdp);
      AK.store.modifier(`Mot de passe réinitialisé : ${t.compte.login}`, (s) => (s.securite.comptes[tid] = { ...h, provisoire: true }));
      return mdp;
    },
    /** Connexion (version navigateur). Renvoie { role, tid?, login?, provisoire? }. */
    async connecter(identifiant, mdp) {
      identifiant = String(identifiant || '').trim().toLowerCase();
      if (!identifiant || identifiant === 'directeur' || identifiant === 'admin') {
        if (!(await auth.verifierAdmin(mdp))) throw new AK.ErreurMetier('Mot de passe incorrect.', 'mdp');
        AK.cles.deverrouiller(mdp).catch((e) => AK.diag.erreur(e, 'clé de signature'));
        return { role: 'dir', provisoire: !!S().securite.forcerChangement };
      }
      const t = S().teachers.find((x) => x.compte && x.compte.login === identifiant);
      const rec = t && S().securite.comptes[t.id];
      // même délai que pour un compte existant : on ne révèle pas si l'identifiant existe
      const ok = await K.verifierSecret(mdp, rec || (await K.empreinteSecret('—')));
      if (!t || !rec || !ok) throw new AK.ErreurMetier('Identifiant ou mot de passe incorrect.', 'mdp');
      if (t.actif === false || !t.compte.actif) throw new AK.ErreurMetier('Ce compte est désactivé. Adressez-vous au directeur.', 'login');
      return { role: 'ens', tid: t.id, login: t.compte.login, provisoire: !!rec.provisoire };
    },
    async changerMotDePasseEnseignant(tid, ancien, nouveau) {
      const rec = S().securite.comptes[tid];
      if (!rec || !(await K.verifierSecret(ancien, rec))) throw new AK.ErreurMetier('Mot de passe actuel incorrect.', 'old');
      const e = V.motDePasse(nouveau, 'Nouveau mot de passe');
      if (e) throw new AK.ErreurMetier(e, 'nw');
      const h = await K.empreinteSecret(nouveau);
      AK.store.modifier('Mot de passe enseignant changé', (s) => (s.securite.comptes[tid] = { ...h, provisoire: false }));
    },

    /**
     * Données AKWA SCHOOL 1.x : le mot de passe en clair devient une empreinte.
     * Un mot de passe faible (dont « admin », valeur d'origine) devra être changé à la connexion.
     */
    async migrerSecrets(etat) {
      if (etat._mdpEnClair == null) return;
      const ancien = String(etat._mdpEnClair);
      delete etat._mdpEnClair;
      if (bureau()) return;
      if (!etat.securite.admin && ancien) etat.securite.admin = await K.empreinteSecret(ancien);
      etat.securite.forcerChangement = !!V.motDePasse(ancien) || ancien === 'admin';
      etat.securite.aSecourir = true;
    },

    /* ---------- Confirmation par mot de passe pour les opérations sensibles ---------- */
    /** Demande le mot de passe administrateur (sauf confirmation récente). Renvoie true/false. */
    async confirmer(message, { forcer = false } = {}) {
      if (!forcer && Date.now() - derniereConfirmation < C.SECU.GRACE_SEC * 1000 && sessionApi.estDirecteur()) return true;
      const ok = await AK.ui.demanderMotDePasse(message);
      if (ok) derniereConfirmation = Date.now();
      return ok;
    },
    oublierConfirmation: () => (derniereConfirmation = 0)
  };
  AK.auth = auth;
})(window.AK);

<script>
/* =====================================================================================
   Autorisations par rôle (rôles existants d'AKWA SCHOOL : directeur, enseignant,
   enseignant « espace seul » qui tient sa classe sans école rattachée).

   Les opérations métier appellent AK.perm.exiger(action, contexte) AVANT de modifier quoi que
   ce soit : masquer un bouton ne suffit pas. L'interface utilise AK.perm.peut() pour n'afficher
   que les actions permises.
   ===================================================================================== */
(function (AK) {
  'use strict';
  const sess = () => AK.session;

  /* Contexte : { classe } pour les actions limitées aux classes de l'enseignant. */
  const saClasse = (ctx) => !ctx || !ctx.classe || sess().classes().includes(ctx.classe);
  const ENS = (ctx) => saClasse(ctx);
  const SOLO = (ctx) => sess().solo() && saClasse(ctx);
  const NON = () => false;

  /* Règle pour un enseignant (le directeur peut tout faire). */
  const REGLES = {
    'eleve.voir': ENS,
    'eleve.inscrire': SOLO,
    'eleve.modifier': SOLO,
    'eleve.supprimer': SOLO,
    'eleve.statut': SOLO,
    'eleve.importer': SOLO,
    'personnel.voir': NON,
    'personnel.gerer': NON,
    'classe.affecter': NON,
    'notes.saisir': ENS,
    'notes.corriger': NON,          // correction d'une note validée : directeur
    'notes.valider': NON,
    'notes.matieres': SOLO,
    'notes.periode': NON,
    'resultats.voir': ENS,
    'decision.modifier': NON,
    'annee.passer': NON,
    'appel.faire': ENS,
    'appel.lever': NON,             // effacer une absence déjà saisie
    'autorisation.demander': () => true,
    'autorisation.decider': NON,
    'autorisation.supprimer': NON,
    'vie.utiliser': ENS,
    'vie.supprimer': NON,
    'finances.gerer': NON,
    'services.utiliser': () => true,
    'liaison.gerer': NON,
    'rapports.officiels': NON,
    'rapports.generateur': NON,
    'stats.voir': NON,
    'document.imprimerClasse': ENS, // listes, bulletins et fiches de sa classe
    'document.emettre': NON,        // certificats, attestations, cartes : directeur
    'document.annuler': NON,
    'document.registre': NON,
    'modeles.gerer': NON,
    'cles.gerer': NON,
    'parametres.gerer': NON,
    'securite.gerer': NON,
    'comptes.gerer': NON,
    'messages.envoyer': NON,
    'donnees.sauvegarder': SOLO,
    'donnees.restaurer': SOLO,
    'donnees.exporter': SOLO,
    'donnees.rattacher': NON,
    'journal.voir': NON,
    'verification.utiliser': () => true
  };

  const perm = {
    peut(action, ctx) {
      const s = sess().courante();
      if (!s) return false;
      if (s.role === 'dir') return true;
      const r = REGLES[action];
      if (!r) {
        AK.diag.avert('Action sans règle de droits : ' + action);
        return false;
      }
      return !!r(ctx || null);
    },
    exiger(action, ctx) {
      if (!perm.peut(action, ctx)) throw new AK.ErreurDroits(MESSAGES[action] || undefined);
    },
    actions: () => Object.keys(REGLES)
  };
  const MESSAGES = {
    'eleve.inscrire': 'L’inscription des élèves est réservée au directeur.',
    'eleve.modifier': 'Seul le directeur peut modifier un élève.',
    'eleve.supprimer': 'Seul le directeur peut supprimer un élève.',
    'eleve.statut': 'Seul le directeur peut changer le statut d’un élève.',
    'personnel.gerer': 'Seul le directeur peut modifier le personnel.',
    'classe.affecter': 'Seul le directeur affecte les classes.',
    'notes.saisir': 'Vous ne pouvez saisir que les notes de votre classe.',
    'notes.corriger': 'Seul le directeur peut corriger une note validée.',
    'notes.matieres': 'Seul le directeur choisit les matières de la composition.',
    'autorisation.decider': 'Seul le directeur accorde ou refuse une demande.',
    'autorisation.supprimer': 'Seul le directeur peut supprimer une demande.',
    'appel.lever': 'Une absence enregistrée ne peut être levée que par le directeur.',
    'document.emettre': 'L’émission des documents officiels est réservée au directeur.',
    'document.annuler': 'Seul le directeur peut annuler un document.'
  };
  AK.perm = perm;
})(window.AK);

<script>
/* =====================================================================================
   Clés de signature des documents (ECDSA P-256).

   - La clé privée est créée sur cet ordinateur par le directeur. Elle n'existe jamais en clair
     dans les données ni dans les sauvegardes : elle est chiffrée (AES-GCM) par une clé dérivée du
     mot de passe administrateur. Elle n'est jamais intégrée au code HTML distribué.
   - Pendant une session du directeur, elle est chargée en mémoire sous forme non exportable.
   - La clé publique (et son empreinte lisible) est distribuée dans l'outil de vérification.
   - Rotation : une nouvelle clé remplace l'active ; l'ancienne est « retirée » (elle ne signe
     plus mais vérifie toujours les documents émis avant son retrait). Une clé « compromise »
     rend suspects les documents qu'elle a signés.
   - Mot de passe oublié (code de secours) : l'ancienne clé ne peut plus être déchiffrée ; elle
     est retirée et le directeur en crée une nouvelle. Les documents déjà émis restent vérifiables.
   ===================================================================================== */
(function (AK) {
  'use strict';
  const K = AK.crypto, u = AK.u;
  const S = () => AK.store.etat;
  let cleEnMemoire = null; // { id, cle: CryptoKey non exportable }

  const cles = {
    liste: () => (S() ? S().cles.liste : []),
    active: () => (S() ? S().cles.liste.find((c) => c.id === S().cles.active && c.statut === 'active') || null : null),
    disponible: () => !!cleEnMemoire && !!cles.active() && cleEnMemoire.id === cles.active().id,

    /** Crée une clé (première clé ou rotation). Le mot de passe administrateur chiffre la clé privée. */
    async creer(mdp) {
      AK.perm.exiger('cles.gerer');
      if (!(await AK.auth.verifierAdmin(mdp))) throw new AK.ErreurMetier('Mot de passe incorrect.', 'pwd');
      const { pub, priv } = await K.nouvellePaire();
      const prive = await K.chiffrer(priv, mdp);
      const empreinte = await K.empreinteCle(pub);
      const n = S().cles.liste.reduce((m, c) => Math.max(m, parseInt(String(c.id).slice(1), 10) || 0), 0) + 1;
      const id = 'K' + n;
      const ancienne = cles.active();
      AK.store.modifier(ancienne ? `Rotation des clés : ${ancienne.id} retirée, ${id} active` : `Clé de signature ${id} créée`, (s) => {
        if (ancienne) {
          ancienne.statut = 'retiree';
          ancienne.retireeLe = new Date().toISOString();
          ancienne.motif = 'Remplacée par ' + id;
        }
        s.cles.liste.push({ id, algo: 'ECDSA-P256-SHA256', pub, empreinte, prive, statut: 'active', creeeLe: new Date().toISOString(), ecole: s.school.name, installId: s.meta.installId });
        s.cles.active = id;
      });
      cleEnMemoire = { id, cle: await K.importerPrivee(priv) };
      priv.fill(0);
      return id;
    },
    /** Charge la clé active en mémoire (après connexion du directeur). */
    async deverrouiller(mdp) {
      const a = cles.active();
      if (!a || !a.prive || !K.dispo()) return false;
      const brut = await K.dechiffrer(a.prive, mdp);
      if (!brut) return false;
      cleEnMemoire = { id: a.id, cle: await K.importerPrivee(brut) };
      brut.fill(0);
      return true;
    },
    oublier: () => (cleEnMemoire = null),
    /** Signe un message canonique avec la clé active ; demande le mot de passe si besoin. */
    async signer(message) {
      if (!cles.active()) return null;
      if (!cles.disponible()) {
        const mdp = await AK.ui.saisirMotDePasse('Signature électronique : saisissez le mot de passe administrateur pour déverrouiller la clé de signature.');
        if (!mdp) return null;
        if (!(await cles.deverrouiller(mdp))) throw new AK.ErreurMetier('Mot de passe incorrect : la clé de signature reste verrouillée.');
      }
      return { kid: cleEnMemoire.id, sig: await K.signer(cleEnMemoire.cle, message) };
    },
    /** Changement du mot de passe administrateur : la clé privée est rechiffrée. */
    async rechiffrer(ancien, nouveau) {
      const L = S().cles.liste.filter((c) => c.prive && c.statut === 'active');
      const maj = [];
      for (const c of L) {
        const brut = await K.dechiffrer(c.prive, ancien);
        if (!brut) continue;
        maj.push([c, await K.chiffrer(brut, nouveau)]);
        brut.fill(0);
      }
      if (maj.length) AK.store.modifier(null, () => maj.forEach(([c, p]) => (c.prive = p)), { rendu: false });
    },
    /** Après récupération par code de secours : l'ancienne clé ne peut plus être déchiffrée. */
    async recupererParSecours() {
      const a = cles.active();
      if (!a) return;
      AK.store.modifier(`Clé ${a.id} retirée (mot de passe perdu) : créez une nouvelle clé`, (s) => {
        a.statut = 'retiree';
        a.retireeLe = new Date().toISOString();
        a.motif = 'Mot de passe administrateur perdu';
        s.cles.active = null;
      });
      cleEnMemoire = null;
    },
    /** Déclare une clé compromise (vol de l'ordinateur, mot de passe divulgué…). */
    declarerCompromise(id, motif) {
      AK.perm.exiger('cles.gerer');
      const c = S().cles.liste.find((x) => x.id === id);
      if (!c) throw new AK.ErreurMetier('Clé introuvable.');
      AK.store.modifier(`Clé ${id} déclarée compromise`, (s) => {
        c.statut = 'compromise';
        c.compromiseLe = new Date().toISOString();
        c.motif = String(motif || '').slice(0, 200);
        if (s.cles.active === id) s.cles.active = null;
      });
      if (cleEnMemoire && cleEnMemoire.id === id) cleEnMemoire = null;
    },
    /** Partie publique, pour l'outil de vérification (aucun secret). */
    publiques() {
      return cles.liste().map((c) => ({ id: c.id, algo: c.algo, pub: c.pub, empreinte: c.empreinte, statut: c.statut, creeeLe: c.creeeLe, retireeLe: c.retireeLe || null, compromiseLe: c.compromiseLe || null, ecole: c.ecole }));
    },
    _effacerMemoire: () => (cleEnMemoire = null),
    _u: u
  };
  AK.cles = cles;
})(window.AK);
