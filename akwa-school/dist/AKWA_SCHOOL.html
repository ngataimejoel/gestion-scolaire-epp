/* ==== styles/00-tokens.css ==== */
/* =====================================================================================
   AKWA SCHOOL 2 — jetons de design
   Identité : structure bleu nuit, surfaces blanc cassé, gris chauds pour les zones secondaires,
   un bleu d'action franc et un accent ambre (la toque du logo) employé avec parcimonie.
   Contrastes vérifiés : texte courant ≥ 7:1, texte secondaire ≥ 4.5:1 (WCAG AA).
   ===================================================================================== */
:root {
  /* Structure */
  --nuit-950: #0a1422;
  --nuit-900: #0f1c2f;
  --nuit-850: #13233a;
  --nuit-800: #182b45;
  --nuit-700: #223754;
  --nuit-600: #2f4766;
  --nuit-txt: #e7edf6;
  --nuit-mut: #a3b1c4;

  /* Surfaces */
  --bg: #f4f2ed;
  --surface: #ffffff;
  --surface-2: #fbfaf7;
  --sunk: #efece5;
  --sunk-2: #e7e3da;

  /* Encre */
  --ink: #152033;
  --ink-2: #364357;
  --mut: #5c687a;
  --faint: #8b94a2;

  /* Lignes */
  --line: #e4e0d7;
  --line-2: #d3cec3;

  /* Action principale */
  --pri: #1f4e8c;
  --pri-h: #173e72;
  --pri-soft: #e8eef7;
  --pri-ring: rgba(31, 78, 140, 0.28);
  --on-pri: #ffffff;

  /* Accent de marque (parcimonie) */
  --acc: #c7782f;
  --acc-ink: #8a4c12;
  --acc-soft: #f8ecde;

  /* États (toujours accompagnés d'un texte ou d'une icône) */
  --ok: #1d774c;
  --ok-soft: #e4f2ea;
  --warn: #965803;
  --warn-soft: #fbf0dc;
  --bad: #b2352c;
  --bad-soft: #fbe8e6;
  --info: #2b5d9c;
  --info-soft: #e7eef8;

  /* Graphiques garçons / filles */
  --cg: #2f5e9e;
  --cf: #c7782f;

  /* Formes */
  --r-xs: 6px;
  --r-sm: 8px;
  --r: 10px;
  --r-lg: 14px;
  --r-xl: 18px;

  /* Ombres légères et fonctionnelles */
  --sh-1: 0 1px 2px rgba(15, 28, 47, 0.06);
  --sh-2: 0 4px 14px rgba(15, 28, 47, 0.08), 0 1px 3px rgba(15, 28, 47, 0.05);
  --sh-3: 0 20px 50px rgba(10, 20, 34, 0.24), 0 4px 12px rgba(10, 20, 34, 0.08);

  /* Espacements (grille de 4 px) */
  --s1: 4px;
  --s2: 8px;
  --s3: 12px;
  --s4: 16px;
  --s5: 20px;
  --s6: 24px;
  --s7: 32px;
  --s8: 40px;

  /* Typographie (polices du système : aucune police téléchargée) */
  --font: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  --font-titre: "Segoe UI Variable Display", "Segoe UI Semibold", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: "Cascadia Mono", Consolas, "SF Mono", Menlo, "Liberation Mono", monospace;
  --fs-xs: 11.5px;
  --fs-sm: 12.5px;
  --fs: 14px;
  --fs-md: 15px;
  --fs-lg: 18px;
  --fs-xl: 22px;
  --fs-2xl: 28px;

  /* Gabarits */
  --ctl-h: 38px;
  --ctl-h-sm: 30px;
  --side-w: 258px;
  --side-wc: 72px;
  --top-h: 60px;
  --contenu-max: 1440px;

  /* Mouvement (rapide et discret) */
  --t-fast: 120ms ease;
  --t: 180ms cubic-bezier(0.2, 0.7, 0.2, 1);

  color-scheme: light;
}

/* Couleur d'action choisie par l'école (la structure reste bleu nuit) */
:root[data-accent="green"] { --pri: #1c6b4a; --pri-h: #155539; --pri-soft: #e5f1ea; --pri-ring: rgba(28, 107, 74, 0.28); }
:root[data-accent="amber"] { --pri: #9a5212; --pri-h: #7d420e; --pri-soft: #f7ece0; --pri-ring: rgba(154, 82, 18, 0.28); }
:root[data-accent="plum"] { --pri: #5e3a8c; --pri-h: #4b2e70; --pri-soft: #efe9f6; --pri-ring: rgba(94, 58, 140, 0.28); }

/* Thème sombre : automatique, ou forcé dans Paramètres */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c1420;
    --surface: #121d2c;
    --surface-2: #15212f;
    --sunk: #192636;
    --sunk-2: #1f2e41;
    --ink: #e7edf5;
    --ink-2: #c3cedb;
    --mut: #9aa8b9;
    --faint: #6f7d8f;
    --line: #233246;
    --line-2: #2f4057;
    --pri: #6f9fe2;
    --pri-h: #8db4ec;
    --pri-soft: #1a2b42;
    --pri-ring: rgba(111, 159, 226, 0.35);
    --on-pri: #08121f;
    --acc: #e09a52;
    --acc-ink: #f0b277;
    --acc-soft: #2c2215;
    --ok: #4fbf87; --ok-soft: #142b21;
    --warn: #e2a54a; --warn-soft: #2d2313;
    --bad: #ef7a70; --bad-soft: #321a19;
    --info: #79a8e6; --info-soft: #172a42;
    --cg: #6f9fe2;
    --cf: #e09a52;
    --sh-1: 0 1px 2px rgba(0, 0, 0, 0.35);
    --sh-2: 0 6px 18px rgba(0, 0, 0, 0.4);
    --sh-3: 0 24px 60px rgba(0, 0, 0, 0.6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c1420;
  --surface: #121d2c;
  --surface-2: #15212f;
  --sunk: #192636;
  --sunk-2: #1f2e41;
  --ink: #e7edf5;
  --ink-2: #c3cedb;
  --mut: #9aa8b9;
  --faint: #6f7d8f;
  --line: #233246;
  --line-2: #2f4057;
  --pri: #6f9fe2;
  --pri-h: #8db4ec;
  --pri-soft: #1a2b42;
  --pri-ring: rgba(111, 159, 226, 0.35);
  --on-pri: #08121f;
  --acc: #e09a52;
  --acc-ink: #f0b277;
  --acc-soft: #2c2215;
  --ok: #4fbf87; --ok-soft: #142b21;
  --warn: #e2a54a; --warn-soft: #2d2313;
  --bad: #ef7a70; --bad-soft: #321a19;
  --info: #79a8e6; --info-soft: #172a42;
  --cg: #6f9fe2;
  --cf: #e09a52;
  --sh-1: 0 1px 2px rgba(0, 0, 0, 0.35);
  --sh-2: 0 6px 18px rgba(0, 0, 0, 0.4);
  --sh-3: 0 24px 60px rgba(0, 0, 0, 0.6);
  color-scheme: dark;
}

/* ==== styles/01-base.css ==== */
/* ---------- Base : remise à zéro, typographie, focus, mouvement ---------- */
*,
*::before,
*::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
html,
body { margin: 0; height: 100%; background: var(--bg); }
body {
  color: var(--ink);
  font: var(--fs)/1.5 var(--font);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  overflow: hidden;
}
h1, h2, h3, h4 { font-family: var(--font-titre); color: var(--ink); margin: 0; font-weight: 650; letter-spacing: -0.01em; text-wrap: balance; }
p { margin: 0 0 var(--s3); }
a { color: var(--pri); text-decoration: none; }
a:hover { text-decoration: underline; text-underline-offset: 3px; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: not-allowed; }
img { max-width: 100%; }
table { border-collapse: collapse; }
td, th, .num, .kpi-v { font-variant-numeric: tabular-nums; }
kbd { font: 500 11px/1 var(--mono); padding: 3px 5px; border: 1px solid var(--line-2); border-bottom-width: 2px; border-radius: 5px; background: var(--surface); color: var(--mut); }
code, .mono { font-family: var(--mono); font-size: 0.92em; }
hr { border: 0; border-top: 1px solid var(--line); margin: var(--s4) 0; }
::selection { background: color-mix(in srgb, var(--acc) 30%, transparent); }

/* Focus visible et constant (navigation au clavier) */
:focus { outline: none; }
:focus-visible { outline: 2px solid var(--pri); outline-offset: 2px; border-radius: 4px; }
.sr { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.lien-evitement { position: fixed; left: 12px; top: -60px; z-index: 200; background: var(--pri); color: var(--on-pri); padding: 8px 14px; border-radius: var(--r-sm); font-weight: 600; transition: top var(--t-fast); }
.lien-evitement:focus { top: 12px; }

/* Icônes */
.i { width: 18px; height: 18px; flex: none; vertical-align: -3px; }
.i-sm { width: 15px; height: 15px; }
.i-lg { width: 22px; height: 22px; }

/* Barres de défilement discrètes */
* { scrollbar-width: thin; scrollbar-color: var(--line-2) transparent; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 10px; border: 2px solid transparent; background-clip: content-box; }
::-webkit-scrollbar-track { background: transparent; }

/* Mouvement réduit à la demande (système ou réglage de l'application) */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; scroll-behavior: auto !important; }
}
:root.sans-animation *, :root.sans-animation *::before, :root.sans-animation *::after { animation: none !important; transition: none !important; }

/* Utilitaires */
.mut { color: var(--mut); }
.petit { font-size: var(--fs-sm); }
.fort { font-weight: 650; }
.nowrap { white-space: nowrap; }
.droite { text-align: right; }
.centre { text-align: center; }
.cache, [hidden] { display: none !important; }
.ligne { display: flex; align-items: center; gap: var(--s2); flex-wrap: wrap; }
.ligne-entre { display: flex; align-items: center; justify-content: space-between; gap: var(--s3); flex-wrap: wrap; }
.pile { display: grid; gap: var(--s3); }
.pile-sm { display: grid; gap: var(--s2); }
.pile-lg { display: grid; gap: var(--s5); }
.flex1 { flex: 1 1 auto; min-width: 0; }
.mt0 { margin-top: 0 !important; }
.mb0 { margin-bottom: 0 !important; }
.mt { margin-top: var(--s4); }
.mb { margin-bottom: var(--s4); }
.tronque { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }

/* ==== styles/02-layout.css ==== */
/* ---------- Ossature : barre latérale bleu nuit, barre supérieure, contenu ---------- */
.app { display: grid; grid-template-columns: var(--side-w) minmax(0, 1fr); height: 100vh; height: 100dvh; transition: grid-template-columns var(--t); }

/* Barre latérale */
.side {
  background: var(--nuit-900);
  color: var(--nuit-txt);
  display: flex;
  flex-direction: column;
  min-height: 0;
  border-right: 1px solid var(--nuit-950);
}
.side-tete { display: flex; align-items: center; gap: 12px; padding: 18px 16px 16px; border-bottom: 1px solid rgba(255, 255, 255, 0.07); }
.side-tete img { width: 38px; height: 38px; border-radius: 10px; background: #fff; object-fit: contain; flex: none; }
.side-tete .marque { min-width: 0; }
.side-tete b { display: block; font: 700 13.5px/1.2 var(--font-titre); letter-spacing: 0.02em; color: #fff; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.side-tete small { display: block; font-size: 11px; color: var(--nuit-mut); margin-top: 2px; letter-spacing: 0.02em; }
.nav { flex: 1 1 auto; overflow-y: auto; padding: 10px 10px 16px; display: grid; align-content: start; gap: 1px; scrollbar-color: var(--nuit-700) transparent; }
.nav-groupe { font-size: 10.5px; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase; color: #7f8fa6; padding: 14px 10px 6px; }
.nav-groupe:first-child { padding-top: 4px; }
.nav a {
  position: relative;
  display: flex;
  align-items: center;
  gap: 11px;
  min-height: 38px;
  padding: 7px 10px;
  border-radius: 8px;
  color: #cbd5e3;
  font-weight: 550;
  font-size: 13.5px;
  text-decoration: none;
  transition: background var(--t-fast), color var(--t-fast);
}
.nav a .i { color: #8fa0b8; width: 18px; height: 18px; }
.nav a:hover { background: var(--nuit-800); color: #fff; }
.nav a:hover .i { color: #dbe4f0; }
.nav a.actif { background: var(--nuit-700); color: #fff; }
.nav a.actif .i { color: #fff; }
.nav a.actif::before { content: ""; position: absolute; left: -10px; top: 8px; bottom: 8px; width: 3px; border-radius: 0 3px 3px 0; background: var(--acc); }
.nav a .compte { margin-left: auto; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; background: var(--acc); color: #1c1006; font-size: 11px; font-weight: 750; display: grid; place-items: center; }
.nav a:focus-visible { outline-color: #fff; }
.side-pied { padding: 12px; border-top: 1px solid rgba(255, 255, 255, 0.07); display: grid; gap: 8px; }
.carte-ecole { font-size: 12px; color: var(--nuit-mut); line-height: 1.4; padding: 10px 12px; border-radius: 10px; background: var(--nuit-850); }
.carte-ecole b { color: #fff; font-size: 12.5px; display: block; }
.btn-replier { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 34px; border-radius: 8px; border: 1px solid rgba(255, 255, 255, 0.1); background: transparent; color: var(--nuit-mut); font-size: 12.5px; font-weight: 600; }
.btn-replier:hover { background: var(--nuit-800); color: #fff; }
.btn-replier .i { transition: transform var(--t); }

@media (min-width: 901px) {
  :root.side-reduite .app { grid-template-columns: var(--side-wc) minmax(0, 1fr); }
  :root.side-reduite .side-tete { justify-content: center; padding-inline: 0; }
  :root.side-reduite .side-tete .marque,
  :root.side-reduite .nav-groupe,
  :root.side-reduite .carte-ecole,
  :root.side-reduite .btn-replier span,
  :root.side-reduite .nav a .lib,
  :root.side-reduite .nav a .compte { display: none; }
  :root.side-reduite .nav a { justify-content: center; padding-inline: 0; }
  :root.side-reduite .nav a.actif::before { left: -10px; }
  :root.side-reduite .btn-replier .i { transform: rotate(180deg); }
  :root.side-reduite .nav-sep { height: 1px; background: rgba(255, 255, 255, 0.08); margin: 8px 6px; }
}
.nav-sep { display: none; }

/* Zone principale */
.principal { min-width: 0; min-height: 0; display: flex; flex-direction: column; overflow-y: auto; overflow-x: hidden; scroll-padding-top: calc(var(--top-h) + 16px); }
.haut {
  position: sticky;
  top: 0;
  z-index: 20;
  flex: none;
  display: flex;
  align-items: center;
  gap: 8px;
  min-height: var(--top-h);
  padding: 8px 24px;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: saturate(140%) blur(10px);
  -webkit-backdrop-filter: saturate(140%) blur(10px);
  border-bottom: 1px solid var(--line);
}
.ariane { display: flex; align-items: center; gap: 4px; min-width: 0; font-size: 13px; color: var(--mut); }
.ariane a { color: var(--mut); padding: 3px 6px; border-radius: 6px; }
.ariane a:hover { background: var(--sunk); color: var(--ink); text-decoration: none; }
.ariane b { color: var(--ink); padding: 3px 6px; font-weight: 600; white-space: nowrap; }
.ariane .i { width: 14px; height: 14px; opacity: 0.55; }
.haut .espace { flex: 1 1 auto; }
.recherche { position: relative; width: min(380px, 34vw); }
.recherche > .i { position: absolute; left: 11px; top: 10px; color: var(--mut); width: 17px; height: 17px; pointer-events: none; }
.recherche input { width: 100%; height: var(--ctl-h); padding: 0 52px 0 36px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--surface); box-shadow: var(--sh-1); }
.recherche input:focus { border-color: var(--pri); box-shadow: 0 0 0 3px var(--pri-ring); }
.recherche kbd { position: absolute; right: 9px; top: 9px; }
.resultats-recherche { position: absolute; top: calc(100% + 6px); left: 0; right: 0; min-width: 360px; max-height: 70vh; overflow: auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--sh-3); padding: 6px; z-index: 30; }
.resultats-recherche button { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; border: 0; background: none; padding: 8px 10px; border-radius: 9px; }
.resultats-recherche button.hl, .resultats-recherche button:hover { background: var(--sunk); }
.resultats-recherche small { display: block; color: var(--mut); font-size: 12px; }
.resultats-recherche .k { margin-left: auto; font-size: 11px; color: var(--mut); border: 1px solid var(--line); padding: 1px 7px; border-radius: 99px; }
.resultats-recherche .rien { padding: 12px; color: var(--mut); font-size: 13px; }
.etat-sauvegarde { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px; border-radius: 99px; font-size: 12px; font-weight: 600; color: var(--mut); border: 1px solid transparent; white-space: nowrap; }
.etat-sauvegarde .point { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
.etat-sauvegarde.encours .point { background: var(--acc); animation: pulse 1s ease-in-out infinite; }
.etat-sauvegarde.erreur { color: var(--bad); background: var(--bad-soft); border-color: color-mix(in srgb, var(--bad) 35%, transparent); }
.etat-sauvegarde.erreur .point, .etat-sauvegarde.ephemere .point { background: var(--bad); }
.etat-sauvegarde.ephemere { color: var(--bad); }
@keyframes pulse { 50% { opacity: 0.35; } }
.btn-haut { position: relative; display: inline-grid; place-items: center; width: var(--ctl-h); height: var(--ctl-h); border-radius: 10px; border: 1px solid transparent; background: transparent; color: var(--mut); }
.btn-haut:hover { background: var(--surface); border-color: var(--line); color: var(--ink); }
.btn-haut .pastille { position: absolute; top: 3px; right: 3px; min-width: 17px; height: 17px; padding: 0 4px; border-radius: 99px; background: var(--bad); color: #fff; font-size: 10.5px; font-weight: 800; display: grid; place-items: center; border: 2px solid var(--bg); }
.btn-profil { display: inline-flex; align-items: center; gap: 9px; height: var(--ctl-h); padding: 0 10px 0 4px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); box-shadow: var(--sh-1); max-width: 260px; }
.btn-profil:hover { border-color: var(--line-2); }
.btn-profil .av { width: 30px; height: 30px; border-radius: 8px; font-size: 11px; }
.btn-profil .pt { display: grid; text-align: left; line-height: 1.15; min-width: 0; }
.btn-profil .pt b { font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.btn-profil .pt small { font-size: 11px; color: var(--mut); white-space: nowrap; }
.burger { display: none; }

.bandeaux:empty { display: none; }
.bandeaux { display: grid; gap: 0; }
.bandeau { display: flex; align-items: center; gap: 10px; padding: 9px 24px; font-size: 13px; font-weight: 550; border-bottom: 1px solid var(--line); }
.bandeau .i { flex: none; }
.bandeau .espace { flex: 1; }
.bandeau.demo { background: var(--acc-soft); color: var(--acc-ink); }
.bandeau.erreur { background: var(--bad-soft); color: var(--bad); }
.bandeau.avert { background: var(--warn-soft); color: var(--warn); }
.bandeau.info { background: var(--info-soft); color: var(--info); }

.contenu { width: 100%; max-width: var(--contenu-max); margin: 0 auto; padding: 24px 28px 56px; outline: none; }
.contenu.entree > * { animation: entree 0.24s cubic-bezier(0.2, 0.7, 0.2, 1) both; }
.contenu.entree > *:nth-child(2) { animation-delay: 25ms; }
.contenu.entree > *:nth-child(3) { animation-delay: 50ms; }
.contenu.entree > *:nth-child(n + 4) { animation-delay: 75ms; }
@keyframes entree { from { opacity: 0; transform: translateY(5px); } }

/* En-tête de page */
.page-tete { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
.page-tete h1 { font-size: var(--fs-xl); line-height: 1.2; }
.page-tete p { color: var(--mut); margin: 4px 0 0; max-width: 78ch; font-size: 13.5px; }
.page-tete .actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.onglets { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin: -4px 0 20px; overflow-x: auto; scrollbar-width: none; }
.onglets a { padding: 10px 14px; font-weight: 600; font-size: 13.5px; color: var(--mut); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; text-decoration: none; display: inline-flex; gap: 7px; align-items: center; }
.onglets a:hover { color: var(--ink); }
.onglets a.actif { color: var(--pri); border-bottom-color: var(--pri); }
.onglets a .compte { font-size: 11px; background: var(--sunk); color: var(--mut); padding: 0 6px; border-radius: 99px; font-weight: 700; }

/* Grilles */
.grille { display: grid; gap: 16px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.g5 { grid-template-columns: repeat(5, minmax(0, 1fr)); }
.gauto { grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
.g-2-1 { grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); }
.g-1-2 { grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); }
.s2 { grid-column: span 2; }
.plein { grid-column: 1 / -1; }

/* Barre du bas (téléphone, tablette) */
.bas { display: none; }

@media (max-width: 1280px) {
  .g5 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}
@media (max-width: 1100px) {
  .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .g3 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .g-2-1, .g-1-2 { grid-template-columns: minmax(0, 1fr); }
  .recherche { width: min(300px, 30vw); }
  .btn-profil .pt { display: none; }
  .btn-profil { padding-right: 4px; }
}
@media (max-width: 900px) {
  :root { --top-h: 56px; }
  .app { grid-template-columns: minmax(0, 1fr); }
  .side { position: fixed; z-index: 60; left: 0; top: 0; bottom: 0; width: min(300px, 86vw); transform: translateX(-104%); transition: transform var(--t); box-shadow: var(--sh-3); }
  :root.nav-ouverte .side { transform: none; }
  .voile-nav { position: fixed; inset: 0; z-index: 59; background: rgba(10, 20, 34, 0.45); }
  .btn-replier { display: none; }
  .burger { display: inline-grid; }
  .haut { padding: 8px 14px; gap: 6px; flex-wrap: wrap; }
  .ariane { display: none; }
  .recherche { order: 9; width: 100%; flex: 1 1 100%; }
  .recherche kbd { display: none; }
  .etat-sauvegarde .txt { display: none; }
  .contenu { padding: 16px 16px 96px; }
  .bandeau { padding: 9px 16px; }
  .g2, .g3, .g4, .g5, .s2 { grid-template-columns: minmax(0, 1fr); grid-column: auto; }
  .bas { display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; background: color-mix(in srgb, var(--surface) 96%, transparent); backdrop-filter: blur(10px); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
  .bas a, .bas button { flex: 1 1 0; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 8px 2px 7px; font-size: 11px; font-weight: 650; color: var(--mut); border: 0; background: none; text-decoration: none; position: relative; }
  .bas a.actif { color: var(--pri); }
  .bas a.actif::before { content: ""; position: absolute; top: 0; left: 28%; right: 28%; height: 3px; border-radius: 0 0 3px 3px; background: var(--pri); }
}
@media (max-width: 560px) {
  .page-tete h1 { font-size: 20px; }
  .page-tete .actions { width: 100%; }
  .page-tete .actions .btn { flex: 1 1 auto; justify-content: center; }
}

/* ==== styles/03-components.css ==== */
/* ---------- Boutons : action principale, secondaire, discrète, destructive ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  min-height: 36px; padding: 6px 14px; border-radius: 9px;
  border: 1px solid var(--line-2); background: var(--surface); color: var(--ink);
  font-weight: 600; font-size: 13.5px; line-height: 1.2; white-space: nowrap;
  box-shadow: var(--sh-1); text-decoration: none;
  transition: background var(--t-fast), border-color var(--t-fast), color var(--t-fast), box-shadow var(--t-fast);
}
.btn:hover { border-color: color-mix(in srgb, var(--pri) 45%, var(--line-2)); color: var(--pri); text-decoration: none; }
.btn:active { transform: translateY(1px); }
.btn:disabled, .btn[aria-disabled="true"] { opacity: 0.5; pointer-events: none; box-shadow: none; }
.btn .i { width: 16px; height: 16px; }
.btn-pri { background: var(--pri); border-color: var(--pri); color: var(--on-pri); }
.btn-pri:hover { background: var(--pri-h); border-color: var(--pri-h); color: var(--on-pri); }
.btn-dng { color: var(--bad); }
.btn-dng:hover { border-color: var(--bad); color: var(--bad); background: var(--bad-soft); }
.btn-dng-plein { background: var(--bad); border-color: var(--bad); color: #fff; }
.btn-dng-plein:hover { background: color-mix(in srgb, var(--bad) 85%, #000); color: #fff; border-color: var(--bad); }
.btn-ghost { background: transparent; border-color: transparent; box-shadow: none; color: var(--ink-2); }
.btn-ghost:hover { background: var(--sunk); border-color: transparent; color: var(--ink); }
.btn-sm { min-height: 30px; padding: 4px 10px; font-size: 12.5px; border-radius: 8px; }
.btn-lg { min-height: 44px; padding: 10px 18px; font-size: 15px; border-radius: 11px; }
.btn-ic { width: 34px; height: 34px; min-height: 34px; padding: 0; border: 0; background: transparent; box-shadow: none; color: var(--mut); border-radius: 8px; }
.btn-ic:hover { background: var(--sunk); color: var(--ink); }
.btn-ic.dng:hover { background: var(--bad-soft); color: var(--bad); }
.btn.occupe { pointer-events: none; opacity: 0.8; }
.btn.occupe::after { content: ""; width: 13px; height: 13px; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent; animation: tourne 0.7s linear infinite; }
@keyframes tourne { to { transform: rotate(360deg); } }
.groupe-btn { display: inline-flex; }
.groupe-btn .btn { border-radius: 0; margin-left: -1px; }
.groupe-btn .btn:first-child { border-radius: 9px 0 0 9px; margin-left: 0; }
.groupe-btn .btn:last-child { border-radius: 0 9px 9px 0; }

/* ---------- Champs ---------- */
.inp, select.inp, textarea.inp {
  width: 100%; min-height: var(--ctl-h); padding: 7px 11px;
  border: 1px solid var(--line-2); border-radius: 9px; background: var(--surface); color: var(--ink);
  transition: border-color var(--t-fast), box-shadow var(--t-fast); min-width: 0;
}
textarea.inp { min-height: 76px; resize: vertical; line-height: 1.45; }
.inp:hover { border-color: color-mix(in srgb, var(--pri) 30%, var(--line-2)); }
.inp:focus { border-color: var(--pri); box-shadow: 0 0 0 3px var(--pri-ring); outline: none; }
.inp[disabled], .inp[readonly] { background: var(--sunk); color: var(--mut); }
.inp[aria-invalid="true"] { border-color: var(--bad); box-shadow: 0 0 0 3px color-mix(in srgb, var(--bad) 18%, transparent); }
.inp-sm { min-height: var(--ctl-h-sm); padding: 4px 8px; font-size: 13px; border-radius: 8px; }
input[type="checkbox"], input[type="radio"] { accent-color: var(--pri); width: 17px; height: 17px; margin: 0; flex: none; }
input[type="color"] { width: 46px; height: 34px; padding: 2px; border: 1px solid var(--line-2); border-radius: 8px; background: var(--surface); }
input[type="range"] { accent-color: var(--pri); width: 100%; }
.champ { display: grid; gap: 5px; min-width: 0; align-content: start; }
.champ > label, .champ > .lib { font-size: 12.5px; font-weight: 650; color: var(--ink-2); }
.champ .req { color: var(--bad); margin-left: 2px; }
.champ .aide { font-size: 12px; color: var(--mut); }
.champ .erreur-champ { font-size: 12.5px; color: var(--bad); font-weight: 600; display: flex; gap: 6px; align-items: flex-start; }
.champ .erreur-champ .i { width: 15px; height: 15px; margin-top: 1px; }
.champ:focus-within > label { color: var(--pri); }
.form-grille { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 16px; }
.form-grille.g3c { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.form-grille .plein { grid-column: 1 / -1; }
.section-form { border: 1px solid var(--line); border-radius: var(--r-lg); padding: 16px; background: var(--surface-2); }
.section-form > h3 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--mut); margin: 0 0 12px; display: flex; gap: 8px; align-items: center; }
.section-form > h3 .i { color: var(--pri); }
.coche { display: inline-flex; align-items: center; gap: 8px; font-weight: 550; cursor: pointer; }
.coches { display: flex; flex-wrap: wrap; gap: 8px 16px; }
.choix-carte { display: flex; gap: 10px; flex-wrap: wrap; }
.choix-carte label { display: flex; align-items: center; gap: 8px; padding: 9px 12px; border: 1px solid var(--line-2); border-radius: 10px; background: var(--surface); cursor: pointer; font-weight: 550; }
.choix-carte label:has(input:checked) { border-color: var(--pri); background: var(--pri-soft); }
.erreur-form { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 10px; background: var(--bad-soft); color: var(--bad); font-weight: 600; font-size: 13px; margin-bottom: 12px; }
.force { display: flex; gap: 4px; margin-top: 4px; }
.force i { flex: 1; height: 4px; border-radius: 2px; background: var(--sunk-2); }
.force[data-n="1"] i:nth-child(-n + 1) { background: var(--bad); }
.force[data-n="2"] i:nth-child(-n + 2) { background: var(--warn); }
.force[data-n="3"] i:nth-child(-n + 3) { background: var(--ok); }
.force[data-n="4"] i { background: var(--ok); }

/* ---------- Cartes, encadrés ---------- */
.carte { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 18px; box-shadow: var(--sh-1); min-width: 0; }
.carte-tete { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
.carte-tete h2, .carte-tete h3 { font-size: 15px; }
.carte-tete .sous { font-size: 12.5px; color: var(--mut); margin-top: 2px; }
.carte.plate { box-shadow: none; }
.carte.compacte { padding: 14px; }
.encadre { display: flex; gap: 10px; align-items: flex-start; padding: 11px 13px; border-radius: 11px; font-size: 13px; line-height: 1.45; background: var(--info-soft); color: var(--ink-2); border: 1px solid color-mix(in srgb, var(--info) 20%, transparent); }
.encadre > .i { color: var(--info); margin-top: 1px; }
.encadre.ok { background: var(--ok-soft); border-color: color-mix(in srgb, var(--ok) 25%, transparent); }
.encadre.ok > .i { color: var(--ok); }
.encadre.avert { background: var(--warn-soft); border-color: color-mix(in srgb, var(--warn) 25%, transparent); }
.encadre.avert > .i { color: var(--warn); }
.encadre.erreur { background: var(--bad-soft); border-color: color-mix(in srgb, var(--bad) 25%, transparent); }
.encadre.erreur > .i { color: var(--bad); }
.encadre b { color: var(--ink); }

/* ---------- Indicateurs ---------- */
.kpi { display: flex; flex-direction: column; gap: 2px; padding: 15px 16px; border: 1px solid var(--line); border-radius: var(--r-lg); background: var(--surface); box-shadow: var(--sh-1); min-width: 0; color: var(--ink); text-decoration: none; position: relative; transition: border-color var(--t-fast), box-shadow var(--t-fast); }
a.kpi:hover, button.kpi:hover { border-color: color-mix(in srgb, var(--pri) 40%, var(--line)); box-shadow: var(--sh-2); text-decoration: none; }
button.kpi { text-align: left; font: inherit; }
.kpi-l { display: flex; align-items: center; gap: 9px; font-size: 12.5px; font-weight: 650; color: var(--mut); }
.kpi-l .i { width: 30px; height: 30px; padding: 7px; border-radius: 9px; background: var(--pri-soft); color: var(--pri); }
.kpi.acc .kpi-l .i { background: var(--acc-soft); color: var(--acc-ink); }
.kpi.avert .kpi-l .i { background: var(--warn-soft); color: var(--warn); }
.kpi.mauvais .kpi-l .i { background: var(--bad-soft); color: var(--bad); }
.kpi-v { font: 750 28px/1.15 var(--font-titre); letter-spacing: -0.02em; margin-top: 6px; color: var(--ink); }
.kpi-v small { font-size: 14px; color: var(--mut); font-weight: 600; letter-spacing: 0; margin-left: 2px; }
.kpi-s { font-size: 12.5px; color: var(--mut); }
.kpi .fleche { position: absolute; right: 12px; top: 14px; color: var(--faint); opacity: 0; transition: opacity var(--t-fast); }
a.kpi:hover .fleche, button.kpi:hover .fleche { opacity: 1; color: var(--pri); }
.repartition { display: flex; gap: 2px; height: 6px; margin-top: 10px; border-radius: 3px; overflow: hidden; background: var(--sunk); }
.repartition i { display: block; height: 100%; }
.g-col { background: var(--cg); }
.f-col { background: var(--cf); }
.legende { display: flex; gap: 14px; flex-wrap: wrap; color: var(--mut); font-size: 12px; }
.legende span { display: inline-flex; align-items: center; gap: 6px; }
.legende i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }

/* Barres horizontales (effectifs, résultats) */
.barres { display: grid; gap: 4px; }
.barre-l { display: grid; grid-template-columns: 52px minmax(0, 1fr) 96px; align-items: center; gap: 10px; padding: 6px 8px; border-radius: 8px; border: 0; background: none; width: 100%; text-align: left; color: var(--ink); text-decoration: none; }
a.barre-l:hover, button.barre-l:hover { background: var(--sunk); text-decoration: none; }
.barre-l .nom { font-weight: 700; font-size: 13px; }
.barre-l .val { text-align: right; font-size: 12.5px; color: var(--mut); font-variant-numeric: tabular-nums; }
.barre-l .val b { color: var(--ink); }
.piste { position: relative; height: 12px; display: flex; gap: 2px; border-radius: 4px; }
.piste.fond { background: var(--sunk); }
.piste i { display: block; height: 100%; border-radius: 3px; }
.piste .ref { position: absolute; top: -3px; bottom: -3px; width: 0; border-left: 1.5px dashed var(--mut); }
.piste .pri { background: var(--pri); }
.colonnes { display: flex; align-items: flex-end; gap: 6px; height: 150px; border-bottom: 1px solid var(--line); padding-top: 6px; }
.colonnes > * { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; gap: 2px; height: 100%; border: 0; background: none; padding: 0; border-radius: 6px 6px 0 0; }
.colonnes > *:hover { background: var(--sunk); }
.colonnes i { display: block; border-radius: 2px; }
.colonnes b { font-size: 11px; text-align: center; color: var(--ink); }
.etiq-col { display: flex; gap: 6px; margin-top: 6px; }
.etiq-col span { flex: 1; text-align: center; font-size: 11px; color: var(--mut); white-space: nowrap; overflow: hidden; }
.anneau { width: 124px; height: 124px; border-radius: 50%; display: grid; place-items: center; flex: none; }
.anneau span { width: 82px; height: 82px; border-radius: 50%; background: var(--surface); display: grid; place-items: center; font-weight: 800; font-size: 20px; text-align: center; line-height: 1.1; }
.anneau small { display: block; font-size: 11px; color: var(--mut); font-weight: 600; }
.progression { height: 6px; border-radius: 3px; background: var(--sunk); overflow: hidden; }
.progression i { display: block; height: 100%; background: var(--pri); border-radius: 3px; }

/* ---------- Étiquettes et puces ---------- */
.tag { display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px; border-radius: 99px; font-size: 11.5px; font-weight: 700; background: var(--sunk); color: var(--ink-2); white-space: nowrap; line-height: 1.5; }
.tag .i { width: 13px; height: 13px; }
.tag.ok { background: var(--ok-soft); color: var(--ok); }
.tag.avert { background: var(--warn-soft); color: var(--warn); }
.tag.mauvais { background: var(--bad-soft); color: var(--bad); }
.tag.pri { background: var(--pri-soft); color: var(--pri); }
.tag.acc { background: var(--acc-soft); color: var(--acc-ink); }
a.tag:hover { text-decoration: none; filter: brightness(0.97); }
.puce { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 99px; background: var(--surface); border: 1px solid var(--line); font-size: 12.5px; font-weight: 600; color: var(--mut); }
.pilules { display: inline-flex; gap: 3px; flex-wrap: wrap; background: var(--sunk); padding: 3px; border-radius: 11px; border: 1px solid var(--line); }
.pilule { border: 0; background: transparent; padding: 5px 12px; border-radius: 8px; font-weight: 650; font-size: 13px; color: var(--mut); display: inline-flex; align-items: center; gap: 6px; }
.pilule:hover { color: var(--ink); }
.pilule[aria-pressed="true"], .pilule.actif { background: var(--surface); color: var(--pri); box-shadow: var(--sh-1); }
.pilule .pt { width: 6px; height: 6px; border-radius: 50%; background: var(--ok); }

/* Avatars */
.av { width: 32px; height: 32px; border-radius: 9px; background: var(--pri-soft); color: var(--pri); display: inline-grid; place-items: center; font-size: 11.5px; font-weight: 800; flex: none; object-fit: cover; letter-spacing: 0.02em; }
.av.lg { width: 64px; height: 64px; border-radius: 16px; font-size: 20px; }
.av.xl { width: 80px; height: 80px; border-radius: 18px; font-size: 24px; }
.qui { display: flex; align-items: center; gap: 10px; min-width: 0; }
.qui .tronque { display: block; }
.lien { border: 0; background: none; padding: 0; font-weight: 650; color: var(--ink); text-align: left; }
.lien:hover { color: var(--pri); text-decoration: underline; text-underline-offset: 3px; }

/* ---------- Tableaux : recherche, tri, pagination ---------- */
.barre-outils { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
.barre-outils .recherche-tab { position: relative; flex: 1 1 220px; max-width: 340px; }
.barre-outils .recherche-tab .i { position: absolute; left: 10px; top: 10px; width: 16px; height: 16px; color: var(--mut); }
.barre-outils .recherche-tab input { padding-left: 33px; }
.barre-outils select.inp { width: auto; min-width: 150px; }
.barre-outils .compte-res { color: var(--mut); font-size: 12.5px; margin-left: auto; }
.tab-cadre { border: 1px solid var(--line); border-radius: var(--r-lg); background: var(--surface); box-shadow: var(--sh-1); overflow: auto; position: relative; }
.tab { width: 100%; border-collapse: separate; border-spacing: 0; }
.tab th, .tab td { text-align: left; padding: 10px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.tab td { white-space: nowrap; }
.tab td.texte { white-space: normal; min-width: 180px; }
.tab th { position: sticky; top: 0; z-index: 2; background: var(--surface-2); font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--mut); white-space: nowrap; border-bottom-color: var(--line-2); }
.tab th button.tri { border: 0; background: none; padding: 0; font: inherit; color: inherit; text-transform: inherit; letter-spacing: inherit; display: inline-flex; gap: 4px; align-items: center; }
.tab th button.tri:hover { color: var(--ink); }
.tab th[aria-sort="ascending"] button.tri, .tab th[aria-sort="descending"] button.tri { color: var(--pri); }
.tab th .i { width: 13px; height: 13px; }
.tab tbody tr { transition: background var(--t-fast); }
.tab tbody tr:hover { background: color-mix(in srgb, var(--pri) 4%, var(--surface)); }
.tab tbody tr.choisi { background: color-mix(in srgb, var(--pri) 8%, var(--surface)); }
.tab tbody tr:last-child td { border-bottom: 0; }
.tab tfoot td { background: var(--surface-2); font-weight: 700; border-top: 1px solid var(--line-2); border-bottom: 0; }
.tab .r, .tab th.r { text-align: right; }
.tab .c, .tab th.c { text-align: center; }
.tab .actions-l { text-align: right; white-space: nowrap; width: 1%; }
.tab .col-choix { width: 36px; padding-right: 0; }
.tab-cadre .vide { border: 0; box-shadow: none; }
.pagination { display: flex; align-items: center; gap: 6px; justify-content: flex-end; padding: 10px 2px 0; font-size: 12.5px; color: var(--mut); flex-wrap: wrap; }
.pagination .btn { min-width: 34px; }
.selection-barre { display: flex; align-items: center; gap: 10px; padding: 8px 12px; margin-bottom: 10px; border-radius: 10px; background: var(--pri-soft); color: var(--pri); font-weight: 650; font-size: 13px; flex-wrap: wrap; }
.selection-barre .espace { flex: 1; }

/* ---------- États vides et chargement ---------- */
.vide { display: grid; justify-items: center; gap: 8px; padding: 36px 20px; text-align: center; color: var(--mut); }
.vide .illu { width: 74px; height: 58px; color: var(--line-2); }
.vide b { color: var(--ink); font-size: 14px; }
.vide p { margin: 0; max-width: 46ch; font-size: 13px; }
.chargement { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 40px; color: var(--mut); }
.chargement::before { content: ""; width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--line-2); border-top-color: var(--pri); animation: tourne 0.8s linear infinite; }
.squelette { background: linear-gradient(90deg, var(--sunk) 25%, var(--sunk-2) 50%, var(--sunk) 75%); background-size: 200% 100%; animation: luire 1.4s ease infinite; border-radius: 8px; }
@keyframes luire { to { background-position: -200% 0; } }

/* ---------- Fenêtres (dialog) : toujours cadrées dans l'écran, fermables ---------- */
dialog.dlg { border: 0; padding: 0; border-radius: 16px; background: var(--surface); color: var(--ink); box-shadow: var(--sh-3); width: min(560px, calc(100vw - 32px)); max-height: calc(100dvh - 32px); overflow: hidden; }
dialog.dlg.sm { width: min(440px, calc(100vw - 32px)); }
dialog.dlg.lg { width: min(820px, calc(100vw - 32px)); }
dialog.dlg.xl { width: min(1120px, calc(100vw - 32px)); }
dialog.dlg.plein { width: calc(100vw - 24px); height: calc(100dvh - 24px); max-height: none; border-radius: 14px; }
dialog.dlg::backdrop { background: rgba(10, 20, 34, 0.52); backdrop-filter: blur(2px); }
dialog.dlg[open] { animation: dlg-in 0.18s cubic-bezier(0.2, 0.7, 0.2, 1); }
@keyframes dlg-in { from { opacity: 0; transform: translateY(8px) scale(0.985); } }
.dlg-f { display: flex; flex-direction: column; max-height: calc(100dvh - 32px); min-height: 0; }
dialog.plein .dlg-f { height: 100%; max-height: none; }
.dlg-tete { display: flex; align-items: center; gap: 10px; padding: 16px 20px; border-bottom: 1px solid var(--line); flex: none; }
.dlg-tete h2 { flex: 1; font-size: 16.5px; display: flex; gap: 9px; align-items: center; min-width: 0; }
.dlg-tete h2 .i { color: var(--pri); }
.dlg-tete.danger h2 .i { color: var(--bad); }
.dlg-corps { padding: 20px; overflow: auto; flex: 1 1 auto; min-height: 0; overscroll-behavior: contain; }
.dlg-pied { display: flex; align-items: center; gap: 8px; padding: 13px 20px; border-top: 1px solid var(--line); background: var(--surface-2); flex: none; flex-wrap: wrap; }
.dlg-pied .espace { flex: 1; }
.dlg-pied .btn { min-width: 100px; }
.dlg-pied .modif { font-size: 12px; color: var(--warn); font-weight: 600; display: none; align-items: center; gap: 6px; }
.dlg-pied .modif::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--warn); }
form.modifie .dlg-pied .modif { display: inline-flex; }
.etapes { display: flex; gap: 6px; margin-bottom: 18px; }
.etapes span { flex: 1; height: 4px; border-radius: 2px; background: var(--sunk-2); }
.etapes span.fait { background: var(--pri); }

/* Onglets dans une fenêtre ou une carte */
.onglets-form { display: flex; gap: 4px; margin: -4px 0 16px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.onglets-form button { border: 0; background: none; padding: 9px 12px; font-weight: 650; font-size: 13px; color: var(--mut); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; display: inline-flex; gap: 6px; align-items: center; }
.onglets-form button[aria-selected="true"] { color: var(--pri); border-bottom-color: var(--pri); }
.onglets-form button .err-pt { width: 7px; height: 7px; border-radius: 50%; background: var(--bad); }

/* ---------- Tiroir (fiche détaillée) ---------- */
.voile { position: fixed; inset: 0; background: rgba(10, 20, 34, 0.4); z-index: 40; }
.tiroir { position: fixed; top: 0; right: 0; bottom: 0; width: min(480px, 100%); background: var(--surface); z-index: 41; overflow: auto; box-shadow: var(--sh-3); border-left: 1px solid var(--line); animation: tiroir-in 0.22s cubic-bezier(0.2, 0.7, 0.2, 1); }
@keyframes tiroir-in { from { transform: translateX(28px); opacity: 0; } }
.tiroir-tete { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid var(--line); background: color-mix(in srgb, var(--surface) 94%, transparent); backdrop-filter: blur(8px); }
.tiroir-tete span { font-size: 11.5px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--mut); }
.tiroir-corps { padding: 18px; display: grid; gap: 20px; }
.tiroir-corps h4 { font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--mut); margin: 0 0 8px; }
.fiche-hero { display: flex; gap: 14px; align-items: center; }
.fiche-hero h2 { font-size: 20px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; margin: 0; font-size: 13px; }
.kv dt { color: var(--mut); }
.kv dd { margin: 0; font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
.liste { display: grid; }
.liste > * { display: flex; align-items: center; gap: 10px; padding: 9px 6px; border-bottom: 1px solid var(--line); font-size: 13px; background: none; border-left: 0; border-right: 0; border-top: 0; width: 100%; text-align: left; color: var(--ink); text-decoration: none; }
.liste > *:last-child { border-bottom: 0; }
.liste > button:hover, .liste > a:hover { background: var(--sunk); text-decoration: none; }
.liste .m { margin-left: auto; color: var(--mut); font-size: 12px; white-space: nowrap; }
.liste .dt { width: 44px; flex: none; text-align: center; border-radius: 9px; background: var(--sunk); padding: 3px 0; font-size: 11px; color: var(--mut); line-height: 1.2; }
.liste .dt b { display: block; font-size: 16px; color: var(--ink); }
.a-faire > * { padding: 11px 8px; border-radius: 0; }
.a-faire .niv { width: 6px; height: 30px; border-radius: 3px; flex: none; background: var(--ok); }
.a-faire .niv.avert { background: var(--warn); }
.a-faire .niv.mauvais { background: var(--bad); }
.a-faire b { display: block; font-size: 13.5px; }
.a-faire small { color: var(--mut); font-size: 12.5px; display: block; }

/* ---------- Notifications ---------- */
.toasts { position: fixed; right: 20px; bottom: 20px; z-index: 120; display: grid; gap: 8px; width: min(420px, calc(100vw - 32px)); pointer-events: none; }
.toast { pointer-events: auto; display: flex; gap: 10px; align-items: flex-start; padding: 12px 12px 12px 14px; border-radius: 12px; background: var(--nuit-900); color: #f1f4f8; box-shadow: var(--sh-3); border-left: 4px solid #4fbf87; font-size: 13.5px; line-height: 1.4; animation: toast-in 0.2s ease both; }
.toast.erreur { border-left-color: #ef7a70; }
.toast.avert { border-left-color: #e2a54a; }
.toast.attente { border-left-color: var(--acc); }
.toast .i { flex: none; margin-top: 1px; }
.toast .tx { flex: 1; min-width: 0; }
.toast .act { border: 1px solid rgba(255, 255, 255, 0.25); background: transparent; color: #fff; border-radius: 7px; padding: 2px 9px; font-size: 12px; font-weight: 650; }
.toast .fermer { border: 0; background: none; color: inherit; opacity: 0.6; padding: 0 2px; font-size: 18px; line-height: 1; }
.toast .fermer:hover { opacity: 1; }
.toast.sortie { animation: toast-out 0.18s ease both; }
@keyframes toast-in { from { opacity: 0; transform: translateY(10px); } }
@keyframes toast-out { to { opacity: 0; transform: translateY(6px); } }

/* ---------- Menus déroulants, bulles ---------- */
.menu { position: fixed; z-index: 90; min-width: 240px; max-width: min(380px, calc(100vw - 16px)); max-height: min(70vh, 520px); overflow: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 13px; box-shadow: var(--sh-3); padding: 6px; animation: dlg-in 0.14s ease; }
.menu h4 { margin: 6px 10px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--mut); }
.menu button, .menu a { display: flex; align-items: center; gap: 10px; width: 100%; border: 0; background: none; text-align: left; padding: 8px 10px; border-radius: 8px; color: var(--ink); font-size: 13.5px; text-decoration: none; }
.menu button:hover, .menu a:hover, .menu button:focus-visible { background: var(--sunk); outline: none; }
.menu .dng { color: var(--bad); }
.menu small { display: block; color: var(--mut); font-size: 12px; }
.menu hr { margin: 5px 0; }
.menu .niv { width: 7px; align-self: stretch; border-radius: 4px; flex: none; background: var(--ok); }
.menu .niv.avert { background: var(--warn); }
.menu .niv.mauvais { background: var(--bad); }
.menu .note { font-size: 12px; color: var(--mut); padding: 8px 10px; border-top: 1px solid var(--line); margin-top: 4px; }
.bulle { position: fixed; z-index: 130; pointer-events: none; background: var(--nuit-900); color: #fff; font-size: 12px; font-weight: 600; padding: 6px 9px; border-radius: 7px; max-width: 280px; box-shadow: var(--sh-2); }

@media (max-width: 560px) {
  .form-grille, .form-grille.g3c { grid-template-columns: minmax(0, 1fr); }
  dialog.dlg, dialog.dlg.lg, dialog.dlg.xl, dialog.dlg.sm { width: calc(100vw - 12px); max-height: calc(100dvh - 12px); }
  .dlg-f { max-height: calc(100dvh - 12px); }
  .dlg-corps { padding: 16px; }
  .dlg-tete, .dlg-pied { padding: 12px 16px; }
  .dlg-pied .btn { flex: 1 1 auto; }
  .dlg-pied .espace { display: none; }
  .toasts { right: 12px; left: 12px; width: auto; bottom: calc(70px + env(safe-area-inset-bottom, 0px)); }
}

/* ==== styles/04-ecrans.css ==== */
/* ---------- Écran plein : accueil, création de l'école, connexion, verrou ---------- */
.ecran-plein { position: fixed; inset: 0; z-index: 100; display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(400px, 0.9fr); background: var(--bg); animation: fondu 0.25s ease both; }
.ecran-plein.sans-photo { grid-template-columns: minmax(0, 1fr); }
@keyframes fondu { from { opacity: 0; } }
.ep-visuel { position: relative; overflow: hidden; background: var(--nuit-900); }
.ep-visuel img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 30%; opacity: 0.92; }
.ep-visuel::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(10, 20, 34, 0.05) 30%, rgba(10, 20, 34, 0.86) 100%), linear-gradient(90deg, rgba(10, 20, 34, 0.25), transparent 60%); }
.ep-legende { position: absolute; z-index: 1; left: 44px; right: 44px; bottom: 40px; color: #fff; }
.ep-legende b { display: block; font: 700 clamp(22px, 2.4vw, 32px)/1.15 var(--font-titre); letter-spacing: -0.02em; text-shadow: 0 2px 12px rgba(0, 0, 0, 0.4); max-width: 22ch; }
.ep-legende span { display: block; margin-top: 10px; max-width: 54ch; opacity: 0.9; font-size: 14.5px; }
.ep-panneau { display: flex; flex-direction: column; overflow: auto; background: var(--surface); border-left: 1px solid var(--line); }
.ecran-plein.sans-photo .ep-panneau { border-left: 0; background: var(--bg); }
.ep-contenu { width: min(480px, 100%); margin: auto; padding: 40px 32px 24px; }
.ecran-plein.sans-photo .ep-contenu { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-xl); box-shadow: var(--sh-2); margin: auto; }
.ep-pied { text-align: center; font-size: 11.5px; color: var(--mut); padding: 0 24px 18px; margin: 0; }
.ep-marque { display: flex; align-items: center; gap: 12px; margin-bottom: 26px; }
.ep-marque img { width: 48px; height: 48px; border-radius: 12px; box-shadow: var(--sh-2); background: #fff; object-fit: contain; }
.ep-marque b { display: block; font: 750 17px/1.1 var(--font-titre); letter-spacing: 0.06em; color: var(--nuit-800); }
:root[data-theme="dark"] .ep-marque b { color: var(--ink); }
.ep-marque small { display: block; color: var(--mut); font-size: 12px; margin-top: 2px; }
.ecran-plein h1 { font-size: 25px; line-height: 1.2; margin-bottom: 6px; }
.ep-sous { color: var(--mut); margin: 0 0 22px; }
.ep-choix { display: grid; gap: 10px; }
.ep-option { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; padding: 14px 16px; border: 1px solid var(--line-2); border-radius: 13px; background: var(--surface); cursor: pointer; transition: border-color var(--t-fast), box-shadow var(--t-fast); color: var(--ink); }
.ep-option > .i:first-child { width: 36px; height: 36px; padding: 8px; border-radius: 10px; background: var(--pri-soft); color: var(--pri); }
.ep-option > .i:last-child { color: var(--faint); }
.ep-option span { flex: 1; min-width: 0; }
.ep-option b { display: block; font-size: 14.5px; }
.ep-option small { display: block; color: var(--mut); font-size: 12.5px; margin-top: 2px; }
.ep-option:hover, .ep-option:focus-visible { border-color: var(--pri); box-shadow: var(--sh-2); }
.ep-option.recommande { border-color: color-mix(in srgb, var(--pri) 50%, var(--line-2)); background: color-mix(in srgb, var(--pri) 4%, var(--surface)); }
.ep-profils { display: grid; gap: 8px; max-height: 38vh; overflow: auto; padding: 2px; }
.ep-profil { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border: 1px solid var(--line-2); border-radius: 12px; background: var(--surface); text-align: left; color: var(--ink); }
.ep-profil:hover { border-color: var(--pri); }
.ep-profil[aria-checked="true"] { border-color: var(--pri); background: var(--pri-soft); box-shadow: 0 0 0 3px var(--pri-ring); }
.ep-profil .av { width: 38px; height: 38px; border-radius: 10px; }
.ep-profil span:nth-child(2) { flex: 1; min-width: 0; }
.ep-profil b { display: block; font-size: 14px; }
.ep-profil small { display: block; color: var(--mut); font-size: 12.5px; }
.ep-profil .ck { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--line-2); flex: none; }
.ep-profil[aria-checked="true"] .ck { border: 6px solid var(--pri); }
.code-secours { font: 700 26px/1.2 var(--mono); letter-spacing: 0.12em; text-align: center; padding: 14px; border-radius: 12px; background: var(--sunk); border: 1px dashed var(--line-2); margin: 0; user-select: all; }
body.a-ecran-plein .toasts { z-index: 140; }
@media (max-width: 900px) {
  .ecran-plein { grid-template-columns: minmax(0, 1fr); grid-template-rows: 180px minmax(0, 1fr); }
  .ecran-plein.sans-photo { grid-template-rows: minmax(0, 1fr); }
  .ep-legende { left: 20px; right: 20px; bottom: 16px; }
  .ep-legende span { display: none; }
  .ep-panneau { border-left: 0; }
  .ep-contenu { padding: 24px 20px; }
}

/* ---------- Tableau de bord ---------- */
.accueil-tete { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 18px; align-items: end; padding: 22px 24px; border-radius: var(--r-xl); background: var(--nuit-850); color: #fff; margin-bottom: 18px; position: relative; overflow: hidden; }
.accueil-tete::after { content: ""; position: absolute; right: -40px; top: -60px; width: 240px; height: 240px; border-radius: 50%; border: 34px solid var(--acc); opacity: 0.16; pointer-events: none; }
.accueil-tete .surtitre { font-size: 11.5px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #f2c38f; }
.accueil-tete h1 { color: #fff; font-size: 25px; margin: 4px 0 4px; }
.accueil-tete p { margin: 0; color: #c9d4e3; font-size: 13.5px; }
.accueil-tete .puces { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; }
.accueil-tete .puces span { font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 99px; background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.18); }
.accueil-tete .puces span.acc { background: var(--acc); border-color: var(--acc); color: #1d1205; }
.accueil-tete .actions-rapides { position: relative; z-index: 1; display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.accueil-tete .btn { background: rgba(255, 255, 255, 0.08); border-color: rgba(255, 255, 255, 0.22); color: #fff; box-shadow: none; }
.accueil-tete .btn:hover { background: rgba(255, 255, 255, 0.16); color: #fff; border-color: rgba(255, 255, 255, 0.4); }
.accueil-tete .btn.clair { background: #fff; color: var(--nuit-850); border-color: #fff; }
.accueil-tete .btn.clair:hover { background: #f1efe9; color: var(--nuit-850); }
.titre-section { display: flex; align-items: baseline; justify-content: space-between; margin: 6px 2px 10px; gap: 10px; }
.titre-section h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.09em; color: var(--mut); font-family: var(--font); font-weight: 700; }
.tuiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.tuile { display: flex; align-items: center; gap: 10px; padding: 11px 12px; border: 1px solid var(--line); border-radius: 13px; background: var(--surface); box-shadow: var(--sh-1); text-align: left; min-width: 0; color: var(--ink); text-decoration: none; }
.tuile:hover { border-color: color-mix(in srgb, var(--pri) 40%, var(--line)); box-shadow: var(--sh-2); text-decoration: none; }
.tuile .ti { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; flex: none; background: var(--pri-soft); color: var(--pri); }
.tuile b { display: block; font-size: 13px; line-height: 1.25; }
.tuile small { display: block; font-size: 11.5px; color: var(--mut); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tuile > span:last-child { min-width: 0; }

/* ---------- Saisie des notes ---------- */
.note-in { width: 72px; text-align: center; padding: 5px 6px; min-height: 34px; border: 1px solid var(--line-2); border-radius: 8px; background: var(--surface); font-weight: 600; font-variant-numeric: tabular-nums; }
.note-in:focus { border-color: var(--pri); box-shadow: 0 0 0 3px var(--pri-ring); outline: none; }
.note-in.attente { background: var(--warn-soft); border-color: var(--warn); color: var(--warn); }
.note-in.mauvaise { border-color: var(--bad); background: var(--bad-soft); }
.note-in.ok { animation: note-ok 0.7s ease; }
@keyframes note-ok { 0% { background: var(--ok-soft); border-color: var(--ok); } }
.note-in:disabled { background: var(--sunk); color: var(--faint); }
.tab-notes th { white-space: normal; min-width: 80px; }
.tab-notes td:first-child, .tab-notes th:first-child { position: sticky; left: 0; background: var(--surface); z-index: 1; }
.tab-notes th:first-child { z-index: 3; background: var(--surface-2); }

/* ---------- Appel ---------- */
.presence { border: 1px solid var(--line-2); border-radius: 99px; padding: 4px 13px; font-weight: 700; font-size: 12.5px; min-width: 120px; background: var(--ok-soft); color: var(--ok); display: inline-flex; gap: 6px; align-items: center; justify-content: center; }
.presence.A { background: var(--bad-soft); color: var(--bad); border-color: color-mix(in srgb, var(--bad) 35%, transparent); }
.presence.J { background: var(--warn-soft); color: var(--warn); border-color: color-mix(in srgb, var(--warn) 35%, transparent); }

/* ---------- Calendrier, emploi du temps ---------- */
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.cal-h { font-size: 11.5px; font-weight: 700; color: var(--mut); text-align: center; padding: 4px 0; }
.cal-j { min-height: 82px; border: 1px solid var(--line); border-radius: 9px; padding: 4px 6px; display: flex; flex-direction: column; gap: 2px; background: var(--surface); min-width: 0; }
.cal-j.hors { border: 0; background: none; }
.cal-j.repos { background: var(--sunk); }
.cal-j.auj { border-color: var(--pri); box-shadow: inset 0 0 0 1px var(--pri); }
.cal-j b { font-size: 12px; }
.cal-e { display: block; font-size: 10.5px; line-height: 1.3; padding: 1px 6px; border-radius: 5px; background: var(--pri-soft); color: var(--pri); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 650; }
.cal-e.g { background: var(--sunk-2); color: var(--ink-2); }
.cal-e.w { background: var(--acc-soft); color: var(--acc-ink); }
.cal-e.b { background: var(--info-soft); color: var(--info); }
.edt td { padding: 5px; }
.edt select { width: 100%; min-width: 130px; font-size: 12.5px; padding: 5px 7px; border-radius: 8px; border: 1px dashed var(--line-2); background: transparent; min-height: 32px; }
.edt select.plein { border-style: solid; background: var(--pri-soft); font-weight: 650; }

/* ---------- Générateur de rapports ---------- */
.gen { display: grid; grid-template-columns: 280px minmax(0, 1fr); gap: 16px; align-items: start; }
.gen-liste button { width: 100%; text-align: left; }
.gen-liste button.actif { background: var(--pri-soft); }
.gen-blocs { display: grid; gap: 8px; }
.gen-bloc { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.gen-bloc .num { display: grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; background: var(--sunk); font-size: 12px; font-weight: 700; }
.gen-bloc .type { font-weight: 600; font-size: 13px; min-width: 160px; }
.gen-bloc input.inp { flex: 1; min-width: 160px; width: auto; }
.gen-bloc select.inp { width: auto; }

/* ---------- Annonces ---------- */
.annonce { position: relative; padding: 10px 40px 10px 12px; border: 1px solid var(--line); border-radius: 10px; margin-bottom: 8px; }
.annonce p { margin: 4px 0 0; font-size: 13px; white-space: pre-wrap; }
.annonce .btn-ic { position: absolute; top: 6px; right: 6px; }

/* ---------- Vérification ---------- */
.verif-res { border-radius: var(--r-lg); border: 1px solid var(--line); overflow: hidden; }
.verif-tete { display: flex; gap: 14px; align-items: center; padding: 16px 18px; }
.verif-tete .i { width: 40px; height: 40px; flex: none; }
.verif-tete b { display: block; font-size: 17px; font-family: var(--font-titre); }
.verif-res.valide .verif-tete { background: var(--ok-soft); color: var(--ok); }
.verif-res.douteux .verif-tete { background: var(--warn-soft); color: var(--warn); }
.verif-res.invalide .verif-tete { background: var(--bad-soft); color: var(--bad); }
.verif-res.inconnu .verif-tete { background: var(--sunk); color: var(--ink-2); }
.verif-points { display: grid; gap: 0; }
.verif-point { display: grid; grid-template-columns: 28px 200px minmax(0, 1fr); gap: 10px; align-items: start; padding: 10px 18px; border-top: 1px solid var(--line); font-size: 13px; }
.verif-point .i { color: var(--mut); }
.verif-point.ok .i { color: var(--ok); }
.verif-point.ko .i { color: var(--bad); }
.verif-point.av .i { color: var(--warn); }
.verif-point b { font-weight: 650; }
.camera { position: relative; border-radius: 12px; overflow: hidden; background: #000; aspect-ratio: 4 / 3; max-width: 520px; }
.camera video { width: 100%; height: 100%; object-fit: cover; }
.camera .viseur { position: absolute; inset: 18%; border: 3px solid rgba(255, 255, 255, 0.85); border-radius: 14px; box-shadow: 0 0 0 999px rgba(0, 0, 0, 0.28); }

/* ---------- Choix de modèles et aperçu ---------- */
.catalogue { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
.modele-carte { display: grid; gap: 6px; padding: 14px; border: 1px solid var(--line); border-radius: 13px; background: var(--surface); text-align: left; color: var(--ink); box-shadow: var(--sh-1); }
.modele-carte:hover { border-color: color-mix(in srgb, var(--pri) 45%, var(--line)); box-shadow: var(--sh-2); }
.modele-carte .i { width: 34px; height: 34px; padding: 8px; border-radius: 10px; background: var(--pri-soft); color: var(--pri); }
.modele-carte b { font-size: 14px; }
.modele-carte small { color: var(--mut); font-size: 12.5px; }
.editeur-modele { display: grid; grid-template-columns: minmax(340px, 420px) minmax(0, 1fr); gap: 16px; align-items: start; }
.editeur-modele .panneau-reglages { position: sticky; top: calc(var(--top-h) + 12px); max-height: calc(100dvh - var(--top-h) - 32px); overflow: auto; }
.jetons { display: flex; flex-wrap: wrap; gap: 6px; }
.jetons button { border: 1px solid var(--line-2); background: var(--surface-2); border-radius: 7px; padding: 2px 8px; font: 12px var(--mono); color: var(--ink-2); }
.jetons button:hover { border-color: var(--pri); color: var(--pri); }
@media (max-width: 1100px) {
  .gen, .editeur-modele { grid-template-columns: minmax(0, 1fr); }
  .editeur-modele .panneau-reglages { position: static; max-height: none; }
  .verif-point { grid-template-columns: 24px minmax(0, 1fr); }
  .verif-point span:last-child { grid-column: 2; }
  .accueil-tete { grid-template-columns: minmax(0, 1fr); }
  .accueil-tete .actions-rapides { justify-content: flex-start; }
}

/* ==== styles/05-documents.css ==== */
/* =====================================================================================
   Système documentaire : feuilles aux dimensions physiques (mm), indépendantes de l'écran.
   Lisibles en couleur comme en noir et blanc ; peu d'aplats d'encre ; filigranes sous le
   contenu, jamais sur la photo, le QR code ou les signatures.
   ===================================================================================== */
.feuille {
  --mt: 14mm; --mr: 14mm; --mb: 12mm; --ml: 14mm;
  --doc-encre: #111; --doc-gris: #555; --doc-trait: #222; --doc-fond-tete: #efefef; --doc-accent: #1f4e8c;
  position: relative;
  width: 210mm;
  height: 297mm;
  overflow: hidden;
  background: #fff;
  color: var(--doc-encre);
  font: 10pt/1.38 Arial, "Liberation Sans", Helvetica, sans-serif;
  box-sizing: border-box;
  page: a4;
  break-after: page;
  print-color-adjust: exact;
  -webkit-print-color-adjust: exact;
  color-scheme: light;
}
.feuille.paysage { width: 297mm; height: 210mm; page: a4p; }
.feuille.a5 { width: 148mm; height: 210mm; page: a5; }
.feuille:last-child { break-after: auto; }
.feuille .zone { position: absolute; inset: var(--mt) var(--mr) var(--mb) var(--ml); display: flex; flex-direction: column; z-index: 1; }
.feuille .corps { flex: 1 1 auto; min-height: 0; position: relative; }
.feuille .corps.ajuste { overflow: visible; }
.feuille * { box-sizing: border-box; }
.feuille h1, .feuille h2, .feuille h3, .feuille h4 { color: var(--doc-encre); font-family: Arial, "Liberation Sans", Helvetica, sans-serif; letter-spacing: 0; }

/* En-tête officiel (modèle des documents de l'école ivoirienne) */
.doc-entete { display: flex; justify-content: space-between; align-items: flex-start; gap: 6mm; font: 7.6pt/1.28 "Times New Roman", Times, "Liberation Serif", serif; color: var(--doc-encre); padding-bottom: 2.2mm; border-bottom: 0.6pt solid var(--doc-trait); margin-bottom: 4mm; }
.doc-entete .ge { flex: 0 1 60%; display: flex; flex-direction: column; text-transform: uppercase; font-weight: 700; }
.doc-entete .ge .sep { display: block; width: 18mm; border-top: 0.5pt solid #777; margin: 1.1mm 0 1.1mm 12mm; }
.doc-entete .ge .ecole { font-size: 8.4pt; }
.doc-entete .ge .logos { display: flex; gap: 3mm; margin-top: 1.6mm; }
.doc-entete .ge .logos img { height: 13mm; width: auto; max-width: 26mm; object-fit: contain; }
.doc-entete .dr { flex: 0 0 34%; display: flex; flex-direction: column; align-items: center; text-align: center; font-weight: 700; }
.doc-entete .dr .rep { font-size: 9pt; }
.doc-entete .dr .devise { font-weight: 400; font-style: italic; }
.doc-entete .dr img { height: 15mm; width: auto; margin: 1.2mm 0; }
.doc-entete .dr .annee { font-weight: 400; }
.doc-entete-x { text-align: center; font-size: 8pt; color: var(--doc-gris); margin: -2.4mm 0 3mm; }
.doc-entete.compact { font-size: 6.8pt; margin-bottom: 2.6mm; }
.doc-entete.compact .ge .logos img { height: 10mm; }
.doc-entete.compact .dr img { height: 11mm; }

/* Titre du document */
.doc-titre { text-align: center; margin: 1mm 0 4.5mm; }
.doc-titre h1 { font-size: 15pt; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; margin: 0; }
.doc-titre .sous { font-size: 9.5pt; color: var(--doc-gris); margin-top: 1mm; }
.doc-titre.cadre h1 { display: inline-block; padding: 1.8mm 7mm; border: 1.2pt solid var(--doc-trait); }
.doc-titre .filet { width: 30mm; margin: 2mm auto 0; border-top: 1.4pt solid var(--doc-accent); }

/* Blocs d'informations */
.doc-infos { display: grid; grid-template-columns: 1fr 1fr; gap: 1.4mm 8mm; margin: 0 0 4mm; font-size: 9.6pt; }
.doc-infos.une { grid-template-columns: 1fr; }
.doc-infos .c { display: flex; gap: 2mm; align-items: baseline; min-width: 0; }
.doc-infos .c .l { color: var(--doc-gris); white-space: nowrap; }
.doc-infos .c .v { font-weight: 700; min-width: 0; overflow-wrap: anywhere; }
.doc-texte { font-size: 11pt; line-height: 1.75; text-align: justify; margin: 6mm 0; white-space: pre-line; }
.doc-texte b { font-weight: 700; }
.doc-texte p { margin: 0 0 3.5mm; }
.doc-ligne { display: flex; gap: 2mm; align-items: baseline; margin: 1.4mm 0; font-size: 10pt; }
.doc-ligne .pt { flex: 1; border-bottom: 0.6pt dotted #666; min-height: 4.2mm; padding: 0 1.5mm; font-weight: 700; }
.doc-section { margin: 3.5mm 0 1.6mm; font-size: 9.6pt; font-weight: 800; text-transform: uppercase; letter-spacing: 0.04em; border-bottom: 0.6pt solid var(--doc-trait); padding-bottom: 0.8mm; break-after: avoid; }
.doc-note { font-size: 8pt; color: var(--doc-gris); margin: 1.4mm 0; }
.doc-cases { display: inline-flex; gap: 4mm; flex-wrap: wrap; }
.doc-case { display: inline-flex; gap: 1.2mm; align-items: center; }
.doc-case i { display: inline-block; width: 3mm; height: 3mm; border: 0.7pt solid var(--doc-trait); position: relative; }
.doc-case i.on::after { content: ""; position: absolute; inset: 0.5mm; background: var(--doc-trait); }

/* Tableaux des documents */
.doc-tab { width: 100%; border-collapse: collapse; font-size: 9pt; margin: 1mm 0 3mm; }
.doc-tab th, .doc-tab td { border: 0.5pt solid var(--doc-trait); padding: 1.3mm 1.8mm; text-align: center; vertical-align: middle; line-height: 1.25; }
.doc-tab th { background: var(--doc-fond-tete); font-size: 7.8pt; font-weight: 700; text-transform: uppercase; letter-spacing: 0.02em; }
.doc-tab td.g, .doc-tab th.g { text-align: left; }
.doc-tab td.d { text-align: right; }
.doc-tab td.nom { text-align: left; font-weight: 700; }
.doc-tab tr { break-inside: avoid; }
.doc-tab thead { display: table-header-group; }
.doc-tab tfoot td, .doc-tab tr.total td { font-weight: 800; background: #f6f6f6; }
.doc-tab.serre th, .doc-tab.serre td { padding: 0.8mm 1.1mm; font-size: 8pt; }
.doc-tab.serre th { font-size: 7pt; }
.doc-tab.leger th, .doc-tab.leger td { border-left: 0; border-right: 0; }
.doc-recap { display: grid; grid-template-columns: repeat(auto-fit, minmax(30mm, 1fr)); border: 0.6pt solid var(--doc-trait); margin: 2mm 0 3mm; }
.doc-recap > div { padding: 1.6mm 2.4mm; border-right: 0.5pt solid var(--doc-trait); font-size: 8.6pt; }
.doc-recap > div:last-child { border-right: 0; }
.doc-recap b { display: block; font-size: 11pt; }

/* Zones à rédiger (rapports) */
.doc-zone { margin: 1.4mm 0 2mm; }
.doc-zone b { display: block; font-size: 8.8pt; margin-bottom: 0.8mm; }
.doc-zone .z { white-space: pre-wrap; border-bottom: 0.6pt dotted #777; min-height: 5mm; font-size: 9.4pt; line-height: 1.5; background-image: repeating-linear-gradient(transparent 0 calc(1.5em - 0.6pt), #bbb calc(1.5em - 0.6pt) 1.5em); }
.doc-zone textarea { width: 100%; border: 1px dashed #9aa6b5; background: #fbfaf6; color: #111; border-radius: 3px; padding: 1.4mm; font: 9.4pt/1.5 Arial, sans-serif; resize: vertical; }
.zg2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 5mm; }
.zg3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0 4mm; }

/* Signatures et cachet : éléments distincts, jamais simulés */
.doc-fait { text-align: right; font-size: 10pt; margin: 4mm 0 2mm; }
.doc-signatures { display: grid; grid-template-columns: repeat(var(--n, 2), minmax(0, 1fr)); gap: 6mm; margin-top: 2mm; break-inside: avoid; position: relative; z-index: 2; }
.doc-sig { text-align: center; font-size: 9.4pt; display: flex; flex-direction: column; align-items: center; }
.doc-sig .role { font-weight: 800; text-decoration: underline; text-underline-offset: 1mm; }
.doc-sig .espace { width: 100%; height: var(--h-sig, 24mm); margin: 1.4mm 0; position: relative; }
.doc-sig .espace.cadre { border: 0.6pt solid #888; border-radius: 1.5mm; }
.doc-sig .cachet { position: absolute; right: 4%; top: 50%; transform: translateY(-50%); width: 22mm; height: 22mm; border: 0.6pt dashed #999; border-radius: 50%; display: grid; place-items: center; font-size: 6.2pt; color: #999; text-align: center; line-height: 1.15; padding: 2mm; }
.doc-sig .nom { font-weight: 700; }
.doc-sig .qualite { font-size: 8.4pt; color: var(--doc-gris); }

/* Bloc de vérification : QR code + référence + signature électronique */
.doc-verif { display: flex; gap: 3mm; align-items: center; break-inside: avoid; position: relative; z-index: 2; }
.doc-verif .qr { flex: none; background: #fff; }
.doc-verif .qr svg { display: block; width: 100%; height: 100%; }
.doc-verif .txt { font-size: 7.2pt; line-height: 1.35; color: #333; min-width: 0; }
.doc-verif .txt b { font-size: 7.8pt; color: #111; }
.doc-verif .ref { font: 700 8pt/1.2 "Consolas", "Cascadia Mono", "Liberation Mono", monospace; letter-spacing: 0.02em; color: #111; }

/* Pied de page */
.doc-pied { flex: none; display: flex; justify-content: space-between; align-items: flex-end; gap: 4mm; border-top: 0.5pt solid #999; padding-top: 1.4mm; margin-top: 2mm; font-size: 7pt; color: #555; }
.doc-pied .m { text-align: center; flex: 1; }
.doc-pied .statut { font-weight: 800; color: #111; letter-spacing: 0.04em; }

/* Photo d'identité (35 × 45 mm, proportions respectées) */
.doc-photo { width: 30mm; height: 38.6mm; border: 0.7pt solid var(--doc-trait); display: grid; place-items: center; background: #fff; overflow: hidden; color: #888; font-size: 7.5pt; text-align: center; position: relative; z-index: 2; }
.doc-photo img { width: 100%; height: 100%; object-fit: cover; }

/* Filigranes : sous le contenu */
.filigrane { position: absolute; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
.filigrane svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.feuille .protege { position: relative; z-index: 2; background: #fff; }

/* Mise à l'échelle d'un rapport qui doit tenir sur une page */
.ajuste-interne { transform-origin: top left; }

/* ---------- Aperçu à l'écran : de vraies feuilles, réduites si besoin ---------- */
.apercu { background: color-mix(in srgb, var(--sunk) 80%, var(--bg)); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 24px 16px; overflow: auto; }
.apercu .pages { display: grid; justify-items: center; gap: 20px; }
.apercu .feuille-cadre { box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08), 0 14px 34px rgba(0, 0, 0, 0.14); background: #fff; }
.apercu-meta { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 10px; font-size: 12.5px; color: var(--mut); margin-bottom: 12px; }
.apercu-meta b { color: var(--ink); }
.dlg-apercu .dlg-corps { background: color-mix(in srgb, var(--sunk) 80%, var(--bg)); padding: 20px; }
.dlg-apercu .barre-apercu { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.dlg-apercu .barre-apercu .espace { flex: 1; }
.feuille-cadre { position: relative; }
.feuille-cadre .num-page { position: absolute; top: -18px; right: 0; font-size: 11px; color: var(--mut); }
.zones-securite .carte-id::after { content: ""; position: absolute; inset: 3mm; border: 1px dashed rgba(178, 53, 44, 0.45); border-radius: 2mm; pointer-events: none; z-index: 5; }

/* Zone d'impression : invisible à l'écran */
.zone-impression { display: none; }

/* ==== styles/06-cartes.css ==== */
/* =====================================================================================
   Cartes d'identification : format ID-1 (ISO/IEC 7810 : 85,60 × 53,98 mm) par défaut,
   portrait, badge 70 × 100 mm ou dimensions personnalisées (variables --cw / --ch).
   Zone de sécurité de 3 mm : aucun texte ni QR code dans la marge de découpe.
   ===================================================================================== */
.carte-id {
  --cw: 85.6mm; --ch: 53.98mm; --c-acc: #1f4e8c; --c-acc2: #c7782f; --c-encre: #121a26; --c-gris: #5a6372;
  position: relative; width: var(--cw); height: var(--ch); overflow: hidden; background: #fff; color: var(--c-encre);
  font: 6.6pt/1.25 Arial, "Liberation Sans", Helvetica, sans-serif; border-radius: 3mm; box-sizing: border-box;
  print-color-adjust: exact; -webkit-print-color-adjust: exact; color-scheme: light;
}
.carte-id * { box-sizing: border-box; }
.carte-id .filigrane { z-index: 0; }
.carte-id .bande { position: absolute; left: 0; right: 0; top: 0; height: 11.5mm; background: var(--c-acc); color: #fff; display: flex; align-items: center; gap: 2mm; padding: 0 3mm; z-index: 1; }
.carte-id.eco .bande { background: #fff; color: var(--c-acc); border-bottom: 0.6pt solid var(--c-acc); }
.carte-id .bande img { width: 7.5mm; height: 7.5mm; object-fit: contain; background: #fff; border-radius: 1.2mm; padding: 0.4mm; flex: none; }
.carte-id .bande .ecole { min-width: 0; flex: 1; }
.carte-id .bande .ecole b { display: block; font-size: 6.9pt; letter-spacing: 0.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.carte-id .bande .ecole span { display: block; font-size: 4.9pt; opacity: 0.85; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-transform: uppercase; }
.carte-id .bande .type { text-align: right; flex: none; }
.carte-id .bande .type b { display: block; font-size: 5.6pt; letter-spacing: 0.08em; text-transform: uppercase; }
.carte-id .bande .type span { display: block; font-size: 5.2pt; opacity: 0.9; }
.carte-id .filet { position: absolute; left: 0; right: 0; top: 11.5mm; height: 0.8mm; background: var(--c-acc2); z-index: 1; }
.carte-id .photo { position: absolute; left: 3mm; top: 14.6mm; width: 19.5mm; height: 25mm; border: 0.5pt solid #9aa3af; border-radius: 1mm; background: #f3f4f6; overflow: hidden; display: grid; place-items: center; color: #8b93a1; font-size: 4.8pt; text-align: center; z-index: 2; }
.carte-id .photo img { width: 100%; height: 100%; object-fit: cover; }
.carte-id .infos { position: absolute; left: 25.2mm; right: 21.5mm; top: 14.2mm; z-index: 2; }
.carte-id .infos .nom { font-size: 8.4pt; font-weight: 800; text-transform: uppercase; line-height: 1.1; letter-spacing: 0.01em; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.carte-id .infos .prenoms { font-size: 7pt; font-weight: 600; margin-top: 0.4mm; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.carte-id .infos dl { display: grid; grid-template-columns: auto 1fr; gap: 0.5mm 1.6mm; margin: 1.8mm 0 0; }
.carte-id .infos dt { color: var(--c-gris); font-size: 5.4pt; text-transform: uppercase; letter-spacing: 0.04em; align-self: center; }
.carte-id .infos dd { margin: 0; font-weight: 700; font-size: 6.6pt; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.carte-id .infos dd.mono { font-family: "Consolas", "Cascadia Mono", "Liberation Mono", monospace; letter-spacing: 0.02em; }
.carte-id .qr { position: absolute; right: 3mm; top: 14.2mm; width: 17mm; height: 17mm; background: #fff; z-index: 2; }
.carte-id .qr svg { display: block; width: 100%; height: 100%; }
.carte-id .ref { position: absolute; right: 3mm; top: 31.6mm; width: 17mm; text-align: center; font: 700 3.9pt/1.15 "Consolas", "Cascadia Mono", monospace; color: #333; z-index: 2; overflow-wrap: anywhere; }
.carte-id .pied { position: absolute; left: 3mm; right: 3mm; bottom: 2.6mm; display: flex; justify-content: space-between; align-items: flex-end; gap: 2mm; z-index: 2; }
.carte-id .pied .valid { font-size: 5.3pt; color: var(--c-gris); line-height: 1.25; }
.carte-id .pied .valid b { color: var(--c-encre); }
.carte-id .pied .sig { text-align: center; font-size: 4.9pt; color: var(--c-gris); min-width: 22mm; border-top: 0.4pt solid #9aa3af; padding-top: 0.5mm; }
.carte-id .statut-carte { position: absolute; left: 3mm; top: 41mm; z-index: 3; font-size: 5.2pt; font-weight: 800; letter-spacing: 0.06em; color: #b2352c; }

/* Personnel : accent inversé */
.carte-id.agent { --c-acc: #13233a; --c-acc2: #c7782f; }

/* Portrait (54 × 85,6 mm) et badge */
.carte-id.portrait .bande { height: 15mm; flex-direction: column; justify-content: center; align-items: center; text-align: center; gap: 0.6mm; padding: 1.6mm 3mm; }
.carte-id.portrait .bande .type { text-align: center; }
.carte-id.portrait .bande img { position: absolute; left: 2.6mm; top: 3.6mm; width: 7mm; height: 7mm; }
.carte-id.portrait .bande .ecole { padding: 0 8mm; text-align: center; flex: none; width: 100%; }
.carte-id.portrait .filet { top: 15mm; }
.carte-id.portrait .photo { left: 50%; transform: translateX(-50%); top: 18mm; width: 22mm; height: 28mm; }
.carte-id.portrait .infos { left: 3mm; right: 3mm; top: 47.5mm; text-align: center; }
.carte-id.portrait .infos dl { grid-template-columns: auto auto; justify-content: center; text-align: left; }
.carte-id.portrait .qr { right: auto; left: 3mm; top: auto; bottom: 3mm; width: 15mm; height: 15mm; }
.carte-id.portrait .ref { right: auto; left: 19.4mm; top: auto; bottom: 3.2mm; width: auto; text-align: left; }
.carte-id.portrait .pied { left: auto; right: 3mm; bottom: 3mm; flex-direction: column; align-items: flex-end; }
.carte-id.portrait .statut-carte { top: 18mm; left: 3mm; }

/* Verso */
.carte-id.verso { padding: 3mm; }
.carte-id.verso .v-tete { font-size: 6.6pt; font-weight: 800; text-transform: uppercase; color: var(--c-acc); border-bottom: 0.5pt solid var(--c-acc); padding-bottom: 1mm; margin-bottom: 1.4mm; position: relative; z-index: 2; }
