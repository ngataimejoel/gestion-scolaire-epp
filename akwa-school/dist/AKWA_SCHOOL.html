<script>
/* =====================================================================================
   Génération des documents : modèle + réglages + données + registre → feuilles.

   Un modèle (AK.modeles.def) fournit rendu(ctx, reglages, outils) qui renvoie :
     { contenu }                  une page (option ajuster : réduite pour tenir sur une page)
     { pages: [Html] }            plusieurs pages déjà composées
     { liste: { avant, tete, lignes, apres, suite } }   tableau paginé automatiquement
     { carte: Html }              carte d'identification (assemblée ensuite en planche)
   ===================================================================================== */
(function (AK) {
  'use strict';
  const u = AK.u, { html } = u;
  const S = () => AK.store.etat;
  const M = () => AK.mise;

  const outils = () => ({
    entete: M().entete, titre: M().titre, infos: M().infos, signatures: M().signatures, verification: M().verification,
    lieuDate: M().lieuDate, rediger: AK.modeles.rediger, texteJetons: AK.modeles.texteJetons, qrSvg: AK.qr.svg
  });

  function canonDe(ctx) {
    const sc = S().school, X = AK.calc;
    if (ctx.eleve) {
      const s = ctx.eleve;
      return { nom: s.nom, prenoms: s.prenoms, matricule: X.matOf(s), classe: s.classe, annee: sc.year, ecole: sc.name, extra: ctx.cleExtra || '' };
    }
    if (ctx.agent) {
      const t = ctx.agent;
      return { nom: AK.valid.civ.sans(t.nom), prenoms: '', matricule: t.matricule || '', classe: X.clsTxt(t), annee: sc.year, ecole: sc.name, extra: ctx.cleExtra || '' };
    }
    return { nom: '', prenoms: '', matricule: '', classe: ctx.classe || '', annee: sc.year, ecole: sc.name, extra: ctx.cleExtra || '' };
  }

  /**
   * Génère les feuilles d'un modèle pour une liste de contextes.
   * options : { reglages (brouillon d'éditeur), apercu (sans émission, SPÉCIMEN), copie, duplicataDe, statutForce }
   * Renvoie { feuilles, cartes, docs, avertissements }.
   */
  async function generer(idModele, contextes, options = {}) {
    const d = AK.modeles.get(idModele);
    if (!d) throw new AK.ErreurMetier('Modèle de document inconnu.');
    const r = options.reglages ? AK.modeles.valider(idModele, options.reglages) : AK.modeles.reglages(idModele);
    const feuilles = [], cartes = [], docs = [], avertissements = [];
    for (const [i, ctx0] of contextes.entries()) {
      const ctx = { ...ctx0 };
      let statut = options.statutForce || (S().meta.demo ? 'specimen' : null);
      let qrTexte = '', doc = null;
      if (d.emission && options.reutiliser && options.reutiliser[i]) {
        // réimpression d'un document déjà émis (copie, ou exemplaire d'archive d'un document annulé)
        const res = AK.registre.reimprimer(options.reutiliser[i].ref, options.copie ? 'copie' : 'reimpression');
        doc = res.doc;
        qrTexte = doc.qr || '';
        statut = options.statutForce || res.statutFiligrane || statut;
        docs.push(doc);
      } else if (d.emission && !options.apercu) {
        const res = await AK.registre.emettre({
          type: d.emission.type, modele: d.id, version: d.version, politique: d.emission.politique || 'registre',
          cleUnique: d.emission.cleUnique ? d.emission.cleUnique(ctx) : null,
          sujet: ctx.eleve ? { type: 'eleve', id: ctx.eleve.id, libelle: AK.calc.nomComplet(ctx.eleve) } : ctx.agent ? { type: 'agent', id: ctx.agent.id, libelle: ctx.agent.nom } : null,
          canon: canonDe(ctx), expire: d.emission.expire ? d.emission.expire(ctx, r) : null, qr: r.qr, duplicataDe: options.duplicataDe
        });
        doc = res.doc;
        qrTexte = res.qrTexte;
        statut = options.statutForce || res.statutFiligrane || statut;
        docs.push(doc);
      } else if (d.emission && options.apercu) {
        const ref = AK.valid.reference(d.emission.type, new Date().getFullYear(), 0);
        doc = { ref, kid: null, emisLe: new Date().toISOString(), expire: d.emission.expire ? d.emission.expire(ctx, r) : null };
        qrTexte = r.qr.actif ? AK.qr.texte({ T: d.emission.type, R: ref, E: u.aujourdhui(), H: 'SPECIMENSPECIMEN', ...(r.qr.identite && ctx.eleve ? { N: AK.calc.nomComplet(ctx.eleve), M: AK.calc.matOf(ctx.eleve) } : {}) }) : '';
        statut = 'specimen';
      }
      if (options.copie && !options.reutiliser) statut = statut === 'specimen' ? statut : 'copie';
      ctx.ref = doc ? doc.ref : '';
      ctx.doc = doc;
      ctx.qrTexte = r.qr.actif ? qrTexte : '';
      if (d.statut) {
        const s2 = d.statut(ctx, r);
        if (s2 && !statut) statut = s2;
      }
      ctx._statutCarte = statut;
      const res = d.rendu(ctx, r, outils());
      if (res.avertissement) avertissements.push(res.avertissement);
      if (res.carte) {
        cartes.push({ html: res.carte, verso: res.verso || null, statut, format: res.format || r.format });
        continue;
      }
      let pages;
      if (res.liste) pages = M().paginer(r, res.liste);
      else if (res.blocs) pages = M().decouper(r, res.blocs, { suite: res.suite || '', garder: res.garder || 1 });
      else if (res.pages) pages = res.pages;
      else if (res.ajuster) {
        const a = M().ajuster(r, res.contenu);
        if (a.deborde) avertissements.push('Contenu trop long pour une seule page : réduit au maximum lisible (72 %). Retirez un bloc ou passez en paysage.');
        pages = [a.contenu];
      } else pages = [res.contenu];
      pages.forEach((p, i) => feuilles.push(M().feuille({ reglages: r, contenu: p, statut, ref: ctx.ref, page: i + 1, total: pages.length })));
    }
    return { feuilles, cartes, docs, avertissements, reglages: r, modele: d };
  }

  /** Génère puis ouvre l'aperçu. */
  async function ouvrir(idModele, contextes, options = {}) {
    const d = AK.modeles.get(idModele);
    if (!contextes.length) throw new AK.ErreurMetier('Aucun document à produire.');
    const attente = contextes.length > 8 ? AK.ui.toast(`Préparation de ${contextes.length} documents…`, { type: 'attente', duree: 0 }) : null;
    try {
      const g = await generer(idModele, contextes, options);
      let feuilles = g.feuilles;
      if (g.cartes.length) feuilles = AK.cartes.planches(g.cartes, options.planche || {});
      const r = g.reglages;
      AK.impression.apercu({
        titre: options.titre || (contextes.length > 1 ? `${d.lib} · ${contextes.length} documents` : d.lib),
        feuilles,
        format: g.cartes.length ? (options.planche && options.planche.mode === 'unitaire' ? 'cartes à l’unité' : 'planche A4') : `A4 ${r.page.orientation === 'paysage' ? 'paysage' : 'portrait'}`,
        resume: g.docs.length ? `${u.pluriel(g.docs.length, 'document')} inscrit(s) au registre${g.docs.some((x) => x.signe) ? ', signé(s) électroniquement' : ''}` : '',
        avertissement: [...new Set(g.avertissements)].join(' ') || null,
        exporter: options.exporter,
        copie: d.emission && g.docs.length === contextes.length && AK.perm.peut('document.registre') && !options.copie ? async () => {
          const c = await generer(idModele, contextes, { ...options, copie: true, apercu: false, reutiliser: g.docs });
          return c.cartes.length ? AK.cartes.planches(c.cartes, options.planche || {}) : c.feuilles;
        } : null
      });
      return g;
    } finally {
      if (attente) attente.fermer();
    }
  }

  AK.docs = { generer, ouvrir, canonDe };
})(window.AK);

//# sourceURL=akwa/js/docs/generateur.js
</script>
<script>
/* =====================================================================================
   Vérification d'un document (QR code scanné ou référence saisie).

   Quatre questions distinctes, jamais confondues :
     1. Intégrité   : le contenu du QR a-t-il été modifié ? (signature ECDSA)
     2. Émetteur    : qui a signé ? (clé connue, active, retirée, compromise)
     3. Validité    : le document figure-t-il au registre, avec la même empreinte ?
     4. Statut      : annulé, remplacé, expiré, version dépassée ?
   Une signature valide ne prouve PAS qu'un document n'a pas été annulé après son émission :
   seul un registre à jour le dit. Hors ligne, la liste d'annulation n'est connue qu'à la date
   de la dernière copie du registre (indiquée dans le résultat).

   Code pur, partagé par l'application et l'outil de vérification autonome.
   source = { cles: [clés publiques], trouver(ref) → entrée | null, registreDate, ecole }
   ===================================================================================== */
(function (AK) {
  'use strict';
  const u = AK.u;
  const AZERTY = { '&': '1', 'é': '2', '"': '3', "'": '4', '(': '5', '§': '6', 'è': '7', '!': '8', 'ç': '9', 'à': '0', ')': '-', '_': '8' };

  /** Référence saisie au clavier, y compris par une douchette réglée en QWERTY sur un clavier AZERTY. */
  function lireReference(t) {
    let s = String(t || '').trim().toUpperCase().replace(/\s+/g, '');
    const brut = s;
    if (!/^AK-[A-Z]{3}-\d{4}-\d{6}-[0-9A-Z]$/.test(s)) s = [...String(t || '').trim()].map((c) => AZERTY[c] || c).join('').toUpperCase().replace(/\s+/g, '');
    const m = s.match(/AK-[A-Z]{3}-\d{4}-\d{6}-[0-9A-Z]/);
    return m ? m[0] : /^AK-/.test(brut) ? brut : null;
  }

  async function verifier(texte, source) {
    const R = { entree: String(texte || '').trim().slice(0, 600), points: [], verdict: 'inconnu' };
    const point = (cle, etat, titre, detail) => R.points.push({ cle, etat, titre, detail });
    const q = AK.qr.lire(R.entree);
    let ref;
    if (q) {
      R.format = 'qr';
      R.champs = q.champs;
      ref = AK.valid.normRef(q.champs.R);
    } else {
      ref = lireReference(R.entree);
      R.format = ref ? 'reference' : 'inconnu';
    }
    R.ref = ref;
    if (!ref) {
      R.titre = 'Contenu non reconnu';
      R.resume = 'Ce texte n’est ni un QR code AKWA SCHOOL ni une référence de document (AK-XXX-AAAA-NNNNNN-C).';
      point('format', 'ko', 'Format', 'Non reconnu');
      return R;
    }
    const refOk = AK.valid.refValide(ref);
    point('format', refOk ? 'ok' : 'ko', 'Référence', refOk ? `${ref} (clé de contrôle correcte)` : `${ref} : clé de contrôle incorrecte (faute de frappe ou référence inventée)`);
    if (!refOk) {
      R.verdict = 'invalide';
      R.titre = 'Référence invalide';
      R.resume = 'La clé de contrôle de la référence ne correspond pas.';
      return R;
    }
    R.type = q ? q.champs.T : ref.split('-')[1];

    /* 1 et 2. Intégrité et émetteur (signature) */
    let sigOk = null, cle = null;
    if (q && q.signature) {
      cle = (source.cles || []).find((c) => c.id === q.champs.K) || null;
      if (!cle) {
        point('integrite', 'av', 'Intégrité', 'Document signé avec une clé inconnue de cet appareil : signature non vérifiable ici.');
        point('emetteur', 'av', 'Émetteur', `Clé ${q.champs.K || '?'} inconnue. Utilisez l’outil de vérification fourni par l’école émettrice.`);
      } else {
        sigOk = await AK.crypto.verifierSignature(cle.pub, q.message, q.signature);
        if (!sigOk) point('integrite', 'ko', 'Intégrité', 'Signature INVALIDE : le contenu du QR code a été modifié ou fabriqué.');
        else point('integrite', 'ok', 'Intégrité', 'Signature électronique valide : le contenu n’a pas été modifié depuis l’émission.');
        if (sigOk) {
          const emis = q.champs.E || '';
          if (cle.statut === 'compromise') point('emetteur', 'ko', 'Émetteur', `Clé ${cle.id} déclarée COMPROMISE le ${u.fmtDate(String(cle.compromiseLe || '').slice(0, 10))} : la signature ne suffit plus à garantir l’origine.`);
          else if (cle.statut === 'retiree' && cle.retireeLe && emis > String(cle.retireeLe).slice(0, 10)) point('emetteur', 'ko', 'Émetteur', `Clé ${cle.id} retirée le ${u.fmtDate(String(cle.retireeLe).slice(0, 10))} : un document daté après cette date ne devrait pas être signé par elle.`);
          else point('emetteur', 'ok', 'Émetteur', `${cle.ecole || 'École'} · clé ${cle.id} (${cle.empreinte})${cle.statut === 'retiree' ? ' · clé retirée depuis, document antérieur' : ''}`);
        }
      }
    } else if (q) {
      point('integrite', 'av', 'Intégrité', 'QR code non signé : seule la comparaison avec le registre de l’école est possible.');
    } else {
      point('integrite', 'av', 'Intégrité', 'Référence saisie à la main : pas de contrôle de signature.');
    }

    /* 3 et 4. Registre et statut */
    const e = source.trouver ? source.trouver(ref) : null;
    R.entreeRegistre = e;
    let statutOk = false, registreOk = false;
    if (!e) {
      point('registre', 'av', 'Registre', source.registreDate
        ? `Absent de la copie du registre du ${u.fmtDate(source.registreDate)}${sigOk ? ' : document signé, peut-être émis après cette date.' : '.'}`
        : `Absent du registre de cet appareil${sigOk ? ' (document signé : registre à mettre à jour ?)' : ''}.`);
    } else {
      if (e.demo) point('registre', 'av', 'Registre', 'Document de DÉMONSTRATION : sans valeur officielle.');
      if (q && q.champs.H) {
        if (q.champs.H === e.h) {
          registreOk = !e.demo;
          if (!e.demo) point('registre', 'ok', 'Registre', `Inscrit au registre le ${u.fmtDate(e.e)}${e.n ? ' · ' + e.n : ''} ; empreinte identique.`);
        } else if ((e.v || []).includes(q.champs.H)) point('registre', 'av', 'Registre', 'Version ANCIENNE : ce document a été réédité depuis (par exemple après une correction de note). Demandez la version en vigueur.');
        else point('registre', 'ko', 'Registre', 'Empreinte DIFFÉRENTE de celle du registre : document falsifié ou mal copié.');
      } else {
        registreOk = !e.demo;
        if (!e.demo) point('registre', 'ok', 'Registre', `Référence inscrite au registre le ${u.fmtDate(e.e)}${e.n ? ' · ' + e.n : ''}. Comparez le document avec les informations du registre.`);
      }
      const auj = source.aujourdhui || u.aujourdhui();
      if (e.s === 'annule') point('statut', 'ko', 'Statut', `ANNULÉ${e.a ? ' le ' + u.fmtDate(e.a) : ''}${e.motif ? ' : ' + e.motif : ''}.`);
      else if (e.s === 'remplace') point('statut', 'ko', 'Statut', `REMPLACÉ par un duplicata${e.remplacePar ? ' (' + e.remplacePar + ')' : ''} : cet exemplaire n’est plus valable.`);
      else if (e.x && e.x < auj) point('statut', 'av', 'Statut', `EXPIRÉ depuis le ${u.fmtDate(e.x)}.`);
      else {
        statutOk = true;
        point('statut', 'ok', 'Statut', `En vigueur${e.x ? ' jusqu’au ' + u.fmtDate(e.x) : ''}${source.registreDate ? ` (selon le registre du ${u.fmtDate(source.registreDate)})` : ''}.`);
      }
    }
    if (!e && q && q.champs.X && q.champs.X < (source.aujourdhui || u.aujourdhui())) point('statut', 'av', 'Statut', `Date de fin de validité inscrite dans le QR dépassée (${u.fmtDate(q.champs.X)}).`);

    /* Identité inscrite dans le QR (à comparer avec le document présenté) */
    if (q && (q.champs.N || q.champs.M)) point('identite', 'info', 'Titulaire (QR)', `${q.champs.N || ''}${q.champs.M ? ' · matricule ' + q.champs.M : ''} — comparez avec la carte et la personne.`);

    /* Verdict */
    const ko = R.points.some((p) => p.etat === 'ko');
    const av = R.points.some((p) => p.etat === 'av');
    if (ko) R.verdict = 'invalide';
    else if (!e && !sigOk) R.verdict = 'inconnu';
    else if (registreOk && statutOk && (sigOk || !q || !q.signature)) R.verdict = av ? 'douteux' : 'valide';
    else R.verdict = 'douteux';
    const libType = AK.registre ? AK.registre.libelleType(R.type) : R.type;
    R.titre = { valide: 'Document authentique et en vigueur', douteux: 'Vérification incomplète : prudence', invalide: 'Document NON valable', inconnu: 'Document inconnu' }[R.verdict];
    R.resume = `${libType || 'Document'} · ${ref}`;
    return R;
  }

  /** Affichage du résultat (application et outil autonome). */
  function rendu(R) {
    const { html } = u, ic = AK.ic;
    const icone = { valide: 'shieldCheck', douteux: 'warn', invalide: 'shieldX', inconnu: 'help' }[R.verdict];
    const ico = { ok: 'checkCircle', ko: 'xCircle', av: 'warn', info: 'info' };
    return html`<div class="verif-res ${R.verdict}" role="status" aria-live="polite"><div class="verif-tete">${ic(icone)}<div><b>${R.titre}</b><span>${R.resume}</span></div></div>
      <div class="verif-points">${R.points.map((p) => html`<div class="verif-point ${p.etat}">${ic(ico[p.etat] || 'info')}<b>${p.titre}</b><span>${p.detail}</span></div>`)}</div></div>`;
  }

  AK.verif = { verifier, rendu, lireReference };
})(window.AK);

</script>
<script>
/* =====================================================================================
   Modèles de documents des élèves.
   ===================================================================================== */
(function (AK) {
  'use strict';
  const u = AK.u, { html, raw } = u, C = AK.cfg;
  const S = () => AK.store.etat;
  const X = () => AK.calc;
  const def = (d) => AK.modeles.def(d);

  /* ---------- Éléments communs ---------- */
  const photoBloc = (s, r) => (r.champs.photo === false ? '' : html`<div class="doc-photo">${s.photo ? html`<img src="${s.photo}" alt="">` : raw('<span>PHOTO<br>35 × 45 mm</span>')}</div>`);
  const naissance = (s) => `${X().fmtNaissance(s)}${s.lieu ? ' à ' + s.lieu : ''}`;
  function identite(s, r, extra = []) {
    const x = X(), t = x.enseignantDe(s.classe);
    const paires = [
      ['Nom et prénoms', x.nomComplet(s)],
      ['Matricule', x.matOf(s)],
      ['Classe', `${s.classe} · effectif ${x.actifsDe(s.classe).length}${s.redoublant ? ' · redoublant(e)' : ''}`],

  def({
    id: 'bulletin', version: 1, lib: 'Bulletin de notes (composition)', categorie: 'eleve', sujet: 'eleve', icone: 'award',
    description: 'Notes par discipline, moyenne, rang, mention, absences. Une référence par élève et par composition.',
    emission: { type: 'BUL', politique: 'unique', cleUnique: (c) => `BUL|${c.eleve.id}|${anneeCle()}|${c.periode}` },
    champsOptionnels: [['photo', 'Photo de l’élève', true], ['naissance', 'Date et lieu de naissance', true], ['enseignant', 'Nom de l’enseignant(e)', true], ['moyClasse', 'Moyenne de la classe par discipline', true], ['appreciation', 'Appréciation par discipline', true], ['absences', 'Absences', true], ['observations', 'Zone d’observations', true]],
    defauts: {
      titre: 'BULLETIN DE NOTES',
      champs: { photo: true, naissance: true, enseignant: true, moyClasse: true, appreciation: true, absences: true, observations: true },
      signatures: [{ role: 'L’enseignant(e)', nom: '' }, { role: 'Le parent / tuteur', nom: '' }, { role: 'Le Directeur', nom: '{directeur}', cachet: true }],
      hauteurSignature: 22, qr: { actif: true, identite: false, taille: 20 }
    },
    statut(ctx) {
      const s = ctx.eleve, n = ctx.periode, x = X();
      const attente = Object.keys(S().attente).some((k) => k.startsWith(`${s.id}|${n}|`));
      const manque = !x.estAbsent(s.id, n) && x.matieres(s.classe, n).some(([m]) => x.note(s.id, n, m) == null);
      return attente || manque ? 'provisoire' : null;
    },
    rendu(ctx, r, o) {
      const s = ctx.eleve, n = ctx.periode, x = X(), c = s.classe, e = x.echelle(c);
      const res = x.resultat(s, n), cl = x.classement(c, n), moi = cl.w.find((z) => z.s.id === s.id);
      const M = x.matieres(c, n);
      const moyM = (m) => u.moyenne(x.actifsDe(c).filter((o2) => !x.estAbsent(o2.id, n)).map((o2) => x.note(o2.id, n, m)).filter((v) => v != null));
      const [na, nj] = absences(s);
      const lignes = M.map(([m, w]) => {
        const v = x.note(s.id, n, m), mx = x.noteMax(c, w);
        return html`<tr><td class="g">${m}</td><td><b>${res && res.abs ? 'Abs.' : u.fmtNote(v)}</b></td><td>${mx}</td>${r.champs.moyClasse !== false ? html`<td>${u.fmtNote(moyM(m))}</td>` : ''}${r.champs.appreciation !== false ? html`<td class="g">${res && res.abs ? '' : v == null ? '' : x.mention((v / mx) * e, c)}</td>` : ''}</tr>`;
      });
      return {
        contenu: colonne(html`${o.entete(r)}${o.titre(r.titre, `${x.evalLabel(c, n)} · Année scolaire ${S().school.year}`)}${identite(s, r)}
          <table class="doc-tab"><thead><tr><th class="g">Discipline</th><th>Note</th><th>Sur</th>${r.champs.moyClasse !== false ? html`<th>Moy. classe</th>` : ''}${r.champs.appreciation !== false ? html`<th class="g">Appréciation</th>` : ''}</tr></thead><tbody>${lignes}</tbody></table>
          <div class="doc-recap"><div>Total<b>${res && !res.abs ? u.fmtNote(res.total) : '—'}</b></div><div>Moyenne<b>${res && res.abs ? 'Absent' : u.fmtNote(res ? res.moy : null)} / ${e}</b></div><div>Rang<b>${moi ? x.rangTxt(moi.rank) + ' / ' + cl.w.length : '—'}</b></div><div>Moy. de la classe<b>${u.fmtNote(x.moyClasse(c, n))}</b></div><div>Mention<b>${res && res.abs ? '—' : x.mention(res ? res.moy : null, c)}</b></div></div>
          ${r.champs.absences !== false ? html`<div class="doc-ligne"><span>Absences de l’année :</span><b>${na} non justifiée(s), ${nj} justifiée(s)</b><span style="margin-left:auto">Seuil de réussite : <b>${x.info(c).seuil}/${e}</b></span></div>` : ''}
          ${r.champs.observations !== false ? html`<div class="doc-zone"><b>Observations de l’enseignant(e) :</b><div class="z" style="min-height:13mm"></div></div>` : ''}
          ${pied(ctx, r, o)}`)
      };
    }
  });

  /* ---------- Bulletin annuel (MGA) ---------- */
  def({
    id: 'bulletin-annuel', version: 1, lib: 'Bulletin annuel (MGA et décision)', categorie: 'eleve', sujet: 'eleve', icone: 'award',
    description: 'Moyennes des quatre évaluations, MGA, rang, décision de fin d’année.',
    emission: { type: 'BUA', politique: 'unique', cleUnique: (c) => `BUA|${c.eleve.id}|${anneeCle()}` },
    champsOptionnels: [['photo', 'Photo de l’élève', true], ['naissance', 'Date et lieu de naissance', true], ['enseignant', 'Nom de l’enseignant(e)', true], ['observations', 'Zone d’observations', true]],
    defauts: {
      titre: 'BULLETIN ANNUEL', champs: { photo: true, naissance: true, enseignant: true, observations: true },
      signatures: [{ role: 'L’enseignant(e)', nom: '' }, { role: 'Le parent / tuteur', nom: '' }, { role: 'Le Directeur', nom: '{directeur}', cachet: true }], hauteurSignature: 22, qr: { actif: true, identite: false, taille: 20 }
    },
    statut: (ctx) => (X().mga(ctx.eleve) == null ? 'provisoire' : null),
    rendu(ctx, r, o) {
      const s = ctx.eleve, x = X(), c = s.classe, e = x.echelle(c), m = x.mga(s), cl = x.classement(c, 'A'), moi = cl.w.find((z) => z.s.id === s.id);
      const lignes = [1, 2, 3, 4].map((n) => {

        return html`<tr><td class="g">${x.evalLabel(c, n)}</td><td>${u.fmtDate(x.evalDate(c, n))}</td><td><b>${x.estAbsent(s.id, n) ? 'Absent' : u.fmtNote(x.moyEval(s, n))}</b></td><td>${rk ? x.rangTxt(rk.rank) : '—'}</td><td>${u.fmtNote(x.moyClasse(c, n))}</td></tr>`;
      });
      const [na, nj] = absences(s);
      return {
        contenu: colonne(html`${o.entete(r)}${o.titre(r.titre, `Année scolaire ${S().school.year}`)}${identite(s, r)}
          <table class="doc-tab"><thead><tr><th class="g">Évaluation</th><th>Date</th><th>Moyenne / ${e}</th><th>Rang</th><th>Moy. classe</th></tr></thead><tbody>${lignes}</tbody></table>
          <div class="doc-recap"><div>MGA<b>${u.fmtNote(m)} / ${e}</b></div><div>Rang annuel<b>${moi ? x.rangTxt(moi.rank) + ' / ' + cl.w.length : '—'}</b></div><div>Seuil<b>${x.info(c).seuil}/${e}</b></div><div>Décision<b>${x.decision(s) || '—'}</b></div><div>Mention<b>${x.mention(m, c)}</b></div></div>
          <p class="doc-note">${x.info(c).regle === 'MOYENNE4' ? 'MGA = moyenne des 4 évaluations (toutes saisies).' : 'MGA = (moyenne des 3 compositions + 2 × composition de passage) ÷ 3.'} Absences de l’année : ${na} non justifiée(s), ${nj} justifiée(s).</p>
          ${r.champs.observations !== false ? html`<div class="doc-zone"><b>Observations du conseil des maîtres :</b><div class="z" style="min-height:13mm"></div></div>` : ''}
          ${pied(ctx, r, o)}`)
      };
    }
  });

  /* ---------- Fiche scolaire (modèle officiel) ---------- */
  def({
    id: 'fiche-scolaire', version: 2, lib: 'Fiche scolaire (modèle officiel)', categorie: 'eleve', sujet: 'eleve', icone: 'file',
    description: 'Identité, parents, tuteur, parcours scolaire sur 8 ans. QR code minimal (plus aucune donnée personnelle dedans).',
    emission: { type: 'FIS', politique: 'unique', cleUnique: (c) => `FIS|${c.eleve.id}|${anneeCle()}` },
    champsOptionnels: [['photo', 'Photo de l’élève', true], ['sante', 'Groupe sanguin et allergies', true], ['parents', 'Parents et tuteur', true]],
    defauts: {
      titre: 'FICHE SCOLAIRE', champs: { photo: true, sante: true, parents: true }, lieuDate: false,
      signatures: [{ role: 'Le Parent / Tuteur', nom: '' }, { role: 'L’Enseignant(e)', nom: '' }, { role: 'Le Directeur de l’école', nom: '{directeur}', cachet: true }],
      hauteurSignature: 24, qr: { actif: true, identite: false, taille: 20 }, entete: { compact: true }
    },
    rendu(ctx, r, o) {
      const s = ctx.eleve, x = X(), sc = S().school, a = s.acte || {};
      const ch = (v, w) => html`<span class="pt"${w ? html` style="flex:0 0 ${w}"` : ''}>${v || ''}</span>`;
      const ligne = (...parts) => html`<div class="doc-ligne">${parts}</div>`;
      const cur = { annee: sc.year, niveau: s.classe, moy: x.mga(s) != null ? u.fmtSaisie(x.mga(s)) : '', eff: String(x.actifsDe(s.classe).length) };
      const P = [...(s.parcours || []), ...(s.statut === 'Inscrit' ? [cur] : [])].slice(-8);
      const cols = Array.from({ length: 8 }, (_, i) => P[i] || {});
      const parent = (lib, p) => html`<div><div class="doc-section" style="text-align:center;border:0;text-decoration:underline">${lib}</div>${ligne('Nom :', ch(p.nom))}${ligne('Prénom(s) :', ch(p.prenoms))}${ligne('Domicile :', ch(p.domicile))}${ligne('Contact :', ch(p.tel))}${ligne('Profession :', ch(p.profession))}</div>`;
      const tut = s.parent ? { nom: s.parent, tel: s.tel } : {};
      const box = (on) => html`<span class="doc-case"><i class="${on ? 'on' : ''}"></i></span>`;
      return {
        contenu: colonne(html`${o.entete(r)}<div class="doc-titre cadre"><h1>${r.titre}</h1></div>
          <div style="display:grid;grid-template-columns:auto 1fr auto;gap:5mm;align-items:start;margin-bottom:2mm">
            ${photoBloc(s, r) || html`<span></span>`}
            <div style="font-size:9.6pt;line-height:1.7"><div><b>Sexe :</b> ${box(s.sexe === 'Masculin')} Masculin &nbsp; ${box(s.sexe === 'Féminin')} Féminin</div><div><b>Classe :</b> ${C.TOUS_NIVEAUX.map((c) => html`${box(s.classe === c)} ${c} &nbsp;`)}</div><div class="doc-note">Réf. ${ctx.ref || '—'}</div></div>
            <div style="display:grid;gap:2mm;justify-items:end"><div style="border:0.8pt solid #222;padding:1.4mm 3mm;font-weight:800;font-size:9pt">FICHE N° ${u.pad(parseInt((s.mat || '').replace(/\D/g, '').slice(2), 10) || 0, 3)}</div><div style="text-align:right;font-size:8.6pt"><b>MATRICULE</b><div style="border:1pt solid #222;padding:1.2mm 3mm;font-weight:800;min-width:34mm;text-align:center;font-size:10pt">${x.matOf(s)}</div></div>${ctx.qrTexte ? html`<div class="doc-verif"><div class="qr" style="width:${r.qr.taille}mm;height:${r.qr.taille}mm">${o.qrSvg(ctx.qrTexte)}</div></div>` : ''}</div>
          </div>
          ${ligne('NOM :', ch(s.nom))}${ligne('PRÉNOM(S) :', ch(s.prenoms))}
          ${ligne('Né(e) le :', ch(x.fmtNaissance(s), '34mm'), 'à :', ch(s.lieu), 'S/P :', ch(String(a.sp || '').replace(/^Sous-préfecture de /i, ''), '30mm'))}
          ${ligne('Nationalité :', ch(s.nationalite, '36mm'), ...(r.champs.sante !== false ? ['Groupe sanguin :', ch(s.sang, '14mm'), 'Allergies / handicap :', ch(s.allergies)] : []))}
          ${ligne('Acte de naissance / jugement supplétif N° :', ch(s.extrait ? a.num : '', '24mm'), 'du', ch(s.extrait ? u.fmtDate(a.date) : '', '26mm'), 'délivré à :', ch(s.extrait ? a.centre : ''))}
          ${r.champs.parents !== false ? html`<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:5mm;margin:2mm 0">${parent('PÈRE', s.pere || {})}${parent('MÈRE', s.mere || {})}${parent('TUTEUR / TUTRICE', tut)}</div>` : ''}
          <table class="doc-tab serre"><thead><tr><th class="g">Année scolaire</th>${cols.map((c) => html`<th>${c.annee || '20…/20…'}</th>`)}</tr></thead><tbody>
            <tr><td class="g"><i>Année de scolarité</i></td>${cols.map((_, i) => html`<td><i>${i + 1}${i ? 'e' : 're'}</i></td>`)}</tr>
            <tr><td class="g"><b>Niveau de cours</b></td>${cols.map((c) => html`<td>${c.niveau || '…'}</td>`)}</tr>
            <tr><td class="g"><b>Moyenne annuelle</b></td>${cols.map((c) => html`<td>${c.moy || '…'}</td>`)}</tr>
            <tr><td class="g"><b>Effectif de la classe</b></td>${cols.map((c) => html`<td>${c.eff || '…'}</td>`)}</tr></tbody></table>
          ${ligne('École :', ch(sc.name), 'Ville / sous-préfecture :', ch([sc.localite, sc.sp].filter(Boolean).join(' / ')))}
          ${ligne('Fréquentée du :', ch(s.entree ? u.fmtDate(s.entree) : '', '30mm'), 'au :', ch(s.statut === 'Inscrit' ? '' : u.fmtDate(s.departLe) || s.statut, '30mm'), 'Matricule :', ch(x.matOf(s)))}
          ${ligne('Motif de départ :', ch(s.motifDepart || (s.statut !== 'Inscrit' ? s.statut : '')))}
          <div class="doc-fait"><i>Fait à ${u.capitale(sc.localite || '……')}, le ${u.fmtDate(u.aujourdhui())}</i></div>
          ${o.signatures({ ...r, lieuDate: false }, ctx)}`)
      };
    }
  });

  /* ---------- Certificat de scolarité ---------- */
  def({
    id: 'certificat-scolarite', version: 1, lib: 'Certificat de scolarité', categorie: 'eleve', sujet: 'eleve', icone: 'fileCheck',
    description: 'Atteste l’inscription régulière de l’élève pour l’année en cours. Référence unique et QR code vérifiable.',
    emission: { type: 'CSC', politique: 'registre' },
    champsOptionnels: [['photo', 'Photo de l’élève', false]],
    defauts: {
      titre: 'CERTIFICAT DE SCOLARITÉ',
      texte: 'Je soussigné(e), **{directeur}**, {directeur.titre} de l’{ecole.nomLong} ({iepp}, {drenaet}), certifie que l’élève **{eleve.nomComplet}**, {eleve.ne} le {eleve.naissance} à {eleve.lieuNaissance}, matricule **{eleve.matricule}**, est régulièrement {eleve.inscrit} dans mon établissement en classe de **{eleve.classe}** au titre de l’année scolaire **{annee}**.\n\nEn foi de quoi, le présent certificat lui est délivré pour servir et valoir ce que de droit.',
      champs: { photo: false }, filigrane: { type: 'logo', opacite: 5, taille: 62 }, qr: { actif: true, identite: false, taille: 24 }
    },
    rendu(ctx, r, o) {
      const s = ctx.eleve;
      if (s.statut !== 'Inscrit') return { contenu: html`${o.entete(r)}${o.titre(r.titre)}<p class="doc-texte">Cet élève n’est plus inscrit (${s.statut}) : délivrez une attestation de fréquentation ou un certificat de transfert.</p>`, avertissement: `${X().nomComplet(s)} n’est plus inscrit(e) : un certificat de scolarité ne convient pas.` };
      return {
        contenu: colonne(html`${o.entete(r)}${o.titre(r.titre, r.sousTitre)}${r.champs.photo ? html`<div style="display:flex;justify-content:flex-end">${photoBloc(s, r)}</div>` : ''}<div class="doc-texte">${o.rediger(r.texte, ctx)}</div>
          <div style="margin-top:auto">${o.signatures(r, ctx)}<div style="margin-top:6mm">${AK.mise.verification(ctx.qrTexte, ctx.doc, r.qr.taille)}</div></div>`)
      };
    }
  });

  /* ---------- Attestation de fréquentation ---------- */
  def({
    id: 'attestation-frequentation', version: 1, lib: 'Attestation de fréquentation', categorie: 'eleve', sujet: 'eleve', icone: 'fileCheck',
    description: 'Atteste que l’élève fréquente (ou a fréquenté) l’établissement, avec son assiduité si souhaité.',
    emission: { type: 'ATF', politique: 'registre' },
    champsOptionnels: [['assiduite', 'Nombre de jours d’absence de l’année', true]],
    defauts: {
      titre: 'ATTESTATION DE FRÉQUENTATION',
      texte: 'Je soussigné(e), **{directeur}**, {directeur.titre} de l’{ecole.nomLong}, atteste que l’élève **{eleve.nomComplet}**, {eleve.ne} le {eleve.naissance} à {eleve.lieuNaissance}, matricule **{eleve.matricule}**, fréquente l’établissement depuis le {eleve.entree}, en classe de **{eleve.classe}** pour l’année scolaire {annee}.\n\nLa présente attestation est délivrée à la demande de l’intéressé(e) pour servir et valoir ce que de droit.',
      champs: { assiduite: true }, filigrane: { type: 'logo', opacite: 5, taille: 62 }, qr: { actif: true, identite: false, taille: 24 }
    },
    rendu(ctx, r, o) {
      const s = ctx.eleve, [na, nj] = absences(s);
      return {
        contenu: colonne(html`${o.entete(r)}${o.titre(r.titre, r.sousTitre)}<div class="doc-texte">${o.rediger(r.texte, ctx)}</div>
          ${r.champs.assiduite !== false ? html`<div class="doc-recap" style="max-width:120mm"><div>Absences non justifiées<b>${na} jour(s)</b></div><div>Absences justifiées<b>${nj} jour(s)</b></div></div>` : ''}
          <div style="margin-top:auto">${o.signatures(r, ctx)}<div style="margin-top:6mm">${AK.mise.verification(ctx.qrTexte, ctx.doc, r.qr.taille)}</div></div>`)
      };
    }
  });

  /* ---------- Certificat de transfert (exeat) ---------- */
  def({
    id: 'certificat-transfert', version: 1, lib: 'Certificat de transfert (exeat)', categorie: 'eleve', sujet: 'eleve', icone: 'send',
    description: 'Pour un élève qui quitte l’école : date et motif de départ, dernier niveau, parcours.',
    emission: { type: 'CTR', politique: 'registre' },
    champsOptionnels: [['parcours', 'Parcours scolaire', true]],
    defauts: {
      titre: 'CERTIFICAT DE TRANSFERT (EXEAT)',
      texte: 'Je soussigné(e), **{directeur}**, {directeur.titre} de l’{ecole.nomLong} ({iepp}), certifie que l’élève **{eleve.nomComplet}**, {eleve.ne} le {eleve.naissance} à {eleve.lieuNaissance}, matricule **{eleve.matricule}**, inscrit(e) en classe de **{eleve.classe}**, a quitté l’établissement.\n\nMotif du départ : {eleve.motifDepart}.\n\nL’intéressé(e) peut être admis(e) dans tout autre établissement scolaire. Le présent certificat est délivré pour servir et valoir ce que de droit.',
      champs: { parcours: true }, filigrane: { type: 'logo', opacite: 5, taille: 60 }, qr: { actif: true, identite: false, taille: 24 }
    },
    rendu(ctx, r, o) {
      const s = ctx.eleve, x = X();
      const P = [...(s.parcours || []), { annee: S().school.year, niveau: s.classe, moy: x.mga(s) != null ? u.fmtSaisie(x.mga(s)) : '' }];
      return {
        contenu: colonne(html`${o.entete(r)}${o.titre(r.titre, r.sousTitre)}<div class="doc-texte">${o.rediger(r.texte, ctx)}</div>
          ${r.champs.parcours !== false ? html`<div class="doc-section">Parcours dans l’établissement</div><table class="doc-tab serre"><thead><tr><th>Année scolaire</th><th>Niveau</th><th>Moyenne annuelle</th></tr></thead><tbody>${P.map((p) => html`<tr><td>${p.annee || '—'}</td><td>${p.niveau || '—'}</td><td>${p.moy || '—'}</td></tr>`)}</tbody></table>` : ''}
          ${s.statut === 'Inscrit' ? html`<p class="doc-note">Attention : l’élève figure encore comme inscrit(e) ; enregistrez son départ (statut « Transféré ») dans sa fiche.</p>` : ''}
          <div style="margin-top:auto">${o.signatures(r, ctx)}<div style="margin-top:6mm">${AK.mise.verification(ctx.qrTexte, ctx.doc, r.qr.taille)}</div></div>`),
        avertissement: s.statut === 'Inscrit' ? `${x.nomComplet(s)} est encore inscrit(e) : pensez à enregistrer son départ.` : null
      };
    }
  });

  /* ---------- Fiche individuelle (document interne) ---------- */
  def({
    id: 'fiche-individuelle', version: 1, lib: 'Fiche individuelle de l’élève', categorie: 'eleve', sujet: 'eleve', icone: 'user',
    description: 'Dossier complet de l’élève pour le classeur de l’école : identité, extrait, parents, santé. Document interne.',
    emission: { type: 'FII', politique: 'unique', cleUnique: (c) => `FII|${c.eleve.id}|${anneeCle()}` },
    champsOptionnels: [['photo', 'Photo', true], ['sante', 'Santé (groupe sanguin, allergies)', true], ['contacts', 'Téléphones des parents', true], ['resultats', 'Résultats de l’année', true]],
    defauts: {
      titre: 'FICHE INDIVIDUELLE DE L’ÉLÈVE', sousTitre: 'Document interne · données personnelles à protéger',
      champs: { photo: true, sante: true, contacts: true, resultats: true }, filigrane: { type: 'texte', texte: 'CONFIDENTIEL', opacite: 5, taille: 70 },
      signatures: [{ role: 'Le Directeur', nom: '{directeur}', cachet: true }], qr: { actif: true, identite: false, taille: 18 }
    },
    rendu(ctx, r, o) {
      const s = ctx.eleve, x = X(), a = s.acte || {};
      const parent = (l, p) => [l, p && (p.nom || p.prenoms) ? `${p.nom} ${p.prenoms}${p.profession ? ' · ' + p.profession : ''}${r.champs.contacts !== false && p.tel ? ' · ' + p.tel : ''}${p.domicile ? ' · ' + p.domicile : ''}` : '—'];
      return {
        contenu: colonne(html`${o.entete(r)}${o.titre(r.titre, r.sousTitre)}${identite(s, r, [['Nationalité', u.capitale(s.nationalite)], ['Entré(e) le', u.fmtDate(s.entree)], ['Statut', s.statut + (s.motifDepart ? ' · ' + s.motifDepart : '')], ['Matricule école', s.mat]])}
          <div class="doc-section">Extrait de naissance</div>${s.extrait ? AK.mise.infos([['Acte n°', a.num], ['Établi le', u.fmtDate(a.date)], ['Centre d’état civil', a.centre], ['Sous-préfecture', a.sp]]) : html`<p class="doc-note">Extrait de naissance non fourni (âge déclaré).</p>`}
          <div class="doc-section">Parents et tuteur</div>${AK.mise.infos([parent('Père', s.pere), parent('Mère', s.mere), ['Tuteur / tutrice', s.parent ? s.parent + (r.champs.contacts !== false && s.tel ? ' · ' + s.tel : '') : '—']], { une: true })}
          ${r.champs.sante !== false ? html`<div class="doc-section">Santé</div>${AK.mise.infos([['Groupe sanguin', s.sang || 'Non renseigné'], ['Allergies / handicap', s.allergies || 'Aucun signalé']])}` : ''}
          ${r.champs.resultats !== false ? html`<div class="doc-section">Résultats de l’année</div><table class="doc-tab serre"><thead><tr>${[1, 2, 3, 4].map((n) => html`<th>${x.evalLabel(s.classe, n)}</th>`)}<th>MGA</th><th>Décision</th></tr></thead><tbody><tr>${[1, 2, 3, 4].map((n) => html`<td>${x.estAbsent(s.id, n) ? 'Abs.' : u.fmtNote(x.moyEval(s, n))}</td>`)}<td><b>${u.fmtNote(x.mga(s))}</b></td><td>${x.decision(s) || '—'}</td></tr></tbody></table>` : ''}
          <div style="margin-top:auto;display:grid;grid-template-columns:auto 1fr;gap:6mm;align-items:end">${AK.mise.verification(ctx.qrTexte, ctx.doc, r.qr.taille)}<div>${o.signatures(r, ctx)}</div></div>`)
      };
    }
  });

  /* ---------- Fiche d'inscription ---------- */
  def({
    id: 'fiche-inscription', version: 1, lib: 'Fiche d’inscription', categorie: 'eleve', sujet: 'eleve', icone: 'filePlus',
    description: 'Fiche remplie à l’inscription, avec engagement et signature du parent, et liste des pièces fournies.',
    emission: { type: 'FIN', politique: 'unique', cleUnique: (c) => `FIN|${c.eleve.id}|${anneeCle()}` },
    champsOptionnels: [['photo', 'Photo', true], ['pieces', 'Liste des pièces à fournir', true], ['engagement', 'Engagement du parent', true]],
    defauts: {
      titre: 'FICHE D’INSCRIPTION', champs: { photo: true, pieces: true, engagement: true },
      texte: 'Je soussigné(e), parent ou tuteur de l’élève **{eleve.nomComplet}**, certifie l’exactitude des renseignements ci-dessus et m’engage à respecter le règlement intérieur de l’établissement et à suivre la scolarité de mon enfant.',
      signatures: [{ role: 'Le parent / tuteur', nom: '' }, { role: 'Le Directeur', nom: '{directeur}', cachet: true }], qr: { actif: true, identite: false, taille: 18 }
    },
    rendu(ctx, r, o) {
      const s = ctx.eleve, x = X(), a = s.acte || {};
      const p = (l, q) => [l, q && (q.nom || q.prenoms) ? `${q.nom} ${q.prenoms}${q.profession ? ' · ' + q.profession : ''}${q.tel ? ' · ' + q.tel : ''}` : '……………………………………'];
      const pieces = [['Extrait d’acte de naissance', s.extrait], ['Photos d’identité', !!s.photo], ['Certificat de transfert (si venant d’une autre école)', s.classe === 'CP1' ? null : false], ['Carnet de vaccination', false]];
      return {
        contenu: colonne(html`${o.entete(r)}${o.titre(r.titre, `Année scolaire ${S().school.year} · inscription en ${s.classe}`)}${identite(s, r, [['Nationalité', u.capitale(s.nationalite)], ['Date d’inscription', u.fmtDate(s.inscritLe || s.entree)]])}
          ${s.extrait ? AK.mise.infos([['Acte de naissance n°', a.num], ['du', u.fmtDate(a.date)], ['Centre d’état civil', a.centre], ['Sous-préfecture', a.sp]]) : ''}
          <div class="doc-section">Parents et tuteur</div>${AK.mise.infos([p('Père', s.pere), p('Mère', s.mere), ['Tuteur / tutrice', s.parent ? `${s.parent}${s.tel ? ' · ' + s.tel : ''}` : '……………………………………'], ['Domicile', (s.pere && s.pere.domicile) || (s.mere && s.mere.domicile) || '……………………………………']], { une: true })}
          ${r.champs.pieces !== false ? html`<div class="doc-section">Pièces fournies</div><div class="doc-cases" style="display:grid;grid-template-columns:1fr 1fr;gap:1.6mm 6mm;font-size:9.4pt">${pieces.filter(([, v]) => v !== null).map(([l, v]) => html`<span class="doc-case"><i class="${v ? 'on' : ''}"></i> ${l}</span>`)}</div>` : ''}
          ${r.champs.engagement !== false ? html`<div class="doc-texte" style="font-size:10pt;margin:5mm 0 2mm">${o.rediger(r.texte, ctx)}</div>` : ''}
          <div style="margin-top:auto;display:grid;grid-template-columns:auto 1fr;gap:6mm;align-items:end">${AK.mise.verification(ctx.qrTexte, ctx.doc, r.qr.taille)}<div>${o.signatures(r, ctx)}</div></div>`)
      };
    }
  });
})(window.AK);

</script>
<script>
/* =====================================================================================
   Cartes d'identification scolaire (élèves) et cartes professionnelles (personnel).
   Hiérarchie : photographie → nom → matricule → QR code. Champs limités au strict nécessaire.
   QR : référence + nom et matricule (déjà imprimés), jamais la photo, le téléphone des
   parents, la santé ou l'acte de naissance.
   ===================================================================================== */
(function (AK) {
  'use strict';
  const u = AK.u, { html, raw } = u;
  const S = () => AK.store.etat;
  const X = () => AK.calc;

  const CARTE_DEFAUT = { format: 'id1', l: 85.6, h: 53.98, verso: true, eco: false, expiration: 'fin-annee', dateExpiration: '', bande: '#1f4e8c', filet: '#c7782f' };
  function valider(o) {
    const c = { ...CARTE_DEFAUT, ...(o.carte || {}) };
    c.format = AK.cartes.FORMATS[c.format] ? c.format : 'id1';
    c.l = Math.min(150, Math.max(40, Number(c.l) || 85.6));
    c.h = Math.min(150, Math.max(40, Number(c.h) || 53.98));
    c.verso = !!c.verso;
    c.eco = !!c.eco;
    c.expiration = ['fin-annee', 'date', 'aucune'].includes(c.expiration) ? c.expiration : 'fin-annee';
    c.dateExpiration = u.estISO(c.dateExpiration) ? c.dateExpiration : '';
    if (c.expiration === 'date' && !c.dateExpiration) throw new AK.ErreurMetier('Indiquez la date de fin de validité de la carte.', 'carte.dateExpiration');
    c.bande = /^#[0-9a-f]{6}$/i.test(c.bande) ? c.bande : CARTE_DEFAUT.bande;
    c.filet = /^#[0-9a-f]{6}$/i.test(c.filet) ? c.filet : CARTE_DEFAUT.filet;
    o.carte = c;
  }
  const logoEcole = () => {
    const sc = S().school;
    return sc.logoEcole && u.IMG_OK.test(sc.logoEcole) ? sc.logoEcole : sc.armoiries && u.IMG_OK.test(sc.armoiries) ? sc.armoiries : AK.assets.armoiries;
  };
  function enveloppe(ctx, r, type, corps, agent) {
    const f = AK.cartes.format(r), c = r.carte;
    const cls = `carte-id${agent ? ' agent' : ''}${f.classe ? ' ' + f.classe : ''}${c.eco ? ' eco' : ''}`;
    const statut = ctx._statut ? AK.filigrane.libelleStatut(ctx._statut) : '';
    return html`<div class="${cls}" style="--cw:${f.l}mm;--ch:${f.h}mm;--c-acc:${agent ? '#13233a' : c.bande};--c-acc2:${c.filet}">${AK.filigrane.calques(r.filigrane, ctx._statut, f.l, f.h)}
      <div class="bande"><img src="${logoEcole()}" alt=""><div class="ecole"><b>${S().school.name || 'ÉCOLE'}</b><span>${[S().school.iepp, S().school.drenaet].filter(Boolean).join(' · ')}</span></div><div class="type"><b>${type}</b><span>${S().school.year || ''}</span></div></div><div class="filet"></div>
      ${corps}${statut ? html`<div class="statut-carte">${statut}</div>` : ''}</div>`;
  }
  const photo = (p) => html`<div class="photo">${p.photo ? html`<img src="${p.photo}" alt="">` : raw('<span>PHOTO</span>')}</div>`;
  const qr = (ctx) => (ctx.qrTexte ? html`<div class="qr">${AK.qr.svg(ctx.qrTexte, { titre: 'QR code de la carte' })}</div><div class="ref">${ctx.ref}</div>` : '');
  const validite = (ctx) => (ctx.doc && ctx.doc.expire ? html`Valable jusqu’au <b>${u.fmtDate(ctx.doc.expire)}</b>` : html`Validité : <b>année ${S().school.year || ''}</b>`);
  function verso(ctx, r, titre, lignes, agent) {
    const f = AK.cartes.format(r), sc = S().school;
    return html`<div class="carte-id verso${agent ? ' agent' : ''}" style="--cw:${f.l}mm;--ch:${f.h}mm;--c-acc:${agent ? '#13233a' : r.carte.bande}">${AK.filigrane.calques({ type: 'logo', logo: 'ecole', opacite: 5, taille: 70 }, ctx._statut, f.l, f.h)}
      <div class="v-tete">${titre}</div><div class="v-texte">${lignes.map((l) => html`<p>${l}</p>`)}</div>
      <div class="v-pied"><span>${sc.name}${sc.adresse ? ' · ' + sc.adresse : ''}${sc.telephone ? ' · ' + sc.telephone : ''}</span><span>${ctx.ref || ''}</span></div></div>`;
  }

  AK.modeles.def({
    id: 'carte-eleve', version: 1, lib: 'Carte d’identité scolaire', categorie: 'carte', sujet: 'eleve', icone: 'idCard',
    description: 'Format carte bancaire (ID-1), portrait ou badge ; planche A4 de 10 cartes avec traits de coupe ou impression à l’unité.',
    emission: { type: 'CEL', politique: 'registre', expire: (ctx, r) => AK.cartes.expiration(r) },
    champsOptionnels: [['naissance', 'Date de naissance', true], ['sexe', 'Sexe', false], ['signature', 'Zone de signature du directeur', true]],
    defauts: {
      titre: 'Carte scolaire', champs: { naissance: true, sexe: false, signature: true },
      filigrane: { type: 'logo', opacite: 6, taille: 55 }, qr: { actif: true, identite: true, taille: 17 }, carte: { ...CARTE_DEFAUT },
      texte: 'Cette carte est personnelle. Elle doit être présentée à toute demande du personnel de l’école.\n\nEn cas de perte, prévenir la direction. Toute carte trouvée doit être rapportée à l’école.'
    },
    valider,
    rendu(ctx, r) {
      const s = ctx.eleve, x = X();
      ctx._statut = ctx._statutCarte;
      const corps = html`${photo(s)}<div class="infos"><div class="nom">${s.nom}</div><div class="prenoms">${s.prenoms}</div><dl><dt>Matricule</dt><dd class="mono">${x.matOf(s)}</dd><dt>Classe</dt><dd>${s.classe}</dd>${r.champs.naissance !== false ? html`<dt>Né(e) le</dt><dd>${s.ageEstime ? '—' : u.fmtDate(s.naissance)}</dd>` : ''}${r.champs.sexe ? html`<dt>Sexe</dt><dd>${s.sexe}</dd>` : ''}</dl></div>${qr(ctx)}
        <div class="pied"><span class="valid">${validite(ctx)}</span>${r.champs.signature !== false ? html`<span class="sig">Le Directeur</span>` : ''}</div>`;
      return {
        carte: enveloppe(ctx, r, 'Carte d’identité scolaire', corps, false),
        verso: r.carte.verso ? verso(ctx, r, 'Carte d’identité scolaire', String(r.texte || '').split(/\n{2,}/).filter(Boolean).concat(['Vérification : scanner le QR code avec AKWA SCHOOL (Vérifier un document).']), false) : null,
        format: AK.cartes.format(r)
      };
    }
  });

  AK.modeles.def({
    id: 'carte-agent', version: 1, lib: 'Carte professionnelle du personnel', categorie: 'carte', sujet: 'agent', icone: 'idCard',
    description: 'Enseignants et personnel administratif : nom, fonction, matricule, établissement, validité.',
    emission: { type: 'CPE', politique: 'registre', expire: (ctx, r) => AK.cartes.expiration(r) },
    champsOptionnels: [['emploi', 'Emploi / grade', true], ['classes', 'Classe(s) tenue(s)', false], ['signature', 'Zone de signature du directeur', true]],
    defauts: {
      titre: 'Carte professionnelle', champs: { emploi: true, classes: false, signature: true },
      filigrane: { type: 'logo', opacite: 6, taille: 55 }, qr: { actif: true, identite: true, taille: 17 }, carte: { ...CARTE_DEFAUT },
      texte: 'Cette carte est strictement personnelle et doit être restituée à la direction en cas de départ de l’établissement.\n\nEn cas de perte, prévenir immédiatement la direction.'
    },
    valider,
    rendu(ctx, r) {
      const t = ctx.agent, x = X();
      ctx._statut = ctx._statutCarte;
      const corps = html`${photo(t)}<div class="infos"><div class="nom">${AK.valid.civ.sans(t.nom)}</div><div class="prenoms">${t.fonction || ''}</div><dl><dt>Matricule</dt><dd class="mono">${t.matricule || '—'}</dd>${r.champs.emploi !== false && x.emploiGrade(t) ? html`<dt>Emploi</dt><dd>${x.emploiGrade(t)}</dd>` : ''}${r.champs.classes && x.clsTxt(t) ? html`<dt>Classe</dt><dd>${x.clsTxt(t)}</dd>` : ''}</dl></div>${qr(ctx)}
        <div class="pied"><span class="valid">${validite(ctx)}</span>${r.champs.signature !== false ? html`<span class="sig">Le Directeur</span>` : ''}</div>`;
      return {
        carte: enveloppe(ctx, r, 'Carte professionnelle', corps, true),
        verso: r.carte.verso ? verso(ctx, r, 'Carte professionnelle', String(r.texte || '').split(/\n{2,}/).filter(Boolean).concat(['Vérification : scanner le QR code avec AKWA SCHOOL (Vérifier un document).']), true) : null,
        format: AK.cartes.format(r)
      };
    }
  });
})(window.AK);
