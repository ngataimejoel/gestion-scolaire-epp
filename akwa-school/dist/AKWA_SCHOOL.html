</script>
<script>
/* =====================================================================================
   Import des élèves depuis Excel (.xls des exports nationaux, .xlsx) ou CSV, sans bibliothèque.
   Lecteurs repris d'AKWA SCHOOL 1.7.0 (format BIFF8 et archive OOXML), entourés de contrôles :
   taille maximale, lignes vides, doublons (base et fichier), aperçu ligne par ligne avant import.
   Rattachement de l'espace d'un enseignant seul à l'école.
   ===================================================================================== */
(function (AK) {
  'use strict';
  const C = AK.cfg, u = AK.u, V = AK.valid, X = AK.calc;
  const S = () => AK.store.etat;
  const E = (m) => new AK.ErreurMetier(m);
  const TAILLE_MAX = 15 * 1024 * 1024;

  function parseCSV(t) {
    t = t.replace(/^﻿/, '');
    const first = t.split(/\r?\n/)[0] || '';
    const sep = first.split(';').length >= first.split(',').length ? ';' : ',';
    const rows = [];
    let row = [], cur = '', q = false;
    for (let i = 0; i < t.length; i++) {
      const c = t[i];
      if (q) {
        if (c === '"') {
          if (t[i + 1] === '"') {
            cur += '"';
            i++;
          } else q = false;
        } else cur += c;
      } else if (c === '"') q = true;
      else if (c === sep) {
        row.push(cur);
        cur = '';
      } else if (c === '\n' || c === '\r') {
        if (c === '\r' && t[i + 1] === '\n') i++;
        row.push(cur);
        rows.push(row);
        row = [];
        cur = '';
      } else cur += c;
    }
    if (cur || row.length) {
      row.push(cur);
      rows.push(row);
    }
    return rows.filter((r) => r.some((x) => x.trim()));
  }

  /* Excel 97-2003 (.xls) : conteneur OLE2 puis enregistrements BIFF8 ; première feuille. */
  function lireXLS(buf) {
    const uu = new Uint8Array(buf), dv = new DataView(buf), u16 = (o) => dv.getUint16(o, true), u32 = (o) => dv.getUint32(o, true);
    if (u32(0) !== 0xe011cfd0) throw E('Ce fichier n’est pas un classeur .xls.');
    const ss = 1 << u16(30), mss = 1 << u16(32), nFat = u32(44), dir0 = u32(48), miniCut = u32(56), mfat0 = u32(60), difat0 = u32(68), nDifat = u32(72);
    const off = (s) => 512 + s * ss, difat = [];
    for (let i = 0; i < 109; i++) difat.push(u32(76 + i * 4));
    for (let d = difat0, k = 0; k < nDifat && d < 0xfffffffa; k++) {
      for (let i = 0; i < ss / 4 - 1; i++) difat.push(u32(off(d) + i * 4));
      d = u32(off(d) + ss - 4);
    }
    const fat = [];
    difat.slice(0, nFat).forEach((s) => {
      for (let i = 0; i < ss / 4; i++) fat.push(u32(off(s) + i * 4));
    });
    const chaine = (s, t) => {
      const r = [];
      for (let k = 0; s < 0xfffffffa && k < 1e6; k++) {
        r.push(s);
        s = t[s];
      }
      return r;
    };
    const gros = (s) => {
      const c = chaine(s, fat), o = new Uint8Array(c.length * ss);
      c.forEach((x, i) => o.set(uu.subarray(off(x), off(x) + ss), i * ss));
      return o;
    };
    const dirB = gros(dir0), dd = new DataView(dirB.buffer), ents = [];
    for (let p = 0; p + 128 <= dirB.length; p += 128) {
      const nl = dd.getUint16(p + 64, true);
      let n = '';
      for (let i = 0; i < nl / 2 - 1; i++) n += String.fromCharCode(dd.getUint16(p + i * 2, true));
      ents.push({ n, t: dirB[p + 66], s: dd.getUint32(p + 116, true), z: dd.getUint32(p + 120, true) });
    }
    const racine = ents[0], e = ents.find((x) => x.n === 'Workbook' || x.n === 'Book');
    if (!e) throw E('Classeur introuvable dans ce fichier .xls.');
    let wb;
    if (e.z < miniCut) {
      const ms = gros(racine.s), mfat = [];
      chaine(mfat0, fat).forEach((s) => {
        for (let i = 0; i < ss / 4; i++) mfat.push(u32(off(s) + i * 4));
      });
      const c = chaine(e.s, mfat);
      wb = new Uint8Array(c.length * mss);
      c.forEach((x, i) => wb.set(ms.subarray(x * mss, x * mss + mss), i * mss));
    } else wb = gros(e.s);
    wb = wb.subarray(0, e.z);
    const w = new DataView(wb.buffer, wb.byteOffset, wb.byteLength), w16 = (o) => w.getUint16(o, true);
    const recs = [];
    for (let p = 0; p + 4 <= wb.length;) {
      const t = w16(p), l = w16(p + 2);
      recs.push({ t, p: p + 4, l });
      p += 4 + l;
    }
    const sst = [], rows = [];
    let feuille = -1;
    const rk = (v) => {
      const x = v & 2 ? v >> 2 : (() => {
        const b = new DataView(new ArrayBuffer(8));
        b.setUint32(4, v & 0xfffffffc, true);
        return b.getFloat64(0, true);
      })();
      return v & 1 ? x / 100 : x;
    };
    const put = (r, c, v) => ((rows[r] || (rows[r] = []))[c] = v);
    const num = (x) => String(Math.round(x * 1e6) / 1e6);
    for (let i = 0; i < recs.length; i++) {
      const R = recs[i];
      if (R.t === 0x0809) {
        feuille++;
        if (feuille > 1) break;
        continue;
      }
      if (R.t === 0x00fc) {
        const parts = [R];
        for (let j = i + 1; j < recs.length && recs[j].t === 0x003c; j++) parts.push(recs[j]);
        let pi = 0, p = R.p + 8, fin = R.p + R.l;
        const n = w.getUint32(R.p + 4, true);
        const besoin = (k) => {
          if (p + k > fin && pi < parts.length - 1) {
            pi++;
            p = parts[pi].p;
            fin = p + parts[pi].l;
          }
        };
        for (let k = 0; k < n; k++) {
          besoin(3);
          const cch = w16(p);
          let fl = wb[p + 2];
          p += 3;
          let rt = 0, sz = 0;
          if (fl & 8) {
            rt = w16(p);
            p += 2;
          }
          if (fl & 4) {
            sz = w.getUint32(p, true);
            p += 4;
          }
          let s = '', reste = cch;
          while (reste > 0) {
            if (p >= fin) {
              pi++;
              p = parts[pi].p;
              fin = p + parts[pi].l;
              fl = wb[p];
              p++;
            }
            const large = fl & 1, peut = Math.min(reste, Math.floor((fin - p) / (large ? 2 : 1)));
            for (let q = 0; q < peut; q++) {
              s += String.fromCharCode(large ? w16(p) : wb[p]);
              p += large ? 2 : 1;
            }
            reste -= peut;
          }
          let saut = rt * 4 + sz;
          while (saut > 0) {
            if (p >= fin) {
              pi++;
              p = parts[pi].p;
              fin = p + parts[pi].l;
            }
            const t = Math.min(saut, fin - p);
            p += t;
            saut -= t;
          }
          sst.push(s);
        }
        continue;
      }
      if (feuille < 1) continue;
      if (R.t === 0x00fd) put(w16(R.p), w16(R.p + 2), sst[w.getUint32(R.p + 6, true)]);
      else if (R.t === 0x0203) put(w16(R.p), w16(R.p + 2), num(w.getFloat64(R.p + 6, true)));
      else if (R.t === 0x027e) put(w16(R.p), w16(R.p + 2), num(rk(w.getUint32(R.p + 6, true))));
      else if (R.t === 0x00bd) {
        const r = w16(R.p), c0 = w16(R.p + 2), n = (R.l - 6) / 6;
        for (let k = 0; k < n; k++) put(r, c0 + k, num(rk(w.getUint32(R.p + 4 + k * 6 + 2, true))));
      } else if (R.t === 0x0204) {
        const r = w16(R.p), c = w16(R.p + 2), n = w16(R.p + 6), large = wb[R.p + 8] & 1;
        let s = '';
        for (let k = 0; k < n; k++) s += String.fromCharCode(large ? w16(R.p + 9 + k * 2) : wb[R.p + 9 + k]);
        put(r, c, s);
      } else if (R.t === 0x0006) {
        const r = w16(R.p), c = w16(R.p + 2);
        if (w16(R.p + 12) !== 0xffff) put(r, c, num(w.getFloat64(R.p + 6, true)));
        else if (wb[R.p + 6] === 0 && recs[i + 1] && recs[i + 1].t === 0x0207) {
          const S2 = recs[i + 1], n = w16(S2.p), large = wb[S2.p + 2] & 1;
          let s = '';
          for (let k = 0; k < n; k++) s += String.fromCharCode(large ? w16(S2.p + 3 + k * 2) : wb[S2.p + 3 + k]);
          put(r, c, s);
        }
      }
    }
    return Array.from(rows, (r) => Array.from(r || [], (v) => (v == null ? '' : String(v))));
  }

  /* Excel 2007+ (.xlsx) : archive ZIP ; décompression par le navigateur (DecompressionStream). */
  async function lireXLSX(buf) {
    const uu = new Uint8Array(buf), dv = new DataView(buf);
    let e = uu.length - 22;
    while (e > 0 && dv.getUint32(e, true) !== 0x06054b50) e--;
    if (e <= 0) throw E('Archive .xlsx illisible.');
    const n = dv.getUint16(e + 10, true);
    let p = dv.getUint32(e + 16, true);
    const fichiers = {};
    for (let k = 0; k < n; k++) {
      const m = dv.getUint16(p + 10, true), cs = dv.getUint32(p + 20, true), nl = dv.getUint16(p + 28, true), xl = dv.getUint16(p + 30, true), cl = dv.getUint16(p + 32, true), lo = dv.getUint32(p + 42, true);
      fichiers[new TextDecoder().decode(uu.subarray(p + 46, p + 46 + nl))] = { m, cs, lo };
      p += 46 + nl + xl + cl;
    }
    const lire = async (nom) => {
      const f = fichiers[nom];
      if (!f) return '';
      const q = f.lo, d = q + 30 + dv.getUint16(q + 26, true) + dv.getUint16(q + 28, true), brut = uu.subarray(d, d + f.cs);
      if (f.m === 0) return new TextDecoder().decode(brut);
      if (typeof DecompressionStream !== 'function') throw E('Ce navigateur ne sait pas ouvrir les .xlsx : enregistrez le fichier en .xls ou .csv.');
      return new Response(new Blob([brut]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text();
    };
    const X2 = (s) => new DOMParser().parseFromString(s, 'application/xml');
    const sst = [...X2((await lire('xl/sharedStrings.xml')) || '<a/>').getElementsByTagName('si')].map((si) => [...si.getElementsByTagName('t')].map((t) => t.textContent).join(''));
    const feuille = Object.keys(fichiers).filter((k) => /^xl\/worksheets\/sheet\d+\.xml$/.test(k)).sort((a, b) => parseInt(a.match(/\d+/), 10) - parseInt(b.match(/\d+/), 10))[0];
    if (!feuille) throw E('Aucune feuille dans ce classeur.');
    const rows = [];
    [...X2(await lire(feuille)).getElementsByTagName('c')].forEach((c) => {
      const ref = c.getAttribute('r'), m = ref && ref.match(/^([A-Z]+)(\d+)$/);
      if (!m) return;
      const col = [...m[1]].reduce((a, ch) => a * 26 + ch.charCodeAt(0) - 64, 0) - 1, row = +m[2] - 1, t = c.getAttribute('t');
      const vEl = c.getElementsByTagName('v')[0], v = vEl ? vEl.textContent : '';
      const val = t === 's' ? sst[+v] : t === 'inlineStr' ? [...c.getElementsByTagName('t')].map((x) => x.textContent).join('') : v;
      (rows[row] || (rows[row] = []))[col] = val;
    });
    return Array.from(rows, (r) => Array.from(r || [], (v) => (v == null ? '' : String(v))));
  }

  async function lireTableur(f) {
    if (f.size > TAILLE_MAX) throw E('Fichier trop volumineux (15 Mo au maximum).');
    const buf = await f.arrayBuffer(), t = new Uint8Array(buf.slice(0, 4));
    if (t[0] === 0xd0 && t[1] === 0xcf) return lireXLS(buf);
    if (t[0] === 0x50 && t[1] === 0x4b) return lireXLSX(buf);
    let s = new TextDecoder('utf-8').decode(buf);
    if (s.includes('�')) s = new TextDecoder('windows-1252').decode(buf);
    return parseCSV(s);
  }

  const vide0 = (v) => {
    v = String(v || '').trim();
    return /^(aucun|neant|néant|0)$/i.test(v) ? '' : v;
  };
  const coupeNom = (v) => {
    const p = vide0(v).split(/\s+/).filter(Boolean);
    return { nom: p[0] || '', prenoms: p.slice(1).join(' ') };
  };

  /** Analyse des lignes : chaque ligne devient { s, etat: 'ok'|'doublon'|'erreur', motif, ligne }. */
  function analyser(rows) {
    if (typeof rows === 'string') rows = parseCSV(rows);
    rows = rows.filter((r) => r.some((x) => String(x).trim()));
    if (rows.length < 2) return { erreur: 'Fichier vide ou sans ligne de données.' };
    if (rows.length > 5001) return { erreur: 'Plus de 5 000 lignes : découpez le fichier.' };
    const H = rows[0].map(u.norm), ix = (...n) => H.findIndex((h) => n.includes(h));
    const c = {
      nom: ix('nom'), pre: ix('prenoms', 'prenom'), cl: ix('niveau', 'classe'), sx: ix('sexe', 'genre'), na: ix('naissance', 'datedenaissance'),
      j: ix('jour'), m: ix('mois'), y: ix('annee'), mat: ix('matricule'), pa: ix('parent', 'tuteur', 'nomduparent'), tel: ix('telephone', 'tel'),
      ex: ix('extrait', 'dossier'), an: ix('nacte', 'actenum', 'numeroacte', 'ndelacte'), ad: ix('actedate', 'datedelacte'), ac: ix('lieuacte', 'centreetatcivil', 'centre'),
      nat: ix('nationalite'), lo: ix('localite', 'lieu', 'lieudenaissance'), sp: ix('sp', 'sousprefecture'), pe: ix('pere'), me: ix('mere'), re: ix('residence', 'domicile')
    };
    if (c.nom < 0 || c.pre < 0 || c.cl < 0 || c.sx < 0) return { erreur: 'Colonnes obligatoires manquantes : nom, prenoms, niveau (ou classe), sexe.' };
    const g = (r, k) => (c[k] >= 0 ? String(r[c[k]] ?? '') : '').trim();
    const mats = new Set(S().students.flatMap((o) => [u.norm(o.mat), u.norm(o.matNat)]).filter(Boolean)), vus = new Set();
    const niveaux = X.niveaux();
    return {
      items: rows.slice(1).map((r, i) => {
        const cl = g(r, 'cl').toUpperCase().replace(/\s/g, ''), sx = u.norm(g(r, 'sx'));
        const sexe = ['m', 'masculin', 'garcon', 'g', 'h', 'homme'].includes(sx) ? 'Masculin' : ['f', 'feminin', 'fille'].includes(sx) ? 'Féminin' : '';
        const na = c.y >= 0 && g(r, 'y') ? u.versISO(`${g(r, 'j')}/${g(r, 'm')}/${g(r, 'y')}`) : u.versISO(g(r, 'na'));
        const num = vide0(g(r, 'an')), exv = u.norm(g(r, 'ex')), ex = c.ex >= 0 && exv ? ['oui', '1', 'true', 'complet', 'x'].includes(exv) : !!num;
        const pe = coupeNom(g(r, 'pe')), me = coupeNom(g(r, 'me')), dom = vide0(g(r, 're'));
        const natRef = AK.ref.NATIONALITES.find((x) => u.norm(x[1]) === u.norm(g(r, 'nat')));
        const s = AK.schema.completerEleve({
          id: u.uid(), nom: u.majNom(g(r, 'nom')), prenoms: u.majPrenoms(g(r, 'pre')), classe: cl, sexe, naissance: na, ageEstime: false,
          matNat: g(r, 'mat').replace(/\s/g, '').toUpperCase(), lieu: vide0(g(r, 'lo')), nationalite: natRef ? natRef[1] : g(r, 'nat').toUpperCase() || C.NAT_DEFAUT,
          redoublant: false, mat: '', parent: g(r, 'pa'), tel: V.telPropre(g(r, 'tel')), extrait: ex,
          acte: { num, date: u.versISO(g(r, 'ad')), centre: vide0(g(r, 'ac')), sp: vide0(g(r, 'sp')) },
          pere: { nom: u.majNom(pe.nom), prenoms: u.majPrenoms(pe.prenoms), profession: '', tel: '', domicile: dom },
          mere: { nom: u.majNom(me.nom), prenoms: u.majPrenoms(me.prenoms), profession: '', tel: '', domicile: dom },
          statut: 'Inscrit', photo: '', decision: '', entree: '', inscritLe: u.aujourdhui()
        });
        let etat = 'ok', motif = '';
        const km = u.norm(s.matNat);
        if (!s.nom || !s.prenoms) [etat, motif] = ['erreur', 'nom ou prénoms manquant'];
        else if (V.nom(s.nom, 'Nom', 1) || V.nom(s.prenoms, 'Prénoms', 1)) [etat, motif] = ['erreur', 'nom ou prénoms illisible'];
        else if (!niveaux.includes(cl)) [etat, motif] = ['erreur', cl ? `classe ${cl} non ouverte` : 'classe manquante'];
        else if (!sexe) [etat, motif] = ['erreur', 'sexe illisible'];
        else if (s.matNat && V.matNat(s.matNat)) [etat, motif] = ['erreur', 'matricule national invalide'];
        else if (!AK.perm.peut('eleve.importer', { classe: cl })) [etat, motif] = ['erreur', 'classe hors de votre espace'];
        else if (km && mats.has(km)) [etat, motif] = ['doublon', 'matricule déjà présent'];
        else if (km && vus.has(km)) [etat, motif] = ['doublon', 'matricule en double dans le fichier'];
        else if (S().students.some((o) => u.norm(o.nom + o.prenoms) === u.norm(s.nom + s.prenoms) && (!s.naissance || o.naissance === s.naissance))) [etat, motif] = ['doublon', 'déjà inscrit'];
        if (!na && etat === 'ok') motif = 'date de naissance absente';
        if (km) vus.add(km);
        return { s, etat, motif, ligne: i + 2 };
      })
    };
  }

  const imports = {
    parseCSV, lireXLS, lireXLSX, lireTableur, analyser,
    async importer(analyse) {
      AK.perm.exiger('eleve.importer');
      const ok = analyse.items.filter((i) => i.etat === 'ok');
      if (!ok.length) throw E('Aucune ligne à importer.');
      await AK.store.copieAvant('avant-import');
      AK.store.modifier(`Import Excel : ${u.pluriel(ok.length, 'élève')}`, (st) => {
        ok.forEach((i) => {
          if (!i.s.mat) {
            i.s.mat = AK.eleves.prochainMatricule();
          }
          st.students.push(i.s);
        });
      }, { categorie: 'eleves' });
      return ok.length;
    },
    /** Le directeur rattache à l'école la sauvegarde d'un espace enseignant seul. */
    async rattacher(o) {
      AK.perm.exiger('donnees.rattacher');
      const src = AK.schema.assainir(o && o.donnees ? o.donnees : o);
      const m = src && src.school && src.school.solo && Array.isArray(src.students) && (src.teachers || []).find((z) => z.id === src.school.solo.tid);
      if (!m || !X.clsDe(m).length) throw E('Ce fichier n’est pas la sauvegarde d’un espace enseignant.');
      if (S().school.solo) throw E('Le rattachement se fait dans l’espace du directeur de l’école.');
      const classes = X.clsDe(m).filter((c) => X.niveaux().includes(c));
      if (!classes.length) throw E(`Les classes de cet espace (${X.clsTxt(m)}) ne sont pas ouvertes dans l’école.`);
      await AK.store.copieAvant('avant-rattachement');
      let nE = 0, nN = 0;
      AK.store.modifier(`Espace enseignant rattaché : ${m.nom} (${classes.join(', ')})`, (st) => {
        let ens = st.teachers.find((z) => u.norm(V.civ.sans(z.nom)) === u.norm(V.civ.sans(m.nom)));
        if (!ens) {
          ens = AK.schema.completerAgent({ ...m, id: u.uid(), compte: null, actif: true });
          st.teachers.push(ens);
        }
        st.teachers.forEach((z) => {
          if (z !== ens && X.clsDe(z).some((c) => classes.includes(c))) AK.personnel.poserClasses(z, X.clsDe(z).filter((k) => !classes.includes(k)));
        });
        AK.personnel.poserClasses(ens, [...X.clsDe(ens), ...classes]);
        const ids = {};
        src.students.forEach((s0) => {
          const s = AK.schema.completerEleve(s0);
          const k = st.students.find((z) => (s.matNat && z.matNat === s.matNat) || (u.norm(X.nomComplet(z)) === u.norm(X.nomComplet(s)) && z.classe === s.classe));
          if (k) ids[s.id] = k.id;
          else {
            const n = { ...s, id: u.uid(), mat: AK.eleves.prochainMatricule() };
            st.students.push(n);
            ids[s.id] = n.id;
            nE++;
          }
        });
        const cle = (k) => {
          const [a, ...r] = k.split('|');
          return ids[a] ? [ids[a], ...r].join('|') : null;
        };
        Object.entries(src.grades || {}).forEach(([k, v]) => {
          const n = cle(k);
          if (n && st.grades[n] == null && typeof v === 'number') {
            st.grades[n] = v;
            nN++;
          }
        });
        Object.keys(src.compAbs || {}).forEach((k) => {
          const n = cle(k);
          if (n) st.compAbs[n] = true;
        });
        Object.entries(src.att || {}).forEach(([d, L]) => Object.entries(L || {}).forEach(([id, v]) => {
          if (ids[id]) {
            const j = st.att[d] || (st.att[d] = {});
            if (j[ids[id]] == null) j[ids[id]] = v;
          }
        }));
        Object.entries(src.appel || {}).forEach(([d, L]) => classes.forEach((c) => {
          if (L && L[c]) (st.appel[d] || (st.appel[d] = {}))[c] = true;
        }));
        (src.auth || []).forEach((a) => {
          const pid = a.qui === 'eleve' ? ids[a.pid] : a.pid === m.id ? ens.id : '';
          if (!pid || st.auth.some((z) => z.id === a.id)) return;
          const n = st.auth.reduce((k, z) => Math.max(k, parseInt(String(z.ref).split('-').pop(), 10) || 0), 0) + 1;
          st.auth.push({ ...a, pid, ref: `AUT-${X.anneeRentree()}-${u.pad(n, 3)}` });
        });
        classes.forEach((c) => {
          if (src.cpMat && src.cpMat[c] && !st.cpMat[c]) st.cpMat[c] = src.cpMat[c];
        });
        st.cpExtra = [...new Set([...(st.cpExtra || []), ...(src.cpExtra || [])])];
      }, { categorie: 'donnees' });
      return { nom: m.nom, eleves: nE, notes: nN };
    }
  };
  AK.imports = imports;
})(window.AK);

<script>
/* =====================================================================================
   École de démonstration (fictive) pour découvrir l'application.
   Toutes les données sont inventées ; les documents imprimés en démonstration portent
   le filigrane SPÉCIMEN et ne sont pas inscrits comme documents officiels valides.
   ===================================================================================== */
(function (AK) {
  'use strict';
  const C = AK.cfg, u = AK.u;
  const DEMO_MDP = 'Demo2026';
  const DEMO_MDP_ENS = 'Classe2026';

  /** Notes fictives : remplit les évaluations demandées (laisse quelques trous si « trous »). */
  function genNotes(S, evals, trous) {
    const X = AK.calc;
    S.students.forEach((s, i) => {
      if (s.statut !== 'Inscrit') return;
      const b = (((i * 29) % 9) - 4) / 22;
      evals.forEach((n) =>
        X.matieres(s.classe, n).forEach(([m, w], k) => {
          if (trous && i % 11 === 4 && k >= 2) return;
          const key = `${s.id}|${n}|${m}`;
          if (S.grades[key] != null) return;
          const r = Math.max(0.12, Math.min(0.97, 0.56 + b + ((((k * 7 + i * 3 + n * 5) % 7) - 3) / 22)));
          S.grades[key] = Math.round(r * X.noteMax(s.classe, w) * 2) / 2;
        })
      );
    });
  }

  function creer() {
    const S = AK.schema.vierge();
    const auj = u.aujourdhui();
    const an = new Date().getMonth() < 7 ? new Date().getFullYear() - 1 : new Date().getFullYear();
    S.meta.demo = true;
    Object.assign(S.school, {
      localite: 'OUANINOU', sp: 'Ouaninou', name: 'EPP OUANINOU 2 (DÉMONSTRATION)', iepp: 'IEPP OUANINOU', drenaet: 'DRENAET DE TOUBA',
      director: 'M. OUATTARA Siaka', dirTel: '+225 07 00 00 00 01', codedren: '35', codeiep: '000251', codeecole: 'E000000',
      direction: C.ENTETE.direction + ' DE TOUBA', inspection: C.ENTETE.inspection + ' DE OUANINOU',
      year: `${an}–${an + 1}`, evalCourante: 1, adresse: 'BP 12 Ouaninou', telephone: '+225 07 00 00 00 01'
    });
    AK.store.installer(S); // les calculs ci-dessous lisent l'état courant
    S.conges = [
      [`${an}-11-01`, '', 'Toussaint'], [`${an}-11-15`, '', 'Journée nationale de la paix'], [`${an}-12-19`, `${an + 1}-01-04`, 'Congés de Noël'],
      [`${an + 1}-02-13`, `${an + 1}-02-21`, 'Congés de février'], [`${an + 1}-04-03`, `${an + 1}-04-11`, 'Congés de Pâques'], [`${an + 1}-05-01`, '', 'Fête du Travail']
    ].map(([du, au, lib]) => ({ id: u.uid(), du, au, lib: lib + ' (date d’exemple)' }));
    const N = ['KOUASSI', 'TRAORE', 'YAO', 'KONE', 'BAMBA', 'DIALLO', 'N’GUESSAN', 'TOURE', 'KOFFI', 'OUATTARA', 'KOUAME', 'COULIBALY', 'SORO', 'TANO', 'AKA', 'GNAGNE', 'ZADI', 'FOFANA', 'KONAN', 'SYLLA', 'DOUMBIA', 'ASSI', 'BROU', 'DAGO'];
    const M = ['Mamadou', 'Jean-Baptiste', 'Ismaël', 'Arnaud', 'Emmanuel', 'Yacouba', 'Kouadio', 'Serge', 'Ibrahim', 'Cédric', 'Abdoulaye', 'Franck', 'Lassina', 'Éric', 'Moussa', 'Désiré', 'Hervé', 'Sékou', 'Patrick', 'Konan', 'Ali', 'Wilfried'];
    const F = ['Aya Mireille', 'Aminata', 'Fatou', 'Aïcha', 'Mariame', 'Adjoua', 'Nathalie', 'Rokia', 'Esther', 'Affoué', 'Salimata', 'Grâce', 'Priscilla', 'Awa', 'Linda', 'Bintou'];
    const mix = [[5, 4], [5, 3], [4, 4], [4, 4], [6, 2], [5, 3]];
    const sansExtrait = [2, 11, 19, 30, 41], depart = { 8: 'Abandon', 27: 'Transféré' }, ages = { 6: 2, 15: 3, 33: 3 }, etr = [13, 35];
    const LIEUX = ['Ouaninou', 'Touba', 'Man', 'Séguéla', 'Koonan'];
    let n = 0, mi = 0, fi = 0;
    C.TOUS_NIVEAUX.forEach((c, ci) => {
      [...Array(mix[ci][0]).fill('Masculin'), ...Array(mix[ci][1]).fill('Féminin')].forEach((sexe) => {
        const by = an - C.AGE_NORMAL[c] - (ages[n] || 0) - (n % 4 === 3 ? 1 : 0);
        const nais = `${by}-${u.pad(((n * 5) % 12) + 1)}-${u.pad(((n * 7) % 27) + 1)}`, lieu = LIEUX[n % 5], ex = !sansExtrait.includes(n);
        const nom = N[(n * 5 + 3) % N.length];
        S.students.push(AK.schema.completerEleve({
          id: u.uid(), nom, prenoms: sexe === 'Masculin' ? M[mi++ % M.length] : F[fi++ % F.length], mat: 'AK-' + String(an).slice(2) + u.pad(n + 1, 3),
          matNat: ex ? `${u.pad(10000000 + n * 7919, 8)}${'ABCDEFGHJK'[n % 10]}` : '', classe: c, sexe, naissance: ex ? nais : `${by}-01-01`, ageEstime: !ex, lieu,

<script>
/* =====================================================================================
   Sauvegarde et restauration.

   Stratégie (voir docs/GUIDE.md) :
     1. enregistrement continu dans le navigateur (IndexedDB) ;
     2. copie de sécurité locale automatique chaque jour + avant chaque opération à risque ;
     3. sauvegarde manuelle sur clé USB (fichier .akwa.json) avec empreinte SHA-256 ;
     4. vérification d'un fichier de sauvegarde avant toute restauration ;
     5. restauration avec aperçu, mot de passe, copie préalable de l'état actuel.
   Le fichier contient les empreintes des mots de passe et la clé de signature CHIFFRÉE,
   jamais un mot de passe ni une clé privée en clair.
   ===================================================================================== */
(function (AK) {
  'use strict';
  const u = AK.u, X = () => AK.calc;
  const S = () => AK.store.etat;
  const E = (m) => new AK.ErreurMetier(m);
  const FORMAT = 'akwa-school-sauvegarde';

  const sansTransitoire = (o) => JSON.parse(JSON.stringify(o, function (k, v) {
    return this === o && k.startsWith('_') ? undefined : v;
  }));
  function resume(d) {
    const imgs = new Set();
    JSON.stringify(d, (k, v) => {
      if (typeof v === 'string' && v.startsWith('data:image/')) imgs.add(u.empreinte(v));
      return v;
    });
    return {
      eleves: (d.students || []).length,
      inscrits: (d.students || []).filter((s) => s.statut === 'Inscrit').length,
      personnel: (d.teachers || []).length,
      notes: Object.keys(d.grades || {}).length,
      documents: ((d.docs && d.docs.items) || []).length,
      images: imgs.size
    };
  }

  const sauvegarde = {
    FORMAT,
    /** Construit le fichier de sauvegarde complet (texte JSON). */
    async construire() {
      AK.perm.exiger('donnees.sauvegarder');
      const donnees = sansTransitoire(S());
      const texte = JSON.stringify(donnees);
      const h = AK.crypto.dispo() ? AK.crypto.hex(await AK.crypto.sha256(texte)) : null;
      const env = {
        format: FORMAT, version: 2, application: AK.NOM + ' ' + AK.VERSION, schema: donnees.meta.schema,
        creeLe: new Date().toISOString(), installId: donnees.meta.installId,
        ecole: { nom: donnees.school.name, annee: donnees.school.year },
        contenu: resume(donnees),
        empreinte: h ? { algo: 'SHA-256', valeur: h } : null,
        donnees
      };
      return JSON.stringify(env);
    },
    nomFichier() {
      const n = u.norm(S().school.name || 'ecole').slice(0, 24) || 'ecole';
      const d = new Date();
      return `akwa-school-${n}-${u.iso(d)}-${u.pad(d.getHours())}h${u.pad(d.getMinutes())}.akwa.json`;
    },
    /** Sauvegarde manuelle : fichier à enregistrer sur clé USB. */
    async exporter() {
      const texte = await sauvegarde.construire();
      const nom = sauvegarde.nomFichier();
      const ou = await AK.hote.fichier(nom, new Blob([texte], { type: 'application/json' }), 'application/json');
      if (ou === '' || ou == null) return null; // annulé par l'utilisateur (application de bureau)
      AK.store.modifier('Sauvegarde complète exportée', (s) => (s.lastBackup = u.aujourdhui()));
      return { nom, octets: texte.length };
    },
    /**
     * Lit et vérifie un fichier de sauvegarde, SANS rien modifier.
     * Renvoie { type, valide, integrite: 'ok'|'absente'|'alteree', etat, notes, infos }.
     */
    async analyser(texte) {
      let o;
      try {
        o = JSON.parse(texte);
      } catch (e) {
        throw E('Ce fichier n’est pas une sauvegarde AKWA SCHOOL (contenu illisible ou incomplet).');
      }
      let donnees, integrite = 'absente', infos = {}, type;
      if (o && o.format === FORMAT) {
        type = 'akwa2';
        donnees = o.donnees;
        infos = { creeLe: o.creeLe, application: o.application, ecole: o.ecole, contenu: o.contenu };
        if (o.empreinte && o.empreinte.algo === 'SHA-256' && AK.crypto.dispo()) {
          const h = AK.crypto.hex(await AK.crypto.sha256(JSON.stringify(donnees)));
          integrite = h === o.empreinte.valeur ? 'ok' : 'alteree';
        }
      } else if (o && o.v === 5 && Array.isArray(o.students)) {
        type = 'akwa1';
        donnees = o;
        infos = { application: 'AKWA SCHOOL 1.x', ecole: { nom: o.school && o.school.name, annee: o.school && o.school.year } };
      } else if (o && o.format && /transmission/.test(o.format)) {
        throw E('Ce fichier est une transmission à l’IEPP, pas une sauvegarde.');
      } else throw E('Ce fichier n’est pas une sauvegarde AKWA SCHOOL.');
      if (integrite === 'alteree') return { type, valide: false, integrite, infos, notes: ['L’empreinte SHA-256 ne correspond pas : le fichier a été modifié ou est incomplet. Il ne sera pas restauré.'] };
      const { etat, notes } = AK.schema.migrer(donnees);
      const pb = AK.schema.verifier(etat).filter((p) => p.gravite === 'erreur');
      return { type, valide: true, integrite, infos: { ...infos, contenu: resume(etat) }, etat, notes, problemes: pb };
    },
    /** Remplace les données actuelles par une sauvegarde analysée (après confirmation de l'écran). */
    async restaurer(analyse, motif = 'Sauvegarde restaurée') {
      AK.perm.exiger('donnees.restaurer');
      if (!analyse || !analyse.valide) throw E('Sauvegarde non valide : restauration refusée.');
      await AK.store.copieAvant('avant-restauration');
      const etat = analyse.etat;
      await AK.auth.migrerSecrets(etat);
      if (AK.hote.type === 'bureau') etat.securite = S().securite; // comptes gérés par l'application Windows
      etat.meta.restaureLe = new Date().toISOString();
      AK.store.installer(etat);
      AK.store.journaliser(`${motif} (${analyse.infos && analyse.infos.creeLe ? 'fichier du ' + u.fmtHorodatage(analyse.infos.creeLe) : 'fichier 1.x'})`);
      await AK.store.maintenant();
      AK.cles.oublier();
      return true;
    },
    /** Copies de sécurité locales (navigateur) */
    copies: () => (AK.stockage.actif ? AK.stockage.actif.listeCopies() : Promise.resolve([])),
    async analyserCopie(id) {
      const etat = await AK.stockage.actif.lireCopie(id);
      const r = AK.schema.migrer(etat);
      return { type: 'copie', valide: true, integrite: 'locale', infos: { contenu: resume(r.etat), ecole: { nom: r.etat.school.name, annee: r.etat.school.year } }, etat: r.etat, notes: r.notes, problemes: [] };
    },
    /** Export au format AKWA SCHOOL 1.x (sans secret ni rubrique nouvelle) pour les applications existantes. */
    async exporter1x() {
      AK.perm.exiger('donnees.exporter');
      const d = sansTransitoire(S());
      ['meta', 'securite', 'docs', 'modeles', 'cles', 'corbeille'].forEach((k) => delete d[k]);
      d.v = 5;
      const nom = `akwa-school-format-1x-${u.aujourdhui()}.json`;
      await AK.hote.fichier(nom, new Blob([JSON.stringify(d)], { type: 'application/json' }), 'application/json');
      AK.store.journaliser('Export au format AKWA SCHOOL 1.x');
      return nom;
    },
    /* ---------- Exports CSV (Excel) ---------- */
    async csv(nom, lignes, libelle) {
      AK.perm.exiger('donnees.exporter');
      await AK.hote.fichier(nom, u.csv(lignes), 'text/csv');
      if (libelle) AK.store.journaliser('Export : ' + libelle);
    },
    lignesEleves() {
      const sc = S().school, x = X();
      const d = (v) => (v ? v.split('-') : ['', '', '']);
      return [AK.cfg.COLS_ELEVES, ...x.actifs().slice().sort(x.parClasse).map((s) => {
        const [y, m, j] = d(s.naissance), sp = s.acte && s.acte.sp ? String(s.acte.sp).replace(/^\s*sous[-\s]?pr[ée]fecture\s+(de\s+|d['’]\s*)?/i, '').toUpperCase() : '';
        const nom = (p) => `${(p && p.nom) || ''} ${(p && p.prenoms) || ''}`.trim();
        const code = (AK.ref.SOUS_PREFECTURES.find((z) => u.norm(z[1]) === u.norm(sp)) || [''])[0];
        return [sc.codedren, sc.codeiep, String(sc.iepp || '').replace(/^IEPP\s+/i, ''), sc.codeecole, sc.name, s.matNat || s.mat, s.nom, s.prenoms, s.sexe === 'Masculin' ? 'MASCULIN' : 'FEMININ',
          s.ageEstime ? '' : j ? String(+j) : '', s.ageEstime ? '' : m ? String(+m) : '', y || '', s.nationalite || AK.cfg.NAT_DEFAUT, (s.lieu || '').toUpperCase(), code, sp,
          nom(s.pere).toUpperCase(), nom(s.mere).toUpperCase(), s.extrait && s.acte && s.acte.num ? s.acte.num : '0', ((s.extrait && s.acte && s.acte.centre) || '').toUpperCase(), (s.pere && s.pere.domicile) || (s.mere && s.mere.domicile) || '', s.classe];
      })];
    }
  };
  AK.sauvegarde = sauvegarde;
})(window.AK);

</script>
<script>
/* =====================================================================================
   Délégation des événements : les éléments déclarent leur action dans le HTML
     data-action="nom"   (clic)      data-change="nom"   (changement)
     data-input="nom"    (frappe)    data-submit="nom"   (formulaire hors fenêtre)
   Chaque écran enregistre ses actions avec AK.actions.def({ nom: f }).
   Les erreurs métier sont affichées à l'utilisateur ; les autres sont journalisées.
   ===================================================================================== */
(function (AK) {
  'use strict';
  const registre = { clic: new Map(), change: new Map(), saisie: new Map(), envoi: new Map() };

  async function executer(f, el, e, nom) {
    try {
      await f(el, e);
    } catch (err) {
      AK.ui.erreur(err, nom);
    }
  }
  function def(table, actions) {
    Object.entries(actions).forEach(([k, f]) => {
      if (table.has(k)) AK.diag.avert('Action redéfinie : ' + k);
      table.set(k, f);
    });
  }
  AK.actions = {
    def: (a) => def(registre.clic, a),
    defChange: (a) => def(registre.change, a),
    defSaisie: (a) => def(registre.saisie, a),
    defEnvoi: (a) => def(registre.envoi, a),
    existe: (nom) => registre.clic.has(nom),
    lancer(nom, el, e) {
      const f = registre.clic.get(nom);
      if (f) return executer(f, el || document.body, e, nom);
    },
    _registre: registre
  };

  document.addEventListener('click', (e) => {
    const el = e.target.closest('[data-action]');
    if (!el || el.closest('[inert]')) return;
    if (el.disabled || el.getAttribute('aria-disabled') === 'true') return;
    const f = registre.clic.get(el.dataset.action);
    if (!f) return;
    e.preventDefault();
    AK.session && AK.session.activite();
    executer(f, el, e, el.dataset.action);
  });
  document.addEventListener('change', (e) => {
    const el = e.target.closest('[data-change]');
    if (!el) return;
    const f = registre.change.get(el.dataset.change);
    if (f) executer(f, el, e, el.dataset.change);
  });
  document.addEventListener('input', (e) => {
    const el = e.target.closest('[data-input]');
    if (!el) return;
    const f = registre.saisie.get(el.dataset.input);
    if (f) executer(f, el, e, el.dataset.input);
  });
  document.addEventListener('submit', (e) => {
    const f0 = e.target;
    if (!f0.dataset || !f0.dataset.submit) return;
    e.preventDefault();
    const f = registre.envoi.get(f0.dataset.submit);
    if (f) executer(f, f0, e, f0.dataset.submit);
  });
  ['keydown', 'pointerdown'].forEach((t) => document.addEventListener(t, () => AK.session && AK.session.activite(), { passive: true }));
})(window.AK);

//# sourceURL=akwa/js/ui/actions.js
</script>
<script>
/* =====================================================================================
   Notifications, fenêtres, confirmations, mot de passe, menus et bulles.

   Fenêtres : une balise <dialog> par fenêtre (elles peuvent s'empiler) ; Échap et la croix
   ferment toujours ; une saisie non enregistrée est protégée par une confirmation ;
   une erreur de validation s'affiche sous le champ concerné SANS effacer la saisie.
   ===================================================================================== */
(function (AK) {
  'use strict';
  const u = AK.u, { html, $, $$ } = u, ic = AK.ic;
  const ui = (AK.ui = AK.ui || {});

  /* ---------- Notifications ---------- */
  let zoneToasts = null;
  ui.toast = function (message, o = {}) {
    if (!zoneToasts) {
      zoneToasts = document.createElement('div');
      zoneToasts.className = 'toasts';
      zoneToasts.setAttribute('aria-live', 'polite');
      document.body.appendChild(zoneToasts);
    }
    const type = o.type || 'ok';
    const el = document.createElement('div');
    el.className = 'toast ' + type;
    el.setAttribute('role', type === 'erreur' ? 'alert' : 'status');
    u.poser(el, html`${ic(type === 'erreur' ? 'alert' : type === 'avert' ? 'warn' : type === 'attente' ? 'clock' : 'checkCircle')}<span class="tx">${message}</span>${o.action ? html`<button type="button" class="act">${o.action.lib}</button>` : ''}<button type="button" class="fermer" aria-label="Fermer la notification">×</button>`);
    zoneToasts.appendChild(el);
    while (zoneToasts.children.length > 4) zoneToasts.firstChild.remove();
    let t = null;
    const fermer = () => {
      clearTimeout(t);
      el.classList.add('sortie');
      setTimeout(() => el.remove(), 180);
    };
    el.querySelector('.fermer').onclick = fermer;
    if (o.action) el.querySelector('.act').onclick = () => {
      fermer();
      o.action.f();
    };
    const duree = o.duree ?? (type === 'erreur' ? 9000 : Math.min(8000, 3200 + String(message).length * 35));
    if (duree > 0) t = setTimeout(fermer, duree);
    el.addEventListener('mouseenter', () => clearTimeout(t));
    el.addEventListener('mouseleave', () => duree > 0 && (t = setTimeout(fermer, 2500)));
    return { fermer };
  };

  /** Affiche une erreur : message métier clair, ou erreur technique journalisée. */
  ui.erreur = function (e, contexte) {
    if (e && (e.name === 'ErreurMetier' || e.name === 'ErreurDroits')) {
      ui.toast(e.message, { type: 'erreur' });
      return;
    }
    AK.diag.erreur(e, contexte);
    ui.toast('Une erreur inattendue est survenue. L’opération n’a pas été effectuée. (Détail dans Paramètres › Diagnostic.)', { type: 'erreur' });
  };

  /* ---------- Formulaires ---------- */
  /** Valeurs d'un formulaire : cases à cocher multiples → tableau, case seule → booléen. */
  ui.lireFormulaire = function (form) {
    const o = {};
    const noms = new Set([...form.elements].map((x) => x.name).filter(Boolean));
    noms.forEach((n) => {
      const els = [...form.elements].filter((x) => x.name === n);
      const t = els[0].type;
      if (t === 'checkbox') o[n] = els.length > 1 || els[0].dataset.multiple != null ? els.filter((x) => x.checked).map((x) => x.value) : els[0].checked;
      else if (t === 'radio') o[n] = (els.find((x) => x.checked) || {}).value || '';
      else if (t === 'file') return;
      else o[n] = els[0].value;
    });
    return o;
  };
  ui.effacerErreurs = function (form) {
    $$('.erreur-champ', form).forEach((x) => x.remove());
    $$('[aria-invalid="true"]', form).forEach((x) => x.removeAttribute('aria-invalid'));
    $$('.err-pt', form).forEach((x) => x.remove());
    const g = $('.erreur-form', form);
    if (g) g.remove();
  };
  /** Erreur sous le champ « champ » (ou en tête du formulaire), avec bascule d'onglet si besoin. */
  ui.erreurChamp = function (form, champ, message) {
    const el = champ ? form.querySelector(`[name="${CSS.escape(champ)}"]`) : null;
    if (el) {
      const panneau = el.closest('[role="tabpanel"]');
      if (panneau && panneau.hidden) {
        const b = form.querySelector(`[role="tab"][aria-controls="${panneau.id}"]`);
        if (b) b.click();
      }
      if (panneau) {
        const b = form.querySelector(`[role="tab"][aria-controls="${panneau.id}"]`);
        if (b && !b.querySelector('.err-pt')) b.insertAdjacentHTML('beforeend', '<span class="err-pt" aria-hidden="true"></span>');
      }
      el.setAttribute('aria-invalid', 'true');
      const id = 'err-' + u.uid();
      const box = el.closest('.champ') || el.parentElement;
      box.insertAdjacentHTML('beforeend', String(html`<div class="erreur-champ" id="${id}">${ic('alert')}<span>${message}</span></div>`));
      el.setAttribute('aria-describedby', id);
      el.focus({ preventScroll: false });
      if (el.scrollIntoView) el.scrollIntoView({ block: 'center', behavior: 'smooth' });
    } else {
      const corps = $('.dlg-corps', form) || form;
      corps.insertAdjacentHTML('afterbegin', String(html`<div class="erreur-form" role="alert">${ic('alert')}<span>${message}</span></div>`));
      corps.scrollTop = 0;
    }
  };
  /** Onglets d'un formulaire (role="tablist") : bascule simple et accessible. */
  ui.activerOnglets = function (racine) {
    $$('[role="tablist"]', racine).forEach((liste) => {
      const onglets = $$('[role="tab"]', liste);
      const choisir = (b) => {
        onglets.forEach((x) => {
          const sel = x === b;
          x.setAttribute('aria-selected', String(sel));
          x.tabIndex = sel ? 0 : -1;
          const p = document.getElementById(x.getAttribute('aria-controls'));
          if (p) p.hidden = !sel;
        });
      };
      onglets.forEach((b) => {
        b.addEventListener('click', () => choisir(b));
        b.addEventListener('keydown', (e) => {
          const i = onglets.indexOf(b);
          if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
            e.preventDefault();
            const n = onglets[(i + (e.key === 'ArrowRight' ? 1 : -1) + onglets.length) % onglets.length];
            n.focus();
            choisir(n);
          }
        });
      });
    });
  };

  /* ---------- Fenêtres ---------- */
  /**
   * Ouvre une fenêtre.
   * o = { titre, icone, taille: 'sm'|''|'lg'|'xl'|'plein', corps (Html), pied (Html, remplace les boutons),
   *       ok: 'Enregistrer', annuler: 'Annuler', okStyle: 'pri'|'dng', sansPied, proteger (défaut : vrai si champs),
   *       surValider(donnees, form, fenetre) → false pour garder ouverte ; peut lever ErreurMetier(message, champ),
   *       apres(racine, fenetre), surFermer() }
   */
  ui.fenetre = function (o) {
    const dlg = document.createElement('dialog');
    dlg.className = 'dlg ' + (o.taille || '');
    dlg.setAttribute('aria-labelledby', 'tdlg-' + u.uid());
    const idTitre = dlg.getAttribute('aria-labelledby');
    const boutons = o.sansPied
      ? ''
      : o.pied || html`<span class="modif">Modifications non enregistrées</span><span class="espace"></span>${o.annuler === false ? '' : html`<button type="button" class="btn" data-fermer>${o.annuler || 'Annuler'}</button>`}${o.ok === false ? '' : html`<button type="submit" class="btn ${o.okStyle === 'dng' ? 'btn-dng-plein' : 'btn-pri'}">${o.ok || 'Enregistrer'}</button>`}`;
    u.poser(dlg, html`<form class="dlg-f" novalidate autocomplete="off"><div class="dlg-tete${o.danger ? ' danger' : ''}"><h2 id="${idTitre}">${o.icone ? ic(o.icone) : ''}<span class="tronque">${o.titre}</span></h2><button type="button" class="btn-ic" data-fermer aria-label="Fermer">${ic('x')}</button></div><div class="dlg-corps">${o.corps || ''}</div>${o.sansPied ? '' : html`<div class="dlg-pied">${boutons}</div>`}</form>`);
    document.body.appendChild(dlg);
    const form = $('form', dlg);
    let ferme = false;
    const champs = () => [...form.elements].filter((x) => x.name && x.type !== 'password' && x.type !== 'hidden');
    const proteger = o.proteger ?? champs().length >= 2;
    const fenetre = {
      dlg, form,
      fermer(force) {
        if (ferme) return;
        if (!force && proteger && form.classList.contains('modifie')) {
          ui.confirmer({ titre: 'Modifications non enregistrées', message: 'Les informations saisies dans cette fenêtre ne sont pas enregistrées. Voulez-vous vraiment la fermer ?', ok: 'Fermer sans enregistrer', annuler: 'Continuer la saisie', danger: true }).then((ok) => ok && fenetre.fermer(true));
          return;
        }
        ferme = true;
        if (dlg.open) dlg.close();
        dlg.remove();
        if (o.surFermer) o.surFermer();
      },
      occuper(oui) {
        const b = $('[type="submit"]', form);
        if (b) b.classList.toggle('occupe', !!oui);
      }
    };
    if (proteger) {
      form.addEventListener('input', () => form.classList.add('modifie'));
      form.addEventListener('change', () => form.classList.add('modifie'));
    }
    dlg.addEventListener('cancel', (e) => {
      e.preventDefault();
      fenetre.fermer();
    });
    dlg.addEventListener('click', (e) => {
      if (e.target.closest('[data-fermer]')) {
        e.preventDefault();
        fenetre.fermer();
      }
    });
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!o.surValider) return fenetre.fermer(true);
      ui.effacerErreurs(form);
      fenetre.occuper(true);
      try {
        const r = await o.surValider(ui.lireFormulaire(form), form, fenetre);
        if (r !== false) fenetre.fermer(true);
      } catch (err) {
        if (err && (err.name === 'ErreurMetier' || err.name === 'ErreurDroits')) ui.erreurChamp(form, err.champ, err.message);
        else ui.erreur(err, 'fenêtre ' + o.titre);
      } finally {
        fenetre.occuper(false);
      }
    });
    ui.activerOnglets(dlg);
    dlg.showModal();
    if (o.apres) o.apres(dlg, fenetre);
    const premier = $('[autofocus]', dlg) || $('.dlg-corps input:not([type=hidden]):not([disabled]), .dlg-corps select, .dlg-corps textarea', dlg);
    if (premier) setTimeout(() => premier.focus(), 30);
    return fenetre;
  };

  /** Confirmation explicite ; « saisie » oblige à recopier un mot (actions très destructrices). */
  ui.confirmer = function ({ titre = 'Confirmation', message, ok = 'Confirmer', annuler = 'Annuler', danger = false, saisie = null, icone } = {}) {
    return new Promise((res) => {
      let rep = false;
      ui.fenetre({
        titre, icone: icone || (danger ? 'warn' : 'help'), taille: 'sm', danger, ok, annuler, okStyle: danger ? 'dng' : 'pri', proteger: false,
        corps: html`<div class="pile"><div>${message}</div>${saisie ? html`<div class="champ"><label for="cf-saisie">Pour confirmer, tapez <b>${saisie}</b></label><input id="cf-saisie" class="inp" name="saisie" autocomplete="off" autofocus></div>` : ''}</div>`,
        surValider(d) {
          if (saisie && String(d.saisie || '').trim().toUpperCase() !== saisie.toUpperCase()) throw new AK.ErreurMetier(`Tapez exactement ${saisie} pour confirmer.`, 'saisie');
          rep = true;
        },
        surFermer: () => res(rep)
      });
    });
  };

  /** Information simple (une seule action « Fermer »). */
  ui.info = function (titre, corps, o = {}) {
    return ui.fenetre({ titre, corps, ok: o.ok || 'Fermer', annuler: false, taille: o.taille || 'sm', icone: o.icone || 'info', proteger: false });
  };

  function fenetreMotDePasse(message, renvoyerSecret) {
    return new Promise((res) => {
      let rep = renvoyerSecret ? null : false;
      const f = ui.fenetre({
        titre: 'Mot de passe administrateur', icone: 'lock', taille: 'sm', ok: 'Valider', proteger: false,
        corps: html`<div class="pile"><p class="mb0">${message}</p>
          <div class="champ"><label for="mdp-admin">Mot de passe du directeur</label><input id="mdp-admin" class="inp" type="password" name="pwd" autocomplete="current-password" autofocus required></div>
          ${AK.hote.authentificationLocale ? html`<button type="button" class="lien petit" data-mdp-oublie>Mot de passe oublié ?</button>` : ''}</div>`,
        async surValider(d) {
          if (!d.pwd) throw new AK.ErreurMetier('Saisissez le mot de passe.', 'pwd');
          if (!(await AK.auth.verifierAdmin(d.pwd))) {
            AK.store.journaliser('Mot de passe administrateur refusé');
            throw new AK.ErreurMetier('Mot de passe incorrect. Réessayez.', 'pwd');
          }
          rep = renvoyerSecret ? d.pwd : true;
        },
        surFermer: () => res(rep),
        apres(racine) {
          const l = $('[data-mdp-oublie]', racine);
          if (l) l.onclick = () => {
            f.fermer(true);
            ui.motDePasseOublie && ui.motDePasseOublie();
          };
        }
      });
    });
  }
  /** Vérifie le mot de passe administrateur : true / false. */
  ui.demanderMotDePasse = (message) => fenetreMotDePasse(message, false);
  /** Demande et vérifie le mot de passe, puis le renvoie (déverrouillage de la clé de signature) ou null. */
  ui.saisirMotDePasse = (message) => fenetreMotDePasse(message, true);

  /* ---------- Menus déroulants ---------- */
  let menuOuvert = null;
  ui.fermerMenu = () => {
    if (menuOuvert) {
      menuOuvert.el.remove();
      if (menuOuvert.ancre) menuOuvert.ancre.setAttribute('aria-expanded', 'false');
      menuOuvert = null;
    }
  };
  /** items : [{ lib, sous, icone, f, danger }] | 'sep' | Html ; titre facultatif */
  ui.menu = function (ancre, items, titre) {
    if (menuOuvert && menuOuvert.ancre === ancre) return ui.fermerMenu();
    ui.fermerMenu();
    const el = document.createElement('div');
    el.className = 'menu';
    el.setAttribute('role', 'menu');
    const fonctions = [];
    u.poser(el, html`${titre ? html`<h4>${titre}</h4>` : ''}${items.map((it) => {
      if (it === 'sep') return html`<hr>`;
      if (it instanceof u.Html) return it;
      fonctions.push(it.f);
      return html`<button type="button" role="menuitem" data-i="${fonctions.length - 1}" class="${it.danger ? 'dng' : ''}">${it.icone ? ic(it.icone) : it.avant || ''}<span class="flex1">${it.lib}${it.sous ? html`<small>${it.sous}</small>` : ''}</span></button>`;
    })}`);
    document.body.appendChild(el);
    const r = ancre.getBoundingClientRect(), w = el.offsetWidth, h = el.offsetHeight;
    el.style.left = Math.max(8, Math.min(innerWidth - w - 8, r.right - w)) + 'px';
    el.style.top = (r.bottom + 6 + h > innerHeight - 8 ? Math.max(8, r.top - h - 6) : r.bottom + 6) + 'px';
    ancre.setAttribute('aria-expanded', 'true');
    menuOuvert = { el, ancre };
    el.addEventListener('click', (e) => {
      const b = e.target.closest('button[data-i]');
      if (!b) return;
      const f = fonctions[+b.dataset.i];
      ui.fermerMenu();
      if (f) Promise.resolve().then(f).catch((err) => ui.erreur(err));
    });
    el.addEventListener('keydown', (e) => {
      const B = $$('button[data-i]', el), i = B.indexOf(document.activeElement);
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
        e.preventDefault();
        B[(i + (e.key === 'ArrowDown' ? 1 : -1) + B.length) % B.length].focus();
      }
      if (e.key === 'Escape') {
        ui.fermerMenu();
        ancre.focus();
      }
    });
    const b0 = $('button[data-i]', el);
    if (b0) b0.focus();
  };
  document.addEventListener('pointerdown', (e) => {
    if (menuOuvert && !menuOuvert.el.contains(e.target) && !menuOuvert.ancre.contains(e.target)) ui.fermerMenu();
  });
  addEventListener('resize', ui.fermerMenu);

  /* ---------- Bulles d'information (data-bulle) ---------- */
  let bulle = null;
  const montrerBulle = (t, x, y) => {
    if (!bulle) {
      bulle = document.createElement('div');
      bulle.className = 'bulle';
      bulle.setAttribute('role', 'tooltip');
      document.body.appendChild(bulle);
    }
    bulle.textContent = t;
    bulle.hidden = false;
    bulle.style.left = Math.max(8, Math.min(x + 12, innerWidth - bulle.offsetWidth - 8)) + 'px';
    bulle.style.top = Math.min(y + 16, innerHeight - bulle.offsetHeight - 8) + 'px';
  };
  document.addEventListener('mouseover', (e) => {
    const t = e.target.closest('[data-bulle]');
    if (!t) {
      if (bulle) bulle.hidden = true;
      return;
    }
    montrerBulle(t.dataset.bulle, e.clientX, e.clientY);
  });
  document.addEventListener('mousemove', (e) => {
    if (bulle && !bulle.hidden && e.target.closest('[data-bulle]')) montrerBulle(bulle.textContent, e.clientX, e.clientY);
  });
  document.addEventListener('focusin', (e) => {
    const t = e.target.closest && e.target.closest('[data-bulle]');
    if (!t) {
      if (bulle) bulle.hidden = true;
      return;
    }
    const r = t.getBoundingClientRect();
    montrerBulle(t.dataset.bulle, r.left, r.bottom - 8);
  });
  document.addEventListener('scroll', () => bulle && (bulle.hidden = true), true);
})(window.AK);

//# sourceURL=akwa/js/ui/dialogues.js
</script>
<script>
/* =====================================================================================
   Composants d'interface réutilisables (HTML sûr) : en-têtes de page, indicateurs, états
   vides, avatars, étiquettes, champs de formulaire libellés et accessibles.
   ===================================================================================== */
(function (AK) {
  'use strict';
  const u = AK.u, { html, raw } = u, ic = AK.ic;
  const ui = (AK.ui = AK.ui || {});
  const X = () => AK.calc;

  /** Attributs HTML : { placeholder: 'x', required: true, maxlength: 20 } (valeurs échappées). */
  ui.attrs = (o = {}) =>
    raw(Object.entries(o).filter(([, v]) => v !== false && v != null).map(([k, v]) => (v === true ? ` ${k}` : ` ${k}="${u.esc(v)}"`)).join(''));
  ui.options = (liste, sel, vide) =>
    html`${vide != null ? html`<option value="">${vide}</option>` : ''}${liste.map((v) => {
      const [val, lib] = Array.isArray(v) ? v : [v, v];
      return html`<option value="${val}"${String(val) === String(sel ?? '') ? raw(' selected') : ''}>${lib}</option>`;
    })}`;

  ui.pageTete = (titre, sous, actions) =>
    html`<header class="page-tete"><div><h1>${titre}</h1>${sous ? html`<p>${sous}</p>` : ''}</div>${actions ? html`<div class="actions">${actions}</div>` : ''}</header>`;

  ui.kpi = ({ lien, action, icone = 'chart', lib, val, sous = '', extra = '', ton = '' }) => {
    const corps = html`<span class="kpi-l">${ic(icone)}${lib}</span><span class="kpi-v">${val}</span><span class="kpi-s">${sous}</span>${extra}${lien || action ? html`<span class="fleche">${ic('chev')}</span>` : ''}`;
    if (lien) return html`<a class="kpi ${ton}" href="#${lien}">${corps}</a>`;
    if (action) return html`<button type="button" class="kpi ${ton}" data-action="${action.nom}"${ui.attrs(action.attrs)}>${corps}</button>`;
    return html`<div class="kpi ${ton}">${corps}</div>`;
  };

  const ILLU = raw('<svg class="illu" viewBox="0 0 84 64" aria-hidden="true"><ellipse cx="42" cy="58" rx="34" ry="4" fill="currentColor" opacity=".35"/><path d="M14 14h24c3 0 4 2 4 4v34c0-2-1-4-4-4H14z" fill="var(--surface)" stroke="currentColor" stroke-width="1.6"/><path d="M70 14H46c-3 0-4 2-4 4v34c0-2 1-4 4-4h24z" fill="var(--surface)" stroke="currentColor" stroke-width="1.6"/><path d="M19 22h17M19 28h17M19 34h12M47 22h17M47 28h17M47 34h12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="66" cy="12" r="6" fill="var(--acc)" opacity=".8"/></svg>');
  ui.vide = (titre, texte, action) => html`<div class="vide">${ILLU}<b>${titre}</b>${texte ? html`<p>${texte}</p>` : ''}${action || ''}</div>`;

  ui.avatar = (p, taille = '') => {
    if (p && p.photo) return html`<img class="av ${taille}" src="${p.photo}" alt="">`;
    return html`<span class="av ${taille}" aria-hidden="true">${X().initiales(p || { nom: '?' })}</span>`;
  };
  ui.tag = (texte, ton = '', icone) => html`<span class="tag ${ton}">${icone ? ic(icone) : ''}${texte}</span>`;
  ui.tagDecision = (d) => (d ? ui.tag(d, d === 'Admis' ? 'ok' : d === 'Redoublant' ? 'avert' : 'mauvais') : ui.tag('MGA incomplète'));
  ui.tagStatut = (s) => ui.tag(s, s === 'Inscrit' ? 'ok' : 'mauvais');
  ui.lienClasse = (c) => html`<a class="tag pri" href="#eleves/liste?classe=${c}" data-bulle="Voir les élèves de ${c}">${c}</a>`;
  ui.nomEleve = (s) => html`<button type="button" class="lien" data-action="fiche-eleve" data-id="${s.id}">${X().nomComplet(s)}</button>`;
  ui.quiEleve = (s) => html`<div class="qui">${ui.avatar(s)}<span class="tronque">${ui.nomEleve(s)}<br><span class="mut petit">${s.classe} · ${X().matOf(s)}</span></span></div>`;
  ui.nomAgent = (t) => html`<button type="button" class="lien" data-action="fiche-agent" data-id="${t.id}">${t.nom}</button>`;
  ui.onglets = (liste, actif) =>
    html`<nav class="onglets" aria-label="Sections">${liste.map(([lien, lib, compte]) => html`<a href="#${lien}" class="${lien === actif ? 'actif' : ''}"${lien === actif ? raw(' aria-current="page"') : ''}>${lib}${compte ? html`<span class="compte">${compte}</span>` : ''}</a>`)}</nav>`;
  ui.pilules = (liste, actif, action, attrs = {}) =>
    html`<div class="pilules" role="group">${liste.map((x) => {
      const [v, l, extra] = Array.isArray(x) ? x : [x, x];
      return html`<button type="button" class="pilule" aria-pressed="${String(v) === String(actif)}" data-action="${action}" data-v="${v}"${ui.attrs(attrs)}>${l}${extra || ''}</button>`;
    })}</div>`;
  ui.encadre = (texte, ton = '', icone) => html`<div class="encadre ${ton}">${ic(icone || (ton === 'avert' ? 'warn' : ton === 'erreur' ? 'alert' : ton === 'ok' ? 'checkCircle' : 'info'))}<div>${texte}</div></div>`;
  ui.carte = (titre, corps, { sous, actions, cls = '' } = {}) =>
    html`<section class="carte ${cls}">${titre ? html`<div class="carte-tete"><div><h2>${titre}</h2>${sous ? html`<div class="sous">${sous}</div>` : ''}</div>${actions || ''}</div>` : ''}${corps}</section>`;

  /* ---------- Champs de formulaire ---------- */
  let n = 0;
  const id = () => 'ch' + ++n;
  const enveloppe = (o, controle, ident) =>
    html`<div class="champ${o.plein ? ' plein' : ''}"${o.cache ? raw(' hidden') : ''}${o.zone ? html` data-zone="${o.zone}"` : ''}><label for="${ident}">${o.lib}${o.req ? html`<span class="req" aria-hidden="true">*</span>` : ''}</label>${controle}${o.aide ? html`<div class="aide" id="${ident}-aide">${o.aide}</div>` : ''}</div>`;
  const F = {
    texte(o) {
      const i = o.id || id();
      return enveloppe(o, html`<input class="inp" id="${i}" name="${o.nom}" type="${o.type || 'text'}" value="${o.val ?? ''}"${ui.attrs({ required: !!o.req, 'aria-describedby': o.aide ? i + '-aide' : null, ...(o.attrs || {}) })}>`, i);
    },
    nombre: (o) => F.texte({ ...o, type: 'number', attrs: { inputmode: 'decimal', ...(o.attrs || {}) } }),
    date: (o) => F.texte({ ...o, type: 'date' }),
    tel: (o) => F.texte({ ...o, type: 'tel', attrs: { inputmode: 'tel', placeholder: '+225 07 00 00 00 00', autocomplete: 'off', ...(o.attrs || {}) } }),
    choix(o) {
      const i = o.id || id();
      return enveloppe(o, html`<select class="inp" id="${i}" name="${o.nom}"${ui.attrs({ required: !!o.req, ...(o.attrs || {}) })}>${ui.options(o.options, o.val, o.vide)}</select>`, i);
    },
    zone(o) {
      const i = o.id || id();
      return enveloppe(o, html`<textarea class="inp" id="${i}" name="${o.nom}" rows="${o.lignes || 3}"${ui.attrs({ required: !!o.req, ...(o.attrs || {}) })}>${o.val ?? ''}</textarea>`, i);
    },
    /** Case à cocher seule (valeur booléenne). */
    case(o) {
      const i = o.id || id();
      return html`<div class="champ${o.plein ? ' plein' : ''}"><label class="coche" for="${i}"><input type="checkbox" id="${i}" name="${o.nom}"${o.coche ? raw(' checked') : ''}${ui.attrs(o.attrs || {})}> ${o.lib}</label>${o.aide ? html`<div class="aide">${o.aide}</div>` : ''}</div>`;
    },
    /** Cases multiples (valeur : tableau). */
    cases(o) {
      return html`<fieldset class="champ${o.plein ? ' plein' : ''}" style="border:0;padding:0;margin:0"><legend class="lib" style="font-size:12.5px;font-weight:650;color:var(--ink-2);margin-bottom:6px">${o.lib}</legend><div class="coches">${o.options.map((x) => {
        const [v, l] = Array.isArray(x) ? x : [x, x];
        return html`<label class="coche"><input type="checkbox" name="${o.nom}" value="${v}" data-multiple${(o.valeurs || []).includes(v) ? raw(' checked') : ''}> ${l}</label>`;
      })}</div>${o.aide ? html`<div class="aide">${o.aide}</div>` : ''}</fieldset>`;
    },
    radios(o) {
      return html`<fieldset class="champ${o.plein ? ' plein' : ''}" style="border:0;padding:0;margin:0"><legend class="lib" style="font-size:12.5px;font-weight:650;color:var(--ink-2);margin-bottom:6px">${o.lib}</legend><div class="choix-carte">${o.options.map(([v, l]) => html`<label><input type="radio" name="${o.nom}" value="${v}"${String(v) === String(o.val) ? raw(' checked') : ''}> ${l}</label>`)}</div></fieldset>`;
    },
    /** Choix d'une image (photo, logo) : aperçu + bouton ; la valeur est mise dans un champ caché. */
    image(o) {
      const i = o.id || id();
      return html`<div class="champ${o.plein ? ' plein' : ''}"><span class="lib">${o.lib}</span><div class="ligne"><span class="apercu-img" id="${i}-ap">${o.val ? html`<img src="${o.val}" alt="" style="height:${o.h || 64}px;border-radius:8px;border:1px solid var(--line)">` : html`<span class="av lg" aria-hidden="true">${ic('image')}</span>`}</span>
        <label class="btn btn-sm">${ic('cam')}${o.bouton || 'Choisir une image'}<input type="file" accept="image/png,image/jpeg,image/webp" hidden data-change="image-choisie" data-cible="${i}" data-max="${o.max || 360}" data-type="${o.typeImg || 'image/jpeg'}"></label>
        ${o.val ? html`<button type="button" class="btn btn-sm btn-ghost" data-action="image-retirer" data-cible="${i}">Retirer</button>` : ''}
        <input type="hidden" name="${o.nom}" id="${i}" value="${o.val || ''}" data-image></div>${o.aide ? html`<div class="aide">${o.aide}</div>` : ''}</div>`;
    }
  };
  ui.champ = F;

  /** Onglets d'un formulaire : [[clé, libellé, Html]] */
  ui.ongletsForm = (liste) => {
    const base = 'of' + ++n;
    return html`<div class="onglets-form" role="tablist">${liste.map(([k, l], i) => html`<button type="button" role="tab" id="${base}-t-${k}" aria-controls="${base}-p-${k}" aria-selected="${i === 0}" tabindex="${i === 0 ? 0 : -1}">${l}</button>`)}</div>${liste.map(([k, , corps], i) => html`<div role="tabpanel" id="${base}-p-${k}" aria-labelledby="${base}-t-${k}"${i ? raw(' hidden') : ''}>${corps}</div>`)}`;
  };

  /* Images choisies dans un formulaire : réduites puis placées dans le champ caché */
  AK.actions.defChange({
    async 'image-choisie'(el) {
      const f = el.files && el.files[0];
      if (!f) return;
      const url = await u.lireImage(f, Number(el.dataset.max) || 360, el.dataset.type || 'image/jpeg');
      const cible = document.getElementById(el.dataset.cible);
      cible.value = url;
      cible.dispatchEvent(new Event('change', { bubbles: true }));
      const ap = document.getElementById(el.dataset.cible + '-ap');
      if (ap) u.poser(ap, html`<img src="${url}" alt="" style="height:64px;border-radius:8px;border:1px solid var(--line)">`);
      el.value = '';
    }
  });
  AK.actions.def({
    'image-retirer'(el) {
      const cible = document.getElementById(el.dataset.cible);
      cible.value = '';
      cible.dispatchEvent(new Event('change', { bubbles: true }));
      const ap = document.getElementById(el.dataset.cible + '-ap');
      if (ap) u.poser(ap, html`<span class="av lg" aria-hidden="true">${ic('image')}</span>`);
      el.remove();
    }
  });
})(window.AK);

<script>
/* =====================================================================================
   Tableau de données : recherche, tri, pagination, sélection, export CSV.
   Usage : AK.ui.tableau({ id, lignes, colonnes, recherche, filtres, parPage, selection, vide, exporter })
   Les colonnes : { cle, lib, rendu(o) → Html, tri(o) → valeur, cls, csv(o) → texte, cache }.
   Seule la partie « résultats » est redessinée lors d'une frappe : la saisie garde le focus.
   ===================================================================================== */
(function (AK) {
  'use strict';
  const u = AK.u, { html, raw } = u, ic = AK.ic;
  const ui = AK.ui;
  const etats = new Map();
  const configs = new Map();

  const etatDe = (id, cfg) => {
    if (!etats.has(id)) etats.set(id, { q: '', tri: cfg && cfg.triDefaut ? { ...cfg.triDefaut } : null, page: 1, choix: new Set() });
    return etats.get(id);
  };

  function filtrer(cfg, st) {
    let L = cfg.lignes;
    const q = u.norm(st.q);
    if (q && cfg.recherche) L = L.filter((o) => u.norm(cfg.recherche(o)).includes(q));
    if (st.tri) {
      const col = cfg.colonnes.find((c) => c.cle === st.tri.cle);
      if (col && col.tri) {
        const k = st.tri.sens === 'desc' ? -1 : 1;
        L = L.slice().sort((a, b) => {
          const x = col.tri(a), y = col.tri(b);
          if (x == null && y == null) return 0;
          if (x == null) return 1;
          if (y == null) return -1;
          return (typeof x === 'number' && typeof y === 'number' ? x - y : String(x).localeCompare(String(y), 'fr', { numeric: true })) * k;
        });
      }
    }
    return L;
  }

  function resultats(cfg) {
    const st = etatDe(cfg.id, cfg);
    const L = filtrer(cfg, st);
    const parPage = cfg.parPage || 50;
    const pages = Math.max(1, Math.ceil(L.length / parPage));
    if (st.page > pages) st.page = pages;
    const vue = L.slice((st.page - 1) * parPage, st.page * parPage);
    const cols = cfg.colonnes.filter((c) => !c.cache);
    const cleId = cfg.cleId || ((o) => o.id);
    const toutCoche = vue.length > 0 && vue.every((o) => st.choix.has(cleId(o)));
    const nbChoix = st.choix.size;
    const entete = html`<tr>${cfg.selection ? html`<th class="col-choix"><input type="checkbox" aria-label="Tout sélectionner sur cette page" data-change="tab-tout" data-tab="${cfg.id}"${toutCoche ? raw(' checked') : ''}></th>` : ''}${cols.map((c) => {
      const trie = st.tri && st.tri.cle === c.cle;
      const aria = trie ? (st.tri.sens === 'desc' ? 'descending' : 'ascending') : null;
      return html`<th class="${c.cls || ''}"${aria ? html` aria-sort="${aria}"` : ''}>${c.tri ? html`<button type="button" class="tri" data-action="tab-tri" data-tab="${cfg.id}" data-cle="${c.cle}">${c.lib}${ic(trie ? (st.tri.sens === 'desc' ? 'chevD' : 'chevU') : 'sort', 'i-sm')}</button>` : c.lib}</th>`;
    })}</tr>`;
    const corps = vue.length
      ? vue.map((o) => {
        const k = cleId(o);
        const sel = st.choix.has(k);
        return html`<tr class="${sel ? 'choisi' : ''}"${cfg.attrsLigne ? ui.attrs(cfg.attrsLigne(o)) : ''}>${cfg.selection ? html`<td class="col-choix"><input type="checkbox" aria-label="Sélectionner" data-change="tab-choix" data-tab="${cfg.id}" data-k="${k}"${sel ? raw(' checked') : ''}></td>` : ''}${cols.map((c) => html`<td class="${c.cls || ''}">${c.rendu ? c.rendu(o) : o[c.cle] ?? ''}</td>`)}</tr>`;
      })
      : html`<tr><td colspan="${cols.length + (cfg.selection ? 1 : 0)}" style="white-space:normal">${cfg.vide || ui.vide('Aucun résultat', st.q ? 'Aucune ligne ne correspond à la recherche.' : '')}</td></tr>`;
    return html`${cfg.selection && nbChoix ? html`<div class="selection-barre" role="status">${ic('checkCircle')}${u.pluriel(nbChoix, 'élément sélectionné', 'éléments sélectionnés')}<span class="espace"></span>${cfg.actionsSelection ? cfg.actionsSelection([...st.choix]) : ''}<button type="button" class="btn btn-sm btn-ghost" data-action="tab-vider" data-tab="${cfg.id}">Désélectionner</button></div>` : ''}
      <div class="tab-cadre"${cfg.hauteur ? html` style="max-height:${cfg.hauteur}"` : ''}><table class="tab"${cfg.legende ? html` aria-label="${cfg.legende}"` : ''}><thead>${entete}</thead><tbody>${corps}</tbody>${cfg.pied ? html`<tfoot>${cfg.pied}</tfoot>` : ''}</table></div>
      ${pages > 1 ? html`<nav class="pagination" aria-label="Pagination"><span>${(st.page - 1) * parPage + 1}–${Math.min(L.length, st.page * parPage)} sur ${L.length}</span>
        <button type="button" class="btn btn-sm" data-action="tab-page" data-tab="${cfg.id}" data-p="${st.page - 1}"${st.page <= 1 ? raw(' disabled') : ''} aria-label="Page précédente">${ic('chevL')}</button>
        <span>Page ${st.page} / ${pages}</span>
        <button type="button" class="btn btn-sm" data-action="tab-page" data-tab="${cfg.id}" data-p="${st.page + 1}"${st.page >= pages ? raw(' disabled') : ''} aria-label="Page suivante">${ic('chev')}</button></nav>` : ''}`;
  }

  ui.tableau = function (cfg) {
    configs.set(cfg.id, cfg);
    const st = etatDe(cfg.id, cfg);
    const total = cfg.lignes.length;
    const nb = filtrer(cfg, st).length;
    return html`<div class="tab-zone" id="tz-${cfg.id}">${cfg.recherche || cfg.filtres || cfg.exporter ? html`<div class="barre-outils">${cfg.recherche ? html`<div class="recherche-tab">${ic('search')}<input class="inp" type="search" value="${st.q}" placeholder="${cfg.placeholder || 'Rechercher…'}" aria-label="${cfg.placeholder || 'Rechercher'}" data-input="tab-q" data-tab="${cfg.id}"></div>` : ''}${cfg.filtres || ''}<span class="compte-res" id="tc-${cfg.id}">${nb === total ? u.pluriel(total, cfg.unite || 'ligne') : `${nb} sur ${total}`}</span>${cfg.exporter ? html`<button type="button" class="btn btn-sm" data-action="tab-csv" data-tab="${cfg.id}">${ic('down')}Excel (CSV)</button>` : ''}</div>` : ''}<div id="tr-${cfg.id}">${resultats(cfg)}</div></div>`;
  };
  ui.tableauEtat = (id) => etatDe(id);
  ui.tableauChoix = (id) => [...etatDe(id).choix];
  ui.tableauViderChoix = (id) => etatDe(id).choix.clear();
  function redessiner(id) {
    const cfg = configs.get(id), z = document.getElementById('tr-' + id);
    if (!cfg || !z) return;
    u.poser(z, resultats(cfg));
    const c = document.getElementById('tc-' + id), st = etatDe(id), nb = filtrer(cfg, st).length;
    if (c) c.textContent = nb === cfg.lignes.length ? u.pluriel(nb, cfg.unite || 'ligne') : `${nb} sur ${cfg.lignes.length}`;
  }
  ui.tableauRedessiner = redessiner;

  const minuteries = new Map();
  AK.actions.defSaisie({
    'tab-q'(el) {
      const id = el.dataset.tab, st = etatDe(id);
      st.q = el.value;
      st.page = 1;
      clearTimeout(minuteries.get(id));
      minuteries.set(id, setTimeout(() => redessiner(id), 140));
    }
  });
  AK.actions.def({
    'tab-tri'(el) {
      const st = etatDe(el.dataset.tab), k = el.dataset.cle;
      st.tri = st.tri && st.tri.cle === k ? (st.tri.sens === 'asc' ? { cle: k, sens: 'desc' } : null) : { cle: k, sens: 'asc' };
      redessiner(el.dataset.tab);
    },
    'tab-page'(el) {
      etatDe(el.dataset.tab).page = Math.max(1, Number(el.dataset.p));
      redessiner(el.dataset.tab);
      const z = document.getElementById('tz-' + el.dataset.tab);
      if (z) z.scrollIntoView({ block: 'start', behavior: 'smooth' });
    },
    'tab-vider'(el) {
      etatDe(el.dataset.tab).choix.clear();
      redessiner(el.dataset.tab);
    },
    async 'tab-csv'(el) {
      const cfg = configs.get(el.dataset.tab);
      if (!cfg) return;
      const L = filtrer(cfg, etatDe(cfg.id));
      const cols = cfg.colonnes.filter((c) => c.csv !== false);
      const txt = (v) => (v instanceof u.Html ? new DOMParser().parseFromString(String(v), 'text/html').body.textContent : v);
      const lignes = [cols.map((c) => c.lib), ...L.map((o) => cols.map((c) => (typeof c.csv === 'function' ? c.csv(o) : c.tri ? c.tri(o) : txt(c.rendu ? c.rendu(o) : o[c.cle]))))];
      await AK.sauvegarde.csv(`${cfg.exporter}-${u.aujourdhui()}.csv`, lignes, cfg.exporter);
      ui.toast('Fichier Excel (CSV) enregistré');
    }
  });
  AK.actions.defChange({
    'tab-choix'(el) {
      const st = etatDe(el.dataset.tab);
      if (el.checked) st.choix.add(el.dataset.k);
      else st.choix.delete(el.dataset.k);
      redessiner(el.dataset.tab);
    },
    'tab-tout'(el) {
      const cfg = configs.get(el.dataset.tab), st = etatDe(el.dataset.tab);
      const parPage = cfg.parPage || 50, L = filtrer(cfg, st).slice((st.page - 1) * parPage, st.page * parPage);
      const cleId = cfg.cleId || ((o) => o.id);
      L.forEach((o) => (el.checked ? st.choix.add(cleId(o)) : st.choix.delete(cleId(o))));
      redessiner(el.dataset.tab);
    }
  });
})(window.AK);
