</script>
<script>
/* =====================================================================================
   Coque de l'application : navigation (menu latéral, onglets, fil d'Ariane), routage par
   l'adresse (#section/onglet?param=valeur), barre supérieure (recherche, enregistrement,
   alertes, profil), tiroir de fiche, bandeaux d'information, verrouillage.
   Chaque écran s'enregistre avec AK.ecrans.def(route, { titre, rendu, apres, droit }).
   ===================================================================================== */
(function (AK) {
  'use strict';
  const u = AK.u, { html, raw, $, $$ } = u, ic = AK.ic, ui = AK.ui;
  const S = () => AK.store.etat;
  const X = () => AK.calc;

  /* ---------- Plan de navigation ---------- */
  const SECTIONS = [
    { grp: 'Pilotage' },
    { id: 'accueil', lib: 'Tableau de bord', court: 'Accueil', ic: 'home' },
    { grp: 'Scolarité' },
    { id: 'eleves', lib: 'Élèves & classes', court: 'Élèves', ic: 'users', onglets: [['eleves/liste', 'Registre des élèves'], ['eleves/classes', 'Classes'], ['eleves/import', 'Import Excel']] },
    { id: 'notes', lib: 'Notes & bulletins', court: 'Notes', ic: 'award', onglets: [['notes/saisie', 'Saisie des notes'], ['notes/resultats', 'Résultats & bulletins'], ['notes/validation', 'Validation des saisies'], ['notes/fin', 'Fin d’année']] },
    { id: 'absences', lib: 'Absences', court: 'Absences', ic: 'cal', onglets: [['absences/appel', 'Appel du jour'], ['absences/autorisations', 'Autorisations']] },
    { grp: 'Équipe' },
    { id: 'personnel', lib: 'Personnel', court: 'Personnel', ic: 'brief', onglets: [['personnel/liste', 'Personnel'], ['personnel/comptes', 'Comptes enseignants'], ['personnel/messages', 'Messages']] },
    { grp: 'Vie de l’école' },
    { id: 'vie', lib: 'Vie scolaire', court: 'Vie', ic: 'heart', onglets: [['vie/edt', 'Emploi du temps'], ['vie/cahier', 'Cahier de textes'], ['vie/discipline', 'Discipline'], ['vie/sante', 'Infirmerie'], ['vie/calendrier', 'Calendrier']] },
    { id: 'finances', lib: 'Scolarité & finances', court: 'Finances', ic: 'coin', onglets: [['finances/paiements', 'Frais & versements'], ['finances/depenses', 'Dépenses'], ['finances/cantine', 'Cantine']] },
    { id: 'services', lib: 'Services', court: 'Services', ic: 'star', onglets: [['services/biblio', 'Bibliothèque'], ['services/cepe', 'Examen du CEPE'], ['services/parents', 'Parents & annonces']] },
    { grp: 'Documents' },
    { id: 'documents', lib: 'Documents & cartes', court: 'Documents', ic: 'idCard', onglets: [['documents/emettre', 'Émettre un document'], ['documents/cartes', 'Cartes d’identification'], ['documents/registre', 'Registre des documents'], ['documents/verifier', 'Vérifier un document']] },
    { id: 'rapports', lib: 'Rapports & statistiques', court: 'Rapports', ic: 'book', onglets: [['rapports/officiels', 'Rapports officiels'], ['rapports/generateur', 'Générateur'], ['rapports/stats', 'Statistiques'], ['rapports/liaison', 'Transmission IEPP']] },
    { grp: 'Administration' },
    { id: 'donnees', lib: 'Données & sauvegarde', court: 'Données', ic: 'database', onglets: [['donnees/sauvegarde', 'Sauvegarde & restauration'], ['donnees/export', 'Exports'], ['donnees/journal', 'Journal des opérations'], ['donnees/corbeille', 'Corbeille']] },
    { id: 'parametres', lib: 'Paramètres', court: 'Paramètres', ic: 'sliders', onglets: [['parametres/ecole', 'École'], ['parametres/modeles', 'Modèles de documents'], ['parametres/securite', 'Sécurité & signature'], ['parametres/calendrier', 'Calendrier'], ['parametres/apparence', 'Apparence'], ['parametres/diagnostic', 'Diagnostic']] }
  ];
  const ecrans = new Map();
  AK.ecrans = {
    def(route, o) {
      ecrans.set(route, o);
    },
    existe: (r) => ecrans.has(r),
    SECTIONS
  };
  const accessible = (route) => {
    const e = ecrans.get(route);
    return !!e && (!e.droit || AK.perm.peut(e.droit));
  };
  const ongletsVisibles = (sec) => (sec.onglets || []).filter(([r]) => accessible(r));
  const sectionDe = (route) => SECTIONS.find((s) => s.id && (route === s.id || route.startsWith(s.id + '/')));

  /* ---------- Adresse ---------- */
  function lireAdresse() {
    const h = decodeURIComponent((location.hash || '#accueil').slice(1));
    const [chemin, q] = h.split('?');
    const params = {};
    new URLSearchParams(q || '').forEach((v, k) => (params[k] = v));
    return { chemin: chemin || 'accueil', params };
  }
  function resoudre(chemin) {
    if (ecrans.has(chemin) && accessible(chemin)) return chemin;
    const sec = SECTIONS.find((s) => s.id === chemin.split('/')[0]);
    if (sec) {
      const o = ongletsVisibles(sec)[0];
      if (o) return o[0];
      if (accessible(sec.id)) return sec.id;
    }
    return 'accueil';
  }
  /** Va vers un écran ; params : filtres transmis à l'écran (ex. { classe: 'CP1' }). */
  function aller(route, params) {
    const q = params && Object.keys(params).length ? '?' + new URLSearchParams(params).toString() : '';
    const cible = '#' + route + q;
    if (location.hash === cible) dessiner();
    else location.hash = cible;
  }

  /* ---------- Squelette ---------- */
  function construire() {
    document.body.insertAdjacentHTML('afterbegin', String(html`<a class="lien-evitement" href="#contenu" data-action="aller-contenu">Aller au contenu</a>
<div class="app" id="app">
  <aside class="side" id="side" aria-label="Navigation principale">
    <div class="side-tete"><img src="${AK.assets.logo}" alt=""><div class="marque"><b id="nom-ecole">AKWA SCHOOL</b><small>AKWA SCHOOL ${AK.VERSION}</small></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="side-pied"><div class="carte-ecole" id="carte-ecole"></div><button type="button" class="btn-replier" data-action="replier-menu" aria-label="Réduire ou agrandir le menu">${ic('chevL')}<span>Réduire le menu</span></button></div>
  </aside>
  <div class="principal" id="principal">
    <header class="haut" id="haut">
      <button type="button" class="btn-haut burger" data-action="ouvrir-nav" aria-label="Ouvrir le menu" aria-expanded="false">${ic('menu')}</button>
      <div class="ariane" id="ariane"></div>
      <span class="espace"></span>
      <div class="recherche" id="zone-recherche">${ic('search')}<input id="recherche" type="search" placeholder="Élève, membre du personnel, écran, référence…" autocomplete="off" aria-label="Recherche globale" aria-controls="resultats-recherche"><kbd>Ctrl K</kbd><div class="resultats-recherche" id="resultats-recherche" role="listbox" hidden></div></div>
      <span class="etat-sauvegarde" id="etat-sauvegarde" role="status"><span class="point"></span><span class="txt">Enregistré</span></span>
      <button type="button" class="btn-haut" data-action="aller" data-route="documents/verifier" aria-label="Vérifier un document" data-bulle="Vérifier un document (QR code ou référence)">${ic('qr')}</button>
      <button type="button" class="btn-haut" id="btn-alertes" data-action="alertes" aria-label="Alertes et rappels" aria-haspopup="menu">${ic('bell')}</button>
      <button type="button" class="btn-haut" data-action="theme" aria-label="Thème clair ou sombre" data-bulle="Thème clair / sombre">${ic('moon')}</button>
      <button type="button" class="btn-profil" id="btn-profil" data-action="menu-profil" aria-haspopup="menu"></button>
    </header>
    <div class="bandeaux" id="bandeaux"></div>
    <main class="contenu" id="contenu" tabindex="-1"></main>
  </div>
</div>
<nav class="bas" id="bas" aria-label="Navigation rapide"></nav>`));
  }

  /* ---------- Menu ---------- */
  function dessinerNav(route) {
    const sec = sectionDe(route);
    const att = AK.session.estDirecteur() ? Object.keys(S().attente || {}).length : 0;
    const dem = AK.session.estDirecteur() ? S().auth.filter((a) => a.statut === 'En attente').length : 0;
    const comptes = { notes: att, absences: dem };
    const items = [];
    let groupe = null;
    SECTIONS.forEach((s) => {
      if (s.grp) {
        groupe = s.grp;
        return;
      }
      const cible = ongletsVisibles(s)[0] ? ongletsVisibles(s)[0][0] : accessible(s.id) ? s.id : null;
      if (!cible) return;
      if (groupe) {
        items.push(html`<div class="nav-groupe">${groupe}</div><div class="nav-sep"></div>`);
        groupe = null;
      }
      items.push(html`<a href="#${cible}" class="${s === sec ? 'actif' : ''}"${s === sec ? raw(' aria-current="page"') : ''} data-bulle="${document.documentElement.classList.contains('side-reduite') ? s.lib : ''}">${ic(s.ic)}<span class="lib">${s.lib}</span>${comptes[s.id] ? html`<span class="compte" aria-label="${comptes[s.id]} en attente">${comptes[s.id]}</span>` : ''}</a>`);
    });
    u.poser($('#nav'), items);
    const principaux = ['accueil', 'eleves', 'notes', 'absences'].map((id) => SECTIONS.find((s) => s.id === id)).filter((s) => ongletsVisibles(s).length || accessible(s.id));
    u.poser($('#bas'), html`${principaux.map((s) => html`<a href="#${ongletsVisibles(s)[0] ? ongletsVisibles(s)[0][0] : s.id}" class="${s === sec ? 'actif' : ''}">${ic(s.ic)}${s.court}</a>`)}<button type="button" data-action="ouvrir-nav">${ic('menu')}Menu</button>`);
    const sc = S().school;
    $('#nom-ecole').textContent = sc.name || 'AKWA SCHOOL';
    u.poser($('#carte-ecole'), html`<b>${sc.name || 'École non renseignée'}</b>${[sc.iepp, sc.drenaet].filter(Boolean).join(' · ')}<br>${sc.year ? 'Année ' + sc.year + ' · ' : ''}${AK.cfg.evCourt(sc.evalCourante || 1)}`);
    const a = AK.session.agent();
    u.poser($('#btn-profil'), html`${a ? ui.avatar(a) : html`<span class="av">${ic('key')}</span>`}<span class="pt"><b>${AK.session.libelle()}</b><small>${a ? 'Enseignant · ' + (X().clsTxt(a) || 'sans classe') : 'Directeur · administrateur'}</small></span>${ic('chevD', 'i-sm')}`);
    const n = alertes().length, b = $('#btn-alertes');
    const p = b.querySelector('.pastille');
    if (p) p.remove();
    if (n) b.insertAdjacentHTML('beforeend', `<span class="pastille">${n > 9 ? '9+' : n}</span>`);
    b.setAttribute('aria-label', `Alertes et rappels : ${n}`);
  }

  /* ---------- Rendu de l'écran courant ---------- */
  let routeCourante = null, paramsCourants = {};
  function dessiner(opts = {}) {
    if (!AK.session.ouverte()) return;
    const { chemin, params } = lireAdresse();
    const route = resoudre(chemin);
    if (route !== chemin && ecrans.has(chemin) && !accessible(chemin)) ui.toast('Cet écran n’est pas accessible avec votre profil.', { type: 'avert' });
    const change = route !== routeCourante;
    routeCourante = route;
    paramsCourants = params;
    const e = ecrans.get(route);
    const sec = sectionDe(route);
    dessinerNav(route);
    const ong = sec && ongletsVisibles(sec).find(([r]) => r === route);
    u.poser($('#ariane'), html`<a href="#accueil">${S().school.name || 'AKWA SCHOOL'}</a>${sec && sec.id !== 'accueil' ? html`${ic('chev')}${ong ? html`<a href="#${ongletsVisibles(sec)[0][0]}">${sec.lib}</a>${ic('chev')}<b>${ong[1]}</b>` : html`<b>${sec.lib}</b>`}` : ''}`);
    document.title = `${(ong && ong[1]) || (sec && sec.lib) || 'Tableau de bord'} · ${S().school.name || 'AKWA SCHOOL'}`;
    // focus et position conservés lors d'un simple rafraîchissement
    const actif = document.activeElement, idActif = actif && actif.id && $('#contenu').contains(actif) ? actif.id : null;
    const sel = idActif && 'selectionStart' in actif ? [actif.selectionStart, actif.selectionEnd] : null;
    const zone = $('#principal'), defil = zone.scrollTop;
    const contenu = $('#contenu');
    try {
      const corps = e.rendu(params, { route });
      u.poser(contenu, html`${sec && sec.onglets && ongletsVisibles(sec).length > 1 && !e.sansOnglets ? ui.onglets(ongletsVisibles(sec).map(([r, l]) => [r, l, e.compteOnglet && e.compteOnglet(r)]), route) : ''}${corps}`);
      if (e.apres) e.apres(contenu, params);
    } catch (err) {
      AK.diag.erreur(err, 'écran ' + route);
      u.poser(contenu, html`${ui.pageTete('Écran indisponible')}${ui.encadre(html`Cet écran n’a pas pu s’afficher à cause d’une erreur inattendue. Vos données ne sont pas touchées. <b>Détail technique :</b> ${err && err.message}`, 'erreur')}<p class="mt"><a class="btn" href="#accueil">${ic('home')}Retour au tableau de bord</a> <a class="btn" href="#parametres/diagnostic">${ic('activity')}Diagnostic</a></p>`);
    }
    if (change && !opts.garderPosition) {
      zone.scrollTop = 0;
      contenu.classList.remove('entree');
      void contenu.offsetWidth;
      contenu.classList.add('entree');
    } else {
      contenu.classList.remove('entree');
      zone.scrollTop = defil;
      if (idActif) {
        const el = document.getElementById(idActif);
        if (el) {
          el.focus({ preventScroll: true });
          if (sel && 'setSelectionRange' in el) try { el.setSelectionRange(sel[0], sel[1]); } catch (x) { /* champ sans sélection */ }
        }
      }
    }
    dessinerTiroir();
    dessinerBandeaux();
    fermerNav();
  }
  let rafRendu = 0;
  const redessiner = () => {
    cancelAnimationFrame(rafRendu);
    rafRendu = requestAnimationFrame(() => dessiner({ garderPosition: true }));
  };

  /* ---------- Bandeaux d'information ---------- */
  function dessinerBandeaux() {
    const B = [];
    if (S().meta.demo) B.push(html`<div class="bandeau demo">${ic('info')}<span>Démonstration : école et élèves fictifs. Les documents portent le filigrane SPÉCIMEN.</span><span class="espace"></span>${AK.session.estDirecteur() ? html`<button type="button" class="btn btn-sm" data-action="quitter-demo">Créer mon école</button>` : ''}</div>`);
    const st = AK.store.sauvegarde;
    if (st.statut === 'erreur') B.push(html`<div class="bandeau erreur" role="alert">${ic('alert')}<span><b>Enregistrement impossible.</b> ${st.message}</span><span class="espace"></span><button type="button" class="btn btn-sm" data-action="reessayer-sauvegarde">Réessayer</button><button type="button" class="btn btn-sm" data-action="aller" data-route="donnees/sauvegarde">Sauvegarder sur clé USB</button></div>`);
    if (AK.stockage.actif && AK.stockage.actif.ephemere) B.push(html`<div class="bandeau erreur">${ic('alert')}<span><b>Aucun enregistrement possible dans ce navigateur</b> (navigation privée ou stockage bloqué). Les modifications seront perdues à la fermeture : exportez une sauvegarde.</span></div>`);
    else if (AK.stockage.description().startsWith('localStorage')) B.push(html`<div class="bandeau avert">${ic('warn')}<span>Stockage de capacité limitée (IndexedDB indisponible) : évitez les photos et sauvegardez souvent.</span></div>`);
    if (AK.session.estDirecteur() && S().securite.forcerChangement && AK.hote.authentificationLocale) B.push(html`<div class="bandeau avert">${ic('lock')}<span>Le mot de passe administrateur est trop faible (ancienne version). Choisissez-en un nouveau.</span><span class="espace"></span><button type="button" class="btn btn-sm" data-action="changer-mdp-admin">Changer maintenant</button></div>`);
    if (AK.session.estDirecteur() && S().securite.aSecourir && AK.hote.authentificationLocale) B.push(html`<div class="bandeau info">${ic('key')}<span>Créez votre code de secours personnel (l’ancien code commun à toutes les installations a été désactivé).</span><span class="espace"></span><button type="button" class="btn btn-sm" data-action="nouveau-secours">Créer le code</button></div>`);
    u.poser($('#bandeaux'), B);
  }
  function dessinerSauvegarde(st) {
    const el = $('#etat-sauvegarde');
    if (!el) return;
    el.className = 'etat-sauvegarde ' + (st.statut === 'ok' ? '' : st.statut);
    const txt = { ok: 'Enregistré', encours: 'Enregistrement…', erreur: 'Non enregistré', ephemere: 'Non conservé' }[st.statut] || '';
    $('.txt', el).textContent = txt;
    el.title = st.statut === 'ok' ? `Enregistré dans ${AK.stockage.description()}` + (st.t ? ' à ' + new Date(st.t).toLocaleTimeString('fr-FR') : '') : st.message || txt;
    if (st.statut === 'erreur' || st.statut === 'ok') dessinerBandeaux();
  }

  /* ---------- Alertes et rappels ---------- */
  function alertes() {
    const L = [], ev = S().school.evalCourante || 1, auj = u.aujourdhui();
    const a = AK.session.agent();
    if (AK.session.estEnseignant()) {
      if (!a) return L;
      const nl = AK.personnel.nonLus(a.id).length;
      if (nl) L.push(['avert', `${u.pluriel(nl, 'message')} du directeur`, 'Messages', () => AK.actions.lancer('lire-messages')]);
      X().clsDe(a).forEach((c) => {
        const m = X().notesManquantes(c, ev);
        if (m) L.push(['avert', `${u.pluriel(m, 'note')} à saisir en ${c}`, AK.cfg.evCourt(ev), () => aller('notes/saisie', { classe: c })]);
        if (X().estJourClasse(auj) && !(S().appel[auj] || {})[c]) L.push(['avert', `Appel du jour à faire en ${c}`, 'Absences', () => aller('absences/appel', { classe: c })]);
      });
      return L;
    }
    const att = Object.keys(S().attente || {}).length;
    if (att) L.push(['avert', `${u.pluriel(att, 'note')} en attente de validation`, 'Saisies des enseignants', () => aller('notes/validation')]);
    const dem = S().auth.filter((x) => x.statut === 'En attente').length;
    if (dem) L.push(['avert', `${u.pluriel(dem, 'demande')} d’autorisation à décider`, 'Absences', () => aller('absences/autorisations', { statut: 'En attente' })]);
    const nd = X().niveaux().filter((c) => !(S().appel[auj] || {})[c]);
    if (X().estJourClasse(auj) && nd.length) L.push(['avert', 'Appel du jour incomplet', nd.join(', '), () => aller('absences/appel', { classe: nd[0] })]);
    const sansEns = X().niveaux().filter((c) => !X().enseignantDe(c));
    if (sansEns.length) L.push(['mauvais', 'Classe(s) sans enseignant', sansEns.join(', '), () => aller('eleves/classes')]);
    const bk = S().lastBackup ? u.ecartJours(S().lastBackup, auj) : null;
    if (bk == null || bk > 7) L.push(['mauvais', 'Sauvegarde sur clé USB à faire', bk == null ? 'Aucune sauvegarde exportée' : `Dernière il y a ${bk} jours`, () => aller('donnees/sauvegarde')]);
    if (!AK.cles.active() && AK.crypto.dispo()) L.push(['avert', 'Signature des documents non configurée', 'Créez la clé de signature de l’école', () => aller('parametres/securite')]);
    return L;
  }
  AK.ui.alertes = alertes;

  /* ---------- Tiroir (fiche élève / personnel) ---------- */
  let tiroir = null; // { type, id }
  const rendusTiroir = {};
  AK.ui.defTiroir = (type, f) => (rendusTiroir[type] = f);
  function ouvrirTiroir(type, id) {
    tiroir = { type, id };
    dessinerTiroir(true);
  }
  function fermerTiroir() {
    tiroir = null;
    dessinerTiroir();
  }
  function dessinerTiroir(focus) {
    let v = $('#voile-tiroir'), t = $('#tiroir');
    if (!tiroir) {
      if (v) v.remove();
      if (t) t.remove();
      return;
    }
    const corps = rendusTiroir[tiroir.type] && rendusTiroir[tiroir.type](tiroir.id);
    if (!corps) return fermerTiroir();
    if (!t) {
      document.body.insertAdjacentHTML('beforeend', '<div class="voile" id="voile-tiroir" data-action="fermer-tiroir"></div><aside class="tiroir" id="tiroir" role="dialog" aria-modal="true" aria-label="Fiche"></aside>');
      t = $('#tiroir');
    }
    u.poser(t, html`<div class="tiroir-tete"><span>${tiroir.type === 'eleve' ? 'Fiche élève' : 'Fiche personnel'}</span><button type="button" class="btn-ic" data-action="fermer-tiroir" aria-label="Fermer la fiche">${ic('x')}</button></div><div class="tiroir-corps">${corps}</div>`);
    if (focus) setTimeout(() => $('.tiroir-tete .btn-ic', t).focus(), 30);
  }
  AK.ui.ouvrirTiroir = ouvrirTiroir;
  AK.ui.fermerTiroir = fermerTiroir;

  /* ---------- Recherche globale ---------- */
  let iRes = 0;
  function itemsRecherche(q) {
    const n = u.norm(q);
    if (!n) return [];
    const R = [];
    const ref = AK.valid.normRef(q);
    if (/^AK-[A-Z]{3}-\d{4}-\d{6}-[0-9A-Z]$/.test(ref) && AK.perm.peut('verification.utiliser'))
      R.push({ f: () => aller('documents/verifier', { ref }), h: html`<span class="av">${ic('qr')}</span><span><b>${ref}</b><small>Vérifier ce document</small></span><span class="k">Référence</span>` });
    X().niveaux().filter((c) => u.norm(c) === n && AK.session.classes().includes(c)).forEach((c) => R.push({ f: () => aller('eleves/liste', { classe: c }), h: html`<span class="av">${c}</span><span><b>Classe ${c}</b><small>${X().actifsDe(c).length} élèves</small></span><span class="k">Classe</span>` }));
    S().students.filter((s) => AK.session.classes().includes(s.classe) && u.norm(s.nom + s.prenoms + s.prenoms + s.nom + s.mat + (s.matNat || '')).includes(n)).sort(X().parClasse).slice(0, 7)
      .forEach((s) => R.push({ f: () => ouvrirTiroir('eleve', s.id), h: html`${ui.avatar(s)}<span><b>${X().nomComplet(s)}</b><small>${s.classe} · ${X().matOf(s)}${s.statut !== 'Inscrit' ? ' · ' + s.statut : ''}</small></span><span class="k">Élève</span>` }));
    if (AK.perm.peut('personnel.voir')) S().teachers.filter((t) => u.norm(t.nom + t.fonction + t.matricule).includes(n)).slice(0, 3)
      .forEach((t) => R.push({ f: () => ouvrirTiroir('agent', t.id), h: html`${ui.avatar(t)}<span><b>${t.nom}</b><small>${t.fonction}${X().clsTxt(t) ? ' · ' + X().clsTxt(t) : ''}</small></span><span class="k">Personnel</span>` }));
    SECTIONS.filter((s) => s.id).forEach((s) => (ongletsVisibles(s).length ? ongletsVisibles(s) : accessible(s.id) ? [[s.id, s.lib]] : []).forEach(([r, l]) => {
      if (u.norm(l + s.lib).includes(n) && R.length < 16) R.push({ f: () => aller(r), h: html`<span class="av">${ic(s.ic)}</span><span><b>${l}</b><small>${s.lib}</small></span><span class="k">Écran</span>` });
    }));
    return R;
  }
  function dessinerRecherche() {
    const inp = $('#recherche'), box = $('#resultats-recherche'), q = inp.value.trim();
    if (!q) {
      box.hidden = true;
      return;
    }
    const L = itemsRecherche(q);
    iRes = Math.min(iRes, Math.max(0, L.length - 1));
    box._items = L;
    u.poser(box, L.length ? html`${L.map((x, i) => html`<button type="button" role="option" class="${i === iRes ? 'hl' : ''}" aria-selected="${i === iRes}" data-i="${i}">${x.h}</button>`)}<div class="rien petit">Entrée : ouvrir · ↑ ↓ : choisir · Échap : fermer</div>` : html`<div class="rien">Aucun résultat pour « ${q} ».</div>`);
    box.hidden = false;
  }
  function brancherRecherche() {
    const inp = $('#recherche'), box = $('#resultats-recherche');
    inp.addEventListener('input', () => {
      iRes = 0;
      dessinerRecherche();
    });
    inp.addEventListener('focus', dessinerRecherche);
    inp.addEventListener('blur', () => setTimeout(() => (box.hidden = true), 150));
    box.addEventListener('mousedown', (e) => e.preventDefault());
    box.addEventListener('click', (e) => {
      const b = e.target.closest('button[data-i]');
      if (!b) return;
      const it = box._items[+b.dataset.i];
      inp.value = '';
      box.hidden = true;
      inp.blur();
      it.f();
    });
    inp.addEventListener('keydown', (e) => {
      const L = box._items || [];
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
        e.preventDefault();
        if (!L.length) return;
        iRes = (iRes + (e.key === 'ArrowDown' ? 1 : -1) + L.length) % L.length;
        dessinerRecherche();
      } else if (e.key === 'Enter') {
        e.preventDefault();
        if (L[iRes]) {
          inp.value = '';
          box.hidden = true;
          inp.blur();
          L[iRes].f();
        }
      } else if (e.key === 'Escape') {
        inp.value = '';
        box.hidden = true;
        inp.blur();
      }
    });
  }

  /* ---------- Navigation mobile, thème, menu réduit ---------- */
  function fermerNav() {
    document.documentElement.classList.remove('nav-ouverte');
    const v = $('#voile-nav');
    if (v) v.remove();
    const b = $('.burger');
    if (b) b.setAttribute('aria-expanded', 'false');
  }
  function appliquerTheme() {
    const r = document.documentElement, sc = S().school;
    r.dataset.accent = sc.accent && sc.accent !== 'navy' ? sc.accent : '';
    if (!r.dataset.accent) delete r.dataset.accent;
    if (sc.theme === 'light' || sc.theme === 'dark') r.dataset.theme = sc.theme;
    else delete r.dataset.theme;
    r.classList.toggle('sans-animation', !!sc.sansAnimation);
  }
  AK.ui.appliquerTheme = appliquerTheme;

  AK.actions.def({
    aller: (el) => aller(el.dataset.route, el.dataset.params ? JSON.parse(el.dataset.params) : undefined),
    'aller-contenu'() {
      $('#contenu').focus();
    },
    'fermer-tiroir': () => fermerTiroir(),
    'ouvrir-nav'() {
      const ouvert = document.documentElement.classList.toggle('nav-ouverte');
      if (ouvert) {
        document.body.insertAdjacentHTML('beforeend', '<div class="voile-nav" id="voile-nav" data-action="fermer-nav"></div>');
        $('.burger').setAttribute('aria-expanded', 'true');
        setTimeout(() => ($('#nav a.actif') || $('#nav a')).focus(), 60);
      } else fermerNav();
    },
    'fermer-nav': fermerNav,
    'replier-menu'() {
      const r = document.documentElement.classList.toggle('side-reduite');
      try {
        localStorage.setItem('akwa2:menu', r ? 'reduit' : '');
      } catch (e) { /* préférence non conservée */ }
      dessinerNav(routeCourante || 'accueil');
    },
    theme() {
      const sombre = matchMedia('(prefers-color-scheme: dark)').matches;
      const cur = S().school.theme === 'auto' || !S().school.theme ? (sombre ? 'dark' : 'light') : S().school.theme;
      AK.store.modifier(null, (s) => (s.school.theme = cur === 'dark' ? 'light' : 'dark'), { rendu: false });
      appliquerTheme();
    },
    alertes(el) {
      const L = alertes();
      ui.menu(el, L.length ? L.map(([niv, a, b, f]) => ({ avant: html`<span class="niv ${niv}"></span>`, lib: a, sous: b, f })) : [html`<div class="vide" style="padding:18px">${ic('checkCircle')}<b>Tout est à jour</b></div>`], 'Alertes et rappels');
    },
    'menu-profil'(el) {
      const items = [];
      if (AK.hote.authentificationLocale) {
        items.push({ icone: 'key', lib: 'Changer mon mot de passe', f: () => AK.actions.lancer(AK.session.estDirecteur() ? 'changer-mdp-admin' : 'changer-mdp-ens') });
        items.push({ icone: 'lock', lib: 'Verrouiller', sous: 'L’écran reste ouvert, mot de passe requis', f: () => AK.app.verrouiller() });
        items.push('sep');
        items.push({ icone: 'logout', lib: 'Se déconnecter', f: () => AK.app.deconnecter() });
      } else items.push({ icone: 'logout', lib: 'Se déconnecter', f: () => AK.hote.appel('deconnexion') });
      ui.menu(el, items, AK.session.libelle());
    },
    'reessayer-sauvegarde': () => AK.store.reessayer()
  });

  /* ---------- Raccourcis clavier ---------- */
  document.addEventListener('keydown', (e) => {
    if (!AK.session.ouverte()) return;
    const saisie = /INPUT|TEXTAREA|SELECT/.test((document.activeElement || {}).tagName || '');
    if ((e.key === 'k' && (e.ctrlKey || e.metaKey)) || (e.key === '/' && !saisie)) {
      if (document.querySelector('dialog[open]')) return;
      e.preventDefault();
      $('#recherche').focus();
    }
    if (e.key === 'Escape' && tiroir && !document.querySelector('dialog[open]')) fermerTiroir();
  });

  AK.shell = {
    construire,
    demarrer() {
      try {
        if (localStorage.getItem('akwa2:menu') === 'reduit') document.documentElement.classList.add('side-reduite');
      } catch (e) { /* stockage indisponible */ }
      brancherRecherche();
      AK.bus.on('change', redessiner);
      AK.bus.on('sauvegarde', dessinerSauvegarde);
      AK.bus.on('erreur-sauvegarde', (st) => ui.toast(st.message, { type: 'erreur', duree: 0 }));
      addEventListener('hashchange', () => {
        fermerTiroir();
        dessiner();
      });
      appliquerTheme();
      dessiner();
    },
    dessiner,
    redessiner,
    aller,
    routeCourante: () => routeCourante,
    params: () => paramsCourants,
    appliquerTheme
  };
})(window.AK);

//# sourceURL=akwa/js/ui/shell.js
</script>
<script>
/* =====================================================================================
   Tableau de bord : situation du jour, effectifs, suivi pédagogique, tâches, agenda.
   Chaque chiffre et chaque ligne « À faire » mène à l'écran concerné, déjà filtré.
   ===================================================================================== */
(function (AK) {
  'use strict';
  const u = AK.u, { html } = u, ic = AK.ic, ui = AK.ui, C = AK.cfg;
  const S = () => AK.store.etat;
  const X = () => AK.calc;

  function aFaire() {
    const x = X(), auj = u.aujourdhui(), ev = S().school.evalCourante || 1, L = [];
    const nv = x.niveaux();
    const ap = S().appel[auj] || {};
    const pasFait = nv.filter((c) => !ap[c] && AK.session.classes().includes(c));
    if (x.estJourClasse(auj) && pasFait.length) L.push(['avert', 'Appel du jour', `Pas encore fait en ${pasFait.join(', ')}`, `absences/appel?classe=${pasFait[0]}`]);
    if (AK.session.estDirecteur()) {
      const att = Object.keys(S().attente || {}).length;
      if (att) L.push(['avert', 'Notes à valider', `${u.pluriel(att, 'note')} saisie(s) par les enseignants`, 'notes/validation']);
      const dem = S().auth.filter((a) => a.statut === 'En attente').length;
      if (dem) L.push(['avert', 'Demandes d’autorisation', `${u.pluriel(dem, 'demande')} en attente de décision`, 'absences/autorisations?statut=En%20attente']);
    }
    const manq = nv.filter((c) => AK.session.classes().includes(c)).map((c) => [c, x.notesManquantes(c, ev)]).filter(([, m]) => m).sort((a, b) => b[1] - a[1]);
    if (manq.length) L.push(['avert', 'Notes manquantes', `${u.pluriel(manq.reduce((a, [, m]) => a + m, 0), 'note')} (${C.evCourt(ev)}), surtout en ${manq[0][0]}`, `notes/saisie?classe=${manq[0][0]}&ev=${ev}`]);
    if (AK.session.estDirecteur()) {
      const sansEns = nv.filter((c) => !x.enseignantDe(c));
      if (sansEns.length) L.push(['mauvais', 'Classes sans enseignant', `${sansEns.join(', ')} : affectez un enseignant`, 'eleves/classes']);
      const sansExtrait = x.actifs().filter((s) => !s.extrait).length;
      if (sansExtrait) L.push(['avert', 'Extraits de naissance', `${u.pluriel(sansExtrait, 'élève')} sans extrait`, 'eleves/liste?dossier=sans']);
      const ages = x.actifs().filter(x.ageAnormal).length;
      if (ages) L.push(['avert', 'Âges à vérifier', `${u.pluriel(ages, 'élève')} avec 3 ans ou plus d’écart à l’âge normal`, 'eleves/liste?dossier=age']);
      const bk = S().lastBackup ? u.ecartJours(S().lastBackup, auj) : null;
      if (bk == null || bk > 7) L.push(['mauvais', 'Sauvegarde sur clé USB', bk == null ? 'Aucune sauvegarde exportée pour l’instant' : `Dernière sauvegarde il y a ${bk} jours`, 'donnees/sauvegarde']);
      if (!AK.cles.active() && AK.crypto.dispo()) L.push(['avert', 'Signature des documents', 'Créez la clé de signature pour des QR codes vérifiables', 'parametres/securite']);
    }
    return L;
  }

  function rendu() {
    const x = X(), sc = S().school, auj = u.aujourdhui(), ev = sc.evalCourante || 1, evC = C.evCourt(ev);
    const classes = AK.session.classes();
    const act = x.actifs().filter((s) => classes.includes(s.classe));
    const g = act.filter((s) => s.sexe === 'Masculin').length, f = act.length - g;
    const ap = S().appel[auj] || {}, att = S().att[auj] || {};
    const faits = classes.filter((c) => ap[c]);
    const attendus = act.filter((s) => ap[s.classe]);
    const absents = attendus.filter((s) => att[s.id]).length;
    const presence = attendus.length ? Math.round(((attendus.length - absents) / attendus.length) * 100) : null;
    const rs = classes.map((c) => x.reussite(c, ev));
    const okN = rs.reduce((a, r) => a + r.ok, 0), evN = rs.reduce((a, r) => a + r.n, 0);
    const manq = classes.reduce((k, c) => k + x.notesManquantes(c, ev), 0);
    const tot = classes.reduce((k, c) => k + x.actifsDe(c).filter((s) => !x.estAbsent(s.id, ev)).length * x.matieres(c, ev).length, 0);
    const pctNotes = tot ? Math.round(((tot - manq) / tot) * 100) : null;
    const h = new Date().getHours(), salut = h < 13 ? 'Bonjour' : h < 18 ? 'Bon après-midi' : 'Bonsoir';
    const agent = AK.session.agent();
    const dir = AK.session.estDirecteur();
    const qui = agent ? agent.nom : sc.director || 'Directeur';
    const dateLongue = new Date().toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });

    const actions = [
      AK.perm.peut('eleve.inscrire') ? html`<button type="button" class="btn clair" data-action="inscrire-eleve">${ic('userPlus')}Inscrire un élève</button>` : '',
      html`<a class="btn" href="#absences/appel">${ic('clip')}Faire l’appel</a>`,
      html`<a class="btn" href="#notes/saisie">${ic('edit')}Saisir les notes</a>`,
      AK.perm.peut('document.emettre') ? html`<a class="btn" href="#documents/emettre">${ic('filePlus')}Émettre un document</a>` : ''
    ];

    const mx = Math.max(1, ...classes.map((c) => x.actifsDe(c).length));
    const effectifs = classes.map((c) => {
      const a = x.actifsDe(c), gg = a.filter((s) => s.sexe === 'Masculin').length, ff = a.length - gg;
      return html`<a class="barre-l" href="#eleves/liste?classe=${c}" data-bulle="${c} : ${gg} garçon(s), ${ff} fille(s)"><span class="nom">${c}</span><span class="piste" style="width:${(a.length / mx) * 100}%">${gg ? html`<i class="g-col" style="flex:${gg}"></i>` : ''}${ff ? html`<i class="f-col" style="flex:${ff}"></i>` : ''}</span><span class="val"><b>${a.length}</b> élève${a.length > 1 ? 's' : ''}</span></a>`;
    });
    const resultats = classes.map((c, i) => {
      const m = x.moyClasse(c, ev), r = rs[i], t = r.n ? Math.round((r.ok / r.n) * 100) : null, e = x.echelle(c);
      return html`<a class="barre-l" href="#notes/resultats?classe=${c}&ev=${ev}" data-bulle="${c} : moyenne ${u.fmtNote(m)} / ${e} ; ${t ?? '—'} % au seuil (${x.info(c).seuil}/${e})"><span class="nom">${c}</span><span class="piste fond">${m != null ? html`<i class="pri" style="width:${(m / e) * 100}%"></i>` : ''}<span class="ref" style="left:${(x.info(c).seuil / e) * 100}%"></span></span><span class="val"><b>${u.fmtNote(m)}</b>/${e} · ${t ?? '—'} %</span></a>`;
    });
    const jours = x.derniersJoursClasse(10, auj);
    const parJour = jours.map((d) => {
      const m = S().att[d] || {}, v = Object.entries(m).filter(([id]) => act.some((s) => s.id === id));
      return { d, a: v.filter(([, z]) => z === 'A').length, j: v.filter(([, z]) => z === 'J').length };
    });
    const amx = Math.max(4, ...parJour.map((z) => z.a + z.j));
    const premiers = classes.map((c) => {
      const t = x.classement(c, ev).w[0];
      return t ? html`<button type="button" data-action="fiche-eleve" data-id="${t.s.id}">${ui.avatar(t.s)}<span class="tronque"><b>${x.nomComplet(t.s)}</b><br><span class="mut petit">${c}</span></span><span class="m"><b style="color:var(--ink)">${u.fmtNote(t.avg)}</b> / ${x.echelle(c)}</span></button>` : '';
    }).filter((z) => String(z));
    const dt = (s) => {
      const d = u.parseISO(s);
      return html`<span class="dt"><b>${d.getDate()}</b>${d.toLocaleDateString('fr-FR', { month: 'short' })}</span>`;
    };
    const prochaineEval = [1, 2, 3, 4].map((n) => ({ n, d: x.evalDate('CP1', n) })).find((z) => z.d >= auj);
    const agenda = [
      ...S().auth.filter((a) => a.statut === 'En attente' && AK.absences.visible(a)).slice(0, 3).map((a) => html`<a href="#absences/autorisations?statut=En%20attente">${dt(a.du)}<span class="tronque"><b>${a.nom}</b><br><span class="mut petit">${a.motif} · ${a.ref}</span></span><span class="m">${ui.tag('À décider', 'avert')}</span></a>`),
      ...(prochaineEval ? [html`<a href="#notes/saisie?ev=${prochaineEval.n}">${dt(prochaineEval.d)}<span><b>${C.EV_GEN[prochaineEval.n - 1]}</b><br><span class="mut petit">Date prévue au calendrier</span></span><span class="m">${ui.tag('Évaluation', 'acc')}</span></a>`] : []),
      ...S().pro.events.filter((e) => e.date >= auj).sort((a, b) => a.date.localeCompare(b.date)).slice(0, 2).map((e) => html`<a href="#vie/calendrier">${dt(e.date)}<span><b>${e.titre}</b></span><span class="m">${ui.tag('Événement', 'pri')}</span></a>`),
      ...S().conges.filter((c) => (c.au || c.du) >= auj).sort((a, b) => a.du.localeCompare(b.du)).slice(0, 2).map((c) => html`<a href="#parametres/calendrier">${dt(c.du)}<span><b>${c.lib}</b><br><span class="mut petit">${c.au ? `du ${u.fmtDate(c.du)} au ${u.fmtDate(c.au)}` : u.fmtDate(c.du)}</span></span><span class="m">${ui.tag(c.au ? 'Congés' : 'Férié')}</span></a>`)
    ];
    const messages = (S().messages || []).filter((m) => !agent || !m.dest || m.dest === agent.id).slice(0, 4);
    const taches = aFaire();
    const P = S().pro;

    return html`<section class="accueil-tete"><div style="position:relative;z-index:1"><span class="surtitre">${sc.name || 'AKWA SCHOOL'} · ${agent ? 'Espace enseignant' : 'Direction'}</span><h1>${salut}, ${qui}</h1><p>${dateLongue.charAt(0).toUpperCase() + dateLongue.slice(1)}${sc.iepp ? ' · ' + sc.iepp : ''}${sc.drenaet ? ' · ' + sc.drenaet : ''}</p>
        <div class="puces">${sc.year ? html`<span>Année scolaire ${sc.year}</span>` : html`<span class="acc">Année scolaire à renseigner</span>`}<span>${evC}</span>${agent ? html`<span>${x.clsTxt(agent) || 'Sans classe'}</span>` : ''}${S().meta.demo ? html`<span class="acc">Démonstration</span>` : ''}</div></div>
      <div class="actions-rapides">${actions}</div></section>

    <div class="titre-section"><h2>${agent ? 'Ma classe' : 'Effectifs et suivi'} · ${evC}</h2>${dir ? html`<a class="btn btn-sm btn-ghost" href="#rapports/stats">${ic('chart')}Statistiques détaillées</a>` : ''}</div>
    <div class="grille g5 mb">
      ${ui.kpi({ lien: 'eleves/liste', icone: 'users', lib: 'Élèves inscrits', val: act.length, sous: `${g} garçons · ${f} filles`, extra: html`<div class="repartition" aria-hidden="true"><i class="g-col" style="flex:${g || 0}"></i><i class="f-col" style="flex:${f || 0}"></i></div>` })}
      ${ui.kpi({ lien: 'absences/appel', icone: 'clip', lib: 'Assiduité aujourd’hui', val: presence == null ? '—' : html`${presence}<small>%</small>`, sous: `${absents} absent(s) · appel fait dans ${faits.length}/${classes.length} classe(s)` })}
      ${ui.kpi({ lien: dir && Object.keys(S().attente || {}).length ? 'notes/validation' : 'notes/saisie', icone: 'edit', lib: 'Notes saisies', val: pctNotes == null ? '—' : html`${pctNotes}<small>%</small>`, sous: `${u.pluriel(manq, 'note')} encore à saisir${dir && Object.keys(S().attente || {}).length ? ` · ${Object.keys(S().attente).length} à valider` : ''}`, ton: manq ? 'avert' : '' })}
      ${ui.kpi({ lien: 'notes/resultats', icone: 'award', lib: 'Réussite', val: evN ? html`${Math.round((okN / evN) * 100)}<small>%</small>` : '—', sous: `${okN} élève(s) sur ${evN} au seuil` })}
      ${dir ? ui.kpi({ lien: 'eleves/liste?dossier=sans', icone: 'file', lib: 'Dossiers à compléter', val: act.filter((s) => !s.extrait).length, sous: `élève(s) sans extrait · ${act.filter(x.ageAnormal).length} âge(s) à vérifier`, ton: act.some((s) => !s.extrait) ? 'acc' : '' }) : ui.kpi({ lien: 'absences/autorisations', icone: 'cal', lib: 'Demandes d’absence', val: S().auth.filter((a) => a.statut === 'En attente' && AK.absences.visible(a)).length, sous: 'en attente de décision' })}
    </div>

    <div class="grille g-2-1 mb">
      ${ui.carte('Effectifs par classe', html`<div class="barres">${effectifs.length ? effectifs : ui.vide('Aucune classe', 'Aucun niveau n’est ouvert.')}</div>`, { sous: `${act.length} élèves inscrits`, actions: html`<div class="legende"><span><i class="g-col"></i>Garçons</span><span><i class="f-col"></i>Filles</span></div>` })}
      ${ui.carte('À faire', taches.length ? html`<div class="liste a-faire">${taches.map(([niv, t, s, lien]) => html`<a href="#${lien}"><span class="niv ${niv}"></span><span class="flex1"><b>${t}</b><small>${s}</small></span>${ic('chev')}</a>`)}</div>` : html`<div class="vide">${ic('checkCircle', 'i-lg')}<b>Tout est à jour</b></div>`, { actions: html`<span class="puce">${taches.length}</span>` })}
    </div>

    <div class="grille g3 mb">
      ${ui.carte('Résultats par classe', html`<div class="barres">${resultats}</div>`, { sous: `${evC} · moyenne et seuil (trait)` })}
      ${ui.carte('Absences', html`<div class="colonnes">${parJour.map((z) => html`<a href="#absences/appel?date=${z.d}" data-bulle="${u.fmtJour(z.d)} : ${z.a} non justifiée(s), ${z.j} justifiée(s)" style="display:flex;flex-direction:column;justify-content:flex-end;text-decoration:none"><b>${z.a + z.j || ''}</b>${z.j ? html`<i class="g-col" style="height:${(z.j / amx) * 118}px"></i>` : ''}${z.a ? html`<i class="f-col" style="height:${(z.a / amx) * 118}px"></i>` : ''}</a>`)}</div><div class="etiq-col">${parJour.map((z) => html`<span>${'DLMMJVS'[u.parseISO(z.d).getDay()]}<br>${u.parseISO(z.d).getDate()}</span>`)}</div>`, { sous: '10 derniers jours de classe', actions: html`<div class="legende"><span><i class="f-col"></i>Non justifiées</span><span><i class="g-col"></i>Justifiées</span></div>` })}
      ${ui.carte('Premiers de classe', premiers.length ? html`<div class="liste">${premiers}</div>` : ui.vide('Aucune note saisie', 'Les premiers apparaîtront dès la saisie des notes.'), { sous: evC, actions: html`<a class="btn btn-sm btn-ghost" href="#notes/resultats">Classements</a>` })}
    </div>

    <div class="grille g3 mb">
      ${ui.carte('Agenda', agenda.length ? html`<div class="liste">${agenda}</div>` : ui.vide('Rien de prévu'), { actions: html`<a class="btn btn-sm btn-ghost" href="#vie/calendrier">Calendrier</a>` })}
      ${ui.carte('Messages', messages.length ? html`<div class="liste">${messages.map((m) => html`<div><span class="av">${ic('mail')}</span><span class="tronque"><b>${m.titre}</b><br><span class="mut petit">${new Date(m.t).toLocaleDateString('fr-FR', { day: '2-digit', month: 'short' })} · ${m.dest ? (S().teachers.find((t) => t.id === m.dest) || {}).nom || '' : 'tous les enseignants'}</span></span></div>`)}</div>` : ui.vide('Aucun message'), { actions: dir ? html`<a class="btn btn-sm btn-ghost" href="#personnel/messages">Écrire</a>` : agent && AK.personnel.nonLus(agent.id).length ? html`<button type="button" class="btn btn-sm btn-pri" data-action="lire-messages">Lire (${AK.personnel.nonLus(agent.id).length})</button>` : '' })}
      ${dir ? ui.carte('Activité récente', S().pro.journal.length ? html`<div class="liste">${S().pro.journal.slice(0, 6).map((l) => html`<div><span class="tag pri">${new Date(l.t).toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit' })}</span><span class="tronque" title="${l.m}">${l.m}</span></div>`)}</div>` : ui.vide('Aucune activité'), { actions: html`<a class="btn btn-sm btn-ghost" href="#donnees/journal">Journal</a>` }) : ui.carte('Ma classe', html`<dl class="kv"><dt>Classe(s)</dt><dd>${agent ? x.clsTxt(agent) || '—' : '—'}</dd><dt>Élèves</dt><dd>${act.length}</dd><dt>Notes en attente</dt><dd>${Object.keys(S().attente).filter((k) => act.some((s) => k.startsWith(s.id + '|'))).length}</dd><dt>Saisie (${evC})</dt><dd>${classes.map((c) => `${c} : ${AK.notes.saisieOuverte(c, ev) ? 'ouverte' : 'fermée'}`).join(' · ')}</dd></dl>`)}
    </div>

    ${dir ? html`<div class="titre-section"><h2>Gestion de l’école</h2></div>
    <div class="grille g4">
      ${ui.kpi({ lien: 'finances/paiements', icone: 'coin', lib: 'Cotisations encaissées', val: (() => { const du = x.actifs().reduce((a, s) => a + AK.pro.duDe(s), 0); return du ? u.pct(AK.pro.encaisse(), du) : u.fcfa(AK.pro.encaisse()); })(), sous: `${u.fcfa(AK.pro.encaisse())} encaissés`, ton: 'acc' })}
      ${ui.kpi({ lien: 'vie/discipline', icone: 'shield', lib: 'Faits en cours', val: P.incidents.filter((z) => z.statut === 'En cours').length, sous: 'registre de discipline' })}
      ${ui.kpi({ lien: 'services/biblio', icone: 'book', lib: 'Prêts en retard', val: P.prets.filter((p) => !p.rendu && p.due < auj).length, sous: 'bibliothèque' })}
      ${ui.kpi({ lien: 'documents/registre', icone: 'fileCheck', lib: 'Documents émis', val: S().docs.items.filter((d) => d.statut === 'valide').length, sous: `${S().docs.items.filter((d) => d.statut === 'annule').length} annulé(s) · registre` })}
    </div>` : ''}`;
  }

  AK.ecrans.def('accueil', { rendu, sansOnglets: true });
  AK.accueil = { aFaire };
})(window.AK);

//# sourceURL=akwa/js/screens/accueil.js
</script>
<script>
(function (AK) { AK.gabaritVerificateur = ""; })(window.AK);

//# sourceURL=akwa/verificateur
</script>
<script>
/* =====================================================================================
   Démarrage : chargement des données, assistant de création, reprise des données 1.x,
   démonstration, connexion, verrouillage après inactivité, déconnexion.
   ===================================================================================== */
(function (AK) {
  'use strict';
  const u = AK.u, { html, raw, $, $$ } = u, ic = AK.ic, ui = AK.ui, C = AK.cfg, V = AK.valid;
  const S = () => AK.store.etat;
  let coqueConstruite = false, minuterieVerrou = null;

  /* ---------- Écran plein (accueil, connexion, verrou) ---------- */
  function ecranPlein(contenu, { photo = true } = {}) {
    let el = $('#ecran-plein');
    if (!el) {
      el = document.createElement('section');
      el.id = 'ecran-plein';
      el.className = 'ecran-plein';
      document.body.appendChild(el);
    }
    const P = AK.assets.photos || {};
    u.poser(el, html`${photo ? html`<div class="ep-visuel" aria-hidden="true">${P.maitre ? html`<img src="${P.maitre}" alt="">` : ''}<div class="ep-legende"><b>L’école primaire, mieux organisée chaque jour.</b><span>Élèves, notes, bulletins, absences, documents officiels et rapports de l’IEPP — sur cet ordinateur, sans Internet.</span></div></div>` : ''}<div class="ep-panneau"><div class="ep-contenu">${contenu}</div><p class="ep-pied">${AK.NOM} ${AK.VERSION} · ${AK.hote.libelle} · données enregistrées sur cet appareil</p></div>`);
    el.classList.toggle('sans-photo', !photo);
    el.hidden = false;
    document.body.classList.add('a-ecran-plein');
    const app = $('#app');
    if (app) app.setAttribute('inert', '');
    return el;
  }
  function fermerEcranPlein() {
    const el = $('#ecran-plein');
    if (el) el.remove();
    document.body.classList.remove('a-ecran-plein');
    const app = $('#app');
    if (app) app.removeAttribute('inert');
  }
  const marque = (titre, sous) => html`<div class="ep-marque"><img src="${AK.assets.logo}" alt=""><div><b>AKWA SCHOOL</b><small>Gestion scolaire de l’école primaire · ${AK.VERSION}</small></div></div><h1>${titre}</h1>${sous ? html`<p class="ep-sous">${sous}</p>` : ''}`;

  /* ---------- Assistant de première ouverture ---------- */
  function assistant() {
    const ancien = AK.hote.type !== 'bureau' ? AK.stockage.ancienneVersion() : null;
    const el = ecranPlein(html`${marque('Bienvenue', 'Aucune école n’est encore enregistrée dans ce navigateur. Comment voulez-vous commencer ?')}
      <div class="ep-choix">
        ${ancien ? html`<button type="button" class="ep-option recommande" data-ep="ancien">${ic('history')}<span><b>Reprendre les données d’AKWA SCHOOL 1.x</b><small>${ancien.school && ancien.school.name ? ancien.school.name + ' · ' : ''}${u.pluriel(ancien.students.length, 'élève')} trouvés dans ce navigateur. Les anciennes données ne sont pas effacées.</small></span>${ic('chev')}</button>` : ''}
        <button type="button" class="ep-option${ancien ? '' : ' recommande'}" data-ep="creer">${ic('school')}<span><b>Créer mon école</b><small>Identité de l’école, niveaux ouverts, mot de passe du directeur.</small></span>${ic('chev')}</button>
        <label class="ep-option" tabindex="0">${ic('up')}<span><b>Restaurer une sauvegarde</b><small>Fichier .akwa.json, ou sauvegarde .json d’AKWA SCHOOL 1.x.</small></span>${ic('chev')}<input type="file" accept=".json,application/json" hidden data-ep-fichier></label>
        <button type="button" class="ep-option" data-ep="demo">${ic('eye')}<span><b>Découvrir avec une école de démonstration</b><small>Élèves et notes fictifs ; documents marqués SPÉCIMEN.</small></span>${ic('chev')}</button>
      </div>
      ${!AK.crypto.dispo() ? ui.encadre('La cryptographie du navigateur est indisponible : ouvrez ce fichier avec Chrome, Edge ou Firefox récent.', 'erreur') : ''}`);
    el.querySelector('[data-ep="creer"]').onclick = () => assistantEcole();
    el.querySelector('[data-ep="demo"]').onclick = () => lancerDemo();
    if (ancien) el.querySelector('[data-ep="ancien"]').onclick = () => reprendre1x(ancien);
    const lab = el.querySelector('label.ep-option');
    lab.addEventListener('keydown', (e) => (e.key === 'Enter' || e.key === ' ') && (e.preventDefault(), lab.querySelector('input').click()));
    el.querySelector('[data-ep-fichier]').onchange = async (e) => {
      const f = e.target.files[0];
      e.target.value = '';
      if (!f) return;
      try {
        const a = await AK.sauvegarde.analyser(await f.text());
        if (!a.valide) return ui.info('Sauvegarde refusée', html`<div class="pile">${a.notes.map((n) => ui.encadre(n, 'erreur'))}</div>`, { icone: 'alert' });
        const ok = await ui.confirmer({ titre: 'Restaurer cette sauvegarde ?', message: apercuSauvegarde(a), ok: 'Restaurer' });
        if (!ok) return;
        await installer(a.etat, a.notes);
      } catch (err) {
        ui.erreur(err);
      }
    };
    setTimeout(() => (el.querySelector('.ep-option') || {}).focus && el.querySelector('.ep-option').focus(), 50);
  }

  function apercuSauvegarde(a) {
    const c = a.infos.contenu || {};
    return html`<div class="pile-sm"><dl class="kv"><dt>École</dt><dd>${(a.infos.ecole && a.infos.ecole.nom) || '—'}</dd><dt>Année</dt><dd>${(a.infos.ecole && a.infos.ecole.annee) || '—'}</dd>${a.infos.creeLe ? html`<dt>Sauvegardée le</dt><dd>${u.fmtHorodatage(a.infos.creeLe)}</dd>` : ''}<dt>Contenu</dt><dd>${u.pluriel(c.eleves || 0, 'élève')}, ${u.pluriel(c.personnel || 0, 'membre')} du personnel, ${u.pluriel(c.notes || 0, 'note')}, ${u.pluriel(c.documents || 0, 'document')}</dd><dt>Intégrité</dt><dd>${a.integrite === 'ok' ? ui.tag('Empreinte SHA-256 vérifiée', 'ok', 'shieldCheck') : a.integrite === 'locale' ? ui.tag('Copie locale', 'pri') : ui.tag('Pas d’empreinte (ancien format)', 'avert')}</dd></dl>${(a.notes || []).map((n) => ui.encadre(n))}${(a.problemes || []).length ? ui.encadre(html`<b>${u.pluriel(a.problemes.length, 'incohérence')} détectée(s)</b> (affichée(s) dans Diagnostic après la restauration).`, 'avert') : ''}</div>`;
  }
  AK.app_apercuSauvegarde = apercuSauvegarde;

  async function reprendre1x(ancien) {
    try {
      const { etat, notes } = AK.schema.migrer(ancien);
      const ok = await ui.confirmer({
        titre: 'Reprendre les données 1.x',
        message: html`<div class="pile-sm"><p class="mb0">${u.pluriel(etat.students.length, 'élève')}, ${u.pluriel(etat.teachers.length, 'membre')} du personnel et ${u.pluriel(Object.keys(etat.grades).length, 'note')} seront repris. Les données d’origine restent intactes dans le navigateur.</p>${notes.map((n) => ui.encadre(n))}${ui.encadre(html`Pour cette première connexion, utilisez <b>votre ancien mot de passe administrateur</b> (par défaut « admin »). Il vous sera demandé d’en choisir un plus sûr.`, 'avert', 'key')}</div>`,
        ok: 'Reprendre les données'
      });
      if (ok) await installer(etat, notes);
    } catch (e) {
      ui.erreur(e);
    }
  }

  async function installer(etat, notes) {
    await AK.auth.migrerSecrets(etat);
    AK.store.installer(etat);
    const ok = await AK.store.maintenant();
    if (!ok) ui.toast('Les données sont chargées mais n’ont pas pu être enregistrées : vérifiez le stockage du navigateur.', { type: 'erreur', duree: 0 });
    else ui.toast((notes && notes[0]) || 'Données chargées.');
    connexion();
  }

  function assistantEcole() {
    const brouillon = {};
    const etape1 = () => {
      ecranPlein(html`${marque('Votre école', 'Ces informations figurent dans l’en-tête des documents officiels. Elles restent modifiables dans Paramètres.')}
        <div class="etapes" aria-label="Étape 1 sur 3"><span class="fait"></span><span></span><span></span></div>
        <form class="pile" novalidate data-ep-form>
          ${ui.champ.radios({ nom: 'statut', lib: 'Statut', options: C.STATUTS_ECOLE, val: brouillon.statut || 'publique' })}
          <div class="form-grille">
            ${ui.champ.texte({ nom: 'name', lib: 'Nom de l’école', req: true, val: brouillon.name, plein: true, attrs: { placeholder: 'EPP … (école publique)', autocapitalize: 'characters', maxlength: 80 } })}
            ${ui.champ.texte({ nom: 'drenaet', lib: 'DRENAET', req: true, val: brouillon.drenaet, attrs: { placeholder: 'ex. TOUBA', autocapitalize: 'characters' } })}
            ${ui.champ.texte({ nom: 'iepp', lib: 'IEPP', val: brouillon.iepp, attrs: { placeholder: 'ex. IEPP OUANINOU' } })}
            ${ui.champ.texte({ nom: 'localite', lib: 'Localité', val: brouillon.localite })}
            ${ui.champ.tel({ nom: 'dirTel', lib: 'Contact du directeur', val: brouillon.dirTel })}
            ${ui.champ.choix({ nom: 'dirCiv', lib: 'Civilité du directeur', options: C.CIVS, val: brouillon.dirCiv || 'M.', req: true })}
            ${ui.champ.texte({ nom: 'director', lib: 'Directeur / directrice (nom et prénoms)', req: true, val: brouillon.director, attrs: { placeholder: 'ex. OUATTARA Siaka' } })}
          </div>
          <div class="ligne-entre"><button type="button" class="btn btn-ghost" data-ep-retour>${ic('chevL')}Retour</button><button class="btn btn-pri btn-lg">Continuer${ic('chev')}</button></div>
        </form>`);
      const f = $('[data-ep-form]');
      $('[data-ep-retour]').onclick = () => assistant();
      f.onsubmit = (e) => {
        e.preventDefault();
        ui.effacerErreurs(f);
        const d = ui.lireFormulaire(f);
        Object.assign(brouillon, d);
        const prive = d.statut === 'privee';
        if (!V.ecoleNom(d.name, prive)) return ui.erreurChamp(f, 'name', V.ECOLE_ERR(prive));
        if (!V.drenaetDe(d.drenaet)) return ui.erreurChamp(f, 'drenaet', 'Indiquez la DRENAET (ex. TOUBA).');
        const e2 = V.nom(d.director, 'Directeur') || V.tel(d.dirTel, 'Contact du directeur');
        if (e2) return ui.erreurChamp(f, /Contact/.test(e2) ? 'dirTel' : 'director', e2);
        etape2();
      };
      setTimeout(() => f.querySelector('[name=name]').focus(), 50);
    };
    const etape2 = () => {
      const an = new Date().getMonth() < 7 ? new Date().getFullYear() - 1 : new Date().getFullYear();
      const annees = [an - 1, an, an + 1].map((y) => `${y}–${y + 1}`);
      ecranPlein(html`${marque('Organisation de l’année', 'Niveaux ouverts dans l’école et année scolaire en cours.')}
        <div class="etapes" aria-label="Étape 2 sur 3"><span class="fait"></span><span class="fait"></span><span></span></div>
        <form class="pile" novalidate data-ep-form>
          ${ui.champ.choix({ nom: 'year', lib: 'Année scolaire', options: annees, val: brouillon.year || `${an}–${an + 1}`, req: true })}
          ${ui.champ.cases({ nom: 'niveaux', lib: 'Niveaux ouverts dans l’école', options: C.TOUS_NIVEAUX, valeurs: brouillon.niveaux || C.TOUS_NIVEAUX })}
          ${ui.champ.choix({ nom: 'evalCourante', lib: 'Évaluation en cours', options: [1, 2, 3, 4].map((n) => [n, C.EV_GEN[n - 1]]), val: brouillon.evalCourante || 1 })}
          <div class="ligne-entre"><button type="button" class="btn btn-ghost" data-ep-retour>${ic('chevL')}Retour</button><button class="btn btn-pri btn-lg">Continuer${ic('chev')}</button></div>
        </form>`);
      const f = $('[data-ep-form]');
      $('[data-ep-retour]').onclick = etape1;
      f.onsubmit = (e) => {
        e.preventDefault();
        ui.effacerErreurs(f);
        const d = ui.lireFormulaire(f);
        if (!d.niveaux.length) return ui.erreurChamp(f, 'niveaux', 'Cochez au moins un niveau.');
        Object.assign(brouillon, d);
        etape3();
      };
    };
    const etape3 = () => {
      ecranPlein(html`${marque('Mot de passe du directeur', 'Il protège les opérations sensibles : corrections de notes, suppressions, restauration, signature des documents.')}
        <div class="etapes" aria-label="Étape 3 sur 3"><span class="fait"></span><span class="fait"></span><span class="fait"></span></div>
        <form class="pile" novalidate data-ep-form>
          <div class="champ"><label for="ep-mdp">Mot de passe (${C.SECU.MDP_MIN} caractères au moins, lettres et chiffres)</label><input id="ep-mdp" class="inp" type="password" name="mdp" autocomplete="new-password" required data-force><div class="force" data-n="0" aria-hidden="true"><i></i><i></i><i></i><i></i></div></div>
          <div class="champ"><label for="ep-mdp2">Confirmez le mot de passe</label><input id="ep-mdp2" class="inp" type="password" name="mdp2" autocomplete="new-password" required></div>
          ${ui.encadre('Ce mot de passe n’est jamais conservé en clair. Un code de secours vous sera remis pour le cas où vous l’oublieriez.', '', 'lock')}
          <div class="ligne-entre"><button type="button" class="btn btn-ghost" data-ep-retour>${ic('chevL')}Retour</button><button class="btn btn-pri btn-lg">Créer l’école</button></div>
        </form>`);
      const f = $('[data-ep-form]');
      $('[data-ep-retour]').onclick = etape2;
      brancherForce(f);
      f.onsubmit = async (e) => {
        e.preventDefault();
        ui.effacerErreurs(f);
        const d = ui.lireFormulaire(f);
        const err = V.motDePasse(d.mdp);
        if (err) return ui.erreurChamp(f, 'mdp', err);
        if (d.mdp !== d.mdp2) return ui.erreurChamp(f, 'mdp2', 'Les deux mots de passe ne sont pas identiques.');
        const b = f.querySelector('.btn-pri');
        b.classList.add('occupe');
        try {
          const etat = AK.schema.vierge();
          const prive = brouillon.statut === 'privee';
          const dr = V.drenaetDe(brouillon.drenaet);
          Object.assign(etat.school, {
            statut: prive ? 'privee' : 'publique', name: V.ecoleNom(brouillon.name, prive), drenaet: dr.drenaet, direction: dr.direction,
            iepp: String(brouillon.iepp || '').trim().toUpperCase(), localite: String(brouillon.localite || '').trim().toUpperCase(),
            director: V.civ.avec(brouillon.dirCiv, brouillon.director), dirTel: V.telPropre(brouillon.dirTel),
            year: brouillon.year, niveaux: C.TOUS_NIVEAUX.filter((c) => brouillon.niveaux.includes(c)), evalCourante: Number(brouillon.evalCourante) || 1, idLock: true
          });
          if (etat.school.iepp && !/^IEPP/.test(etat.school.iepp)) etat.school.iepp = 'IEPP ' + etat.school.iepp;
          if (etat.school.iepp) etat.school.inspection = C.ENTETE.inspection + ' DE ' + etat.school.iepp.replace(/^IEPP\s+/, '');
          AK.store.installer(etat);
          AK.store.journaliser('École créée : ' + etat.school.name);
          const code = await AK.auth.configurerAdmin(d.mdp);
          const ok = await AK.store.maintenant();
          montrerCodeSecours(code, () => {
            AK.session.ouvrir({ role: 'dir' });
            AK.cles.deverrouiller(d.mdp).catch(() => {});
            ouvrirApplication();
            if (!ok) ui.toast('L’école est créée mais l’enregistrement a échoué : vérifiez le stockage du navigateur.', { type: 'erreur', duree: 0 });
            else ui.toast('Votre école est créée. Commencez par inscrire les élèves ou importer le fichier Excel de l’IEPP.');
          });
        } catch (er) {
          b.classList.remove('occupe');
          ui.erreur(er);
        }
      };
      setTimeout(() => f.querySelector('[name=mdp]').focus(), 50);
    };
    etape1();
  }

  function brancherForce(racine) {
    $$('[data-force]', racine).forEach((i) => {
      const barre = i.parentElement.querySelector('.force');
      i.addEventListener('input', () => barre.setAttribute('data-n', i.value ? String(Math.max(1, V.forceMotDePasse(i.value))) : '0'));
    });
  }
  AK.ui.brancherForce = brancherForce;

  /** Code de secours : affiché une seule fois, l'utilisateur confirme l'avoir noté. */
  function montrerCodeSecours(code, suite) {
    ui.fenetre({
      titre: 'Votre code de secours', icone: 'key', taille: 'sm', ok: 'J’ai noté le code', annuler: false, proteger: false,
      corps: html`<div class="pile"><p class="mb0">Il permet de choisir un nouveau mot de passe si vous oubliez le vôtre, sans Internet. <b>Notez-le sur papier et rangez-le en lieu sûr</b> : il ne sera plus affiché.</p>
        <p class="code-secours" aria-label="Code de secours">${code}</p>
        <label class="coche"><input type="checkbox" name="note" required> J’ai noté ce code et je l’ai rangé en lieu sûr.</label></div>`,
      surValider(d) {
        if (!d.note) throw new AK.ErreurMetier('Cochez la case pour confirmer que vous avez noté le code.', 'note');
      },
      surFermer: suite
    });
  }
  AK.ui.montrerCodeSecours = montrerCodeSecours;

  async function lancerDemo() {
    try {
      const etat = AK.demo.creer();
      await AK.demo.comptes(etat);
      AK.store.installer(etat);
      await AK.store.maintenant();
      connexion();
    } catch (e) {
      ui.erreur(e);
    }
  }

  /* ---------- Connexion ---------- */
  function connexion() {
    if (AK.hote.type === 'bureau') return sessionBureau();
    const sc = S().school;
    const profils = [['', S().school.solo ? 'Mon espace (enseignant)' : 'Directeur (administrateur)', sc.director || 'Toute l’école', null]];
    if (!sc.solo) S().teachers.filter((t) => t.compte && t.compte.actif && t.actif !== false).forEach((t) => profils.push([t.compte.login, t.nom, 'Enseignant · ' + (AK.calc.clsTxt(t) || 'sans classe'), t]));
    let choix = '';
    const el = ecranPlein(html`${marque(sc.name || 'Connexion', [sc.iepp, sc.drenaet, sc.year ? 'Année ' + sc.year : ''].filter(Boolean).join(' · '))}
      <form class="pile" novalidate data-ep-form>
        <div class="champ"><span class="lib">Profil</span><div class="ep-profils" role="radiogroup" aria-label="Profil">${profils.map(([v, l, s, t], i) => html`<button type="button" class="ep-profil" role="radio" aria-checked="${i === 0}" data-v="${v}">${t ? ui.avatar(t) : html`<span class="av">${ic('key')}</span>`}<span><b>${l}</b><small>${s}</small></span><span class="ck"></span></button>`)}</div></div>
        <div class="champ"><label for="ep-mdp">Mot de passe</label><input id="ep-mdp" class="inp" type="password" name="mdp" autocomplete="current-password" required></div>
        <button class="btn btn-pri btn-lg" type="submit">${ic('unlock')}Se connecter</button>
        <div class="ligne-entre petit"><button type="button" class="lien mut" data-ep-oubli>Mot de passe oublié ?</button><span class="mut">${ic('shield', 'i-sm')} Accès protégé sur cet appareil</span></div>
        ${S().meta.demo ? ui.encadre(html`<b>Démonstration</b> — directeur : <code>${AK.demo.DEMO_MDP}</code> · enseignants : <code>${AK.demo.DEMO_MDP_ENS}</code>`, 'avert', 'info') : ''}
      </form>`);
    const f = $('[data-ep-form]', el);
    $$('.ep-profil', el).forEach((b) => {
      b.onclick = () => {
        choix = b.dataset.v;
        $$('.ep-profil', el).forEach((x) => x.setAttribute('aria-checked', String(x === b)));
        f.mdp.focus();
      };
      b.onkeydown = (e) => {
        const B = $$('.ep-profil', el), i = B.indexOf(b);
        if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
          e.preventDefault();
          const n = B[(i + (e.key === 'ArrowDown' ? 1 : -1) + B.length) % B.length];
          n.focus();
          n.click();
        }
      };
    });
    $('[data-ep-oubli]', el).onclick = () => (choix ? ui.info('Mot de passe oublié', 'Demandez au directeur de vous donner un nouveau mot de passe provisoire (Personnel › Comptes enseignants).', { icone: 'key' }) : motDePasseOublie());
    f.onsubmit = async (e) => {
      e.preventDefault();
      ui.effacerErreurs(f);
      const b = f.querySelector('.btn-pri');
      b.classList.add('occupe');
      try {
        const r = await AK.auth.connecter(choix, f.mdp.value);
        if (r.role === 'dir' && S().school.solo) {
          r.role = 'ens';
          r.tid = S().school.solo.tid;
        }
        AK.session.ouvrir(r);
        AK.store.journaliser(r.role === 'dir' ? 'Connexion du directeur' : 'Connexion enseignant');
        ouvrirApplication();
        if (r.provisoire && r.role === 'ens' && !S().school.solo) setTimeout(() => changerMdpEnseignant(true), 100);
      } catch (err) {
        b.classList.remove('occupe');
        if (err.name === 'ErreurMetier') {
          ui.erreurChamp(f, 'mdp', err.message);
          f.mdp.select();
          await u.attendre(600); // ralentit les essais au hasard
        } else ui.erreur(err);
      }
    };
    setTimeout(() => f.mdp.focus(), 60);
  }

  function sessionBureau() {
    const s = AK.hote.session || { role: 'dir' };
    AK.session.ouvrir(s.role === 'ens' ? { role: 'ens', tid: s.tid, login: s.login } : { role: 'dir' });
    ouvrirApplication();
  }

  function ouvrirApplication() {
    fermerEcranPlein();
    if (!coqueConstruite) {
      AK.shell.construire();
      AK.shell.demarrer();
      coqueConstruite = true;
    } else AK.shell.dessiner();
    armerVerrou();
    const pb = AK.schema.verifier(S()).filter((p) => p.gravite === 'erreur');
    if (pb.length && AK.session.estDirecteur()) ui.toast(`${u.pluriel(pb.length, 'incohérence')} dans les données : voir Paramètres › Diagnostic.`, { type: 'avert', action: { lib: 'Voir', f: () => AK.shell.aller('parametres/diagnostic') } });
  }

  /* ---------- Verrouillage après inactivité ---------- */
  function armerVerrou() {
    clearInterval(minuterieVerrou);
    if (!AK.hote.authentificationLocale) return;
    minuterieVerrou = setInterval(() => {
      const min = Number(S().securite.verrouMin) || 0;
      if (min > 0 && AK.session.ouverte() && AK.session.inactifDepuis() > min * 60000 && !$('#ecran-plein')) verrouiller();
    }, 20000);
  }
  function verrouiller() {
    if (!AK.session.ouverte()) return;
    document.querySelectorAll('dialog[open]').forEach((d) => d.querySelector('[data-fermer]') && d.close());
    AK.cles.oublier();
    AK.auth.oublierConfirmation();
    const s = AK.session.courante();
    const el = ecranPlein(html`${marque('Session verrouillée', AK.session.libelle())}
      <form class="pile" novalidate data-ep-form><div class="champ"><label for="ep-mdp">Mot de passe</label><input id="ep-mdp" class="inp" type="password" name="mdp" autocomplete="current-password" required></div>
      <button class="btn btn-pri btn-lg">${ic('unlock')}Déverrouiller</button><button type="button" class="btn btn-ghost" data-ep-sortir>${ic('logout')}Changer d’utilisateur</button></form>`, { photo: false });
    const f = $('[data-ep-form]', el);
    $('[data-ep-sortir]', el).onclick = () => deconnecter();
    f.onsubmit = async (e) => {
      e.preventDefault();
      ui.effacerErreurs(f);
      try {
        const login = s.role === 'ens' && !S().school.solo ? s.login : '';
        await AK.auth.connecter(login, f.mdp.value);
        AK.session.activite();
        fermerEcranPlein();
      } catch (err) {
        ui.erreurChamp(f, 'mdp', err.message || 'Mot de passe incorrect.');
        await u.attendre(600);
      }
    };
    setTimeout(() => f.mdp.focus(), 60);
  }
  async function deconnecter() {
    await AK.store.maintenant();
    AK.store.journaliser('Déconnexion');
    AK.session.fermer();
    AK.cles.oublier();
    AK.ui.fermerTiroir();
    document.querySelectorAll('dialog[open]').forEach((d) => d.remove());
    connexion();
  }

  /* ---------- Mots de passe ---------- */
  function motDePasseOublie() {
    if (AK.hote.type === 'bureau') return ui.info('Mot de passe oublié', 'Fermez l’application et utilisez « Mot de passe oublié » sur la fenêtre de connexion de l’application Windows.');
    ui.fenetre({
      titre: 'Mot de passe oublié', icone: 'key', taille: 'sm', ok: 'Valider', proteger: false,
      corps: html`<div class="pile"><p class="mut mb0">Saisissez le code de secours remis à la création de l’école, puis choisissez un nouveau mot de passe.</p>
        ${ui.champ.texte({ nom: 'code', lib: 'Code de secours', req: true, attrs: { placeholder: 'XXXX-XXXX-XXXX', autocomplete: 'off', autocapitalize: 'characters', autofocus: true } })}
        <div class="champ"><label for="mo-nw">Nouveau mot de passe</label><input id="mo-nw" class="inp" type="password" name="nw" autocomplete="new-password" required data-force><div class="force" data-n="0"><i></i><i></i><i></i><i></i></div></div>
        ${ui.encadre('Pour des raisons de sécurité, la clé de signature des documents protégée par l’ancien mot de passe sera retirée : vous en créerez une nouvelle. Les documents déjà émis restent vérifiables.', 'avert')}</div>`,
      apres: (r) => brancherForce(r),
      async surValider(d) {
        const code = await AK.auth.recupererAdmin(d.code, d.nw);
        AK.session.ouvrir({ role: 'dir' });
        setTimeout(() => montrerCodeSecours(code, () => ouvrirApplication()), 50);
      }
    });
  }
  ui.motDePasseOublie = motDePasseOublie;

  function changerMdpAdmin() {
    ui.fenetre({
      titre: 'Changer le mot de passe administrateur', icone: 'key', taille: 'sm', proteger: false,
      corps: html`<div class="pile">
        <div class="champ"><label for="cm-old">Mot de passe actuel</label><input id="cm-old" class="inp" type="password" name="old" autocomplete="current-password" required autofocus></div>
        <div class="champ"><label for="cm-nw">Nouveau mot de passe</label><input id="cm-nw" class="inp" type="password" name="nw" autocomplete="new-password" required data-force><div class="force" data-n="0"><i></i><i></i><i></i><i></i></div><div class="aide">${C.SECU.MDP_MIN} caractères au moins, lettres et chiffres.</div></div>
        <div class="champ"><label for="cm-nw2">Confirmez</label><input id="cm-nw2" class="inp" type="password" name="nw2" autocomplete="new-password" required></div></div>`,
      apres: (r) => brancherForce(r),
      async surValider(d) {
        if (d.nw !== d.nw2) throw new AK.ErreurMetier('Les deux mots de passe ne sont pas identiques.', 'nw2');
        await AK.auth.changerAdmin(d.old, d.nw);
        ui.toast('Mot de passe changé.');
      }
    });
  }
  function changerMdpEnseignant(premier) {
    const s = AK.session.courante();
    ui.fenetre({
      titre: premier ? 'Choisissez votre mot de passe' : 'Changer mon mot de passe', icone: 'key', taille: 'sm', proteger: false, annuler: premier ? false : 'Annuler',
      corps: html`<div class="pile">${premier ? ui.encadre('Votre mot de passe actuel est provisoire : choisissez-en un personnel.', 'avert') : ''}
        <div class="champ"><label for="ce-old">Mot de passe ${premier ? 'provisoire' : 'actuel'}</label><input id="ce-old" class="inp" type="password" name="old" required autofocus></div>
        <div class="champ"><label for="ce-nw">Nouveau mot de passe</label><input id="ce-nw" class="inp" type="password" name="nw" required data-force><div class="force" data-n="0"><i></i><i></i><i></i><i></i></div></div>
        <div class="champ"><label for="ce-nw2">Confirmez</label><input id="ce-nw2" class="inp" type="password" name="nw2" required></div></div>`,
      apres: (r) => brancherForce(r),
      async surValider(d) {
        if (d.nw !== d.nw2) throw new AK.ErreurMetier('Les deux mots de passe ne sont pas identiques.', 'nw2');
        if (S().school.solo) await AK.auth.changerAdmin(d.old, d.nw);
        else await AK.auth.changerMotDePasseEnseignant(s.tid, d.old, d.nw);
        ui.toast('Mot de passe changé.');
      }
    });
  }
  AK.actions.def({
    'changer-mdp-admin': changerMdpAdmin,
    'changer-mdp-ens': () => changerMdpEnseignant(false),
    async 'nouveau-secours'() {
      const mdp = await ui.saisirMotDePasse('Créer un nouveau code de secours ? L’ancien ne servira plus.');
      if (!mdp) return;
      const code = await AK.auth.nouveauSecours(mdp);
      montrerCodeSecours(code, () => AK.shell.redessiner());
    },
    async 'quitter-demo'() {
      const ok = await ui.confirmer({ titre: 'Quitter la démonstration', message: 'Les données fictives de démonstration seront effacées de ce navigateur, puis l’assistant de création de votre école s’ouvrira.', ok: 'Effacer la démonstration', danger: true });
      if (!ok) return;
      await AK.stockage.actif.effacerTout();
      location.reload();
    },
    'lire-messages'() {
      const a = AK.session.agent();
      if (!a) return;
      const L = S().messages.filter((m) => !m.dest || m.dest === a.id);
      ui.fenetre({
        titre: 'Messages du directeur', icone: 'mail', ok: 'Fermer', annuler: false, proteger: false,
        corps: L.length ? html`<div class="liste">${L.map((m) => html`<div style="display:block"><b>${m.titre}</b> <span class="mut petit">· ${u.fmtHorodatage(m.t)}</span><div style="white-space:pre-wrap">${m.texte}</div></div>`)}</div>` : ui.vide('Aucun message'),
        surFermer: () => AK.personnel.marquerLus(a.id)
      });
    }
  });

  /* ---------- Démarrage ---------- */
  async function demarrer() {
    try {
      const etatHote = await AK.hote.demarrer();
      let etat = null, notes = [];
      if (etatHote) ({ etat, notes } = AK.schema.migrer(etatHote));
      else if (AK.hote.type !== 'bureau') {
        const r = await AK.stockage.actif.charger();
        if (r) {
          ({ etat, notes } = AK.schema.migrer(r.S));
          if (r.manquantes.length) notes.push(`${u.pluriel(r.manquantes.length, 'image')} introuvable(s) dans le stockage : remplacée(s) par un emplacement vide.`);
        }
      } else if (AK.hote.type === 'bureau') {
        etat = AK.schema.vierge();
      }
      if (!etat) return assistant();
      await AK.auth.migrerSecrets(etat);
      AK.store.installer(etat);
      if (notes.length && etat.meta.migreDe) await AK.store.maintenant();
      connexion();
      AK.diag.info('Démarrage : ' + AK.stockage.description());
    } catch (e) {
      AK.diag.erreur(e, 'démarrage');
      ecranPlein(html`${marque('Démarrage impossible', '')}${ui.encadre(html`Les données n’ont pas pu être chargées : <b>${e.message || e}</b>. Rien n’a été effacé. Essayez de recharger la page ; si le problème persiste, restaurez une sauvegarde.`, 'erreur')}<button class="btn btn-pri" onclick="location.reload()">${ic('refresh')}Recharger</button>`);
    }
  }

  AK.app = { demarrer, verrouiller, deconnecter, connexion, montrerCodeSecours, installer };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', demarrer);
  else setTimeout(demarrer, 0);
})(window.AK);

</script>
