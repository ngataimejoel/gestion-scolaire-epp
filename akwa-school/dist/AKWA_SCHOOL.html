<script>
/* =====================================================================================
   Calculs scolaires (règles d'AKWA SCHOOL 1.7.0, inchangées) :
   âges, moyennes d'évaluation, MGA, rangs avec ex-aequo, décisions, seuils, effectifs.
   Fonctions pures sur l'état courant (AK.store.etat).
   ===================================================================================== */
(function (AK) {
  'use strict';
  const C = AK.cfg, u = AK.u;
  const S = () => AK.store.etat;

  /* ---------- Niveaux et grilles ---------- */
  /** Niveaux ouverts dans l'école, dans l'ordre CP1 → CM2. */
  const niveaux = () => {
    const n = (S() && S().school.niveaux) || [];
    const L = C.TOUS_NIVEAUX.filter((c) => n.includes(c));
    return L.length ? L : C.TOUS_NIVEAUX.slice();
  };
  /** Niveau suivant dans le cursus (CP1 → CP2…), indépendamment des niveaux ouverts ; null après le CM2. */
  const niveauSuivant = (c) => C.TOUS_NIVEAUX[C.TOUS_NIVEAUX.indexOf(c) + 1] || null;
  const info = (c) => C.CLASSE_INFO[c] || C.CLASSE_INFO.CP1;
  const grille = (c) => C.GRILLES[info(c).grille];
  const cpChoix = (c, n) => (S() && S().cpMat && S().cpMat[c] ? S().cpMat[c][n] : null);
  /** Matières d'une évaluation : [[matière, coefficient ou barème]] */
  function matieres(c, n) {
    const L = grille(c).mat(n);
    const ch = info(c).grille === 'CP' && cpChoix(c, n);
    if (!ch || !ch.length) return L;
    return [...L, ...(S().cpExtra || []).map((m) => [m, 1])].filter(([m]) => ch.includes(m));
  }
  const noteMax = (c, w) => (grille(c).mode === 'COEF' ? grille(c).max : w);
  const echelle = (c) => grille(c).echelle;
  const anneeRentree = () => parseInt(S() && S().school.year, 10) || new Date().getFullYear() - (new Date().getMonth() < 7 ? 1 : 0);
  const evalLabel = (c, n) => C.EVALUATIONS[info(c).cal][n - 1];
  const evalDate = (c, n) => {
    const [m, d, o] = C.EVAL_DATES[info(c).cal][n - 1];
    return `${anneeRentree() + o}-${u.pad(m)}-${u.pad(d)}`;
  };
  const perLabel = (p, c) => (p === 'A' ? 'Annuel (MGA)' : c ? evalLabel(c, p) : C.EV_GEN[p - 1]);

  /* ---------- Élèves ---------- */
  const actifs = () => S().students.filter((s) => s.statut === 'Inscrit');
  const actifsDe = (c) => actifs().filter((s) => s.classe === c);
  const parNom = (a, b) => (a.nom + ' ' + a.prenoms).localeCompare(b.nom + ' ' + b.prenoms, 'fr');
  const parClasse = (a, b) => C.TOUS_NIVEAUX.indexOf(a.classe) - C.TOUS_NIVEAUX.indexOf(b.classe) || parNom(a, b);
  const nomComplet = (s) => `${s.nom} ${s.prenoms}`.trim();
  /** Matricule imprimé : national (DESPS) s'il est connu, sinon celui de l'école */
  const matOf = (s) => s.matNat || s.mat || '';
  /** Âge au 1er octobre de l'année de rentrée */
  function ageDe(s) {
    if (!s.naissance) return null;
    const b = u.parseISO(s.naissance), r = new Date(anneeRentree(), 9, 1);
    let a = r.getFullYear() - b.getFullYear();
    if (r < new Date(r.getFullYear(), b.getMonth(), b.getDate())) a--;
    return a;
  }
  const ageAnormal = (s) => {
    const a = ageDe(s);
    return a != null && a - (C.AGE_NORMAL[s.classe] || 0) >= 3;
  };
  const fmtNaissance = (s) => (s.ageEstime && s.naissance ? `vers ${s.naissance.slice(0, 4)} (sans extrait)` : u.fmtDate(s.naissance));
  const estIvoirien = (s) => u.norm(s.nationalite || C.NAT_DEFAUT).startsWith('ivoir');
  const compteSexe = (L) => {
    const g = L.filter((s) => s.sexe === 'Masculin').length;
    return [g, L.length - g, L.length];
  };
  function initiales(p) {
    if (p.prenoms != null) return ((p.prenoms || '?')[0] + (p.nom || '?')[0]).toUpperCase();
    const w = AK.valid.civ.sans(p.nom || '?').split(' ').filter(Boolean);
    return ((w[0] || '?')[0] + ((w[1] || '')[0] || '')).toUpperCase();
  }

  /* ---------- Notes ---------- */
  const cle = (id, n, m) => `${id}|${n}|${m}`;
  const note = (id, n, m) => S().grades[cle(id, n, m)];
  const estAbsent = (id, n) => !!S().compAbs[id + '|' + n];
  /** Total et moyenne d'une évaluation. COEF : Σ note×coef ÷ Σ coef ; BARÈME : Σ notes ÷ Σ barèmes × échelle. Absent = 0. */
  function resultat(s, n) {
    if (estAbsent(s.id, n)) return { total: 0, moy: 0, abs: true };
    const L = matieres(s.classe, n).map(([m, w]) => [note(s.id, n, m), w]).filter(([v]) => v != null);
    if (!L.length) return null;
    const g = grille(s.classe), den = L.reduce((a, [, w]) => a + w, 0);
    if (g.mode === 'COEF') {
      const p = L.reduce((a, [v, w]) => a + v * w, 0);
      return { total: u.arrondi(p), moy: u.arrondi(p / den) };
    }
    const t = L.reduce((a, [v]) => a + v, 0);
    return { total: u.arrondi(t), moy: u.arrondi((t / den) * g.echelle) };
  }
  const moyEval = (s, n) => {
    const r = resultat(s, n);
    return r ? r.moy : null;
  };
  const moy3 = (s) => {
    const v = [1, 2, 3].map((n) => moyEval(s, n)).filter((x) => x != null);
    return v.length ? u.arrondi(u.moyenne(v)) : null;
  };
  /** MGA : CP1 à CM1 = (moyenne des 3 compositions + 2 × composition de passage) ÷ 3 ; CM2 = moyenne des 4 évaluations (toutes saisies) */
  function mga(s) {
    const m = [1, 2, 3, 4].map((n) => moyEval(s, n));
    if (info(s.classe).regle === 'MOYENNE4') return m.every((v) => v != null) ? u.arrondi(u.moyenne(m)) : null;
    const a = moy3(s);
    return a == null || m[3] == null ? null : u.arrondi((a + 2 * m[3]) / 3);
  }
  const score = (s, per) => (per === 'A' ? mga(s) : estAbsent(s.id, per) ? null : moyEval(s, per));
  /** Mention (note ramenée sur 10) */
  const mention = (v, c) => {
    if (v == null) return '—';
    const x = (v / echelle(c)) * 10;
    return x >= 8 ? 'Très bien' : x >= 7 ? 'Bien' : x >= 6 ? 'Assez bien' : x >= 5 ? 'Passable' : 'Insuffisant';
  };
  /** Classement d'une classe : { w : élèves classés (rang, ex-aequo), all : tous } */
  function classement(cls, per) {
    const L = actifsDe(cls).map((s) => ({ s, avg: score(s, per) }));
    const w = L.filter((x) => x.avg != null).sort((a, b) => b.avg - a.avg || parNom(a.s, b.s));
    w.forEach((x) => (x.rank = 1 + w.filter((o) => o.avg > x.avg).length));
    return { w, all: [...w, ...L.filter((x) => x.avg == null).sort((a, b) => parNom(a.s, b.s))] };
  }
  const rangTxt = (r) => (r ? r + (r === 1 ? 'er' : 'e') : '—');
  const moyClasse = (cls, per) => {
    const v = actifsDe(cls).map((s) => score(s, per)).filter((x) => x != null);
    return v.length ? u.arrondi(u.moyenne(v)) : null;
  };
  const reussite = (cls, per) => {
    const v = actifsDe(cls).map((s) => score(s, per)).filter((x) => x != null);
    return { n: v.length, ok: v.filter((x) => x >= info(cls).seuil).length };
  };
  const notesManquantes = (cls, n) =>
    actifs()
      .filter((s) => (!cls || s.classe === cls) && !estAbsent(s.id, n))
      .reduce((k, s) => k + matieres(s.classe, n).filter(([m]) => note(s.id, n, m) == null).length, 0);
  function decisionProposee(s) {
    if (s.statut !== 'Inscrit') return s.statut;
    const a = mga(s);
    return a == null ? '' : a >= info(s.classe).seuil ? 'Admis' : 'Redoublant';
  }
  const decision = (s) => s.decision || decisionProposee(s);

  /* ---------- Personnel et classes ---------- */
  const clsDe = (t) => (!t ? [] : Array.isArray(t.classes) && t.classes.length ? t.classes : t.classe ? [t.classe] : []);
  const clsTxt = (t) => clsDe(t).join(' / ');
  const enseignantDe = (c) => S().teachers.find((t) => t.actif !== false && clsDe(t).includes(c));
  const emploiGrade = (t) => [t.grade, t.echelon].filter(Boolean).join(' / ');
  const estFemme = (t) => /^(mme|mlle)/i.test(t.nom) || /ice$|rice|adjointe|Directrice/.test(t.fonction || '');
  const fonctTxt = (t) => (t.fonct === 'autre' ? t.fonctAutre || 'Autre' : (C.FONCTS.find((x) => x[0] === t.fonct) || [, ''])[1]);
  const fonctErr = (f, n, autre) =>
    !n ? ''
      : !f ? 'Choisissez d’abord le type de fonctionnement de la classe (simple, jumelée, multigrade ou autre).'
        : f === 'autre' && !String(autre || '').trim() ? 'Précisez le type de fonctionnement (Autre).'
          : f === 'simple' && n > 1 ? 'Une classe simple n’a qu’un niveau : choisissez jumelée ou multigrade.'
            : (f === 'jumelee' || f === 'multigrade') && n < 2 ? 'Une classe jumelée ou multigrade a au moins deux niveaux : cochez-les.'
              : f === 'jumelee' && n > 2 ? 'Une classe jumelée a deux niveaux ; au-delà, choisissez multigrade.' : '';

  /* ---------- Absences et calendrier ---------- */
  const estFerie = (d, cg) => (cg || S().conges).some((c) => d >= c.du && d <= (c.au || c.du));
  const estJourClasse = (d, cg) => C.JOURS_CLASSE.includes(u.parseISO(d).getDay()) && !estFerie(d, cg);
  function joursClasse(a, b, cg) {
    const r = [];
    if (!a || !b || b < a) return r;
    for (let d = a, k = 0; d <= b && k < 400; d = u.ajouterJours(d, 1), k++) if (estJourClasse(d, cg)) r.push(d);
    return r;
  }
  function derniersJoursClasse(n, fin, cg) {
    const r = [];
    let d = fin;
    for (let k = 0; r.length < n && k < 160; k++) {
      if (estJourClasse(d, cg)) r.unshift(d);
      d = u.ajouterJours(d, -1);
    }
    return r;
  }
  const absencesDe = (id) =>
    Object.entries(S().att).filter(([, m]) => m[id]).map(([d, m]) => ({ d, v: m[id] })).sort((a, b) => b.d.localeCompare(a.d));
  const moisCourant = () => {
    const m = new Date().getMonth() + 1;
    return C.JOURS_MOIS[m] ? m : 9;
  };
  const moisInfo = (m) => {
    const y = m >= 9 ? anneeRentree() : anneeRentree() + 1;
    return { y, mm: `${y}-${u.pad(m)}`, jours: C.JOURS_MOIS[m] || 0 };
  };

  AK.calc = {
    niveaux, niveauSuivant, info, grille, matieres, noteMax, echelle, anneeRentree, evalLabel, evalDate, perLabel,
    actifs, actifsDe, parNom, parClasse, nomComplet, matOf, ageDe, ageAnormal, fmtNaissance, estIvoirien, compteSexe, initiales,
    cle, note, estAbsent, resultat, moyEval, moy3, mga, score, mention, classement, rangTxt, moyClasse, reussite, notesManquantes,
    decisionProposee, decision,
    clsDe, clsTxt, enseignantDe, emploiGrade, estFemme, fonctTxt, fonctErr,
    estFerie, estJourClasse, joursClasse, derniersJoursClasse, absencesDe, moisCourant, moisInfo
  };
})(window.AK);

<script>
/* =====================================================================================
   Élèves : inscription, modification, statut, suppression (corbeille), doublons.
   Toutes les règles sont vérifiées ici, quel que soit l'écran qui appelle.
   ===================================================================================== */
(function (AK) {
  'use strict';
  const C = AK.cfg, u = AK.u, V = AK.valid, X = AK.calc;
  const S = () => AK.store.etat;
  const E = (m, champ) => new AK.ErreurMetier(m, champ);

  /** Prochain matricule école : AK-<2 chiffres de l'année><numéro sur 3 chiffres> */
  function prochainMatricule() {
    const nums = S().students.map((s) => parseInt((s.mat || '').replace(/\D/g, '').slice(2), 10) || 0);
    const archives = Object.values(S().archives || {}).flatMap((a) => (a.students || []).map((s) => parseInt((s.mat || '').replace(/\D/g, '').slice(2), 10) || 0));
    return 'AK-' + String(X.anneeRentree()).slice(2) + u.pad(Math.max(0, ...nums, ...archives) + 1, 3);
  }

  const lireParent = (d, k) => ({
    nom: u.majNom(String(d[k + '_nom'] || '').trim()),
    prenoms: u.majPrenoms(String(d[k + '_prenoms'] || '').trim()),
    profession: String(d[k + '_profession'] || '').trim(),
    tel: V.telPropre(d[k + '_tel']),
    domicile: String(d[k + '_domicile'] || '').trim()
  });

  /** Contrôle d'un formulaire d'élève (objet champ → valeur). Lève une ErreurMetier ciblée. */
  function controler(d, existant) {
    const ex = d.extrait === true || d.extrait === 'on';
    const P = (k) => String(d[k + '_nom'] || '').trim() && String(d[k + '_prenoms'] || '').trim();
    let e = V.nom(d.nom, 'Nom de l’élève', 1, 40);
    if (e) throw E(e, 'nom');
    if ((e = V.nom(d.prenoms, 'Prénoms de l’élève', 1, 60))) throw E(e, 'prenoms');
    if (d.sexe !== 'Masculin' && d.sexe !== 'Féminin') throw E('Choisissez le sexe de l’élève.', 'sexe');
    if ((e = V.classe(d.classe, X.niveaux()))) throw E(e, 'classe');
    if ((e = V.matNat(d.matNat))) throw E(e, 'matNat');
    if (ex) {
      if ((e = V.naissanceEleve(d.naissance, X.anneeRentree()))) throw E(e, 'naissance');
      if (!P('pere') || !P('mere')) throw E('Avec un extrait, les nom et prénoms du père et de la mère sont obligatoires.', P('pere') ? 'mere_nom' : 'pere_nom');
      if ((e = V.date(d.acte_date, 'Date de l’acte', { max: u.aujourdhui(), min: d.naissance }))) throw E(e, 'acte_date');
      if ((e = V.texte(d.acte_num, 'N° de l’acte', { max: 20 }))) throw E(e, 'acte_num');
    } else {
      const a = Number(d.age);
      if (!a || a < 2 || a > 20 || !Number.isInteger(a)) throw E('Saisissez l’âge de l’enfant (de 2 à 20 ans).', 'age');
      if (!P('pere') && !P('mere') && !((d.tuteur === true || d.tuteur === 'on') && String(d.parent || '').trim()))
        throw E('Sans extrait, le nom et les prénoms de l’un des parents ou du tuteur sont obligatoires.', 'pere_nom');
    }
    if (d.classe !== 'CP1' || existant) {
      if (d.classe !== 'CP1' && !d.entree) throw E('Saisissez la date d’entrée à l’école.', 'entree');
    }
    if (d.entree && (e = V.date(d.entree, 'Date d’entrée', { max: u.ajouterJours(u.aujourdhui(), 31) }))) throw E(e, 'entree');
    for (const [k, l] of [['pere', 'du père'], ['mere', 'de la mère']]) {
      if (String(d[k + '_nom'] || '').trim() || String(d[k + '_prenoms'] || '').trim()) {
        if ((e = V.nom(d[k + '_nom'], 'Nom ' + l, 1, 40))) throw E(e, k + '_nom');
        if ((e = V.nom(d[k + '_prenoms'], 'Prénoms ' + l, 1, 60))) throw E(e, k + '_prenoms');
      }
      if ((e = V.tel(d[k + '_tel'], 'Contact ' + l))) throw E(e, k + '_tel');
    }
    if ((d.tuteur === true || d.tuteur === 'on') && String(d.parent || '').trim() && (e = V.nom(d.parent, 'Nom et prénoms du tuteur'))) throw E(e, 'parent');
    if ((e = V.tel(d.tel, 'Contact du tuteur'))) throw E(e, 'tel');
    if ((e = V.texte(d.allergies, 'Allergies / handicap', { max: 120 }))) throw E(e, 'allergies');
    // matricule national unique
    const mn = u.norm(d.matNat);
    if (mn) {
      const autre = S().students.find((o) => o !== existant && u.norm(o.matNat) === mn);
      if (autre) throw E(`Matricule national déjà attribué à ${X.nomComplet(autre)} (${autre.classe}).`, 'matNat');
    }
  }

  /** Élèves déjà enregistrés qui ressemblent à celui-ci (même nom et prénoms, même naissance si connue). */
  function doublons(d, existant) {
    const n = u.norm(u.majNom(d.nom) + u.majPrenoms(d.prenoms));
    return S().students.filter((o) => o !== existant && u.norm(o.nom + o.prenoms) === n && (!d.naissance || !o.naissance || o.ageEstime || o.naissance === d.naissance));
  }

  function appliquer(d, s) {
    const ex = d.extrait === true || d.extrait === 'on';
    const tut = d.tuteur === true || d.tuteur === 'on';
    const age = Number(d.age) || 0;
    const nat = AK.ref.NATIONALITES.find((x) => u.norm(x[1]) === u.norm(d.nationalite));
    Object.assign(s, {
      matNat: String(d.matNat || '').replace(/\s/g, '').toUpperCase(),
      nom: u.majNom(String(d.nom).trim().replace(/\s+/g, ' ')),
      prenoms: u.majPrenoms(String(d.prenoms).trim().replace(/\s+/g, ' ')),
      naissance: ex ? d.naissance : `${X.anneeRentree() - age}-01-01`,
      ageEstime: !ex,
      lieu: String(d.lieu || '').trim(),
      sexe: d.sexe,
      nationalite: nat ? nat[1] : String(d.nationalite || '').trim().toUpperCase() || C.NAT_DEFAUT,
      classe: d.classe,
      statut: s.statut || 'Inscrit',
      parent: tut ? u.majNomComplet(String(d.parent || '').trim()) : '',
      tel: tut ? V.telPropre(d.tel) : '',
      redoublant: d.redoublant === true || d.redoublant === 'on',
      extrait: ex,
      pere: lireParent(d, 'pere'),
      mere: lireParent(d, 'mere'),
      sang: C.SANG.includes(d.sang) ? d.sang : '',
      allergies: String(d.allergies || '').trim(),
      entree: d.classe === 'CP1' && !s.entree ? u.aujourdhui() : d.entree || s.entree || '',
      motifDepart: s.motifDepart || '',
      parcours: s.parcours || [],
      acte: ex ? { num: String(d.acte_num || '').trim(), date: d.acte_date || '', centre: String(d.acte_centre || '').trim(), sp: String(d.acte_sp || '').trim() } : s.acte || { num: '', date: '', centre: '', sp: '' }
    });
    if (d.photo !== undefined) s.photo = d.photo && u.IMG_OK.test(d.photo) ? d.photo : '';
    if (d.extraitPhoto !== undefined) s.extraitPhoto = d.extraitPhoto && u.IMG_OK.test(d.extraitPhoto) ? d.extraitPhoto : '';
    return s;
  }

  const eleves = {
    prochainMatricule,
    controler,
    doublons,
    trouver: (id) => S().students.find((s) => s.id === id) || null,
    /** Inscription. options.accepterDoublon : l'utilisateur a confirmé qu'il s'agit d'un autre enfant. */
    inscrire(d, { accepterDoublon = false } = {}) {
      AK.perm.exiger('eleve.inscrire', { classe: d.classe });
      controler(d, null);
      const dbl = doublons(d, null);
      if (dbl.length && !accepterDoublon) {
        const err = E(`Un élève du même nom est déjà enregistré : ${dbl.map((o) => `${X.nomComplet(o)} (${o.classe}, ${X.fmtNaissance(o)})`).join(' ; ')}.`, 'nom');
        err.doublons = dbl;
        throw err;
      }
      const s = appliquer(d, { id: u.uid(), mat: prochainMatricule(), photo: '', decision: '', statut: 'Inscrit', inscritLe: u.aujourdhui() });
      AK.store.modifier(`Inscription : ${X.nomComplet(s)} (${s.classe})`, (st) => st.students.push(s), { categorie: 'eleves' });
      return s;
    },
    modifier(id, d) {
      const s = eleves.trouver(id);
      if (!s) throw E('Élève introuvable.');
      AK.perm.exiger('eleve.modifier', { classe: s.classe });
      AK.perm.exiger('eleve.modifier', { classe: d.classe });
      controler(d, s);
      const avant = s.classe;
      AK.store.modifier(`Dossier modifié : ${X.nomComplet(s)}${avant !== d.classe ? ` (classe ${avant} → ${d.classe})` : ''}`, () => appliquer(d, s), { categorie: 'eleves' });
      return s;
    },
    changerStatut(id, statut, motif) {
      const s = eleves.trouver(id);
      if (!s) throw E('Élève introuvable.');
      AK.perm.exiger('eleve.statut', { classe: s.classe });
      if (!C.STATUTS.includes(statut)) throw E('Statut inconnu.');
      AK.store.modifier(`Statut de ${X.nomComplet(s)} : ${statut}${motif ? ' (' + String(motif).slice(0, 80) + ')' : ''}`, () => {
        s.statut = statut;
        s.motifDepart = statut === 'Inscrit' ? '' : String(motif || '').trim().slice(0, 200);
        if (statut !== 'Inscrit') s.departLe = s.departLe || u.aujourdhui();
        else delete s.departLe;
      }, { categorie: 'eleves' });
    },
    /** Suppression : l'élève et ses notes, absences… vont à la corbeille (restaurables). */
    supprimer(id) {
      const s = eleves.trouver(id);
      if (!s) throw E('Élève introuvable.');
      AK.perm.exiger('eleve.supprimer', { classe: s.classe });
      const docs = (S().docs.items || []).filter((d) => d.sujet && d.sujet.id === id && d.statut === 'valide');
      AK.store.modifier(`Élève supprimé (corbeille) : ${X.nomComplet(s)}`, (st) => {
        const notes = {}, abs = {}, compAbs = {}, attente = {};
        Object.keys(st.grades).forEach((k) => {
          if (k.startsWith(id + '|')) {
            notes[k] = st.grades[k];
            delete st.grades[k];
          }
        });
        Object.keys(st.attente).forEach((k) => {
          if (k.startsWith(id + '|')) {
            attente[k] = st.attente[k];
            delete st.attente[k];
          }
        });
        Object.keys(st.compAbs).forEach((k) => {
          if (k.startsWith(id + '|')) {
            compAbs[k] = true;
            delete st.compAbs[k];
          }
        });
        Object.entries(st.att).forEach(([d, m]) => {
          if (m[id]) {
            abs[d] = m[id];
            delete m[id];
          }
        });
        st.students = st.students.filter((x) => x !== s);
        st.corbeille.unshift({ id: u.uid(), type: 'eleve', t: Date.now(), libelle: `${X.nomComplet(s)} (${s.classe})`, donnees: { s, notes, abs, compAbs, attente } });
      }, { categorie: 'eleves' });
      return { documentsValides: docs.length };
    },
    appliquer
  };
  AK.eleves = eleves;
})(window.AK);

</script>
<script>
/* =====================================================================================
   Personnel : fiches, affectation des classes, fiches actives, messages aux enseignants,
   corbeille (restauration des élèves et membres supprimés).
   ===================================================================================== */
(function (AK) {
  'use strict';
  const C = AK.cfg, u = AK.u, V = AK.valid, X = AK.calc;
  const S = () => AK.store.etat;
  const E = (m, champ) => new AK.ErreurMetier(m, champ);

  /** Range les niveaux tenus dans l'ordre du cursus ; t.classe = le premier (compatibilité). */
  const poserClasses = (t, L) => {
    L = C.TOUS_NIVEAUX.filter((c) => L.includes(c));
    t.classes = L;
    t.classe = L[0] || '';
  };

  function controler(d, existant) {
    if (!C.CIVS.includes(d.civ)) throw E('Choisissez la civilité : M., Mme ou Mlle.', 'civ');
    let e = V.nom(d.nom, 'Nom complet', 2, 80);
    if (e) throw E(e, 'nom');
    if ((e = V.matriculeAgent(d.matricule))) throw E(e, 'matricule');
    if ((e = V.tel(d.tel, 'Téléphone'))) throw E(e, 'tel');
    const classes = (Array.isArray(d.classes) ? d.classes : d.classes ? [d.classes] : []).filter((c) => X.niveaux().includes(c));
    if ((e = X.fonctErr(d.fonct, classes.length, d.fonctAutre))) throw E(e, 'fonct');
    if (!C.FONCTIONS.includes(d.fonction)) throw E('Choisissez la fonction.', 'fonction');
    const nom = V.civ.avec(d.civ, d.nom);
    const meme = S().teachers.find((t) => t !== existant && u.norm(V.civ.sans(t.nom)) === u.norm(V.civ.sans(nom)));
    if (meme && !d.accepterDoublon) {
      const err = E(`${meme.nom} figure déjà dans le personnel.`, 'nom');
      err.doublons = [meme];
      throw err;
    }
    const mat = String(d.matricule || '').trim();
    if (mat) {
      const m2 = S().teachers.find((t) => t !== existant && u.norm(t.matricule) === u.norm(mat));
      if (m2) throw E(`Matricule déjà attribué à ${m2.nom}.`, 'matricule');
    }
    return classes;
  }

  function appliquer(d, t, classes) {
    t.nom = V.civ.avec(d.civ, d.nom);
    t.fonct = classes.length ? d.fonct : '';
    t.fonctAutre = classes.length && t.fonct === 'autre' ? String(d.fonctAutre || '').trim() : '';
    t.matricule = String(d.matricule || '').trim().toUpperCase();
    t.fonction = d.fonction;
    t.grade = C.GRADES.includes(d.grade) ? d.grade : '';
    t.echelon = String(d.echelon || '').trim().toUpperCase().slice(0, 6);
    t.tel = V.telPropre(d.tel);
    t.dateEntree = d.dateEntree || t.dateEntree || '';
    poserClasses(t, classes);
    if (d.photo !== undefined) t.photo = d.photo && u.IMG_OK.test(d.photo) ? d.photo : '';
    if (d.avis !== undefined) t.avis = d.avis && u.IMG_OK.test(d.avis) ? d.avis : '';
    // un niveau n'a qu'un enseignant : il est retiré aux autres
    S().teachers.forEach((o) => {
      if (o !== t && X.clsDe(o).some((c) => classes.includes(c))) poserClasses(o, X.clsDe(o).filter((c) => !classes.includes(c)));
    });
  }

  const personnel = {
    poserClasses,
    trouver: (id) => S().teachers.find((t) => t.id === id) || null,
    ajouter(d) {
      AK.perm.exiger('personnel.gerer');
      const classes = controler(d, null);
      const t = { id: u.uid(), photo: '', compte: null, actif: true, classes: [], classe: '' };
      AK.store.modifier(`Personnel ajouté : ${V.civ.avec(d.civ, d.nom)}`, (s) => {
        appliquer(d, t, classes);
        s.teachers.push(t);
      }, { categorie: 'personnel' });
      return t;
    },
    modifier(id, d) {
      AK.perm.exiger('personnel.gerer');
      const t = personnel.trouver(id);
      if (!t) throw E('Membre du personnel introuvable.');
      const classes = controler(d, t);
      AK.store.modifier(`Personnel modifié : ${t.nom}`, () => appliquer(d, t, classes), { categorie: 'personnel' });
      return t;
    },
    /** Affectation d'un niveau à un enseignant (ou retrait si tid vide). */
    affecter(classe, tid) {
      AK.perm.exiger('classe.affecter');
      if (!X.niveaux().includes(classe)) throw E('Classe inconnue.');
      const m = tid ? personnel.trouver(tid) : null;
      if (tid && !m) throw E('Enseignant introuvable.');
      if (m) {
        const e = X.fonctErr(m.fonct, X.clsDe(m).filter((k) => k !== classe).length + 1, m.fonctAutre);
        if (e) {
          const err = E(e + ' Complétez d’abord la fiche de l’enseignant.');
          err.ficheAgent = m.id;
          throw err;
        }
      }
      AK.store.modifier(m ? `${m.nom} affecté(e) en ${classe}` : `${classe} : enseignant retiré`, (s) => {
        s.teachers.forEach((x) => {
          if (X.clsDe(x).includes(classe)) poserClasses(x, X.clsDe(x).filter((k) => k !== classe));
        });
        if (m) poserClasses(m, [...X.clsDe(m), classe]);
      }, { categorie: 'personnel' });
    },
    /** Fiche désactivée (départ, mutation) : compte bloqué, classes conservées pour l'historique. */
    basculerFiche(id) {
      AK.perm.exiger('personnel.gerer');
      const t = personnel.trouver(id);
      if (!t) throw E('Membre du personnel introuvable.');
      AK.store.modifier(`Fiche de ${t.nom} ${t.actif === false ? 'réactivée' : 'désactivée (compte bloqué)'}`, () => {
        t.actif = t.actif === false;
        if (!t.actif && t.compte) t.compte.actif = false;
      }, { categorie: 'personnel' });
    },
    basculerCompte(id) {
      AK.perm.exiger('comptes.gerer');
      const t = personnel.trouver(id);
      if (!t || !t.compte) throw E('Ce membre n’a pas de compte.');
      if (!t.compte.actif && t.actif === false) throw E('Réactivez d’abord la fiche de ce membre.');
      AK.store.modifier(`Compte ${t.compte.login} ${t.compte.actif ? 'désactivé' : 'activé'}`, () => (t.compte.actif = !t.compte.actif), { categorie: 'comptes' });
    },
    retirer(id) {
      AK.perm.exiger('personnel.gerer');
      const t = personnel.trouver(id);
      if (!t) throw E('Membre du personnel introuvable.');
      AK.store.modifier(`Personnel retiré (corbeille) : ${t.nom}`, (s) => {
        s.teachers = s.teachers.filter((x) => x !== t);
        const compte = s.securite.comptes[t.id];
        delete s.securite.comptes[t.id];
        s.corbeille.unshift({ id: u.uid(), type: 'agent', t: Date.now(), libelle: t.nom, donnees: { t, compte: compte || null } });
      }, { categorie: 'personnel' });
    },
    /* ---------- Messages du directeur aux enseignants ---------- */
    envoyerMessage(d) {
      AK.perm.exiger('messages.envoyer');
      let e = V.texte(d.titre, 'Objet', { requis: true, max: 120 });
      if (e) throw E(e, 'titre');
      if ((e = V.texte(d.texte, 'Message', { requis: true, max: 2000 }))) throw E(e, 'texte');
      if (d.dest && !personnel.trouver(d.dest)) throw E('Destinataire introuvable.', 'dest');
      AK.store.modifier(`Message envoyé : ${String(d.titre).trim()}`, (s) =>
        s.messages.unshift({ id: u.uid(), t: Date.now(), dest: d.dest || '', titre: String(d.titre).trim(), texte: String(d.texte).trim(), lus: {} }), { categorie: 'messages' });
    },
    marquerLus(tid) {
      const L = S().messages.filter((m) => (!m.dest || m.dest === tid) && !m.lus[tid]);
      if (L.length) AK.store.modifier('Messages lus', () => L.forEach((m) => (m.lus[tid] = Date.now())));
    },
    nonLus: (tid) => S().messages.filter((m) => (!m.dest || m.dest === tid) && !m.lus[tid]),

    /* ---------- Corbeille ---------- */
    restaurer(idCorbeille) {
      const c = S().corbeille.find((x) => x.id === idCorbeille);
      if (!c) throw E('Élément introuvable dans la corbeille.');
      if (c.type === 'eleve') {
        AK.perm.exiger('eleve.supprimer', { classe: c.donnees.s.classe });
        if (S().students.some((x) => x.id === c.donnees.s.id)) throw E('Cet élève est déjà présent.');
        AK.store.modifier(`Élève restauré : ${c.libelle}`, (s) => {
          s.students.push(c.donnees.s);
          Object.assign(s.grades, c.donnees.notes || {});
          Object.assign(s.compAbs, c.donnees.compAbs || {});
          Object.assign(s.attente, c.donnees.attente || {});
          Object.entries(c.donnees.abs || {}).forEach(([d, v]) => ((s.att[d] = s.att[d] || {})[c.donnees.s.id] = v));
          s.corbeille = s.corbeille.filter((x) => x !== c);
        });
      } else if (c.type === 'agent') {
        AK.perm.exiger('personnel.gerer');
        AK.store.modifier(`Personnel restauré : ${c.libelle}`, (s) => {
          const t = c.donnees.t;
          // ses niveaux ont pu être confiés à d'autres entre-temps : on ne les reprend pas
          poserClasses(t, X.clsDe(t).filter((k) => !s.teachers.some((o) => X.clsDe(o).includes(k))));
          s.teachers.push(t);
          if (c.donnees.compte) s.securite.comptes[t.id] = c.donnees.compte;
          s.corbeille = s.corbeille.filter((x) => x !== c);
        });
      }
    },
    viderCorbeilleElement(idCorbeille) {
      AK.perm.exiger('parametres.gerer');
      const c = S().corbeille.find((x) => x.id === idCorbeille);
      if (!c) return;
      AK.store.modifier(`Supprimé définitivement de la corbeille : ${c.libelle}`, (s) => (s.corbeille = s.corbeille.filter((x) => x !== c)));
    }
  };
  AK.personnel = personnel;
})(window.AK);

<script>
/* =====================================================================================
   Notes, validation des saisies des enseignants, décisions et passage à l'année suivante.
   ===================================================================================== */
(function (AK) {
  'use strict';
  const C = AK.cfg, u = AK.u, V = AK.valid, X = AK.calc;
  const S = () => AK.store.etat;
  const E = (m, champ) => new AK.ErreurMetier(m, champ);
  const EVALS = [1, 2, 3, 4];

  const cleSaisie = (c, n) => S().saisie[c + '|' + n] || (S().saisie[c + '|' + n] = { fermee: false, fin: '' });
  const saisieOuverte = (c, n) => {
    const x = S().saisie[c + '|' + n] || {};
    return !x.fermee && !(x.fin && x.fin < u.aujourdhui());
  };
  const enAttenteDe = (c, n) =>
    Object.keys(S().attente).filter((k) => {
      const [id, e] = k.split('|');
      const s = S().students.find((x) => x.id === id);
      return s && s.classe === c && (n == null || String(e) === String(n));
    });

  const notes = {
    EVALS,
    saisieOuverte,
    enAttenteDe,
    /**
     * Saisie d'une note. Renvoie { etat: 'ok' | 'attente' | 'inchange', v }.
     * Une correction (note déjà enregistrée modifiée ou effacée) exige options.correctionConfirmee
     * (mot de passe administrateur demandé par l'écran) : sinon ErreurMetier avec .correction = true.
     */
    saisir(sid, n, m, brut, options = {}) {
      const s = AK.eleves.trouver(sid);
      if (!s || s.statut !== 'Inscrit') throw E('Élève introuvable ou non inscrit.');
      AK.perm.exiger('notes.saisir', { classe: s.classe });
      if (!EVALS.includes(Number(n))) throw E('Évaluation inconnue.');
      n = Number(n);
      const mat = X.matieres(s.classe, n).find(([x]) => x === m);
      if (!mat) throw E('Matière inconnue pour cette évaluation.');
      if (X.estAbsent(sid, n)) throw E('Élève marqué absent à cette évaluation : retirez d’abord l’absence.');
      const max = X.noteMax(s.classe, mat[1]);
      const r = V.note(brut, max);
      if (r.err) throw E(r.err);
      const v = r.v, k = X.cle(sid, n, m), ancien = S().grades[k];
      const enseignant = AK.session.estEnseignant();
      if (enseignant && !saisieOuverte(s.classe, n)) throw E('La saisie est fermée pour cette évaluation (date limite dépassée ou fermée par le directeur).');

      // enseignant avec validation : la note attend la validation du directeur (sauf correction d'une note validée)
      if (enseignant && S().school.validation && ancien == null) {
        if ((S().attente[k] ?? null) === v) return { etat: 'inchange', v };
        AK.store.modifier(v == null ? null : `Note saisie (en attente) : ${X.nomComplet(s)}, ${m} = ${u.fmtNote(v)}`, (st) => {
          if (v == null) delete st.attente[k];
          else st.attente[k] = v;
        }, { rendu: false, categorie: 'notes' });
        return { etat: 'attente', v };
      }
      if (ancien === v || (ancien == null && v == null)) return { etat: 'inchange', v };
      if (ancien != null && !options.correctionConfirmee) {
        const err = E(`Corriger la note de ${X.nomComplet(s)} en ${m} : ${u.fmtNote(ancien)} → ${v == null ? '(vide)' : u.fmtNote(v)} sur ${max} ?`);
        err.correction = true;
        throw err;
      }
      AK.store.modifier(ancien != null ? `Note corrigée : ${X.nomComplet(s)}, ${m} (${u.fmtNote(ancien)} → ${v == null ? 'vide' : u.fmtNote(v)})` : null, (st) => {
        if (v == null) delete st.grades[k];
        else st.grades[k] = v;
        delete st.attente[k];
      }, { rendu: false, categorie: 'notes' });
      return { etat: 'ok', v };
    },
    /** Absence à une évaluation : efface les notes de l'évaluation (moyenne = 0). Confirmation exigée si des notes existent ou pour retirer l'absence. */
    marquerAbsent(sid, n, absent, options = {}) {
      const s = AK.eleves.trouver(sid);
      if (!s) throw E('Élève introuvable.');
      AK.perm.exiger('notes.saisir', { classe: s.classe });
      n = Number(n);
      if (AK.session.estEnseignant() && !saisieOuverte(s.classe, n)) throw E('La saisie est fermée pour cette évaluation.');
      const k = sid + '|' + n;
      const aDesNotes = Object.keys(S().grades).some((g) => g.startsWith(k + '|')) || Object.keys(S().attente).some((g) => g.startsWith(k + '|'));
      if ((aDesNotes || !absent) && !options.confirme) {
        const err = E(absent
          ? `Marquer ${X.nomComplet(s)} absent(e) ? Ses notes de cette évaluation seront effacées et sa moyenne vaudra 0.`
          : `Annuler l’absence de ${X.nomComplet(s)} à cette évaluation ?`);
        err.correction = true;
        throw err;
      }
      AK.store.modifier(`Notes : ${X.nomComplet(s)} ${absent ? 'marqué(e) absent(e)' : 'n’est plus absent(e)'} (${X.evalLabel(s.classe, n)})`, (st) => {
        if (absent) {
          Object.keys(st.grades).forEach((g) => g.startsWith(k + '|') && delete st.grades[g]);
          Object.keys(st.attente).forEach((g) => g.startsWith(k + '|') && delete st.attente[g]);
          st.compAbs[k] = true;
        } else delete st.compAbs[k];
      }, { rendu: false, categorie: 'notes' });
    },
    valider(classe, n) {
      AK.perm.exiger('notes.valider');
      const L = enAttenteDe(classe, n);
      if (!L.length) return 0;
      AK.store.modifier(`${u.pluriel(L.length, 'note')} validée(s) : ${classe}`, (st) =>
        L.forEach((k) => {
          st.grades[k] = st.attente[k];
          delete st.attente[k];
        }), { categorie: 'notes' });
      return L.length;
    },
    rejeter(classe, n) {
      AK.perm.exiger('notes.valider');
      const L = enAttenteDe(classe, n);
      if (!L.length) return 0;
      AK.store.modifier(`${u.pluriel(L.length, 'note')} en attente rejetée(s) : ${classe}`, (st) => L.forEach((k) => delete st.attente[k]), { categorie: 'notes' });
      return L.length;
    },
    basculerSaisie(classe, n) {
      AK.perm.exiger('notes.periode');
      const x = cleSaisie(classe, n);
      AK.store.modifier(`Saisie ${x.fermee ? 'rouverte' : 'fermée'} : ${classe} (${C.evCourt(n)})`, () => (x.fermee = !x.fermee), { categorie: 'notes' });
    },
    dateLimite(classe, n, date) {
      AK.perm.exiger('notes.periode');
      const e = V.date(date, 'Date limite');
      if (e) throw E(e);
      const x = cleSaisie(classe, n);
      AK.store.modifier(`Date limite de saisie ${classe} : ${date ? u.fmtDate(date) : 'aucune'}`, () => (x.fin = date || ''), { categorie: 'notes' });
    },
    basculerValidation(oui) {
      AK.perm.exiger('notes.periode');
      AK.store.modifier(`Validation des notes par le directeur : ${oui ? 'oui' : 'non'}`, (s) => (s.school.validation = !!oui));
    },
    /** Matières d'une composition au CP (choix parmi la liste officielle + matières ajoutées). */
    matieresCP(c, n, liste, nouvelle, aussiAutre) {
      AK.perm.exiger('notes.matieres', { classe: c });
      if (X.info(c).grille !== 'CP') throw E('Le choix des matières ne concerne que le CP1 et le CP2.');
      const nv = String(nouvelle || '').trim().toUpperCase().replace(/\s+/g, ' ').slice(0, 40);
      const L = [...liste];
      const tout = [...C.CP_MATIERES, ...(S().cpExtra || [])];
      if (nv && !L.includes(nv)) L.push(nv);
      if (!L.length) throw E('Choisissez au moins une matière.');
      const autre = c === 'CP1' ? 'CP2' : 'CP1';
      AK.store.modifier(`Matières ${c}${aussiAutre ? ' et ' + autre : ''} – ${X.evalLabel(c, n)}`, (s) => {
        if (nv && !tout.includes(nv)) s.cpExtra = [...(s.cpExtra || []), nv];
        const ordre = [...C.CP_MATIERES, ...(s.cpExtra || [])].filter((m) => L.includes(m));
        const defaut = ordre.length === C.CP_MATIERES.length && C.CP_MATIERES.every((m) => ordre.includes(m));
        [c, ...(aussiAutre ? [autre] : [])].forEach((k) => {
          s.cpMat[k] = s.cpMat[k] || {};
          s.cpMat[k][n] = defaut ? null : ordre;
        });
      }, { categorie: 'notes' });
    },
    fixerDecision(sid, d) {
      AK.perm.exiger('decision.modifier');
      const s = AK.eleves.trouver(sid);
      if (!s) throw E('Élève introuvable.');
      if (d && !C.DECISIONS.includes(d)) throw E('Décision inconnue.');
      AK.store.modifier(`Décision de ${X.nomComplet(s)} : ${d || 'proposition'}`, () => (s.decision = !d || d === X.decisionProposee(s) ? '' : d), { categorie: 'notes' });
    },
    anneeSuivante() {
      const y = parseInt(S().school.year, 10);
      return y ? `${y + 1}–${y + 2}` : '';
    },
    /** Bilan prévisionnel du passage (affiché avant confirmation). */
    bilanPassage() {
      const R = { montent: 0, restent: 0, sortants: 0, archives: 0, sansDecision: 0, niveauNonOuvert: [] };
      S().students.forEach((s) => {
        const d = X.decision(s);
        if (s.statut !== 'Inscrit' || ['Abandon', 'Exclu', 'Transféré'].includes(d)) return R.archives++;
        if (d === 'Admis') {
          const sv = X.niveauSuivant(s.classe);
          if (!sv) return R.sortants++;
          if (!X.niveaux().includes(sv)) {
            R.niveauNonOuvert.push(`${X.nomComplet(s)} (${s.classe} → ${sv})`);
            return R.sortants++;
          }
          return R.montent++;
        }
        if (!d) R.sansDecision++;
        R.restent++;
      });
      return R;
    },
    /**
     * Passage à l'année suivante (correction de 1.7.0 : un admis du plus haut niveau ouvert, autre que le CM2,
     * restait sans classe et bloquait le tableau de bord). Copie de sécurité préalable.
     */
    async passerAnnee() {
      AK.perm.exiger('annee.passer');
      const annee = S().school.year, suivante = notes.anneeSuivante();
      if (!suivante) throw E('Renseignez d’abord l’année scolaire en cours (Paramètres).');
      await AK.store.copieAvant('avant-passage-' + annee);
      const effs = Object.fromEntries(X.niveaux().map((c) => [c, X.actifsDe(c).length]));
      const R = { montent: 0, restent: 0, archives: 0 };
      AK.store.modifier(`Passage à ${suivante}`, (st) => {
        const arch = [], garder = [];
        st.students.forEach((s) => {
          const d = X.decision(s);
          if (s.statut === 'Inscrit') {
            const m = X.mga(s);
            s.parcours = [...(s.parcours || []), { annee, niveau: s.classe, moy: m != null ? u.fmtSaisie(m) : '', eff: String(effs[s.classe] || '') }];
          }
          if (s.statut !== 'Inscrit' || ['Abandon', 'Exclu', 'Transféré'].includes(d)) {
            arch.push({ ...s, decision: d || s.statut });
            R.archives++;
            return;
          }
          if (d === 'Admis') {
            const sv = X.niveauSuivant(s.classe);
            if (!sv) {
              arch.push({ ...s, decision: 'Admis (entrée en 6ème)' });
              R.archives++;
              return;
            }
            if (!X.niveaux().includes(sv)) {
              arch.push({ ...s, decision: `Admis en ${sv} (niveau non ouvert dans l’école : à transférer)` });
              R.archives++;
              return;
            }
            s.classe = sv;
            s.redoublant = false;
            R.montent++;
          } else {
            if (d === 'Redoublant') s.redoublant = true;
            R.restent++;
          }
          s.decision = '';
          garder.push(s);
        });
        st.archives[annee || 'sans-annee'] = { students: arch, grades: st.grades, compAbs: st.compAbs, att: st.att, appel: st.appel, cloture: new Date().toISOString() };
        Object.assign(st, { students: garder, grades: {}, compAbs: {}, att: {}, appel: {}, attente: {}, saisie: {} });
        Object.assign(st.school, { year: suivante, evalCourante: 1 });
      }, { categorie: 'annee' });
      AK.store.journaliser(`Passage à ${suivante} : ${R.montent} admis passent, ${R.restent} restent, ${R.archives} archivés`);
      return R;
    }
  };
  AK.notes = notes;
})(window.AK);

<script>
/* =====================================================================================
   Appel du jour et demandes d'autorisation d'absence (personnel et élèves).
   ===================================================================================== */
(function (AK) {
  'use strict';
  const C = AK.cfg, u = AK.u, V = AK.valid, X = AK.calc;
  const S = () => AK.store.etat;
  const E = (m, champ) => new AK.ErreurMetier(m, champ);

  const absences = {
    /** État suivant d'une case de l'appel : Présent → Absent → Absent justifié → Présent. */
    basculer(date, classe, sid) {
      const s = AK.eleves.trouver(sid);
      if (!s || s.classe !== classe) throw E('Élève introuvable dans cette classe.');
      AK.perm.exiger('appel.faire', { classe });
      if (V.date(date, 'Date')) throw E('Date invalide.');
      if (date > u.aujourdhui()) throw E('Impossible de faire l’appel d’un jour à venir.');
      const d = S().att[date] || {};
      const v = d[sid] || '';
      // un enseignant ne lève pas une absence déjà enregistrée
      if (v && !AK.perm.peut('appel.lever')) throw E('Absence déjà enregistrée : seul le directeur peut la modifier.');
      const nv = AK.perm.peut('appel.lever') ? (v === '' ? 'A' : v === 'A' ? 'J' : '') : 'A';
      AK.store.modifier(null, (st) => {
        const j = st.att[date] || (st.att[date] = {});
        if (nv) j[sid] = nv;
        else delete j[sid];
        (st.appel[date] || (st.appel[date] = {}))[classe] = true;
      }, { rendu: false });
      return nv;
    },
    tousPresents(date, classe) {
      AK.perm.exiger('appel.faire', { classe });
      const directeur = AK.perm.peut('appel.lever');
      AK.store.modifier(`Appel ${classe} du ${u.fmtDate(date)} : ${directeur ? 'tout le monde présent' : 'les autres élèves présents'}`, (st) => {
        const j = st.att[date] || (st.att[date] = {});
        if (directeur) X.actifsDe(classe).forEach((s) => delete j[s.id]);
        (st.appel[date] || (st.appel[date] = {}))[classe] = true;
      }, { categorie: 'appel' });
    },
    valider(date, classe) {
      AK.perm.exiger('appel.faire', { classe });
      AK.store.modifier(`Appel validé : ${classe}, ${u.fmtDate(date)}`, (st) => ((st.appel[date] || (st.appel[date] = {}))[classe] = true), { categorie: 'appel' });
    },
    joursDemande: (a) => X.joursClasse(a.du, a.au).length,
    /** Demande d'autorisation. d = { qui: 'personnel'|'eleve', pid, du, au, motif, precision } */
    demander(d) {
      AK.perm.exiger('autorisation.demander');
      if (d.qui !== 'eleve' && d.qui !== 'personnel') throw E('Choisissez pour qui est la demande.', 'qui');
      let nom = '';
      if (d.qui === 'eleve') {
        const s = AK.eleves.trouver(d.pid);
        if (!s) throw E('Élève introuvable : choisissez-le dans la liste.', 'pid');
        if (!AK.perm.peut('eleve.voir', { classe: s.classe })) throw E('Cet élève n’est pas dans votre classe.', 'pid');
        nom = X.nomComplet(s);
      } else {
        const t = AK.personnel.trouver(d.pid);
        if (!t) throw E(S().teachers.length ? 'Personne introuvable : choisissez-la dans la liste.' : 'Aucun membre du personnel enregistré : ajoutez d’abord la personne dans Personnel.', 'pid');
        const moi = AK.session.agent();
        if (AK.session.estEnseignant() && (!moi || moi.id !== t.id)) throw E('Vous ne pouvez demander une autorisation que pour vous-même ou un élève de votre classe.', 'pid');
        nom = t.nom;
      }
      let e = V.date(d.du, 'Date de début', { requise: true });
      if (e) throw E(e, 'du');
      if ((e = V.date(d.au, 'Date de fin', { requise: true }))) throw E(e, 'au');
      if ((e = V.periode(d.du, d.au))) throw E(e, 'au');
      if (u.ecartJours(d.du, d.au) > 366) throw E('Période trop longue (un an au plus).', 'au');
      if (!C.MOTIFS.includes(d.motif)) throw E('Choisissez le motif.', 'motif');
      if ((e = V.texte(d.precision, 'Précision', { max: 160 }))) throw E(e, 'precision');
      const an = X.anneeRentree();
      const n = S().auth.reduce((k, a) => Math.max(k, parseInt(String(a.ref).split('-').pop(), 10) || 0), 0) + 1;
      const a = { id: u.uid(), ref: `AUT-${an}-${u.pad(n, 3)}`, qui: d.qui, pid: d.pid, nom, du: d.du, au: d.au, motif: d.motif, precision: String(d.precision || '').trim(), statut: 'En attente', cree: u.aujourdhui() };
      AK.store.modifier(`Demande ${a.ref} : ${nom}`, (st) => st.auth.push(a), { categorie: 'autorisations' });
      return a;
    },
    /** Accorder : pour un élève, crée les absences justifiées des jours de classe concernés. */
    decider(id, accord) {
      AK.perm.exiger('autorisation.decider');
      const a = S().auth.find((x) => x.id === id);
      if (!a) throw E('Demande introuvable.');
      if (a.statut !== 'En attente') throw E('Cette demande a déjà reçu une décision.');
      let n = 0;
      AK.store.modifier(`${a.ref} ${accord ? 'accordée' : 'refusée'}`, (st) => {
        a.statut = accord ? 'Accordée' : 'Refusée';
        a.decideLe = u.aujourdhui();
        if (accord && a.qui === 'eleve')
          X.joursClasse(a.du, a.au).forEach((d) => {
            (st.att[d] || (st.att[d] = {}))[a.pid] = 'J';
            n++;
          });
      }, { categorie: 'autorisations' });
      return n;
    },
    supprimer(id) {
      AK.perm.exiger('autorisation.supprimer');
      const a = S().auth.find((x) => x.id === id);
      if (!a) throw E('Demande introuvable.');
      AK.store.modifier(`Demande supprimée : ${a.ref}`, (st) => (st.auth = st.auth.filter((x) => x !== a)), { categorie: 'autorisations' });
    },
    visible(a) {
      if (AK.session.estDirecteur()) return true;
      const moi = AK.session.agent();
      if (a.qui === 'personnel') return !!moi && a.pid === moi.id;
      const s = AK.eleves.trouver(a.pid);
      return !!s && AK.session.classes().includes(s.classe);
    },
    /* ---------- Calendrier (jours fériés et congés) ---------- */
    ajouterConge(d) {
      AK.perm.exiger('parametres.gerer');
      let e = V.texte(d.lib, 'Libellé', { requis: true, max: 80 });
      if (e) throw E(e, 'lib');
      if ((e = V.date(d.du, 'Date', { requise: true }))) throw E(e, 'du');
      if ((e = V.date(d.au, 'Fin'))) throw E(e, 'au');
      if ((e = V.periode(d.du, d.au))) throw E(e, 'au');
      AK.store.modifier(`Calendrier : ${String(d.lib).trim()} ajouté`, (st) => st.conges.push({ id: u.uid(), lib: String(d.lib).trim(), du: d.du, au: d.au && d.au !== d.du ? d.au : '' }));
    },
    supprimerConge(id) {
      AK.perm.exiger('parametres.gerer');
      const c = S().conges.find((x) => x.id === id);
      if (!c) return;
      AK.store.modifier(`Calendrier : ${c.lib} supprimé`, (st) => (st.conges = st.conges.filter((x) => x !== c)));
    }
  };
  AK.absences = absences;
})(window.AK);

//# sourceURL=akwa/js/domain/absences.js
</script>
<script>
/* =====================================================================================
   Gestion de l'école (modules PRO de 1.7.0) : vie scolaire, scolarité et finances,
   services (bibliothèque, CEPE, parents), liaison avec l'IEPP.
   ===================================================================================== */
(function (AK) {
  'use strict';
  const C = AK.cfg, u = AK.u, V = AK.valid, X = AK.calc;
  const S = () => AK.store.etat;
  const P = () => S().pro;
  const E = (m, champ) => new AK.ErreurMetier(m, champ);
  const eleveVisible = (sid) => {
    const s = AK.eleves.trouver(sid);
    if (!s) throw E('Élève introuvable : choisissez-le dans la liste.', 'sid');
    if (!AK.perm.peut('eleve.voir', { classe: s.classe })) throw E('Cet élève n’est pas dans votre classe.', 'sid');
    return s;
  };
  const txt = (v, lib, o) => {
    const e = V.texte(v, lib, o);
    if (e) throw E(e);
    return String(v || '').trim();
  };

  /* ---------- Finances : calculs ---------- */
  const fraisDe = (c) => {
    const F = P().frais[c] || {};
    return { inscription: +F.inscription || 0, coges: +F.coges || 0, tenue: +F.tenue || 0, autre: +F.autre || 0 };
  };
  const duDe = (s) => Object.values(fraisDe(s.classe)).reduce((a, b) => a + b, 0);
  const payeDe = (s) => P().paiements.filter((p) => p.sid === s.id && !p.annule).reduce((a, p) => a + (+p.montant || 0), 0);
  const etatPaie = (s) => {
    const d = duDe(s), p = payeDe(s);
    return !d ? 'Aucun frais' : p >= d ? 'Soldé' : p > 0 ? 'Partiel' : 'Non payé';
  };
  const encaisse = () => P().paiements.filter((p) => !p.annule).reduce((a, p) => a + (+p.montant || 0), 0);
  const depense = () => P().depenses.reduce((a, d) => a + (+d.montant || 0), 0);

  const pro = {
    fraisDe, duDe, payeDe, etatPaie, encaisse, depense,
    telParent: (s) => s.tel || (s.pere && s.pere.tel) || (s.mere && s.mere.tel) || '',

    /* ---------- Emploi du temps ---------- */
    caseEdt(classe, k, matiere) {
      AK.perm.exiger('vie.utiliser', { classe });
      AK.store.modifier(null, () => {
        const E2 = P().edt[classe] || (P().edt[classe] = {});
        if (matiere) E2[k] = String(matiere).slice(0, 40);
        else delete E2[k];
      }, { rendu: false });
    },
    edtType(classe) {
      AK.perm.exiger('vie.utiliser', { classe });
      const M = X.matieres(classe, 1).map(([m]) => m), E2 = {};
      C.JOURS_EDT.forEach(([d], k) => C.CRENEAUX.forEach((h, i) => {
        E2[d + '|' + i] = i === 2 ? 'RECREATION' : i === 6 && k % 2 ? 'EPS' : i === 5 && k === 0 ? 'ANGLAIS' : M[(i + k * 3) % M.length];
      }));
      AK.store.modifier('Emploi du temps type : ' + classe, () => (P().edt[classe] = E2));
    },
    /* ---------- Cahier de textes ---------- */
    seance(d, id) {
      AK.perm.exiger('vie.utiliser', { classe: d.classe });
      const e = V.date(d.date, 'Date', { requise: true });
      if (e) throw E(e, 'date');
      if (!d.mat) throw E('Choisissez la discipline.', 'mat');
      const x = { classe: d.classe, date: d.date, mat: String(d.mat), contenu: txt(d.contenu, 'Contenu de la séance', { requis: true, max: 1000 }), travail: txt(d.travail, 'Travail à faire', { max: 300 }) };
      if (id) {
        const o = P().cahier.find((c) => c.id === id);
        if (!o) throw E('Séance introuvable.');
        AK.store.modifier('Cahier de textes modifié : ' + d.classe, () => Object.assign(o, x));
      } else AK.store.modifier('Cahier de textes : ' + d.classe + ' · ' + d.mat, () => P().cahier.push({ id: u.uid(), ...x }));
    },
    supprimerSeance(id) {
      const o = P().cahier.find((c) => c.id === id);
      if (!o) return;
      AK.perm.exiger('vie.utiliser', { classe: o.classe });
      AK.store.modifier('Séance supprimée du cahier de textes', () => (P().cahier = P().cahier.filter((c) => c !== o)));
    },
    /* ---------- Discipline ---------- */
    incident(d) {
      const s = eleveVisible(d.sid);
      const e = V.date(d.date, 'Date', { requise: true, max: u.aujourdhui() });
      if (e) throw E(e, 'date');
      if (!C.FAITS.includes(d.fait)) throw E('Choisissez le fait.', 'fait');
      if (!C.SANCTIONS.includes(d.sanction)) throw E('Choisissez la sanction.', 'sanction');
      const pts = /Bagarre|Insolence|Dégradation|Tricherie|dangereux/.test(d.fait) ? 3 : 1;
      AK.store.modifier('Discipline : ' + X.nomComplet(s) + ' · ' + d.fait, () =>
        P().incidents.push({ id: u.uid(), sid: s.id, date: d.date, fait: d.fait, detail: txt(d.detail, 'Précision', { max: 200 }), sanction: d.sanction, statut: d.statut === 'Traité' ? 'Traité' : 'En cours', pts }));
    },
    clore(id) {
      const x = P().incidents.find((o) => o.id === id);
      if (!x) return;
      eleveVisible(x.sid);
      AK.store.modifier('Fait de discipline clos', () => (x.statut = 'Traité'));
    },
    supprimerIncident(id) {
      AK.perm.exiger('vie.supprimer');
      AK.store.modifier('Fait de discipline supprimé', () => (P().incidents = P().incidents.filter((o) => o.id !== id)));
    },
    /* ---------- Infirmerie ---------- */
    soin(d) {
      const s = eleveVisible(d.sid);
      const e = V.date(d.date, 'Date', { requise: true, max: u.aujourdhui() });
      if (e) throw E(e, 'date');
      if (!C.MAUX.includes(d.motif)) throw E('Choisissez le motif.', 'motif');
      AK.store.modifier('Infirmerie : passage enregistré (' + s.classe + ')', () =>
        P().soins.push({ id: u.uid(), sid: s.id, date: d.date, heure: /^\d\d:\d\d$/.test(d.heure || '') ? d.heure : '', motif: d.motif, suite: C.SUITES_SOIN.includes(d.suite) ? d.suite : C.SUITES_SOIN[0], soin: txt(d.soin, 'Soins donnés', { max: 200 }) }));
    },
    supprimerSoin(id) {
      AK.perm.exiger('vie.supprimer');
      AK.store.modifier('Passage à l’infirmerie supprimé', () => (P().soins = P().soins.filter((o) => o.id !== id)));
    },
    /* ---------- Événements ---------- */
    evenement(d) {
      AK.perm.exiger('vie.utiliser');
      const e = V.date(d.date, 'Date', { requise: true });
      if (e) throw E(e, 'date');
      const titre = txt(d.titre, 'Intitulé', { requis: true, max: 100 });
      AK.store.modifier('Événement : ' + titre, () => P().events.push({ id: u.uid(), date: d.date, type: ['acc', 'w', 'g', 'b'].includes(d.type) ? d.type : 'acc', titre }));
    },
    supprimerEvenement(id) {
      AK.perm.exiger('vie.supprimer');
      AK.store.modifier('Événement supprimé', () => (P().events = P().events.filter((e) => e.id !== id)));
    },

    /* ---------- Frais et versements ---------- */
    fixerFrais(table) {
      AK.perm.exiger('finances.gerer');
      const F = {};
      X.niveaux().forEach((c) => {
        F[c] = {};
        ['inscription', 'coges', 'tenue', 'autre'].forEach((k) => {
          const v = Math.round(Number(table[c + '|' + k]) || 0);
          if (v < 0 || v > 10000000) throw E(`${c} : montant invalide (0 à 10 000 000 F).`, c + '|' + k);
          F[c][k] = v;
        });
      });
      AK.store.modifier('Frais par niveau modifiés', () => Object.assign(P().frais, F), { categorie: 'finances' });
    },
    encaisser(d) {
      AK.perm.exiger('finances.gerer');
      const s = AK.eleves.trouver(d.sid);
      if (!s) throw E('Choisissez l’élève.', 'sid');
      let e = V.montant(d.montant, 'Montant', { min: 25, max: 10000000 });
      if (e) throw E(e, 'montant');
      if ((e = V.date(d.date, 'Date', { requise: true, max: u.aujourdhui() }))) throw E(e, 'date');
      if (!C.MODES_PAIE.includes(d.mode)) throw E('Choisissez le mode de paiement.', 'mode');
      const p = { id: u.uid(), ref: `REC-${X.anneeRentree()}-${u.pad(P().seq.rec, 5)}`, sid: s.id, montant: Math.round(+d.montant), mode: d.mode, objet: C.OBJETS_PAIE.includes(d.objet) ? d.objet : 'Autre', date: d.date, payeur: txt(d.payeur, 'Versé par', { max: 80 }), cree: Date.now() };
      AK.store.modifier(`Versement ${p.ref} : ${u.fcfa(p.montant)}`, () => {
        P().seq.rec++;
        P().paiements.push(p);
      }, { categorie: 'finances' });
      return p;
    },
    /** Annulation d'un reçu : conservé dans l'historique avec la mention ANNULÉ (jamais effacé). */
    annulerRecu(id, motif) {
      AK.perm.exiger('finances.gerer');
      const p = P().paiements.find((x) => x.id === id);
      if (!p) throw E('Reçu introuvable.');
      if (p.annule) throw E('Ce reçu est déjà annulé.');
      const m = txt(motif, 'Motif d’annulation', { requis: true, max: 160 });
      AK.store.modifier(`Reçu annulé : ${p.ref} (${m})`, () => (p.annule = { le: new Date().toISOString(), motif: m, par: AK.session.libelle() }), { categorie: 'finances' });
    },
    depense(d) {
      AK.perm.exiger('finances.gerer');
      const libelle = txt(d.libelle, 'Libellé', { requis: true, max: 120 });
      let e = V.montant(d.montant, 'Montant', { min: 1, max: 100000000 });
      if (e) throw E(e, 'montant');
      if ((e = V.date(d.date, 'Date', { requise: true, max: u.aujourdhui() }))) throw E(e, 'date');
      AK.store.modifier('Dépense : ' + libelle + ' · ' + u.fcfa(+d.montant), () =>
        P().depenses.push({ id: u.uid(), libelle, cat: C.CAT_DEP.includes(d.cat) ? d.cat : 'Autre', montant: Math.round(+d.montant), date: d.date, fournisseur: txt(d.fournisseur, 'Fournisseur', { max: 80 }), justif: txt(d.justif, 'Justificatif', { max: 60 }) }), { categorie: 'finances' });
    },
    supprimerDepense(id) {
      AK.perm.exiger('finances.gerer');
      const x = P().depenses.find((o) => o.id === id);
      if (!x) return;
      AK.store.modifier(`Dépense supprimée : ${x.libelle} (${u.fcfa(x.montant)})`, () => (P().depenses = P().depenses.filter((o) => o !== x)), { categorie: 'finances' });
    },
    /* ---------- Cantine ---------- */
    cantineInscrire(sid, oui) {
      AK.perm.exiger('finances.gerer');
      AK.store.modifier(null, () => {
        if (oui) P().cantine.inscrits[sid] = true;
        else delete P().cantine.inscrits[sid];
      });
    },
    cantineTous(classe) {
      AK.perm.exiger('finances.gerer');
      AK.store.modifier('Cantine : toute la classe ' + classe + ' inscrite', () => X.actifsDe(classe).forEach((s) => (P().cantine.inscrits[s.id] = true)));
    },
    cantinePrix(prix) {
      AK.perm.exiger('finances.gerer');
      const e = V.montant(prix, 'Prix du repas', { min: 0, max: 100000 });
      if (e) throw E(e, 'prix');
      AK.store.modifier('Prix du repas : ' + u.fcfa(+prix), () => (P().cantine.prix = Math.round(+prix)));
    },
    cantineMenu(i, plat) {
      AK.perm.exiger('finances.gerer');
      AK.store.modifier(null, () => (P().cantine.menu[i].p = String(plat || '').trim().slice(0, 80)), { rendu: false });
    },
    cantineJour() {
      AK.perm.exiger('finances.gerer');
      const j = u.aujourdhui();
      if (!X.estJourClasse(j)) throw E('Aujourd’hui n’est pas un jour de classe.');
      const abs = S().att[j] || {};
      const n = X.actifs().filter((s) => P().cantine.inscrits[s.id] && !abs[s.id]).length;
      AK.store.modifier(`Cantine : ${n} repas le ${u.fmtDate(j)}`, () => (P().cantine.repas[j] = n));
      return n;
    },

    /* ---------- Bibliothèque ---------- */
    ouvrage(d) {
      AK.perm.exiger('services.utiliser');
      const titre = txt(d.titre, 'Titre', { requis: true, max: 120 });
      const ex = Math.round(Number(d.ex));
      if (!(ex >= 1 && ex <= 9999)) throw E('Nombre d’exemplaires : de 1 à 9999.', 'ex');
      const g = C.GENRES.includes(d.genre) ? d.genre : 'Manuel';
      const cote = txt(d.cote, 'Cote', { max: 20 }) || u.norm(g).slice(0, 3).toUpperCase() + '-' + (100 + P().livres.length * 7);
      if (P().livres.some((b) => b.cote === cote)) throw E('Cette cote est déjà utilisée.', 'cote');
      AK.store.modifier('Ouvrage ajouté : ' + titre, () => P().livres.push({ id: u.uid(), titre, auteur: txt(d.auteur, 'Auteur', { max: 80 }), genre: g, ex, cote }));
    },
    retirerOuvrage(id) {
      AK.perm.exiger('services.utiliser');
      if (P().prets.some((p) => p.livre === id && !p.rendu)) throw E('Des exemplaires sont encore prêtés.');
      AK.store.modifier('Ouvrage retiré du fonds', () => (P().livres = P().livres.filter((b) => b.id !== id)));
    },
    preter(d) {
      AK.perm.exiger('services.utiliser');
      const s = eleveVisible(d.sid);
      const b = P().livres.find((x) => x.id === d.livre);
      if (!b) throw E('Choisissez l’ouvrage.', 'livre');
      if (P().prets.filter((p) => p.livre === b.id && !p.rendu).length >= b.ex) throw E('Aucun exemplaire disponible.', 'livre');
      let e = V.date(d.out, 'Date du prêt', { requise: true });
      if (e) throw E(e, 'out');
      if ((e = V.date(d.due, 'Retour prévu', { requise: true, min: d.out }))) throw E(e, 'due');
      AK.store.modifier('Prêt : ' + b.titre + ' (' + s.classe + ')', () => P().prets.push({ id: u.uid(), sid: s.id, livre: b.id, out: d.out, due: d.due, rendu: false }));
    },
    retour(id) {
      AK.perm.exiger('services.utiliser');
      const p = P().prets.find((x) => x.id === id);
      if (p) AK.store.modifier('Retour d’un ouvrage enregistré', () => (p.rendu = u.aujourdhui()));
    },
    /* ---------- CEPE ---------- */
    pieceCepe(sid, k, oui) {
      AK.perm.exiger('services.utiliser');
      eleveVisible(sid);
      if (!C.PIECES_CEPE.some(([x]) => x === k)) throw E('Pièce inconnue.');
      AK.store.modifier(null, () => ((P().cepe[sid] = P().cepe[sid] || {})[k] = !!oui));
    },
    dossierCepe(s) {
      const d = P().cepe[s.id] || {};
      const pieces = C.PIECES_CEPE.filter(([k]) => (k === 'extrait' ? d.extrait ?? !!s.extrait : d[k]));
      return { d, n: pieces.length, complet: pieces.length === C.PIECES_CEPE.length };
    },
    /* ---------- Parents ---------- */
    cibleSms(dest, classe) {
      const abs = S().att[u.aujourdhui()] || {};
      return X.actifs().filter((s) => AK.session.classes().includes(s.classe) && (dest === 'tous' || (dest === 'classe' && s.classe === classe) || (dest === 'cm2' && s.classe === 'CM2') || (dest === 'absents' && abs[s.id] === 'A') || (dest === 'impayes' && ['Partiel', 'Non payé'].includes(etatPaie(s)))));
    },
    noterEnvoi(d) {
      AK.perm.exiger('services.utiliser');
      AK.store.modifier(`Message aux parents : ${d.dest} (${d.n})`, () => P().sms.unshift({ id: u.uid(), date: u.aujourdhui(), dest: d.dest, n: d.n, objet: d.objet, texte: String(d.texte || '').slice(0, 459) }));
    },
    annonce(d) {
      AK.perm.exiger('services.utiliser');
      const titre = txt(d.titre, 'Titre', { requis: true, max: 100 });
      const corps = txt(d.corps, 'Texte', { requis: true, max: 1500 });
      AK.store.modifier('Annonce publiée : ' + titre, () => P().annonces.push({ id: u.uid(), titre, cible: ['Parents', 'Enseignants', 'Élèves', 'Tous'].includes(d.cible) ? d.cible : 'Tous', date: d.date || u.aujourdhui(), corps }));
    },
    retirerAnnonce(id) {
      AK.perm.exiger('services.utiliser');
      AK.store.modifier('Annonce retirée', () => (P().annonces = P().annonces.filter((a) => a.id !== id)));
    },

    /* ---------- Liaison IEPP ---------- */
    paquetIEPP(n) {
      const sc = S().school, A = X.actifs();
      const sx = (L) => ({ G: L.filter((s) => s.sexe === 'Masculin').length, F: L.filter((s) => s.sexe === 'Féminin').length, T: L.length });
      const mois = u.aujourdhui().slice(0, 7), absM = Object.entries(S().att).filter(([d]) => d.slice(0, 7) === mois);
      return {
        format: 'AKWA SCHOOL · transmission IEPP', version: 2, genere: new Date().toISOString(), application: AK.NOM + ' ' + AK.VERSION,
        ecole: { nom: sc.name, code: sc.codeecole || '', iepp: sc.iepp, drenaet: sc.drenaet, annee: sc.year, directeur: sc.director, statut: sc.statut || '' },
        evaluation: { numero: n, libelle: C.EV_GEN[n - 1] },
        effectifs: X.niveaux().map((c) => ({ classe: c, ...sx(X.actifsDe(c)) })),
        resultats: X.niveaux().map((c) => {
          const r = X.reussite(c, n);
          return { classe: c, moyenne: X.moyClasse(c, n), evalues: r.n, admis_seuil: r.ok, taux: r.n ? u.arrondi((r.ok / r.n) * 100, 1) : null, seuil: X.info(c).seuil, echelle: X.echelle(c) };
        }),
        absences_mois: { mois, non_justifiees: absM.reduce((a, [, m]) => a + Object.values(m).filter((v) => v === 'A').length, 0), justifiees: absM.reduce((a, [, m]) => a + Object.values(m).filter((v) => v && v !== 'A').length, 0) },
        // personnel : fonction et classes seulement (pas de téléphone : minimisation des données)
        personnel: S().teachers.filter((t) => t.actif !== false).map((t) => ({ nom: t.nom, fonction: t.fonction || '', fonctionnement: t.fonct || '', classes: X.clsDe(t).join(' ') })),
        cepe: { candidats: A.filter((s) => s.classe === 'CM2').length },
        vie_scolaire: { incidents: P().incidents.length, soins: P().soins.length, inscrits_cantine: A.filter((s) => P().cantine.inscrits[s.id]).length },
        finances: { encaisse: encaisse(), depenses: depense() }
      };
    },
    noterTransmission(objet) {
      AK.perm.exiger('liaison.gerer');
      AK.store.modifier('Transmission IEPP : ' + objet, () => P().transmis.unshift({ date: u.aujourdhui(), objet }));
    }
  };
  AK.pro = pro;
})(window.AK);
