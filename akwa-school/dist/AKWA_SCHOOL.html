<script>
/* =====================================================================================
   Listes et états imprimables (paginés automatiquement, en-tête de tableau répété).
   Pas d'inscription au registre : ce sont des états de gestion, datés au pied de page.
   ===================================================================================== */
(function (AK) {
  'use strict';
  const u = AK.u, { html } = u, C = AK.cfg;
  const S = () => AK.store.etat;
  const X = () => AK.calc;
  const def = (d) => AK.modeles.def({ categorie: 'liste', sujet: 'ecole', version: 1, ...d });
  const sx = (L) => X().compteSexe(L).map((v, i) => html`<td${i === 2 ? html` style="font-weight:800"` : ''}>${v}</td>`);
  const suite = (r, titre) => html`<div class="doc-note" style="margin-bottom:2mm">${S().school.name} · ${titre} (suite)</div>`;
  const signer = (r, ctx) => (r.signatures && r.signatures.length ? AK.mise.signatures(r, ctx) : '');
  const SIG_DIR = [{ role: 'Le Directeur', nom: '{directeur}', cachet: true }];

  def({
    id: 'liste-classe', lib: 'Liste des élèves d’une classe', icone: 'list', sujet: 'classe',
    description: 'Ordre alphabétique, matricule, sexe, naissance, extrait. Colonnes vides facultatives pour émargement.',
    champsOptionnels: [['naissance', 'Date de naissance', true], ['extrait', 'Extrait de naissance', true], ['emargement', 'Colonne d’émargement', false], ['parents', 'Contact des parents', false]],
    defauts: { titre: 'LISTE DES ÉLÈVES', champs: { naissance: true, extrait: true, emargement: false, parents: false }, signatures: SIG_DIR, qr: { actif: false } },
    rendu(ctx, r, o) {
      const x = X(), c = ctx.classe, L = x.actifsDe(c).sort(x.parNom), t = x.enseignantDe(c);
      const tete = html`<tr><th>N°</th><th>Matricule</th><th class="g">Nom et prénoms</th><th>Sexe</th>${r.champs.naissance !== false ? html`<th>Né(e) le</th>` : ''}${r.champs.extrait !== false ? html`<th>Extrait</th>` : ''}${r.champs.parents ? html`<th>Contact parent</th>` : ''}${r.champs.emargement ? html`<th style="width:30mm">Émargement</th>` : ''}</tr>`;
      const lignes = L.map((s, i) => html`<tr><td>${i + 1}</td><td>${x.matOf(s)}</td><td class="nom">${x.nomComplet(s)}</td><td>${s.sexe ? s.sexe[0] : ''}</td>${r.champs.naissance !== false ? html`<td>${x.fmtNaissance(s)}</td>` : ''}${r.champs.extrait !== false ? html`<td>${s.extrait ? 'Oui' : 'Non'}</td>` : ''}${r.champs.parents ? html`<td>${AK.pro.telParent(s)}</td>` : ''}${r.champs.emargement ? html`<td></td>` : ''}</tr>`);
      const [g, f] = x.compteSexe(L);
      return { liste: { avant: html`${o.entete(r)}${o.titre(`${r.titre} – ${c}`, `Enseignant(e) : ${t ? t.nom : '—'} · ${L.length} élèves (${g} garçons, ${f} filles)`)}`, tete, lignes, apres: signer(r, ctx), suite: suite(r, `Liste ${c}`) } };
    }
  });

  def({
    id: 'registre-eleves', lib: 'Registre général des élèves', icone: 'book',
    description: 'Tous les élèves (inscrits et partis), classés par niveau : identité, naissance, extrait, statut.',
    champsOptionnels: [['parents', 'Parent et téléphone', true], ['partis', 'Inclure les élèves partis', true]],
    defauts: { titre: 'REGISTRE GÉNÉRAL DES ÉLÈVES', page: { orientation: 'paysage', marges: { h: 10, d: 10, b: 10, g: 10 } }, champs: { parents: true, partis: true }, signatures: SIG_DIR, qr: { actif: false }, entete: { compact: true } },
    orientations: ['paysage', 'portrait'],
    rendu(ctx, r, o) {
      const x = X(), L = S().students.filter((s) => r.champs.partis !== false || s.statut === 'Inscrit').slice().sort(x.parClasse);
      const tete = html`<tr><th>N°</th><th>Matricule</th><th class="g">Nom et prénoms</th><th>Sexe</th><th>Classe</th><th>Né(e) le</th><th>Âge</th><th>Nationalité</th><th>Extrait (n° / date)</th>${r.champs.parents !== false ? html`<th>Parent / tuteur</th><th>Téléphone</th>` : ''}<th>Red.</th><th>Statut</th></tr>`;
      const lignes = L.map((s, i) => {
        const p = s.parent || [s.pere && s.pere.nom, s.pere && s.pere.prenoms].filter(Boolean).join(' ') || [s.mere && s.mere.nom, s.mere && s.mere.prenoms].filter(Boolean).join(' ');
        return html`<tr><td>${i + 1}</td><td>${x.matOf(s)}</td><td class="nom">${x.nomComplet(s)}</td><td>${s.sexe ? s.sexe[0] : ''}</td><td>${s.classe}</td><td>${x.fmtNaissance(s)}</td><td>${x.ageDe(s) ?? ''}</td><td>${u.capitale(s.nationalite)}</td><td>${s.extrait ? `${(s.acte && s.acte.num) || '?'} du ${u.fmtDate(s.acte && s.acte.date)}` : 'Non'}</td>${r.champs.parents !== false ? html`<td class="g">${p}</td><td>${AK.pro.telParent(s)}</td>` : ''}<td>${s.redoublant ? 'Oui' : ''}</td><td>${s.statut}</td></tr>`;
      });
      return { liste: { avant: html`${o.entete(r)}${o.titre(r.titre, `Année scolaire ${S().school.year} · ${L.length} élèves`)}`, tete, lignes, classeTab: 'doc-tab serre', apres: signer(r, ctx), suite: suite(r, 'Registre général') } };
    }
  });

  def({
    id: 'etat-classe', lib: 'État de la classe (liste et statistiques)', icone: 'grid', sujet: 'classe',
    description: 'Liste de la classe suivie des statistiques par sexe : ivoiriens, étrangers, extraits, redoublants.',
    defauts: { titre: 'ÉTAT DES ÉLÈVES', signatures: SIG_DIR, qr: { actif: false } },
    rendu(ctx, r, o) {
      const x = X(), c = ctx.classe, L = x.actifsDe(c).sort(x.parNom), t = x.enseignantDe(c);
      const tete = html`<tr><th>N°</th><th class="g">Nom et prénoms</th><th>Matricule</th><th>Sexe</th><th>Naissance</th><th>Extrait</th></tr>`;
      const lignes = L.map((s, i) => html`<tr><td>${i + 1}</td><td class="nom">${x.nomComplet(s)}</td><td>${x.matOf(s)}</td><td>${s.sexe ? s.sexe[0] : ''}</td><td>${x.fmtNaissance(s)}</td><td>${s.extrait ? 'Oui' : 'Non'}</td></tr>`);
      const stats = [['Inscrits', L], ['Ivoiriens', L.filter(x.estIvoirien)], ['Étrangers', L.filter((s) => !x.estIvoirien(s))], ['Avec extrait', L.filter((s) => s.extrait)], ['Sans extrait', L.filter((s) => !s.extrait)], ['Redoublants', L.filter((s) => s.redoublant)]];
      const apres = html`<div class="doc-section">Statistiques de la classe</div><table class="doc-tab serre" style="max-width:120mm"><thead><tr><th class="g"></th><th>G</th><th>F</th><th>T</th></tr></thead><tbody>${stats.map(([l, X2]) => html`<tr><td class="g">${l}</td>${sx(X2)}</tr>`)}</tbody></table>${signer(r, ctx)}`;
      return { liste: { avant: html`${o.entete(r)}${o.titre(`${r.titre} – CLASSE DE ${c}`, `Enseignant(e) : ${t ? t.nom : '—'}`)}`, tete, lignes, apres, suite: suite(r, `État ${c}`) } };
    }
  });

  def({
    id: 'classement', lib: 'Classement d’une classe', icone: 'award', sujet: 'classe',
    description: 'Rang, moyenne et mention pour une composition ou pour l’année (MGA).',
    defauts: { titre: 'CLASSEMENT', signatures: SIG_DIR, qr: { actif: false } },
    rendu(ctx, r, o) {
      const x = X(), c = ctx.classe, per = ctx.periode, { all } = x.classement(c, per), e = x.echelle(c);
      const tete = html`<tr><th>Rang</th><th class="g">Élève</th><th>Matricule</th><th>${per === 'A' ? 'MGA' : 'Moyenne'} / ${e}</th><th>Mention</th>${per === 'A' ? html`<th>Décision</th>` : ''}</tr>`;
      const lignes = all.map((z) => html`<tr><td>${x.rangTxt(z.rank)}</td><td class="nom">${x.nomComplet(z.s)}</td><td>${x.matOf(z.s)}</td><td><b>${u.fmtNote(z.avg)}</b></td><td>${x.mention(z.avg, c)}</td>${per === 'A' ? html`<td>${x.decision(z.s) || '—'}</td>` : ''}</tr>`);
      const rs = x.reussite(c, per);
      return { liste: { avant: html`${o.entete(r)}${o.titre(`${r.titre} – ${c}`, `${x.perLabel(per, c)} · moyenne de la classe ${u.fmtNote(x.moyClasse(c, per))} / ${e} · réussite ${u.pct(rs.ok, rs.n)}`)}`, tete, lignes, apres: signer(r, ctx), suite: suite(r, `Classement ${c}`) } };
    }
  });

  def({
    id: 'decisions', lib: 'Décisions de fin d’année', icone: 'flag', sujet: 'classe',
    description: 'MGA, rang, proposition et décision retenue pour chaque élève de la classe.',
    defauts: { titre: 'DÉCISIONS DE FIN D’ANNÉE', signatures: SIG_DIR, qr: { actif: false } },
    rendu(ctx, r, o) {
      const x = X(), c = ctx.classe, { w } = x.classement(c, 'A'), L = x.actifsDe(c).sort(x.parNom);
      const tete = html`<tr><th>N°</th><th class="g">Élève</th><th>Matricule</th><th>MGA / ${x.echelle(c)}</th><th>Rang</th><th>Proposition</th><th>Décision retenue</th></tr>`;
      const lignes = L.map((s, i) => {
        const k = w.find((z) => z.s.id === s.id);
        return html`<tr><td>${i + 1}</td><td class="nom">${x.nomComplet(s)}</td><td>${x.matOf(s)}</td><td>${u.fmtNote(x.mga(s))}</td><td>${k ? x.rangTxt(k.rank) : '—'}</td><td>${x.decisionProposee(s) || '—'}</td><td><b>${x.decision(s) || '—'}</b></td></tr>`;
      });
      return { liste: { avant: html`${o.entete(r)}${o.titre(`${r.titre} – ${c}`, `Année scolaire ${S().school.year} · seuil ${x.info(c).seuil}/${x.echelle(c)}`)}`, tete, lignes, apres: signer(r, ctx), suite: suite(r, `Décisions ${c}`) } };
    }
  });

  def({
    id: 'effectifs', lib: 'Tableau des effectifs', icone: 'chart',
    description: 'Inscrits, ivoiriens, étrangers, extraits, redoublants et abandons par classe et par sexe.',
    defauts: { titre: 'TABLEAU DES EFFECTIFS DES ÉLÈVES', page: { orientation: 'paysage' }, signatures: SIG_DIR, qr: { actif: false } },
    orientations: ['paysage', 'portrait'],
    rendu(ctx, r, o) {
      const x = X(), act = x.actifs(), nv = x.niveaux();
      const M = [['Inscrits', (L) => L], ['Ivoiriens', (L) => L.filter(x.estIvoirien)], ['Étrangers', (L) => L.filter((s) => !x.estIvoirien(s))], ['Avec extrait', (L) => L.filter((s) => s.extrait)], ['Sans extrait', (L) => L.filter((s) => !s.extrait)], ['Redoublants', (L) => L.filter((s) => s.redoublant)]];
      const partis = (cls) => S().students.filter((s) => s.statut !== 'Inscrit' && cls.includes(s.classe)).length;
      const ligne = (lib, L, cls) => html`<tr><td class="g"><b>${lib}</b></td>${M.map(([, f]) => sx(f(L)))}<td>${partis(cls)}</td></tr>`;
      const cp = nv.filter((c) => c === 'CP1' || c === 'CP2');
      return {
        ajuster: true,
        contenu: html`${o.entete(r)}${o.titre(r.titre, `Année scolaire ${S().school.year}`)}<table class="doc-tab serre"><thead><tr><th rowspan="2" class="g">Classe</th>${M.map(([l]) => html`<th colspan="3">${l}</th>`)}<th rowspan="2">Abandons, départs</th></tr><tr>${M.map(() => html`<th>G</th><th>F</th><th>T</th>`)}</tr></thead><tbody>${nv.map((c) => ligne(c, act.filter((s) => s.classe === c), [c]))}${cp.length ? ligne('Total CP', act.filter((s) => cp.includes(s.classe)), cp) : ''}${ligne('TOTAL', act, nv)}</tbody></table>${signer(r, ctx)}`
      };
    }
  });

  def({
    id: 'ages-extraits', lib: 'Élèves par âge, niveau et sexe', icone: 'chart',
    description: 'Âge au 1er octobre par niveau et par sexe, puis élèves avec et sans extrait de naissance.',
    defauts: { titre: 'ÉLÈVES PAR ÂGE, NIVEAU ET SEXE', page: { orientation: 'paysage' }, signatures: SIG_DIR, qr: { actif: false } },
    orientations: ['paysage'],
    rendu(ctx, r, o) {
      return { ajuster: true, contenu: html`${o.entete(r)}${o.titre(r.titre, `Âge au 1er octobre ${X().anneeRentree()}`)}${AK.rapports.tableAges('doc-tab serre')}<div class="doc-section">Élèves avec et sans extrait de naissance</div>${AK.rapports.tableExtraits('doc-tab serre')}${signer(r, ctx)}` };
    }
  });

  def({
    id: 'dossiers-regulariser', lib: 'Dossiers à régulariser', icone: 'file',
    description: 'Élèves inscrits sans extrait de naissance, par classe.',
    defauts: { titre: 'DOSSIERS À RÉGULARISER', sousTitre: 'Élèves sans extrait de naissance', signatures: SIG_DIR, qr: { actif: false } },
    rendu(ctx, r, o) {
      const x = X(), L = x.actifs().filter((s) => !s.extrait).sort(x.parClasse);
      const tete = html`<tr><th>N°</th><th class="g">Nom et prénoms</th><th>Classe</th><th>Sexe</th><th>Âge déclaré</th><th>Parent / tuteur</th><th>Téléphone</th></tr>`;
      const lignes = L.map((s, i) => html`<tr><td>${i + 1}</td><td class="nom">${x.nomComplet(s)}</td><td>${s.classe}</td><td>${s.sexe ? s.sexe[0] : ''}</td><td>${x.ageDe(s) ?? '—'} ans</td><td class="g">${s.parent || [s.pere && s.pere.nom, s.pere && s.pere.prenoms].filter(Boolean).join(' ')}</td><td>${AK.pro.telParent(s)}</td></tr>`);
      return { liste: { avant: html`${o.entete(r)}${o.titre(r.titre, `${r.sousTitre} · ${L.length} élève(s)`)}`, tete, lignes, apres: signer(r, ctx), suite: suite(r, 'Dossiers à régulariser') } };
    }
  });

  def({
    id: 'liste-personnel', lib: 'Liste du personnel', icone: 'brief',
    description: 'Nom, matricule, fonction, emploi, classe tenue, fonctionnement, contact.',
    champsOptionnels: [['contacts', 'Téléphones', true]],
    defauts: { titre: 'LISTE DU PERSONNEL', page: { orientation: 'paysage' }, champs: { contacts: true }, signatures: SIG_DIR, qr: { actif: false } },
    orientations: ['paysage', 'portrait'],
    rendu(ctx, r, o) {
      const x = X(), L = S().teachers.filter((t) => t.actif !== false);
      const tete = html`<tr><th>N°</th><th class="g">Nom et prénoms</th><th>Matricule</th><th>Fonction</th><th>Genre</th><th>Emploi / grade</th><th>Classe tenue</th><th>Fonctionnement</th>${r.champs.contacts !== false ? html`<th>Contact</th>` : ''}</tr>`;
      const lignes = L.map((t, i) => html`<tr><td>${i + 1}</td><td class="nom">${t.nom}</td><td>${t.matricule}</td><td>${t.fonction}</td><td>${x.estFemme(t) ? 'F' : 'M'}</td><td>${x.emploiGrade(t)}</td><td>${x.clsTxt(t) || '—'}</td><td>${x.fonctTxt(t) || '—'}</td>${r.champs.contacts !== false ? html`<td>${t.tel}</td>` : ''}</tr>`);
      return { liste: { avant: html`${o.entete(r)}${o.titre(r.titre, `Année scolaire ${S().school.year} · ${L.length} membre(s)`)}`, tete, lignes, apres: signer(r, ctx), suite: suite(r, 'Personnel') } };
    }
  });

  def({
    id: 'liste-cepe', lib: 'Liste des candidats au CEPE', icone: 'list',
    description: 'Candidats du CM2 : identité, naissance, nationalité, état du dossier.',
    defauts: { titre: 'LISTE DES CANDIDATS AU CEPE', page: { orientation: 'paysage' }, signatures: SIG_DIR, qr: { actif: false } },
    orientations: ['paysage', 'portrait'],
    rendu(ctx, r, o) {
      const x = X(), L = x.actifsDe('CM2').sort(x.parNom);
      const tete = html`<tr><th>N°</th><th class="g">Nom et prénoms</th><th>Matricule</th><th>Sexe</th><th>Date et lieu de naissance</th><th>Nationalité</th><th>Dossier</th></tr>`;
      const lignes = L.map((s, i) => html`<tr><td>${i + 1}</td><td class="nom">${x.nomComplet(s)}</td><td>${x.matOf(s)}</td><td>${s.sexe ? s.sexe[0] : ''}</td><td>${x.fmtNaissance(s)}${s.lieu ? ' à ' + s.lieu : ''}</td><td>${u.capitale(s.nationalite)}</td><td>${AK.pro.dossierCepe(s).complet ? 'Complet' : 'Incomplet'}</td></tr>`);
      return { liste: { avant: html`${o.entete(r)}${o.titre(`${r.titre} – SESSION ${X().anneeRentree() + 1}`, `${L.length} candidat(s)`)}`, tete, lignes, apres: signer(r, ctx), suite: suite(r, 'Candidats CEPE') } };
    }
  });
  AK.listesDoc = { sx };
})(window.AK);

//# sourceURL=akwa/js/docs/modeles/listes.js
</script>
<script>
/* =====================================================================================
   Rapports officiels (rentrée, composition, mensuel, fin d'année, CM2, notes par classe),
   synthèse pour l'IEPP, infrastructures, fiche de transmission et rapports personnalisés.
   ctx = { edit (zones modifiables à l'écran), ev, mois, classe, rapport (générateur) }
   ===================================================================================== */
(function (AK) {
  'use strict';
  const u = AK.u, { html } = u, C = AK.cfg;
  const S = () => AK.store.etat;
  const X = () => AK.calc;
  const R = () => AK.rapports;
  const SIG = [{ role: 'Le Directeur', nom: '{directeur}', cachet: true }];
  const def = (d) => AK.modeles.def({ categorie: 'rapport', sujet: 'ecole', version: 1, ...d });
  const titre = (o, r, t, sous) => html`${o.entete({ ...r, entete: { ...r.entete, compact: true } })}${o.titre(t, sous)}`;
  const section = (t) => html`<div class="doc-section">${t}</div>`;
  const obsSig = (zone, r, ctx) => html`<div style="display:grid;grid-template-columns:3fr 2fr;gap:6mm;align-items:start;margin-top:2mm">${zone}<div>${AK.mise.signatures(r, ctx)}</div></div>`;
  const PAYSAGE = { page: { orientation: 'paysage', marges: { h: 9, d: 10, b: 9, g: 10 } }, signatures: SIG, qr: { actif: false }, hauteurSignature: 18 };

  def({
    id: 'rapport-rentree', lib: 'Rapport de rentrée', icone: 'book', description: 'Liste des enseignants et tableau des effectifs (non redoublants, redoublants), sur une page A4 paysage.',
    defauts: { titre: 'RAPPORT DE RENTRÉE – EFFECTIFS ET PERSONNEL', ...PAYSAGE }, orientations: ['paysage', 'portrait'],
    rendu: (ctx, r, o) => ({ ajuster: true, contenu: html`${titre(o, r, r.titre, `Année scolaire ${S().school.year}`)}${section('1. Liste des enseignants')}${R().blocEnseignants()}${section('2. Tableau des effectifs élèves')}${R().blocEffectifs()}${obsSig(R().zone('RENTREE', '', 'observations', 'OBSERVATIONS :', 3, ctx.edit), r, ctx)}` })
  });
  def({
    id: 'rapport-composition', lib: 'Rapport de composition', icone: 'book', description: 'Inscrits, présents, absents, admis par niveau et par sexe ; trois meilleurs par niveau.',
    defauts: { titre: 'RAPPORT DE COMPOSITION', ...PAYSAGE }, orientations: ['paysage', 'portrait'],
    rendu(ctx, r, o) {
      const n = Number(ctx.ev) || 1, x = X();
      return { ajuster: true, contenu: html`${titre(o, r, r.titre, `${C.EV_GEN[n - 1]} – ${u.fmtDate(x.evalDate('CP1', n))}${n >= 3 ? ` (CM2 : ${u.fmtDate(x.evalDate('CM2', n))})` : ''}`)}${R().blocCompo(n)}${section('Liste des trois meilleurs par niveau')}${R().blocTop3(n)}${obsSig(R().zone('COMPOSITION', n, 'observations', 'OBSERVATIONS DU DIRECTEUR :', 2, ctx.edit), r, ctx)}` };
    }
  });
  def({
    id: 'rapport-mensuel', lib: 'Rapport mensuel du directeur', icone: 'book', description: 'Fréquentation, assiduité du personnel, activités, relations humaines, difficultés, conclusion (A4 portrait, plusieurs pages si besoin).',
    defauts: { titre: 'RAPPORT MENSUEL DU DIRECTEUR', signatures: SIG, qr: { actif: false }, page: { orientation: 'portrait', marges: { h: 12, d: 13, b: 11, g: 13 } } },
    rendu(ctx, r, o) {
      const m = Number(ctx.mois) || X().moisCourant(), { y, jours } = X().moisInfo(m), e = ctx.edit;
      const z = (ch, t, l) => R().zone('MENSUEL', String(m), ch, t, l, e);
      return {
        blocs: [
          titre(o, r, r.titre, `École : ${S().school.name} • Période : ${C.MOIS[m - 1]} ${y} • Jours de classe : ${jours}`),
          html`${section('1. Effectifs et fréquentation')}${R().blocFreq(m)}`,
          html`${section('2. Assiduité et ponctualité du personnel enseignant')}${R().blocPersonnel(m)}`,
          html`${section('3. Activités menées')}${z('animations', 'a. Animations pédagogiques :', 2)}<b style="font-size:8.8pt">b. Évaluations du mois</b>${R().blocEvalsMois(m)}`,
          html`<b style="font-size:8.8pt;display:block;margin-top:1.4mm">c. Activités extra-scolaires</b><div class="zg3">${z('cooperatives', 'Activités coopératives', 2)}${z('bibliotheque', 'Bibliothèque', 2)}${z('cantine', 'Cantine', 2)}</div>`,
          html`${section('4. Relations humaines')}<div class="zg2">${z('relations_enseignants', 'Entre les enseignants :', 2)}${z('relations_maitres_eleves', 'Entre maîtres et élèves :', 2)}${z('relations_parents', 'Entre maîtres et parents d’élèves :', 2)}${z('relations_autorites', 'Entre maîtres et autorités :', 2)}</div>`,
          html`${section('5. Événements ayant marqué la vie de l’école')}${z('evenements', '', 2)}`,
          html`${section('6. Difficultés rencontrées au cours du mois')}<div class="zg2">${z('grossesses', 'Nombre de filles en grossesse :', 1)}${z('deces', 'Nombre d’élèves décédés :', 1)}</div>${z('difficultes', 'Autres difficultés :', 2)}`,
          html`<div class="zg2"><div>${section('7. Satisfactions')}${z('satisfactions', '', 2)}</div><div>${section('8. Conclusion')}${z('conclusion', '', 2)}</div></div>`,
          AK.mise.signatures(r, ctx)
        ],
        garder: 2,
        suite: html`<div class="doc-note">${S().school.name} · rapport mensuel de ${C.MOIS[m - 1]} ${y} (suite)</div>`
      };
    }
  });
  def({
    id: 'rapport-fin', lib: 'Rapport de fin d’année', icone: 'book', description: 'Tableau de synthèse (inscrits, présents, admis, taux, redoublants, effectif probable) et récapitulatif des décisions.',
    defauts: { titre: 'RAPPORT DE FIN D’ANNÉE – TABLEAU DE SYNTHÈSE', ...PAYSAGE }, orientations: ['paysage'],
    rendu: (ctx, r, o) => ({ ajuster: true, contenu: html`${titre(o, r, r.titre, `Année scolaire ${S().school.year}`)}${R().blocSynthese(ctx.edit)}${section('Récapitulatif des décisions')}${R().blocDecisions()}${obsSig(R().zone('FIN', '', 'observations', 'OBSERVATIONS :', 3, ctx.edit), r, ctx)}` })
  });
  def({
    id: 'rapport-cm2', lib: 'Rapport CM2', icone: 'book', description: 'Résultats des quatre évaluations du CM2, MGA, décision (entrée en 6e), rang.',
    defauts: { titre: 'RÉSULTATS DES COMPOSITIONS CM2', ...PAYSAGE }, orientations: ['paysage'],
    rendu: (ctx, r, o) => ({ ajuster: true, contenu: html`${titre(o, r, r.titre, `Classe de CM2 – année scolaire ${S().school.year}`)}${R().blocCM2()}${obsSig(R().zone('CM2', '', 'observations', 'OBSERVATIONS :', 3, ctx.edit), r, ctx)}` })
  });
  def({
    id: 'rapport-resultats', lib: 'Rapport des notes par classe', icone: 'book', sujet: 'classe', description: 'Notes par matière, total, moyenne, observation, récapitulatif par sexe.',
    defauts: { titre: 'RAPPORT DES NOTES', ...PAYSAGE }, orientations: ['paysage'],
    rendu(ctx, r, o) {
      const c = ctx.classe, n = Number(ctx.ev) || 1, x = X(), t = x.enseignantDe(c), { table, recap } = R().blocResClasse(c, n);
      return { ajuster: true, contenu: html`${titre(o, r, `${r.titre} – CLASSE DE ${c} – ${x.evalLabel(c, n).toUpperCase()}`, `Évaluation du ${u.fmtDate(x.evalDate(c, n))} • Moyenne sur ${x.echelle(c)} • Seuil ${x.info(c).seuil}/${x.echelle(c)} • Enseignant(e) : ${t ? t.nom : '—'}`)}${table}<div style="display:grid;grid-template-columns:minmax(60mm,1fr) 1.3fr 1fr;gap:5mm;align-items:start">${recap}${R().zone('RESULTATS', c + '|' + n, 'observations', 'OBSERVATIONS :', 3, ctx.edit)}<div>${AK.mise.signatures(r, ctx)}</div></div>` };
    }
  });
  def({
    id: 'synthese-iepp', lib: 'Fiche de synthèse pour l’IEPP', icone: 'send', description: 'Chiffres clés de l’école sur une page : élèves, enseignants, infrastructures.',
    defauts: { titre: 'FICHE DE SYNTHÈSE DE L’ÉCOLE', signatures: SIG, qr: { actif: false } },
    rendu(ctx, r, o) {
      const sc = S().school, x = X(), I = R().infra(), act = x.actifs(), ev = sc.evalCourante || 1, f = act.filter((s) => s.sexe === 'Féminin').length, ens = S().teachers.filter((t) => t.actif !== false && x.clsDe(t).length);
      const rs = x.niveaux().map((c) => x.reussite(c, ev)), ok = rs.reduce((a, z) => a + z.ok, 0), n = rs.reduce((a, z) => a + z.n, 0);
      const hom = ens.filter((t) => AK.valid.civ.de(t.nom) === 'M.').length, fem = ens.filter((t) => /^(Mme|Mlle)$/.test(AK.valid.civ.de(t.nom))).length;
      const sal = R().iSom(I.salles.agglo, I.salles.prov), E = I.eau, Tt = I.toil;
      const kv = (...L) => html`<table class="doc-tab serre"><tbody>${L.map(([a, b]) => html`<tr><td class="g" style="width:45%"><b>${a}</b></td><td class="g">${b}</td></tr>`)}</tbody></table>`;
      return {
        ajuster: true,
        contenu: html`${titre(o, r, r.titre, `Année scolaire ${sc.year} · à l’attention de l’IEPP`)}
          ${section('1. Identification')}${kv(['École', `${sc.name || '—'} (${sc.statut === 'privee' ? 'privée' : 'publique'})`], ['IEPP', sc.iepp || '—'], ['DRENAET', sc.drenaet || '—'], ['Directeur', `${sc.director || '—'}${sc.dirTel ? ' · ' + sc.dirTel : ''}`], ['Localité', sc.localite || '—'])}
          ${section('2. Élèves')}<table class="doc-tab serre"><thead><tr><th>Niveau</th><th>G</th><th>F</th><th>T</th><th>Réussite (${C.evCourt(ev)})</th></tr></thead><tbody>${x.niveaux().map((c, i) => html`<tr><td><b>${c}</b></td>${R().sx(x.actifsDe(c))}<td>${u.pct(rs[i].ok, rs[i].n)}</td></tr>`)}<tr class="total"><td>TOTAL</td>${R().sx(act)}<td>${u.pct(ok, n)}</td></tr></tbody></table>
          ${kv(['Part des filles', u.pct(f, act.length)], ['Dossiers avec extrait de naissance', u.pct(act.filter((s) => s.extrait).length, act.length)], ['Redoublants', act.filter((s) => s.redoublant).length], ['Abandons et départs', S().students.filter((s) => s.statut !== 'Inscrit').length])}
          ${section('3. Enseignants et classes')}${kv(['Enseignants tenant une classe', `${ens.length} (${hom} homme(s), ${fem} femme(s))`], ['Personnel total', S().teachers.filter((t) => t.actif !== false).length], ...R().fonctStats().filter((y) => y.ens.length).map((y) => [`Classes de type ${y.l.toLowerCase()}`, y.ens.length]), ['Élèves par enseignant', R().iRat(act.length, ens.length)])}
          ${section('4. Infrastructures')}${kv(['Salles de classe', sal == null ? '—' : `${sal} (${R().iT(I.salles.agglo)} en dur, ${R().iT(I.salles.prov)} provisoires) · ${R().iRat(act.length, sal)} élèves par salle`], ['Toilettes des élèves', Tt.existe !== 'oui' ? R().iL(C.ON, Tt.existe) : `${R().iT(Tt.eleves.n)} cabine(s), ${R().iT(Tt.eleves.fonct)} fonctionnelle(s)`], ['Points d’eau', E.existe !== 'oui' ? R().iL(C.ON, E.existe) : `${R().iT(R().iSom(...C.EAUX.map(([k]) => E[k].n)))}, dont ${R().iT(R().iSom(...C.EAUX.map(([k]) => E[k].fonct)))} fonctionnel(s)`], ['Électricité à l’école', R().iL(C.ON, I.elec.ecole)], ['Tables-bancs', R().iN(I.mob.tb) == null ? '—' : `${R().iT(I.mob.tb)} · ${R().iRat(act.length, R().iN(I.mob.tb))} élèves par table-banc`], ['Cantine', I.cant.existe !== 'oui' ? R().iL(C.ON, I.cant.existe) : `Oui, fonctionnelle : ${R().iL(C.ON, I.cant.fonct)}`])}
          ${I.maj ? '' : html`<p class="doc-note">Infrastructures non renseignées : complétez-les dans Rapports › Statistiques.</p>`}${AK.mise.signatures(r, ctx)}`
      };
    }
  });
  def({
    id: 'rapport-infrastructures', lib: 'Rapport d’infrastructures', icone: 'building', description: 'Bâtiments, toilettes, eau, électricité, mobilier, cantine, locaux, manuels, accès, ratios.',
    defauts: { titre: 'RAPPORT D’INFRASTRUCTURES', signatures: SIG, qr: { actif: false } },
    rendu: (ctx, r, o) => ({ blocs: [titre(o, r, r.titre, `Année scolaire ${S().school.year}`), ...R().sectionsInfra(R().infra()).map(([t, h], i) => html`${section(`${i + 1}. ${t}`)}${h}`), AK.mise.signatures(r, ctx)] })
  });
  def({
    id: 'fiche-transmission', lib: 'Fiche de transmission à l’IEPP', icone: 'send', description: 'Récapitulatif imprimé du fichier de transmission : effectifs, résultats, absences du mois.',
    defauts: { titre: 'FICHE DE TRANSMISSION À L’INSPECTION', signatures: SIG, qr: { actif: false } },
    rendu(ctx, r, o) {
      const n = Number(ctx.ev) || 1, pk = AK.pro.paquetIEPP(n);
      return {
        ajuster: true,
        contenu: html`${titre(o, r, `${r.titre} – ${C.EV_GEN[n - 1].toUpperCase()}`, `Année scolaire ${S().school.year}`)}<table class="doc-tab"><thead><tr><th>Classe</th><th>G</th><th>F</th><th>Total</th><th>Moyenne</th><th>Évalués</th><th>Seuil atteint</th><th>Taux</th></tr></thead><tbody>${pk.effectifs.map((e, i) => {
          const z = pk.resultats[i];
          return html`<tr><td>${e.classe}</td><td>${e.G}</td><td>${e.F}</td><td><b>${e.T}</b></td><td>${z.moyenne == null ? '—' : u.fmtNote(z.moyenne) + '/' + z.echelle}</td><td>${z.evalues}</td><td>${z.admis_seuil}</td><td>${z.taux == null ? '—' : String(z.taux).replace('.', ',') + ' %'}</td></tr>`;
        })}</tbody></table><p>Absences du mois : ${pk.absences_mois.non_justifiees} non justifiée(s), ${pk.absences_mois.justifiees} justifiée(s) · Personnel : ${pk.personnel.length} · Candidats au CEPE : ${pk.cepe.candidats} · Faits de discipline : ${pk.vie_scolaire.incidents}.</p>${AK.mise.signatures(r, ctx)}`
      };
    }
  });

  /* ---------- Générateur : rapports composés de blocs ---------- */
  const BLOCS = {
    enseignants: { lab: 'Liste des enseignants', titre: 'LISTE DES ENSEIGNANTS', f: () => R().blocEnseignants() },
    effectifs: { lab: 'Effectifs par classe (non redoublants / redoublants)', titre: 'TABLEAU DES EFFECTIFS ÉLÈVES', f: () => R().blocEffectifs() },
    compo: { lab: 'Résultats d’une composition', titre: 'RÉSULTATS DE LA COMPOSITION', p: 'ev', f: (b) => R().blocCompo(Number(b.ev || 1)) },
    top3: { lab: 'Trois meilleurs par niveau', titre: 'LISTE DES TROIS MEILLEURS PAR NIVEAU', p: 'ev', f: (b) => R().blocTop3(Number(b.ev || 1)) },
    frequentation: { lab: 'Effectifs et fréquentation du mois', titre: 'EFFECTIFS ET FRÉQUENTATION', p: 'mois', f: (b) => R().blocFreq(Number(b.mois || X().moisCourant())) },
    personnel: { lab: 'Assiduité du personnel (mois)', titre: 'ASSIDUITÉ DU PERSONNEL ENSEIGNANT', p: 'mois', f: (b) => R().blocPersonnel(Number(b.mois || X().moisCourant())) },
    evalsMois: { lab: 'Évaluations du mois', titre: 'ÉVALUATIONS DU MOIS', p: 'mois', f: (b) => R().blocEvalsMois(Number(b.mois || X().moisCourant())) },
    synthese: { lab: 'Synthèse de fin d’année', titre: 'TABLEAU DE SYNTHÈSE', f: (b, edit) => R().blocSynthese(edit) },
    decisions: { lab: 'Récapitulatif des décisions', titre: 'RÉCAPITULATIF DES DÉCISIONS', f: () => R().blocDecisions() },
    cm2: { lab: 'Résultats du CM2 (4 évaluations et MGA)', titre: 'RÉSULTATS DES COMPOSITIONS CM2', f: () => R().blocCM2() },
    resClasse: { lab: 'Résultats d’une classe (notes par matière)', titre: '', p: 'clsev', f: (b) => { const z = R().blocResClasse(b.cls || X().niveaux()[0], Number(b.ev || 1)); return html`${z.table}<div style="max-width:110mm">${z.recap}</div>`; } },
    ages: { lab: 'Élèves par âge, niveau et sexe', titre: 'ÉLÈVES PAR ÂGE, NIVEAU ET SEXE', f: () => R().tableAges() },
    extraits: { lab: 'Élèves avec ou sans extrait de naissance', titre: 'EXTRAITS DE NAISSANCE', f: () => R().tableExtraits() },
    fonctionnement: { lab: 'Types de fonctionnement des classes', titre: 'FONCTIONNEMENT DES CLASSES', f: () => R().blocFonct() },
    texte: { lab: 'Zone de texte à rédiger', titre: 'OBSERVATIONS', p: 'lignes', f: (b, edit, rap) => R().zone('PERSO', rap.id, b.id, '', Number(b.lignes || 3), edit) },
    signature: { lab: 'Signature du directeur', titre: '', f: (b, edit, rap, r, ctx) => AK.mise.signatures(r, ctx) }
  };
  const MODELES_PERSO = {
    rentree: () => ({ titre: 'Rapport de rentrée – effectifs et personnel', sous: `Année scolaire ${S().school.year}`, pay: true, blocs: [['enseignants', '1. LISTE DES ENSEIGNANTS'], ['effectifs', '2. TABLEAU DES EFFECTIFS ÉLÈVES'], ['texte', 'OBSERVATIONS'], ['signature', '']] }),
    compo: (p) => ({ titre: 'Rapport de composition', sous: C.EV_GEN[(Number(p.ev) || 1) - 1], pay: true, blocs: [['compo', '', { ev: String(p.ev || 1) }], ['top3', 'LISTE DES TROIS MEILLEURS PAR NIVEAU', { ev: String(p.ev || 1) }], ['texte', 'OBSERVATIONS DU DIRECTEUR'], ['signature', '']] }),
    mensuel: (p) => ({ titre: 'Rapport mensuel du directeur', sous: C.MOIS[(Number(p.mois) || 10) - 1], pay: false, blocs: [['frequentation', '1. EFFECTIFS ET FRÉQUENTATION', { mois: String(p.mois) }], ['personnel', '2. ASSIDUITÉ DU PERSONNEL', { mois: String(p.mois) }], ['texte', '3. ACTIVITÉS MENÉES'], ['evalsMois', 'Évaluations du mois', { mois: String(p.mois) }], ['texte', '4. RELATIONS HUMAINES'], ['texte', '5. ÉVÉNEMENTS'], ['texte', '6. DIFFICULTÉS'], ['texte', '7. SATISFACTIONS ET CONCLUSION'], ['signature', '']] }),
    fin: () => ({ titre: 'Rapport de fin d’année – tableau de synthèse', sous: `Année scolaire ${S().school.year}`, pay: true, blocs: [['synthese', ''], ['decisions', 'RÉCAPITULATIF DES DÉCISIONS'], ['texte', 'OBSERVATIONS'], ['signature', '']] }),
    resultats: (p) => ({ titre: `Résultats – ${p.classe || 'CM2'}`, sous: '', pay: true, blocs: [['resClasse', '', { cls: p.classe || 'CM2', ev: String(p.ev || 1) }], ['texte', 'OBSERVATIONS'], ['signature', '']] }),
    cm2: () => ({ titre: 'Résultats des compositions CM2', sous: `Année scolaire ${S().school.year}`, pay: true, blocs: [['cm2', ''], ['texte', 'OBSERVATIONS'], ['signature', '']] })
  };
  def({
    id: 'rapport-perso', lib: 'Rapport personnalisé (générateur)', icone: 'layers', description: 'Rapport composé de blocs choisis par l’école (Rapports › Générateur).',
    defauts: { titre: '', signatures: SIG, qr: { actif: false }, hauteurSignature: 18 }, orientations: ['paysage', 'portrait'],
    rendu(ctx, r, o) {
      const rap = ctx.rapport;
      const blocs = [titre(o, r, String(rap.titre || '').toUpperCase(), rap.sous), ...rap.blocs.map((b) => {
        const B = BLOCS[b.type];
        return B ? html`${b.titre ? section(b.titre) : ''}${B.f(b, ctx.edit, rap, r, ctx)}` : '';
      })];
      if (rap.ajuster !== false) return { ajuster: true, contenu: html`${blocs}` };
      return { blocs, garder: 2 };
    }
  });
  AK.rapports.BLOCS = BLOCS;
  AK.rapports.MODELES_PERSO = MODELES_PERSO;
  AK.rapports.OFFICIELS = [['rentree', 'Rapport de rentrée', 'rapport-rentree'], ['compo', 'Rapport de composition', 'rapport-composition'], ['mensuel', 'Rapport mensuel', 'rapport-mensuel'], ['fin', 'Rapport de fin d’année', 'rapport-fin'], ['cm2', 'Rapport CM2', 'rapport-cm2'], ['resultats', 'Rapport des notes par classe', 'rapport-resultats']];
})(window.AK);

//# sourceURL=akwa/js/docs/modeles/rapports.js
</script>
<script>
/* =====================================================================================
   Autres documents : demandes d'autorisation d'absence, convocation des parents, emploi du
   temps, cahier de textes, reçus, journal de caisse, attestation de service du personnel.
   ===================================================================================== */
(function (AK) {
  'use strict';
  const u = AK.u, { html, raw } = u, C = AK.cfg;
  const S = () => AK.store.etat;
  const X = () => AK.calc;
  const SIG = [{ role: 'Le Directeur', nom: '{directeur}', cachet: true }];
  const def = (d) => AK.modeles.def({ version: 1, ...d });
  const colonne = (c) => html`<div style="display:flex;flex-direction:column;height:100%">${c}</div>`;

  /* ---------- Demande d'autorisation d'absence du personnel (lettre à l'IEPP) ---------- */
  def({
    id: 'demande-absence-personnel', lib: 'Demande d’autorisation d’absence (personnel)', categorie: 'absence', sujet: 'agent', icone: 'cal',
    description: 'Lettre adressée à l’Inspecteur, avec l’avis du directeur et la décision de l’IEPP.',
    defauts: {
      titre: 'Demande d’autorisation d’absence', signatures: [], lieuDate: false, qr: { actif: false },
      texte: 'Monsieur l’Inspecteur,\n\nPar la présente, j’ai l’honneur de solliciter respectueusement de votre haute bienveillance l’autorisation de m’absenter de mon poste de travail pour la période indiquée ci-dessus.\n\nJe prendrai toutes les dispositions utiles afin que le bon fonctionnement du service soit préservé durant cette période et je m’engage à reprendre mes activités dès la fin de la période autorisée.\n\nEspérant que ma demande retiendra votre bienveillante attention, je vous prie d’agréer, Monsieur l’Inspecteur, l’expression de mon profond respect.'
    },
    rendu(ctx, r, o) {
      const a = ctx.demande, m = ctx.agent, sc = S().school, x = X(), n = AK.absences.joursDemande(a);
      const ville = u.capitale(sc.localite || sc.sp || ''), lieuIepp = String(sc.iepp || '').replace(/^IEPP\s+/i, '') || '………';
      const L = (k, v) => html`<div>${k} : <b>${v || '……………………'}</b></div>`;
      const coche = (ok, lab) => html`<span class="doc-case" style="margin-right:6mm"><i class="${ok ? 'on' : ''}"></i> ${lab}</span>`;
      return {
        contenu: colonne(html`${o.entete(r)}<div style="font-size:9.6pt;margin:0 0 3mm">N° ………… /${String(X().anneeRentree()).slice(2)}/IEPP/${lieuIepp.toUpperCase()}</div>
          <div style="display:flex;justify-content:space-between;gap:8mm;font-size:9.8pt;line-height:1.55"><div>${L('Nom et prénoms', a.nom)}${L('Matricule', m && m.matricule)}${L('Emploi / grade', m && x.emploiGrade(m))}${L('Fonction', m && m.fonction)}${L('Classe tenue', m && x.clsTxt(m))}${L('Établissement', sc.name)}${L('Circonscription', sc.iepp)}${L('Téléphone', m && m.tel)}</div>
            <div style="text-align:center;min-width:38%"><div>${ville || '………'}, le ${u.fmtDate(a.cree)}</div><div style="font-size:8.6pt">Demande N° ${a.ref}</div><div style="margin-top:7mm;font-weight:700;line-height:1.4">À<br>Monsieur l’Inspecteur de l’Enseignement<br>Préscolaire et Primaire de ${ville || lieuIepp}</div></div></div>
          <p style="margin:5mm 0 2mm;font-size:10.5pt"><b><u>Objet</u> : demande d’autorisation d’absence</b></p>
          <div class="doc-infos" style="margin-bottom:2mm"><div class="c"><span class="l">Période :</span><span class="v">du ${u.fmtDate(a.du)} au ${u.fmtDate(a.au)}</span></div><div class="c"><span class="l">Durée :</span><span class="v">${u.pluriel(n, 'jour')} de classe</span></div><div class="c"><span class="l">Motif :</span><span class="v">${a.motif}${a.precision ? ' (' + a.precision + ')' : ''}</span></div></div>
          <div class="doc-texte" style="font-size:10.4pt;margin:3mm 0">${o.rediger(r.texte, ctx)}</div>
          <div style="text-align:right;font-weight:700;margin-top:2mm">${a.nom}</div>
          <div style="display:grid;grid-template-columns:1fr 1fr;margin-top:auto;border:0.6pt solid #444;font-size:9.4pt">
            <div style="padding:2mm 3mm;min-height:34mm;border-right:0.6pt solid #444"><div style="text-align:center;font-weight:700;margin-bottom:2mm">Avis du directeur d’école</div><div>${coche(a.statut === 'Accordée', 'Favorable')}${coche(a.statut === 'Refusée', 'Défavorable')}</div><div style="margin-top:2mm">Nom, signature et cachet</div><div style="margin-top:9mm">${sc.director || ''}</div></div>
            <div style="padding:2mm 3mm;min-height:34mm"><div style="text-align:center;font-weight:700;margin-bottom:2mm">Décision de l’IEPP</div><div>${coche(false, 'Accord')}${coche(false, 'Refus')}</div><div style="margin-top:2mm">Date, signature et cachet</div></div></div>`)
      };
    }
  });

  def({
    id: 'demande-absence-eleve', lib: 'Demande d’autorisation d’absence (élève)', categorie: 'absence', sujet: 'eleve', icone: 'cal',
    description: 'Demande présentée par le parent, avec la décision du directeur.',
    defauts: { titre: 'DEMANDE D’AUTORISATION D’ABSENCE', signatures: [{ role: 'Le parent / tuteur', nom: '' }, { role: 'Le Directeur', nom: '{directeur}', cachet: true }], qr: { actif: false } },
    rendu(ctx, r, o) {
      const a = ctx.demande, s = ctx.eleve, x = X();
      const coche = (ok, lab) => html`<span class="doc-case" style="margin-right:6mm"><i class="${ok ? 'on' : ''}"></i> ${lab}</span>`;
      return {
        contenu: colonne(html`${o.entete(r)}${o.titre(r.titre, `N° ${a.ref} du ${u.fmtDate(a.cree)}`)}${AK.mise.infos([['Élève', a.nom], ['Matricule', s ? x.matOf(s) : ''], ['Classe', s ? s.classe : ''], ['Période', `du ${u.fmtDate(a.du)} au ${u.fmtDate(a.au)}`], ['Jours de classe', String(AK.absences.joursDemande(a))], ['Motif', a.motif + (a.precision ? ' · ' + a.precision : '')]])}
          <div style="border:0.6pt solid #222;padding:2.4mm 3mm;margin:4mm 0;font-size:10pt">Décision du directeur : ${coche(a.statut === 'Accordée', 'Accordée')}${coche(a.statut === 'Refusée', 'Refusée')} <span style="float:right">Statut actuel : <b>${a.statut}</b></span></div>
          <div style="margin-top:auto">${o.signatures(r, ctx)}</div>`)
      };
    }
  });

  def({
    id: 'convocation-parents', lib: 'Convocation des parents', categorie: 'vie', sujet: 'eleve', icone: 'mail',
    description: 'Convocation à la direction au sujet d’un fait de discipline.',
    defauts: {
      titre: 'CONVOCATION DES PARENTS', signatures: SIG, qr: { actif: false },
      texte: 'Madame, Monsieur,\n\nVous êtes prié(e) de vous présenter à la direction de l’école le …………………… à ………… au sujet de votre enfant **{eleve.nomComplet}**, élève en classe de **{eleve.classe}**.\n\nComptant sur votre collaboration pour l’éducation de votre enfant, veuillez agréer, Madame, Monsieur, l’expression de nos salutations distinguées.'
    },
    rendu(ctx, r, o) {
      const s = ctx.eleve, f = ctx.fait;
      const dest = s.parent || [s.pere && s.pere.nom, s.pere && s.pere.prenoms].filter(Boolean).join(' ') || 'Monsieur / Madame le parent';
      return {
        contenu: colonne(html`${o.entete(r)}${o.titre(r.titre)}<p style="margin-top:4mm">À l’attention de <b>${dest}</b>${AK.pro.telParent(s) ? ' · ' + AK.pro.telParent(s) : ''}</p>
          <div class="doc-texte">${o.rediger(r.texte, ctx)}</div>
          ${f ? html`<div class="doc-infos une"><div class="c"><span class="l">Motif :</span><span class="v">${f.fait}${f.detail ? ' (' + f.detail + ')' : ''}, constaté le ${u.fmtDate(f.date)}</span></div><div class="c"><span class="l">Mesure prise :</span><span class="v">${f.sanction}</span></div></div>` : ''}
          <div style="margin-top:auto">${o.signatures(r, ctx)}</div>`)
      };
    }
  });

  def({
    id: 'emploi-du-temps', lib: 'Emploi du temps de la classe', categorie: 'vie', sujet: 'classe', icone: 'grid',
    description: 'Grille hebdomadaire (lundi, mardi, jeudi, vendredi).',
    defauts: { titre: 'EMPLOI DU TEMPS', page: { orientation: 'paysage' }, signatures: SIG, qr: { actif: false } }, orientations: ['paysage'],
    rendu(ctx, r, o) {
      const c = ctx.classe, E = S().pro.edt[c] || {}, t = X().enseignantDe(c);
      return { ajuster: true, contenu: html`${o.entete(r)}${o.titre(`${r.titre} – ${c}`, `Titulaire : ${t ? t.nom : '—'} · Année scolaire ${S().school.year}`)}<table class="doc-tab"><thead><tr><th>Horaire</th>${C.JOURS_EDT.map(([, j]) => html`<th>${j}</th>`)}</tr></thead><tbody>${C.CRENEAUX.map((h, i) => html`<tr><td><b>${h}</b></td>${C.JOURS_EDT.map(([d]) => html`<td>${E[d + '|' + i] || ''}</td>`)}</tr>`)}</tbody></table>${o.signatures(r, ctx)}` };
    }
  });

  def({
    id: 'cahier-textes', lib: 'Cahier de textes', categorie: 'vie', sujet: 'classe', icone: 'book',
    description: 'Séances consignées de la classe, par date.',
    defauts: { titre: 'CAHIER DE TEXTES', signatures: [{ role: 'L’enseignant(e)', nom: '' }, { role: 'Le Directeur', nom: '{directeur}' }], qr: { actif: false } },
    rendu(ctx, r, o) {
      const c = ctx.classe, L = S().pro.cahier.filter((x) => x.classe === c).sort((a, b) => a.date.localeCompare(b.date));
      return { liste: { avant: html`${o.entete(r)}${o.titre(`${r.titre} – ${c}`, `Année scolaire ${S().school.year}`)}`, tete: html`<tr><th>Date</th><th>Discipline</th><th class="g">Contenu de la séance</th><th class="g">Travail à faire</th></tr>`, lignes: L.map((x) => html`<tr><td>${u.fmtDate(x.date)}</td><td>${x.mat}</td><td class="g">${x.contenu}</td><td class="g">${x.travail}</td></tr>`), apres: o.signatures(r, ctx), suite: html`<div class="doc-note">Cahier de textes ${c} (suite)</div>` } };
    }
  });

  def({
    id: 'recu', lib: 'Reçu de versement', categorie: 'finance', sujet: 'eleve', icone: 'coin', papiers: ['A5', 'A4'],
    description: 'Reçu numéroté (REC-AAAA-NNNNN) ; un reçu annulé est réimprimé avec la mention ANNULÉ.',
    defauts: { titre: 'REÇU DE VERSEMENT', page: { orientation: 'portrait', papier: 'A5', marges: { h: 10, d: 10, b: 9, g: 10 } }, signatures: [{ role: 'Le caissier / Le Directeur', nom: '{directeur}', cachet: true }], hauteurSignature: 18, qr: { actif: false }, entete: { compact: true } },
    statut: (ctx) => (ctx.paiement.annule ? 'annule' : null),
    rendu(ctx, r, o) {
      const p = ctx.paiement, s = ctx.eleve || { nom: '—', prenoms: '', classe: '' }, x = X();
      const du = s.id ? AK.pro.duDe(s) : 0, pa = s.id ? AK.pro.payeDe(s) : 0;
      return {
        contenu: colonne(html`${o.entete(r)}${o.titre(`${r.titre} N° ${p.ref}`)}<table class="doc-tab"><tbody>
          <tr><td class="g" style="width:32%">Reçu de</td><td class="g"><b>${p.payeur || s.parent || 'Le parent'}</b></td></tr>
          <tr><td class="g">Pour l’élève</td><td class="g"><b>${x.nomComplet(s)}</b> · ${s.classe} · ${s.id ? x.matOf(s) : ''}</td></tr>
          <tr><td class="g">Objet</td><td class="g">${p.objet}</td></tr>
          <tr><td class="g">Montant</td><td class="g"><b style="font-size:12pt">${u.fcfa(p.montant)}</b> (${p.mode})</td></tr>
          <tr><td class="g">Date</td><td class="g">${u.fmtDate(p.date)}</td></tr>
          <tr><td class="g">Situation</td><td class="g">Total dû ${u.fcfa(du)} · versé ${u.fcfa(pa)} · reste ${u.fcfa(Math.max(0, du - pa))}</td></tr>
          ${p.annule ? html`<tr><td class="g">Annulation</td><td class="g"><b>ANNULÉ le ${u.fmtDate(p.annule.le.slice(0, 10))}</b> · ${p.annule.motif}</td></tr>` : ''}</tbody></table>
          <div style="margin-top:auto">${o.signatures(r, ctx)}</div>`)
      };
    }
  });

  def({
    id: 'journal-caisse', lib: 'Journal de caisse', categorie: 'finance', sujet: 'ecole', icone: 'coin',
    description: 'Recettes et dépenses dans l’ordre chronologique avec le solde (reçus annulés exclus).',
    defauts: { titre: 'JOURNAL DE CAISSE', signatures: [{ role: 'Le trésorier du COGES', nom: '' }, { role: 'Le Directeur', nom: '{directeur}', cachet: true }], qr: { actif: false } },
    rendu(ctx, r, o) {
      const P = S().pro, x = X();
      const ops = [...P.paiements.filter((p) => !p.annule).map((p) => ({ d: p.date, l: `Versement ${p.ref} · ${x.nomComplet(AK.eleves.trouver(p.sid) || { nom: '', prenoms: '' })}`, r: +p.montant, s: 0 })), ...P.depenses.map((d) => ({ d: d.date, l: d.libelle + (d.justif ? ' (pièce ' + d.justif + ')' : ''), r: 0, s: +d.montant }))].sort((a, b) => a.d.localeCompare(b.d));
      let solde = 0;
      const lignes = ops.map((op) => {
        solde += op.r - op.s;
        return html`<tr><td>${u.fmtDate(op.d)}</td><td class="g">${op.l}</td><td class="d">${op.r ? u.fcfa(op.r) : ''}</td><td class="d">${op.s ? u.fcfa(op.s) : ''}</td><td class="d"><b>${u.fcfa(solde)}</b></td></tr>`;
      });
      return { liste: { avant: html`${o.entete(r)}${o.titre(r.titre, `Année scolaire ${S().school.year} · arrêté au ${u.fmtDate(u.aujourdhui())}`)}`, tete: html`<tr><th>Date</th><th class="g">Opération</th><th>Recette</th><th>Dépense</th><th>Solde</th></tr>`, lignes, apres: html`<div class="doc-recap"><div>Total des recettes<b>${u.fcfa(AK.pro.encaisse())}</b></div><div>Total des dépenses<b>${u.fcfa(AK.pro.depense())}</b></div><div>Solde<b>${u.fcfa(AK.pro.encaisse() - AK.pro.depense())}</b></div></div>${o.signatures(r, ctx)}`, suite: html`<div class="doc-note">Journal de caisse (suite)</div>` } };
    }
  });

  def({
    id: 'attestation-service', lib: 'Attestation de service (personnel)', categorie: 'personnel', sujet: 'agent', icone: 'fileCheck',
    description: 'Atteste que le membre du personnel est en service dans l’établissement. Référence et QR vérifiables.',
    emission: { type: 'ATS', politique: 'registre' },
    defauts: {
      titre: 'ATTESTATION DE SERVICE', filigrane: { type: 'logo', opacite: 5, taille: 60 }, qr: { actif: true, identite: false, taille: 24 },
      texte: 'Je soussigné(e), **{directeur}**, {directeur.titre} de l’{ecole.nomLong} ({iepp}, {drenaet}), atteste que **{agent.nom}**, matricule **{agent.matricule}**, {agent.fonction}, est en service dans mon établissement depuis le {agent.entree}.\n\nEn foi de quoi, la présente attestation lui est délivrée pour servir et valoir ce que de droit.'
    },
    rendu: (ctx, r, o) => ({ contenu: colonne(html`${o.entete(r)}${o.titre(r.titre, r.sousTitre)}<div class="doc-texte">${o.rediger(r.texte, ctx)}</div><div style="margin-top:auto">${o.signatures(r, ctx)}<div style="margin-top:6mm">${AK.mise.verification(ctx.qrTexte, ctx.doc, r.qr.taille)}</div></div>`) })
  });
})(window.AK);
