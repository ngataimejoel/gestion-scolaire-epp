:root {

  --side-w: 258px;

  --top-h: 60px;

  /* Mouvement (rapide et discret) */

  color-scheme: light;
}

/* ---------- Base ---------- */
*,
*::before,
*::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; background: var(--bg); }
body {
  margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink);
  font: var(--fs)/1.5 var(--font); -webkit-font-smoothing: antialiased; overflow-x: hidden;
}
h1, h2, h3 { font-family: var(--font-titre); color: var(--ink); margin: 0; font-weight: 650; letter-spacing: -0.01em; text-wrap: balance; }
p { margin: 0 0 var(--s3); }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
code, .mono { font-family: var(--mono); font-size: 0.92em; }
::selection { background: color-mix(in srgb, var(--acc) 30%, transparent); }
:focus { outline: none; }
:focus-visible { outline: 2px solid var(--pri); outline-offset: 2px; border-radius: 4px; }
.sr { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
[hidden] { display: none !important; }
.lien-evitement { position: fixed; left: 12px; top: -60px; z-index: 50; background: var(--pri); color: var(--on-pri); padding: 8px 14px; border-radius: var(--r-sm); font-weight: 600; text-decoration: none; transition: top var(--t-fast); }
.lien-evitement:focus { top: 12px; }
.i { width: 18px; height: 18px; flex: none; vertical-align: -3px; }
.mut { color: var(--mut); }
.petit { font-size: var(--fs-sm); }
.mb0 { margin-bottom: 0 !important; }
.ligne { display: flex; align-items: center; gap: var(--s2); flex-wrap: wrap; }
.pile { display: grid; gap: var(--s3); min-width: 0; }
.pile-sm { display: grid; gap: var(--s2); min-width: 0; }
.vf-noscript, .vf-chargement { padding: 24px; margin: 0; }

/* ---------- Boutons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  min-height: 38px; padding: 6px 14px; border-radius: 9px;
  border: 1px solid var(--line-2); background: var(--surface); color: var(--ink);
  font-weight: 600; font-size: 13.5px; line-height: 1.2; box-shadow: var(--sh-1); text-decoration: none; text-align: center;
  transition: background var(--t-fast), border-color var(--t-fast), color var(--t-fast);
}
.btn:hover { border-color: color-mix(in srgb, var(--pri) 45%, var(--line-2)); color: var(--pri); }
.btn:active { transform: translateY(1px); }
.btn .i { width: 16px; height: 16px; }
.btn-pri { background: var(--pri); border-color: var(--pri); color: var(--on-pri); }
.btn-pri:hover { background: var(--pri-h); border-color: var(--pri-h); color: var(--on-pri); }
.btn-ghost { background: transparent; border-color: transparent; box-shadow: none; color: var(--ink-2); }
.btn-ghost:hover { background: var(--sunk); border-color: transparent; color: var(--ink); }
.btn-sm { min-height: 32px; padding: 4px 10px; font-size: 12.5px; border-radius: 8px; }
.btn-ic { width: 40px; height: 40px; min-height: 40px; padding: 0; }
.btn.occupe { pointer-events: none; opacity: 0.8; }
.btn.occupe::after { content: ""; width: 13px; height: 13px; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent; animation: vf-tourne 0.7s linear infinite; }
@keyframes vf-tourne { to { transform: rotate(360deg); } }
.vf-fichier { position: relative; cursor: pointer; }
.vf-fichier:focus-within { outline: 2px solid var(--pri); outline-offset: 2px; }

/* ---------- Champs ---------- */
.champ { display: grid; gap: 5px; min-width: 0; }
.champ > label { font-size: 12.5px; font-weight: 650; color: var(--ink-2); }
.champ:focus-within > label { color: var(--pri); }
.champ .aide { font-size: 12px; color: var(--mut); }
.erreur-champ { font-size: 12.5px; color: var(--bad); font-weight: 600; display: flex; gap: 6px; align-items: flex-start; }
.erreur-champ .i { width: 15px; height: 15px; margin-top: 1px; }
.inp {
  width: 100%; min-width: 0; min-height: 44px; padding: 8px 12px;
  border: 1px solid var(--line-2); border-radius: 9px; background: var(--surface); color: var(--ink);
  transition: border-color var(--t-fast), box-shadow var(--t-fast);
}
.inp:hover { border-color: color-mix(in srgb, var(--pri) 30%, var(--line-2)); }
.inp:focus { border-color: var(--pri); box-shadow: 0 0 0 3px var(--pri-ring); outline: none; }
.inp[aria-invalid="true"] { border-color: var(--bad); box-shadow: 0 0 0 3px color-mix(in srgb, var(--bad) 18%, transparent); }
.vf-saisie { font-family: var(--mono); font-size: 15px; letter-spacing: 0.02em; }
.vf-saisie::placeholder { color: var(--faint); }

/* ---------- Cartes, encadrés, étiquettes ---------- */
.carte { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 18px; box-shadow: var(--sh-1); min-width: 0; }
.vf-titre { display: flex; align-items: center; gap: 9px; font-size: 15px; margin-bottom: 14px; }
.vf-titre .i { color: var(--pri); }
.vf-titre:focus-visible { outline-offset: 4px; }
.encadre { display: flex; gap: 10px; align-items: flex-start; padding: 11px 13px; border-radius: 11px; font-size: 13px; line-height: 1.45; background: var(--info-soft); color: var(--ink-2); border: 1px solid color-mix(in srgb, var(--info) 20%, transparent); }
.encadre > .i { color: var(--info); margin-top: 1px; }
.encadre > div { min-width: 0; }
.encadre.ok { background: var(--ok-soft); border-color: color-mix(in srgb, var(--ok) 25%, transparent); }
.encadre.ok > .i { color: var(--ok); }
.encadre.avert { background: var(--warn-soft); border-color: color-mix(in srgb, var(--warn) 25%, transparent); }
.encadre.avert > .i { color: var(--warn); }
.encadre.erreur { background: var(--bad-soft); border-color: color-mix(in srgb, var(--bad) 25%, transparent); }
.encadre.erreur > .i { color: var(--bad); }
.encadre b { color: var(--ink); }
.tag { display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px; border-radius: 99px; font: 700 11.5px/1.5 var(--font); background: var(--sunk); color: var(--ink-2); white-space: nowrap; vertical-align: 1px; }
.tag .i { width: 13px; height: 13px; }
.tag.ok { background: var(--ok-soft); color: var(--ok); }
.tag.avert { background: var(--warn-soft); color: var(--warn); }
.tag.mauvais { background: var(--bad-soft); color: var(--bad); }

/* ---------- En-tête : école, copie du registre, clés ---------- */
.vf-entete { background: var(--nuit-900); color: var(--nuit-txt); padding: 18px 16px 14px; border-bottom: 3px solid var(--acc); }
.vf-entete-in { max-width: 1120px; margin: 0 auto; display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.vf-marque { display: flex; align-items: center; gap: 14px; min-width: 0; }
.vf-marque > div { min-width: 0; }
.vf-logo { width: 44px; height: 44px; padding: 9px; border-radius: 12px; background: var(--nuit-700); color: #fff; }
.vf-sur { margin: 0; font-size: 12px; font-weight: 650; letter-spacing: 0.04em; text-transform: uppercase; color: var(--nuit-mut); }
.vf-entete h1 { color: #fff; font-size: var(--fs-xl); line-height: 1.2; overflow-wrap: anywhere; }
.vf-sous { margin: 2px 0 0; color: var(--nuit-mut); font-size: 13px; overflow-wrap: anywhere; }
.vf-theme { flex: none; background: var(--nuit-800); border-color: var(--nuit-600); color: var(--nuit-txt); box-shadow: none; }
.vf-theme:hover { background: var(--nuit-700); color: #fff; border-color: var(--nuit-600); }
.vf-theme[aria-pressed="true"] { background: var(--nuit-600); color: #fff; }
.vf-infos { max-width: 1120px; margin: 14px auto 0; display: flex; flex-wrap: wrap; gap: 8px 22px; font-size: 13px; color: var(--nuit-txt); }
.vf-infos b { color: #fff; }
.vf-cles { display: contents; }
.vf-info-l { display: inline-flex; align-items: center; gap: 7px; min-width: 0; flex-wrap: wrap; }
.vf-info-l > .i { color: var(--acc); }
.vf-entete .tag { background: var(--nuit-700); color: var(--nuit-txt); }
.vf-entete .tag.ok { background: color-mix(in srgb, #4fbf87 22%, var(--nuit-800)); color: #c9f0dc; }
.vf-entete .tag.mauvais { background: color-mix(in srgb, #ef7a70 26%, var(--nuit-800)); color: #ffd9d5; }
.vf-empreinte { letter-spacing: 0.04em; overflow-wrap: anywhere; }

/* ---------- Corps ---------- */
.vf-corps { max-width: 1120px; margin: 0 auto; padding: 20px 16px 8px; display: grid; gap: 16px; }
.vf-etroit { max-width: 760px; }
.vf-grille { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: 16px; align-items: start; }
.vf-resultat { position: sticky; top: 12px; }
.vf-vide { display: grid; justify-items: center; text-align: center; gap: 6px; padding: 26px 12px; color: var(--ink-2); }
.vf-vide-i { width: 40px; height: 40px; color: var(--faint); margin-bottom: 4px; }
.vf-etat:empty { display: none; }
.vf-etat.erreur { color: var(--bad); font-weight: 600; }
.vf-etat.ok { color: var(--ok); font-weight: 600; }
.vf-etapes { margin: 0; padding-left: 22px; display: grid; gap: 6px; }
.vf-apropos { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
.vf-apropos h3, .vf-sous-titre { font-size: 13.5px; }
.vf-sous-titre { margin-bottom: 8px; }
.vf-liste-cles { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.vf-liste-cles li { padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); }
.vf-pied { max-width: 1120px; margin: 0 auto; padding: 8px 16px 28px; font-size: 12.5px; color: var(--mut); }

/* Détails à comparer */
.vf-details { display: grid; grid-template-columns: minmax(0, 210px) minmax(0, 1fr); margin: 0; border: 1px solid var(--line); border-radius: 11px; overflow: hidden; font-size: 13px; }
.vf-details dt, .vf-details dd { margin: 0; padding: 7px 12px; border-top: 1px solid var(--line); overflow-wrap: anywhere; }
.vf-details dt { color: var(--mut); font-weight: 600; background: var(--surface-2); }
.vf-details dd { font-weight: 600; }
.vf-details dt:first-of-type, .vf-details dt:first-of-type + dd { border-top: 0; }

/* Historique de la session */
.vf-historique { list-style: none; margin: 0 0 10px; padding: 0; display: grid; gap: 6px; }
.vf-hist { width: 100%; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 8px 10px; border: 1px solid var(--line); border-radius: 9px; background: var(--surface-2); text-align: left; }
.vf-hist:hover { border-color: color-mix(in srgb, var(--pri) 40%, var(--line)); }
.vf-hist[aria-current="true"] { border-color: var(--pri); background: var(--pri-soft); }
.vf-hist-ref { font-weight: 650; overflow-wrap: anywhere; min-width: 0; }

/* Caméra */
.vf-camera { position: relative; border-radius: 12px; overflow: hidden; background: #000; aspect-ratio: 4 / 3; width: 100%; max-width: 520px; }
.vf-camera video { display: block; width: 100%; height: 100%; object-fit: cover; }
.vf-viseur { position: absolute; inset: 16%; border: 3px solid rgba(255, 255, 255, 0.85); border-radius: 14px; box-shadow: 0 0 0 999px rgba(0, 0, 0, 0.3); pointer-events: none; }
.vf-depot.survol { border-color: var(--pri); box-shadow: 0 0 0 3px var(--pri-ring); }

/* ---------- Résultat (AK.verif.rendu) ---------- */
.verif-res { border-radius: var(--r-lg); border: 1px solid var(--line); overflow: hidden; }
.verif-tete { display: flex; gap: 14px; align-items: center; padding: 16px 18px; }
.verif-tete .i { width: 40px; height: 40px; flex: none; }
.verif-tete b { display: block; font-size: 17px; font-family: var(--font-titre); line-height: 1.25; }
.verif-tete span { overflow-wrap: anywhere; }
.verif-res.valide .verif-tete { background: var(--ok-soft); color: var(--ok); }
.verif-res.douteux .verif-tete { background: var(--warn-soft); color: var(--warn); }
.verif-res.invalide .verif-tete { background: var(--bad-soft); color: var(--bad); }
.verif-res.inconnu .verif-tete { background: var(--sunk); color: var(--ink-2); }
.verif-points { display: grid; }
.verif-point { display: grid; grid-template-columns: 24px 150px minmax(0, 1fr); gap: 10px; align-items: start; padding: 10px 16px; border-top: 1px solid var(--line); font-size: 13px; }
.verif-point span { overflow-wrap: anywhere; min-width: 0; }
.verif-point .i { color: var(--mut); }
.verif-point.ok .i { color: var(--ok); }
.verif-point.ko .i { color: var(--bad); }
.verif-point.av .i { color: var(--warn); }
.verif-point b { font-weight: 650; }

/* ---------- Petits écrans ---------- */
@media (max-width: 900px) {
  .vf-grille, .vf-apropos { grid-template-columns: minmax(0, 1fr); }
  .vf-resultat { position: static; }
}
@media (max-width: 560px) {
  .vf-entete { padding-top: 14px; }
  .vf-entete h1 { font-size: var(--fs-lg); }
  .vf-logo { width: 38px; height: 38px; padding: 8px; }
  .carte { padding: 14px; }
  .verif-tete { padding: 14px; }
  .verif-point { grid-template-columns: 22px minmax(0, 1fr); padding: 10px 14px; }
  .verif-point span:last-child { grid-column: 2; }
  .vf-details { grid-template-columns: minmax(0, 1fr); }
  .vf-details dd { border-top: 0; padding-top: 0; }
  .vf-details dt { background: none; }

   Toute l'application vit sous window.AK, découpée en modules (un fichier = un module).
   Ordre de chargement : src/manifest.json. Les scripts sont « classiques » (pas de modules ES)

   ===================================================================================== */
(function () {
  'use strict';
  const AK = (window.AK = window.AK || {});
  AK.VERSION = '2.0.0';
  AK.NOM = 'AKWA SCHOOL';

  /* Erreurs métier : message destiné à l'utilisateur, jamais une trace technique. */
  class ErreurMetier extends Error {
    constructor(message, champ) {
      super(message);
      this.name = 'ErreurMetier';
      this.champ = champ || null;
    }
  }
  class ErreurDroits extends ErreurMetier {

  AK.ErreurMetier = ErreurMetier;
  AK.ErreurDroits = ErreurDroits;

  /* Petit bus d'événements : les modules s'écoutent sans se connaître. */
  const ecoutes = new Map();
  AK.bus = {
    on(nom, f) {
      if (!ecoutes.has(nom)) ecoutes.set(nom, new Set());
      ecoutes.get(nom).add(f);

        }

  const fmtHorodatage = (t) =>
    new Date(t).toLocaleString('fr-FR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });

      if (fichier.size > 25 * 1024 * 1024) return ko(new AK.ErreurMetier('Image trop volumineuse (25 Mo au maximum).'));

      r.onload = () => {
        const im = new Image();
        im.onload = () => {
          const k = Math.min(1, max / Math.max(im.width, im.height));

<script>
/* =====================================================================================
   Validation des données : chaque règle renvoie '' (valide) ou un message compréhensible.
   Les formulaires affichent le message sous le champ concerné ; la logique métier
   revalide toujours avant d'enregistrer (un bouton masqué n'est pas une protection).
   ===================================================================================== */
(function (AK) {
  'use strict';
  const C = AK.cfg, u = AK.u;
  const V = {};

  /* ---------- Noms ---------- */
  const CIVIL = /^(M\.?|MR\.?|MME\.?|MLLE\.?|DR\.?)$/i;
  const motOk = (w) => /^[A-Za-zÀ-ÖØ-öø-ÿ][A-Za-zÀ-ÖØ-öø-ÿ'’-]+$/.test(w) && !/^(.)\1*$/i.test(w.replace(/['’-]/g, ''));
  /** Nom de personne : mots de 2 lettres au moins ; min = nombre de mots exigés (2 pour « nom et prénoms »). */
  V.nom = function (v, lib, min = 2, max = 80) {
    const s = String(v || '').trim();
    if (s.length > max) return `${lib} : ${max} caractères au maximum.`;
    const m = s.split(/\s+/).filter((w) => w && !CIVIL.test(w));
    if (m.length < min) return min > 1 ? `${lib} : nom et prénoms en entier (ex. KOFFI KOUADIO).` : `${lib} : à renseigner.`;
    return m.every(motOk) ? '' : `${lib} : lettres uniquement, 2 au moins par mot (ex. KOFFI KOUADIO).`;
  };
  V.civ = {
    de(n) {
      const m = String(n || '').trim().match(/^(MLLE|MME|MR|M)\.?\s+/i);
      return m ? { mlle: 'Mlle', mme: 'Mme' }[m[1].toLowerCase()] || 'M.' : '';
    },
    sans: (n) => String(n || '').trim().replace(/^(MLLE|MME|MR|M)\.?\s+/i, ''),
    avec: (c, n) => (C.CIVS.includes(c) ? c + ' ' : '') + u.majNomComplet(V.civ.sans(n))
  };

  /* ---------- Téléphones (Côte d'Ivoire) ---------- */
  V.telCI = (v) => {
    const n = String(v || '').replace(/[\s.\-()/]/g, '').replace(/^(?:\+|00)?225(?=\d{10}$)/, '');

    for (let i = 0; i < a.length; i++) d |= a[i] ^ b[i];
    return d === 0;
  };

  async function sha256(texte) {
    exiger();

  /* ---------- Mots de passe ---------- */
  async function pbkdf2(secret, sel, iterations, octets = 32) {

  async function empreinteSecret(secret) {

  async function cleDeSecret(secret, sel, iter) {
    const bits = await pbkdf2(secret, sel, iter);
    return crypto.subtle.importKey('raw', bits, 'AES-GCM', false, ['encrypt', 'decrypt']);
  }
  async function chiffrer(octets, secret) {
    exiger();
    const sel = aleatoire(16), iv = aleatoire(12), iter = AK.cfg.SECU.PBKDF2_ITER;
    const k = await cleDeSecret(secret, sel, iter);
    const c = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, k, octets);
    return { algo: 'PBKDF2-AESGCM', iter, sel: b64(sel), iv: b64(iv), donnees: b64(c) };
  }
  async function dechiffrer(paquet, secret) {
    exiger();
    try {
      const k = await cleDeSecret(secret, deB64(paquet.sel), paquet.iter);
      return new Uint8Array(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: deB64(paquet.iv) }, k, deB64(paquet.donnees)));
    } catch (e) {

  const ALG = { name: 'ECDSA', namedCurve: 'P-256' };
  const SIG = { name: 'ECDSA', hash: 'SHA-256' };
  async function nouvellePaire() {
    exiger();
    const p = await crypto.subtle.generateKey(ALG, true, ['sign', 'verify']);
    const pub = await crypto.subtle.exportKey('jwk', p.publicKey);
    const priv = new Uint8Array(await crypto.subtle.exportKey('pkcs8', p.privateKey));
    return { pub: { kty: pub.kty, crv: pub.crv, x: pub.x, y: pub.y }, priv };

  async function importerPrivee(pkcs8) {
    return crypto.subtle.importKey('pkcs8', pkcs8, ALG, false, ['sign']);
  }
  async function importerPublique(jwk) {
    return crypto.subtle.importKey('jwk', { ...jwk, ext: true }, ALG, false, ['verify']);
  }
  async function signer(clePrivee, message) {
    return b64url(await crypto.subtle.sign(SIG, clePrivee, enc.encode(message)));
  }
  async function verifierSignature(jwk, message, signature) {
    exiger();
    try {
      const k = await importerPublique(jwk);
      return await crypto.subtle.verify(SIG, k, deB64url(signature), enc.encode(message));
    } catch (e) {
      return false;
    }
  }
  /** Empreinte lisible d'une clé publique : 4 groupes de 4 caractères (à comparer à voix haute). */
  async function empreinteCle(jwk) {
    const h = await sha256(`${jwk.crv}|${jwk.x}|${jwk.y}`);
    return b32(h.slice(0, 10)).match(/.{4}/g).join('-');
  }
  /** Code aléatoire lisible (ni 0/O ni 1/I) : XXXX-XXXX-XXXX… */
  function codeLisible(groupes = 3) {
    const A = AK.cfg.SECU.ALPHABET_CODE;
    const r = aleatoire(groupes * 4);
    let s = '';
    for (let i = 0; i < r.length; i++) s += A[r[i] % A.length];
    return s.match(/.{4}/g).join('-');
  }
  const normCode = (c) => String(c || '').toUpperCase().replace(/[^0-9A-Z]/g, '');

  AK.crypto = {
    dispo, sha256, b64, deB64, b64url, deB64url, b32, hex, aleatoire, egaux,
    empreinteSecret, verifierSecret, chiffrer, dechiffrer,
    nouvellePaire, importerPrivee, importerPublique, signer, verifierSignature, empreinteCle,
    codeLisible, normCode
  };
})(window.AK);

<script>
/* =====================================================================================
   QR codes des documents : contenu minimal, canonique et vérifiable.

   Format (version 1), champs dans cet ordre, séparés par « ; » :
     AKS1 ; T=<type> ; R=<référence> ; E=<émission AAAA-MM-JJ> ; X=<expiration> ; H=<empreinte>
          [; N=<NOM PRÉNOMS>] [; M=<matricule>] ; K=<clé> ; S=<signature>
   - Jamais de photo, de téléphone, de donnée médicale ni de détail d'acte de naissance.
   - N et M (nom et matricule, déjà imprimés sur le document) seulement si le modèle le prévoit
     (cartes d'identification par défaut) : ils permettent une vérification hors ligne sans base.
   - H : empreinte SHA-256 (80 bits, base 32) des données du titulaire au moment de l'émission.
   - S : signature ECDSA P-256 du texte qui précède « ;S= » (absente si aucune clé n'est créée).
   ===================================================================================== */
(function (AK) {
  'use strict';
  const u = AK.u;
  const PREFIXE = 'AKS1';
  const ORDRE = ['T', 'R', 'E', 'X', 'H', 'N', 'M', 'K'];

  /** Valeur sûre dans le QR : majuscules sans accents, sans « ; » ni « = ». */
  const propre = (v) => u.sansAccents(String(v || '')).toUpperCase().replace(/[;=\r\n]/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 60);

  /** Données canoniques du titulaire → empreinte H (texte de 16 caractères). */
  async function empreinteTitulaire(canon) {
    const t = ['type', 'ref', 'nom', 'prenoms', 'matricule', 'classe', 'annee', 'ecole', 'extra'].map((k) => propre(canon[k])).join('|');
    if (!AK.crypto.dispo()) return '';
    return AK.crypto.b32((await AK.crypto.sha256(t)).slice(0, 10));
  }

  /** Texte signé (sans la signature). */
  function message(c) {
    const parts = [PREFIXE];
    ORDRE.forEach((k) => {
      if (c[k] != null && c[k] !== '') parts.push(`${k}=${k === 'R' ? String(c[k]).toUpperCase() : propre(c[k])}`);
    });
    return parts.join(';');
  }
  function texte(c) {
    const m = message(c);
    return c.S ? `${m};S=${c.S}` : m;
  }
  /** Lecture tolérante (espaces, minuscules, saisie au clavier) ; null si ce n'est pas un QR AKWA. */
  function lire(brut) {
    let s = String(brut || '').trim();
    try {
      if (/%[0-9A-F]{2}/i.test(s)) s = decodeURIComponent(s);
    } catch (e) { /* texte laissé tel quel */ }
    const i = s.toUpperCase().indexOf(PREFIXE + ';');
    if (i < 0) return null;
    s = s.slice(i);
    const champs = {};
    const morceaux = s.split(';');
    for (const p of morceaux.slice(1)) {
      const k = p.indexOf('=');
      if (k < 1) continue;
      const cle = p.slice(0, k).trim().toUpperCase();
      champs[cle] = p.slice(k + 1).trim();
    }
    if (!champs.T || !champs.R) return null;
    const sansSig = { ...champs };
    delete sansSig.S;
    return { champs, message: message(sansSig), signature: champs.S || null };
  }

  /** Emplacement réservé dans un aperçu : le vrai QR (référence, signature) est créé à l'impression. */
  const BROUILLON = '@brouillon';
  const SVG_BROUILLON = u.raw('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" role="img" aria-label="QR code créé à l’impression"><rect x="1" y="1" width="38" height="38" rx="2" fill="#fff" stroke="#8a94a6" stroke-width=".8" stroke-dasharray="2 1.6"/><path d="M6 6h9v9H6zM25 6h9v9h-9zM6 25h9v9H6z" fill="none" stroke="#8a94a6" stroke-width="1.4"/><text x="20" y="22" font-size="4.2" text-anchor="middle" fill="#5c687a" font-family="sans-serif">QR</text><text x="27" y="31" font-size="3.2" text-anchor="middle" fill="#5c687a" font-family="sans-serif">à l’impression</text></svg>');

  /** Matrice → SVG vectoriel (zone de silence de 4 modules), net à toutes les tailles. */
  function svg(texteQR, { niveau = 'M', titre = 'QR code' } = {}) {
    if (texteQR === BROUILLON) return SVG_BROUILLON;
    const m = AK.vendor.qr.matrix(texteQR, niveau);
    const n = m.size;
    let d = '';
    for (let r = 0; r < n; r++) {
      let c = 0;
      while (c < n) {
        if (m.rows[r][c]) {
          let l = 1;
          while (c + l < n && m.rows[r][c + l]) l++;
          d += `M${c + 4} ${r + 4}h${l}v1h-${l}z`;
          c += l;
        } else c++;
      }
    }
    const t = n + 8;
    return u.raw(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${t} ${t}" shape-rendering="crispEdges" role="img" aria-label="${u.esc(titre)}"><rect width="${t}" height="${t}" fill="#fff"/><path d="${d}" fill="#000"/></svg>`);
  }

  AK.qr = { PREFIXE, BROUILLON, propre, empreinteTitulaire, message, texte, lire, svg };
})(window.AK);

<script>
/* =====================================================================================
   Lecture de QR codes à partir d'une image (caméra ou photo), entièrement hors ligne.
   Écrit pour AKWA SCHOOL (aucune bibliothèque téléchargeable) ; s'appuie sur les tables
   éprouvées de la bibliothèque de génération (blocs Reed-Solomon, codes BCH, masques).

   Étapes : niveaux de gris → seuillage adaptatif → repérage des trois motifs de position →
   motif d'alignement → transformation perspective → échantillonnage → format et version →
   démasquage → codes correcteurs (Reed-Solomon) → segments (numérique, alphanumérique, octets).
   Si l'API BarcodeDetector du navigateur existe, elle est essayée d'abord (plus rapide).
   ===================================================================================== */
(function (AK) {
  'use strict';
  const Q = () => AK.vendor.qr;

  /* ---------- Image → matrice binaire ---------- */
  function binariser(img) {
    const { data, width: w, height: h } = img;
    const lum = new Uint8ClampedArray(w * h);
    for (let i = 0, p = 0; i < lum.length; i++, p += 4) lum[i] = (data[p] * 77 + data[p + 1] * 150 + data[p + 2] * 29) >> 8;
    const B = 8, bw = Math.ceil(w / B), bh = Math.ceil(h / B);
    const seuils = new Float32Array(bw * bh);
    for (let by = 0; by < bh; by++)
      for (let bx = 0; bx < bw; bx++) {
        let min = 255, max = 0, som = 0, n = 0;
        for (let y = by * B; y < Math.min(h, by * B + B); y++)
          for (let x = bx * B; x < Math.min(w, bx * B + B); x++) {
            const v = lum[y * w + x];
            som += v;
            n++;
            if (v < min) min = v;
            if (v > max) max = v;
          }
        let moy = som / n;
        if (max - min <= 24) {
          moy = min / 2;
          if (by > 0 && bx > 0) {
            const voisins = (seuils[(by - 1) * bw + bx] + 2 * seuils[by * bw + bx - 1] + seuils[(by - 1) * bw + bx - 1]) / 4;
            if (min < voisins) moy = voisins;
          }
        }
        seuils[by * bw + bx] = moy;
      }
    const noir = new Uint8Array(w * h);
    for (let by = 0; by < bh; by++)
      for (let bx = 0; bx < bw; bx++) {
        let s = 0, n = 0;
        for (let dy = -2; dy <= 2; dy++)
          for (let dx = -2; dx <= 2; dx++) {
            const yy = by + dy, xx = bx + dx;
            if (yy >= 0 && xx >= 0 && yy < bh && xx < bw) {
              s += seuils[yy * bw + xx];
              n++;
            }
          }
        const t = s / n;
        for (let y = by * B; y < Math.min(h, by * B + B); y++)
          for (let x = bx * B; x < Math.min(w, bx * B + B); x++) noir[y * w + x] = lum[y * w + x] <= t ? 1 : 0;
      }
    return { w, h, noir, inverse: false, get(x, y) { return x >= 0 && y >= 0 && x < w && y < h ? noir[y * w + x] ^ (this.inverse ? 1 : 0) : 0; } };
  }

  /* ---------- Motifs de position (1:1:3:1:1) ---------- */
  function ratioOk(c, tol = 0.5) {
    const total = c[0] + c[1] + c[2] + c[3] + c[4];
    if (total < 7) return false;
    const m = total / 7, v = m * tol;
    return Math.abs(m - c[0]) < v && Math.abs(m - c[1]) < v && Math.abs(3 * m - c[2]) < 3 * v && Math.abs(m - c[3]) < v && Math.abs(m - c[4]) < v;
  }
  const centreDe = (c, fin) => fin - c[4] - c[3] - c[2] / 2;
  function croiserVertical(M, cx, cy, maxCompte, total) {
    const c = [0, 0, 0, 0, 0];
    let y = cy;
    while (y >= 0 && M.get(cx, y)) { c[2]++; y--; }
    if (y < 0) return NaN;
    while (y >= 0 && !M.get(cx, y) && c[1] <= maxCompte) { c[1]++; y--; }
    if (y < 0 || c[1] > maxCompte) return NaN;
    while (y >= 0 && M.get(cx, y) && c[0] <= maxCompte) { c[0]++; y--; }
    if (c[0] > maxCompte) return NaN;
    y = cy + 1;
    while (y < M.h && M.get(cx, y)) { c[2]++; y++; }
    if (y === M.h) return NaN;
    while (y < M.h && !M.get(cx, y) && c[3] < maxCompte) { c[3]++; y++; }
    if (y === M.h || c[3] >= maxCompte) return NaN;
    while (y < M.h && M.get(cx, y) && c[4] < maxCompte) { c[4]++; y++; }
    if (c[4] >= maxCompte) return NaN;
    const t = c[0] + c[1] + c[2] + c[3] + c[4];
    if (5 * Math.abs(t - total) >= 2 * total) return NaN;
    return ratioOk(c) ? centreDe(c, y) : NaN;
  }
  function croiserHorizontal(M, cx, cy, maxCompte, total) {
    const c = [0, 0, 0, 0, 0];
    let x = cx;
    while (x >= 0 && M.get(x, cy)) { c[2]++; x--; }
    if (x < 0) return NaN;
    while (x >= 0 && !M.get(x, cy) && c[1] <= maxCompte) { c[1]++; x--; }
    if (x < 0 || c[1] > maxCompte) return NaN;
    while (x >= 0 && M.get(x, cy) && c[0] <= maxCompte) { c[0]++; x--; }
    if (c[0] > maxCompte) return NaN;
    x = cx + 1;
    while (x < M.w && M.get(x, cy)) { c[2]++; x++; }
    if (x === M.w) return NaN;
    while (x < M.w && !M.get(x, cy) && c[3] < maxCompte) { c[3]++; x++; }
    if (x === M.w || c[3] >= maxCompte) return NaN;
    while (x < M.w && M.get(x, cy) && c[4] < maxCompte) { c[4]++; x++; }
    if (c[4] >= maxCompte) return NaN;
    const t = c[0] + c[1] + c[2] + c[3] + c[4];
    if (5 * Math.abs(t - total) >= total) return NaN;
    return ratioOk(c) ? centreDe(c, x) : NaN;
  }
  function chercherMotifs(M) {
    const cands = [];
    const ajouter = (x, y, taille) => {
      const ex = cands.find((p) => Math.abs(p.x - x) <= taille && Math.abs(p.y - y) <= taille && Math.abs(p.m - taille) <= Math.max(1, p.m) * 0.7);
      if (ex) {
        ex.x = (ex.x * ex.n + x) / (ex.n + 1);
        ex.y = (ex.y * ex.n + y) / (ex.n + 1);
        ex.m = (ex.m * ex.n + taille) / (ex.n + 1);
        ex.n++;
      } else cands.push({ x, y, m: taille, n: 1 });
    };
    const pas = Math.max(1, Math.floor(M.h / 300));
    for (let y = 0; y < M.h; y += pas) {
      const c = [0, 0, 0, 0, 0];
      let etat = 0;
      for (let x = 0; x < M.w; x++) {
        const n = M.get(x, y);
        if (n) {
          if (etat & 1) etat++;
          c[etat]++;
        } else if (!(etat & 1)) {
          if (etat === 4) {
            if (ratioOk(c)) {
              const total = c[0] + c[1] + c[2] + c[3] + c[4];
              let cx = centreDe(c, x);
              const cy = croiserVertical(M, Math.floor(cx), y, c[2], total);
              if (!isNaN(cy)) {
                cx = croiserHorizontal(M, Math.floor(cx), Math.floor(cy), c[2], total);
                if (!isNaN(cx)) ajouter(cx, cy, total / 7);
              }
              c[0] = c[2]; c[1] = c[3]; c[2] = c[4]; c[3] = 1; c[4] = 0;
              etat = 3;
              continue;
            }
            c[0] = c[2]; c[1] = c[3]; c[2] = c[4]; c[3] = 1; c[4] = 0;
            etat = 3;
          } else c[++etat]++;
        } else c[etat]++;
      }
      if (ratioOk(c)) {
        const total = c[0] + c[1] + c[2] + c[3] + c[4];
        const cx = centreDe(c, M.w);
        const cy = croiserVertical(M, Math.floor(cx), y, c[2], total);
        if (!isNaN(cy)) ajouter(cx, cy, total / 7);
      }
    }
    return cands.filter((p) => p.n >= 2 || cands.length <= 3).sort((a, b) => b.n - a.n).slice(0, 12);
  }
  const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
  /** Choix de trois motifs formant un triangle rectangle isocèle ; renvoie [hautGauche, hautDroit, basGauche]. */
  function trier(cands) {
    let meilleur = null, score = Infinity;
    for (let i = 0; i < cands.length; i++)
      for (let j = i + 1; j < cands.length; j++)
        for (let k = j + 1; k < cands.length; k++) {
          const P = [cands[i], cands[j], cands[k]];
          const m = (P[0].m + P[1].m + P[2].m) / 3;
          if (P.some((p) => Math.abs(p.m - m) > m * 0.5)) continue;
          const d = [dist(P[1], P[2]), dist(P[0], P[2]), dist(P[0], P[1])];
          const h = d.indexOf(Math.max(...d)); // hypoténuse opposée au coin haut-gauche
          const a = P[h], b = P[(h + 1) % 3], c = P[(h + 2) % 3];
          const db = dist(a, b), dc = dist(a, c);
          if (db < m * 14 || dc < m * 14) continue; // au moins 21 modules : distance entre centres ≥ 14
          const s = Math.abs(db - dc) / Math.max(db, dc) + Math.abs(d[h] - Math.hypot(db, dc)) / d[h];
          if (s < score) {
            score = s;
            meilleur = [a, b, c];
          }
        }
    if (!meilleur || score > 0.35) return null;
    let [hg, b, c] = meilleur;
    const croix = (b.x - hg.x) * (c.y - hg.y) - (b.y - hg.y) * (c.x - hg.x);
    if (croix < 0) [b, c] = [c, b];
    return [hg, b, c];
  }

  /* ---------- Transformation perspective (carré → quadrilatère) ---------- */
  function carreVersQuad(x0, y0, x1, y1, x2, y2, x3, y3) {
    const dx3 = x0 - x1 + x2 - x3, dy3 = y0 - y1 + y2 - y3;
    if (Math.abs(dx3) < 1e-9 && Math.abs(dy3) < 1e-9) return [x1 - x0, x2 - x1, x0, y1 - y0, y2 - y1, y0, 0, 0, 1];
    const dx1 = x1 - x2, dx2 = x3 - x2, dy1 = y1 - y2, dy2 = y3 - y2, den = dx1 * dy2 - dx2 * dy1;
    const a13 = (dx3 * dy2 - dx2 * dy3) / den, a23 = (dx1 * dy3 - dx3 * dy1) / den;
    return [x1 - x0 + a13 * x1, x3 - x0 + a23 * x3, x0, y1 - y0 + a13 * y1, y3 - y0 + a23 * y3, y0, a13, a23, 1];
  }
  function adjointe(m) {
    const [a11, a21, a31, a12, a22, a32, a13, a23, a33] = m;
    return [a22 * a33 - a23 * a32, a23 * a31 - a21 * a33, a21 * a32 - a22 * a31, a13 * a32 - a12 * a33, a11 * a33 - a13 * a31, a12 * a31 - a11 * a32, a12 * a23 - a13 * a22, a13 * a21 - a11 * a23, a11 * a22 - a12 * a21];
  }
  function produit(a, b) {
    const [a11, a21, a31, a12, a22, a32, a13, a23, a33] = a, [b11, b21, b31, b12, b22, b32, b13, b23, b33] = b;
    return [a11 * b11 + a21 * b12 + a31 * b13, a11 * b21 + a21 * b22 + a31 * b23, a11 * b31 + a21 * b32 + a31 * b33, a12 * b11 + a22 * b12 + a32 * b13, a12 * b21 + a22 * b22 + a32 * b23, a12 * b31 + a22 * b32 + a32 * b33, a13 * b11 + a23 * b12 + a33 * b13, a13 * b21 + a23 * b22 + a33 * b23, a13 * b31 + a23 * b32 + a33 * b33];
  }
  /* Quadrilatère source (coordonnées en modules) → quadrilatère image */
  function quadVersQuad(src, dst) {
    const q2s = adjointe(carreVersQuad(...src));
    const s2q = carreVersQuad(...dst);
    const m = produit(s2q, q2s);
    return (x, y) => {
      const [a11, a21, a31, a12, a22, a32, a13, a23, a33] = m;
      const d = a13 * x + a23 * y + a33;
      return [(a11 * x + a21 * y + a31) / d, (a12 * x + a22 * y + a32) / d];
    };
  }

<script>
/* =====================================================================================
   Vérification d'un document (QR code scanné ou référence saisie).

   Quatre questions distinctes, jamais confondues :
     1. Intégrité   : le contenu du QR a-t-il été modifié ? (signature ECDSA)
     2. Émetteur    : qui a signé ? (clé connue, active, retirée, compromise)
     3. Validité    : le document figure-t-il au registre, avec la même empreinte ?
     4. Statut      : annulé, remplacé, expiré, version dépassée ?

   seul un registre à jour le dit. Hors ligne, la liste d'annulation n'est connue qu'à la date
   de la dernière copie du registre (indiquée dans le résultat).

   Code pur, partagé par l'application et l'outil de vérification autonome.

        } else if ((e.v || []).includes(q.champs.H)) point('registre', 'av', 'Registre', 'Version ANCIENNE : ce document a été réédité depuis (par exemple après une correction de note). Demandez la version en vigueur.');

      else {
        statutOk = true;
        point('statut', 'ok', 'Statut', `En vigueur${e.x ? ' jusqu’au ' + u.fmtDate(e.x) : ''}${source.registreDate ? ` (selon le registre du ${u.fmtDate(source.registreDate)})` : ''}.`);
      }
    }
    if (!e && q && q.champs.X && q.champs.X < (source.aujourdhui || u.aujourdhui())) point('statut', 'av', 'Statut', `Date de fin de validité inscrite dans le QR dépassée (${u.fmtDate(q.champs.X)}).`);

    /* Identité inscrite dans le QR (à comparer avec le document présenté) */
    if (q && (q.champs.N || q.champs.M)) point('identite', 'info', 'Titulaire (QR)', `${q.champs.N || ''}${q.champs.M ? ' · matricule ' + q.champs.M : ''} — comparez avec la carte et la personne.`);

    /* Verdict */
    const ko = R.points.some((p) => p.etat === 'ko');
    const av = R.points.some((p) => p.etat === 'av');
    if (ko) R.verdict = 'invalide';
    else if (!e && !sigOk) R.verdict = 'inconnu';
    else if (registreOk && statutOk && (sigOk || !q || !q.signature)) R.verdict = av ? 'douteux' : 'valide';
    else R.verdict = 'douteux';
    const libType = AK.registre ? AK.registre.libelleType(R.type) : R.type;
    const titreValide = sigOk ? 'Document authentique et en vigueur' : R.format === 'reference' ? 'Référence inscrite au registre et en vigueur' : 'Inscrit au registre et en vigueur (document non signé)';
    R.titre = { valide: titreValide, douteux: 'Vérification incomplète : prudence', invalide: 'Document NON valable', inconnu: 'Document inconnu' }[R.verdict];
    R.resume = `${libType || 'Document'} · ${ref}`;
    return R;
  }

  /** Affichage du résultat (application et outil autonome). */
  function rendu(R) {
    const { html } = u, ic = AK.ic;
    const icone = { valide: 'shieldCheck', douteux: 'warn', invalide: 'shieldX', inconnu: 'help' }[R.verdict];
    const ico = { ok: 'checkCircle', ko: 'xCircle', av: 'warn', info: 'info' };
    return html`<div class="verif-res ${R.verdict}" role="status" aria-live="polite"><div class="verif-tete">${ic(icone)}<div><b>${R.titre}</b><span>${R.resume}</span></div></div>
      <div class="verif-points">${R.points.map((p) => html`<div class="verif-point ${p.etat}">${ic(ico[p.etat] || 'info')}<b>${p.titre}</b><span>${p.detail}</span></div>`)}</div></div>`;
  }

  AK.verif = { verifier, rendu, lireReference };
})(window.AK);

</script>
<script>
/* =====================================================================================
   Outil de vérification AUTONOME : fichier HTML hors ligne remis par l'école à l'IEPP, à un
   autre établissement ou à un parent. Il fonctionne en ouvrant simplement le fichier
   (adresse file://), sans connexion, sans aucune ressource externe.

   Données intégrées par AKWA SCHOOL › Documents › Vérifier › « Créer l'outil »
   (window.AKWA_DONNEES) :
     { format: 'akwa-verification', version: 1, cree, registreDate, ecole: { nom, iepp, drenaet },
       cles: [clés PUBLIQUES de signature], registre: [{ r, t, e, x, h, s, a, v, n? }] }
   Le modèle livré avec l'application n'en contient aucune : il explique alors comment
   produire l'outil de l'école.

   Le contrôle (signature, registre, statut) est confié au moteur commun AK.verif
   (docs/verification.js), le même que dans l'application. Cet écran ne fait que :
     - préparer la source (clés publiques contrôlées, index du registre, date de la copie) ;
     - lire la référence, le texte d'une douchette, la caméra ou une photo ;
     - présenter le résultat avec des avertissements honnêtes : la copie du registre est
       datée (une annulation postérieure n'est pas connue), la signature prouve l'intégrité
       et l'émetteur mais pas la validité administrative, et il faut comparer la personne.
   ===================================================================================== */
(function (AK) {
  'use strict';
  const u = AK.u, { html } = u, ic = AK.ic, V = AK.valid;
  const $ = (s, e) => u.$(s, e);

  /* Libellés des types de document : copie de AK.registre.TYPES (docs/registre.js), module
     qui n'est pas embarqué dans l'outil. Le moteur de vérification s'en sert s'il existe. */
  const TYPES = {
    CEL: 'Carte d’identité scolaire',
    CPE: 'Carte professionnelle',
    CSC: 'Certificat de scolarité',
    ATF: 'Attestation de fréquentation',
    CTR: 'Certificat de transfert (exeat)',
    FIS: 'Fiche scolaire',
    FII: 'Fiche individuelle de l’élève',
    FIN: 'Fiche d’inscription',
    BUL: 'Bulletin de notes',
    BUA: 'Bulletin annuel',
    ATS: 'Attestation de service',
    REC: 'Reçu de versement'
  };
  const libelleType = (t) => TYPES[t] || t || 'Document';
  if (!AK.registre) AK.registre = { TYPES, libelleType };

  const COPIE_ANCIENNE = 30; // jours au-delà desquels la copie du registre est signalée comme ancienne
  const HISTORIQUE_MAX = 12;
  const VERDICTS = { valide: ['ok', 'Valable'], douteux: ['avert', 'À vérifier'], invalide: ['mauvais', 'Non valable'], inconnu: ['', 'Inconnu'] };
  const STATUTS_CLE = { active: 'Active', retiree: 'Retirée', compromise: 'COMPROMISE' };
  const STATUTS_DOC = { valide: 'En vigueur', annule: 'Annulé', remplace: 'Remplacé' };

  /* ---------- Données intégrées : contrôle de forme, index du registre ---------- */
  const estTexte = (v) => typeof v === 'string' && v.length > 0;
  const cleBienFormee = (c) => c && estTexte(c.id) && c.pub && typeof c.pub === 'object' && estTexte(c.pub.x) && estTexte(c.pub.y) && estTexte(c.pub.crv);

  function chargerDonnees(brut) {
    if (brut == null) return { etat: 'modele' };
    if (typeof brut !== 'object' || brut.format !== 'akwa-verification' || brut.version !== 1 || !Array.isArray(brut.registre) || !Array.isArray(brut.cles)) return { etat: 'illisible' };
    const e = brut.ecole && typeof brut.ecole === 'object' ? brut.ecole : {};
    const ecole = { nom: String(e.nom || '').trim(), iepp: String(e.iepp || '').trim(), drenaet: String(e.drenaet || '').trim() };
    const index = new Map();
    const comptes = { valide: 0, annule: 0, remplace: 0 };
    let ignorees = 0;
    for (const x of brut.registre) {
      const ref = x && estTexte(x.r) ? V.normRef(x.r) : '';
      if (!V.refValide(ref)) {
        ignorees++;
        continue;
      }
      index.set(ref, x);
      if (comptes[x.s] != null) comptes[x.s]++;
    }
    const cles = brut.cles.filter(cleBienFormee).map((c) => ({ ...c, ecole: c.ecole || ecole.nom, controle: 'en-cours' }));
    ignorees += brut.cles.length - cles.length;
    return {
      etat: 'ok', ecole, cles, index, comptes, ignorees,
      registreDate: u.estISO(brut.registreDate) ? brut.registreDate : null,
      cree: typeof brut.cree === 'string' && !isNaN(Date.parse(brut.cree)) ? brut.cree : null
    };
  }

  const D = chargerDonnees(window.AKWA_DONNEES);
  const cryptoDispo = AK.crypto && AK.crypto.dispo();

  /* L'empreinte affichée d'une clé sert à authentifier l'outil (comparée à celle que l'école
     communique). Elle est recalculée ici : une clé dont l'empreinte ne correspond pas est
     écartée (fichier altéré) et n'est jamais utilisée pour valider une signature. */
  const clesControlees = D.etat !== 'ok' || !cryptoDispo ? Promise.resolve() : Promise.all(D.cles.map(async (c) => {
    try {
      const calc = await AK.crypto.empreinteCle(c.pub);
      c.controle = calc === c.empreinte ? 'ok' : 'alteree';
      c.empreinteCalculee = calc;
    } catch (e) {
      c.controle = 'alteree';
    }
  }));

  /** Entrée de la copie du registre → format attendu par AK.verif.verifier. */
  const entree = (x) => (x ? {
    e: estTexte(x.e) ? x.e : '', n: estTexte(x.n) ? x.n : '', h: estTexte(x.h) ? x.h : '', v: Array.isArray(x.v) ? x.v : [],
    s: x.s, a: estTexte(x.a) ? x.a : null, motif: '', remplacePar: '', x: estTexte(x.x) ? x.x : null, demo: false
  } : null);
  const source = () => ({
    cles: D.cles.filter((c) => c.controle === 'ok'),
    trouver: (ref) => entree(D.index.get(V.normRef(ref))),
    registreDate: D.registreDate,
    aujourdhui: u.aujourdhui(),
    ecole: D.ecole
  });
  const ageCopie = () => (D.registreDate ? u.ecartJours(D.registreDate, u.aujourdhui()) : null);

  /* ---------- Affichage général ---------- */
  const ecoleNom = () => D.ecole.nom || 'École non nommée';
  const sousTitre = () => [D.ecole.iepp && `IEPP : ${D.ecole.iepp}`, D.ecole.drenaet && `DRENAET : ${D.ecole.drenaet}`].filter(Boolean).join(' · ');
  const dateCopie = () => (D.registreDate ? u.fmtDate(D.registreDate) : 'date inconnue');

  const boutonTheme = () => html`<button type="button" class="btn btn-ic vf-theme" data-action="vf-theme" aria-pressed="${themeSombre() ? 'true' : 'false'}" aria-label="Thème sombre" title="Thème sombre">${ic('moon')}</button>`;

  function vueModele() {
    return html`<header class="vf-entete"><div class="vf-entete-in">
        <div class="vf-marque">${ic('shieldCheck', 'vf-logo')}<div><p class="vf-sur">AKWA SCHOOL · outil de vérification</p><h1>Modèle sans données</h1></div></div>
        ${boutonTheme()}</div></header>
      <main class="vf-corps vf-etroit" id="vf-principal">
        <section class="carte pile" aria-labelledby="vf-modele-titre">
          <h2 id="vf-modele-titre">Ce fichier ne peut encore vérifier aucun document</h2>
          <p class="mb0">C’est le <b>modèle</b> de l’outil de vérification livré avec AKWA SCHOOL. Il ne contient ni les clés publiques de signature d’une école ni de copie de son registre : sans elles, aucun document ne peut être contrôlé.</p>
          <h3>Pour obtenir l’outil de votre école</h3>
          <ol class="vf-etapes">
            <li>Ouvrez AKWA SCHOOL avec le compte du <b>directeur</b>.</li>
            <li>Allez dans <b>Documents › Vérifier</b>, rubrique « Vérification par d’autres personnes » (ou dans <b>Documents › Registre</b>, bouton « Outil de vérification autonome »).</li>
            <li>Cliquez sur <b>Créer l’outil</b> ; choisissez d’inclure ou non les noms des titulaires.</li>
            <li>Remettez le fichier créé (<span class="mono">AKWA_verification_…html</span>) à l’IEPP, à l’établissement ou au parent concerné. Il s’ouvre dans un navigateur, sans connexion.</li>
          </ol>
          ${encadre('Le fichier produit contient les clés publiques de l’école et une copie datée du registre (références et statuts). Il ne contient aucune clé privée ni aucun mot de passe. Refaites-le après chaque annulation importante : il ne connaît que les annulations antérieures à sa création.', '', 'info')}
        </section>
      </main>${pied()}`;
  }

  function vueIllisible() {
    return html`<header class="vf-entete"><div class="vf-entete-in"><div class="vf-marque">${ic('shieldX', 'vf-logo')}<div><p class="vf-sur">AKWA SCHOOL · outil de vérification</p><h1>Fichier inutilisable</h1></div></div>${boutonTheme()}</div></header>
      <main class="vf-corps vf-etroit" id="vf-principal">
        ${encadre(html`<b>Les données de vérification de ce fichier sont illisibles.</b> Il a pu être modifié, abîmé pendant une copie ou produit par une version incompatible. N’utilisez pas ce fichier : demandez un nouvel exemplaire à l’école émettrice.`, 'erreur', 'shieldX')}
      </main>${pied()}`;
  }

  const encadre = (contenu, ton = '', icone = 'info') => html`<div class="encadre ${ton}">${ic(icone)}<div>${contenu}</div></div>`;
  const pied = () => html`<footer class="vf-pied"><p class="mb0">AKWA SCHOOL 2.0.0 · outil de vérification hors ligne. Aucune donnée n’est envoyée : la lecture du QR code et les contrôles se font sur cet appareil.</p></footer>`;

  function bandeauCles() {
    if (!D.cles.length) return html`<span class="vf-info-l">${ic('key')}<span>Aucune clé de signature : vérification par la référence et le registre uniquement.</span></span>`;
    return html`${D.cles.map((c) => html`<span class="vf-info-l">${ic('key')}<span>Clé ${c.id} · <span class="mono vf-empreinte">${c.empreinteCalculee || c.empreinte || '—'}</span> ${tagCle(c)}</span></span>`)}`;
  }
  function tagCle(c) {
    if (c.controle === 'alteree') return html`<span class="tag mauvais">${ic('xCircle')}Empreinte incohérente</span>`;
    if (c.statut === 'compromise') return html`<span class="tag mauvais">${ic('warn')}Compromise</span>`;
    if (c.statut === 'retiree') return html`<span class="tag">Retirée</span>`;
    return html`<span class="tag ok">${ic('checkCircle')}${STATUTS_CLE[c.statut] || c.statut || 'Active'}</span>`;
  }

  function alertesGenerales() {
    const a = [];
    if (!cryptoDispo) a.push(encadre(html`<b>Ce navigateur ne permet pas de contrôler les signatures électroniques</b> (Web Crypto indisponible). Seules la référence et la copie du registre peuvent être vérifiées. Ouvrez cet outil dans Chrome, Edge ou Firefox récent.`, 'avert', 'warn'));
    const alterees = D.cles.filter((c) => c.controle === 'alteree');
    if (alterees.length) a.push(encadre(html`<b>Fichier altéré : ${alterees.map((c) => c.id).join(', ')}.</b> L’empreinte enregistrée ne correspond pas à la clé publique. Cette clé est ignorée : aucune signature n’est validée avec elle. Demandez un nouvel exemplaire de l’outil à l’école.`, 'erreur', 'shieldX'));
    if (D.ignorees) a.push(encadre(`${u.pluriel(D.ignorees, 'élément illisible')} de la copie ${D.ignorees > 1 ? 'ont été ignorés' : 'a été ignoré'} (fichier peut-être abîmé).`, 'avert', 'warn'));
    const age = ageCopie();
    if (age != null && age > COPIE_ANCIENNE) a.push(encadre(html`<b>Copie du registre ancienne (${u.pluriel(age, 'jour')}).</b> Les annulations décidées depuis le ${dateCopie()} ne sont pas connues de cet outil : demandez une version à jour à l’école.`, 'avert', 'cal'));
    return a.length ? html`<div class="pile">${a}</div>` : '';
  }

  function vuePrincipale() {
    const st = sousTitre();
    const c = D.comptes;
    const camOk = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
    return html`<header class="vf-entete"><div class="vf-entete-in">
        <div class="vf-marque">${ic('shieldCheck', 'vf-logo')}<div><p class="vf-sur">Vérification des documents</p><h1>${ecoleNom()}</h1>${st ? html`<p class="vf-sous">${st}</p>` : ''}</div></div>
        ${boutonTheme()}</div>
        <div class="vf-infos" aria-label="Informations sur cet outil">
          <span class="vf-info-l">${ic('cal')}<span>Copie du registre du <b>${dateCopie()}</b> · ${u.pluriel(D.index.size, 'référence')}</span></span>
          <span id="vf-cles" class="vf-cles">${bandeauCles()}</span>
        </div></header>
      <main class="vf-corps" id="vf-principal">
        <div id="vf-alertes">${alertesGenerales()}</div>
        <div class="vf-grille">
          <div class="pile">
            <section class="carte" aria-labelledby="vf-saisie-titre">
              <h2 id="vf-saisie-titre" class="vf-titre">${ic('search')}Référence ou contenu du QR code</h2>
              <form id="vf-form" class="pile" autocomplete="off" novalidate>
                <div class="champ">
                  <label for="vf-texte">Référence du document (AK-XXX-AAAA-NNNNNN-C) ou texte lu par une douchette</label>
                  <input id="vf-texte" name="texte" class="inp vf-saisie" type="text" inputmode="text" spellcheck="false" autocapitalize="characters" maxlength="1000" placeholder="AK-CSC-2026-000012-7" aria-describedby="vf-texte-aide vf-texte-err">
                  <p class="aide mb0" id="vf-texte-aide">La référence est imprimée à côté du QR code. Une douchette (lecteur de codes) peut aussi écrire ici le contenu du QR code.</p>
                  <p class="erreur-champ mb0" id="vf-texte-err" hidden></p>
                </div>
                <div class="ligne"><button type="submit" class="btn btn-pri">${ic('shieldCheck')}Vérifier</button><button type="button" class="btn btn-ghost" data-action="vf-effacer">Effacer</button></div>
              </form>
            </section>
            <section class="carte vf-depot" id="vf-depot" aria-labelledby="vf-camera-titre">
              <h2 id="vf-camera-titre" class="vf-titre">${ic('cam')}Caméra ou photo du QR code</h2>
              <div class="pile">
                <div class="vf-camera" id="vf-camera" hidden><video playsinline muted aria-label="Image de la caméra : placez le QR code dans le cadre"></video><div class="vf-viseur" aria-hidden="true"></div></div>
                <div class="ligne">
                  ${camOk ? html`<button type="button" class="btn" data-action="vf-camera" id="vf-btn-camera" aria-pressed="false">${ic('cam')}<span>Scanner avec la caméra</span></button>` : ''}
                  <label class="btn vf-fichier">${ic('image')}Importer une photo du QR<input type="file" accept="image/*" id="vf-photo" class="sr"></label>
                </div>
                <p class="petit mb0 vf-etat" id="vf-etat-lecture" role="status" aria-live="polite"></p>
                <p class="mut petit mb0">${camOk ? '' : 'Caméra non disponible dans ce navigateur : importez une photo du QR code. '}Le QR code est lu sur cet appareil ; aucune image n’est envoyée. Vous pouvez aussi déposer une image ici ou la coller (Ctrl+V).</p>
              </div>
            </section>
            <section class="carte" id="vf-historique-zone" aria-labelledby="vf-hist-titre" hidden>
              <h2 id="vf-hist-titre" class="vf-titre">${ic('clock')}Vérifications de cette session</h2>
              <ul class="vf-historique" id="vf-historique"></ul>
              <p class="mut petit mb0">Non conservées : la liste s’efface à la fermeture de l’outil.</p>
            </section>
          </div>
          <section class="carte vf-resultat" aria-labelledby="vf-res-titre">
            <h2 id="vf-res-titre" class="vf-titre" tabindex="-1">${ic('shieldCheck')}Résultat</h2>
            <div id="vf-resultat">${attente()}</div>
          </section>
        </div>
        <section class="carte" aria-labelledby="vf-apropos-titre">
          <h2 id="vf-apropos-titre" class="vf-titre">${ic('info')}À propos de cet outil</h2>
          <div class="vf-apropos">
            <div class="pile-sm">
              <h3>Copie du registre</h3>
              <p class="mb0">Copie du <b>${dateCopie()}</b>${D.cree ? html` (créée le ${u.fmtHorodatage(D.cree)})` : ''} : ${u.pluriel(D.index.size, 'référence')}, dont ${c.valide} en vigueur, ${u.pluriel(c.annule, 'annulée')}, ${u.pluriel(c.remplace, 'remplacée')} par un duplicata.</p>
              <p class="mut petit mb0">Elle contient les références, les empreintes et les statuts des documents${[...D.index.values()].some((x) => estTexte(x.n)) ? ', ainsi que le nom des titulaires' : ' (sans le nom des titulaires)'}. Les documents de démonstration n’y figurent pas.</p>
            </div>
            <div class="pile-sm">
              <h3>Clés de signature de l’école</h3>
              ${D.cles.length ? html`<ul class="vf-liste-cles">${D.cles.map(itemCle)}</ul>` : html`<p class="mb0">Aucune : les documents de cette école ne sont pas signés électroniquement.</p>`}
              <p class="mut petit mb0">Pour être sûr que cet outil vient bien de l’école, comparez l’empreinte ci-dessus avec celle qu’elle vous a communiquée (AKWA SCHOOL › Paramètres › Sécurité). Elle figure aussi sous le QR code des documents signés.</p>
            </div>
          </div>
        </section>
      </main>${pied()}`;
  }
  const itemCle = (k) => html`<li><b>${k.id}</b> ${tagCle(k)}<br><span class="mono vf-empreinte">${k.empreinteCalculee || k.empreinte || '—'}</span><br><span class="mut petit">${detailCle(k)}</span></li>`;
  function detailCle(k) {
    const d = (v) => (v ? u.fmtDate(String(v).slice(0, 10)) : '');
    return [k.creeeLe && `Créée le ${d(k.creeeLe)}`, k.retireeLe && `retirée le ${d(k.retireeLe)}`, k.compromiseLe && `déclarée compromise le ${d(k.compromiseLe)}`].filter(Boolean).join(' · ') || 'Dates non précisées';
  }

  const attente = () => html`<div class="vf-vide">${ic('shieldCheck', 'vf-vide-i')}<p class="mb0"><b>En attente d’un document</b></p><p class="mut petit mb0">Le résultat détaille séparément l’intégrité (signature), l’émetteur (clé), l’inscription au registre et le statut (annulé, remplacé, expiré).</p></div>`;

  /* ---------- Résultat ---------- */
  function lignesDetail(R) {
    const x = R.ref ? D.index.get(R.ref) : null;
    const q = R.champs || {};
    const L = [];
    L.push(['Type', libelleType(R.type)]);
    L.push(['Référence', R.ref]);
    const emis = (x && x.e) || q.E;
    if (emis) L.push(['Émis le', u.fmtDate(emis)]);
    const fin = (x && x.x) || q.X;
    if (fin) L.push(['Valable jusqu’au', u.fmtDate(fin)]);
    if (x && estTexte(x.n)) L.push(['Titulaire (registre)', x.n]);
    if (q.N) L.push(['Titulaire (QR code)', q.N]);
    if (q.M) L.push(['Matricule (QR code)', q.M]);
    if (x) L.push([`Statut au registre du ${dateCopie()}`, `${STATUTS_DOC[x.s] || x.s || '—'}${x.s !== 'valide' && x.a ? ' le ' + u.fmtDate(x.a) : ''}`]);
    else L.push([`Registre du ${dateCopie()}`, 'Référence absente de cette copie']);
    if (q.K) {
      const k = D.cles.find((c) => c.id === q.K);
      L.push(['Signature', k ? `Clé ${k.id} · ${k.empreinteCalculee || k.empreinte}` : `Clé ${q.K} (inconnue de cet outil)`]);
    } else if (R.format === 'qr') L.push(['Signature', 'Aucune (QR code non signé)']);
    return L;
  }

  function conseils(R) {
    const C = [];
    if (R.verdict === 'invalide') C.push(encadre(html`<b>Ne vous fiez pas à ce document.</b> Signalez-le à l’école émettrice (${ecoleNom()}) en indiquant sa référence.`, 'erreur', 'shieldX'));
    else if (R.verdict === 'inconnu') C.push(encadre('Ce document n’est pas connu de cette copie du registre et ne porte pas de signature vérifiable ici. Contactez l’école émettrice avant de l’accepter.', 'avert', 'help'));
    else if (R.verdict === 'douteux') C.push(encadre('Certains contrôles n’ont pas pu aboutir (voir les points signalés). Contactez l’école émettrice avant d’accepter ce document.', 'avert', 'warn'));
    const age = ageCopie();
    C.push(encadre(html`<b>Registre daté.</b> Cet outil contient la copie du registre du ${dateCopie()}${age != null && age > 0 ? html` (il y a ${u.pluriel(age, 'jour')})` : ''} : un document annulé ou remplacé après cette date apparaît encore « en vigueur » ici. En cas de doute, demandez à l’école une version à jour de l’outil.`, age != null && age > COPIE_ANCIENNE ? 'avert' : '', 'cal'));
    C.push(encadre('La signature électronique prouve que le contenu du QR code n’a pas été modifié et qu’il a été émis avec la clé de l’école. Elle ne prouve pas la validité administrative du document (exactitude des informations, décision de l’autorité compétente).', '', 'shield'));
    C.push(encadre('Comparez le nom, le matricule, la classe et la photo avec la personne et le document présentés : un QR code authentique peut avoir été recopié sur un autre document.', '', 'user'));
    return C;
  }

  function resultatHtml(R) {
    const reconnu = !!R.ref;
    return html`<div class="pile">
      ${AK.verif.rendu(R)}
      ${reconnu ? html`<div><h3 class="vf-sous-titre">Informations à comparer avec le document présenté</h3>
        <dl class="vf-details">${lignesDetail(R).map(([k, v]) => html`<dt>${k}</dt><dd>${v}</dd>`)}</dl></div>` : ''}
      ${reconnu ? html`<div class="pile-sm">${conseils(R)}</div>` : encadre('Saisissez la référence imprimée à côté du QR code (par exemple AK-CSC-2026-000012-7), ou scannez le QR code du document.', '', 'info')}
      <div class="ligne"><button type="button" class="btn btn-sm" data-action="vf-copier">${ic('copy')}Copier le résultat</button><span class="petit mut" id="vf-copie-etat" role="status" aria-live="polite"></span></div>
    </div>`;
  }

  /** Résumé texte (à coller dans un message ou un rapport d'inspection). */
  function texteResultat(R, quand) {
    const l = [`Vérification d’un document AKWA SCHOOL — ${u.fmtHorodatage(quand)}`, `Outil de vérification : ${ecoleNom()} · copie du registre du ${dateCopie()}`, `Résultat : ${R.titre}`];
    if (R.ref) l.push(R.resume);
    R.points.forEach((p) => l.push(`- ${p.titre} : ${p.detail}`));
    if (R.ref) lignesDetail(R).forEach(([k, v]) => l.push(`  ${k} : ${v}`));
    l.push(`Rappel : un document annulé après le ${dateCopie()} n’est pas connu de cet outil ; la signature ne prouve pas la validité administrative.`);
    return l.join('\n');
  }

  /* ---------- Vérification ---------- */
  let dernier = null; // { R, t, origine }
  const historique = [];
  let enCours = 0;

  function erreurSaisie(message) {
    const inp = $('#vf-texte'), err = $('#vf-texte-err');
    if (!inp || !err) return;
    if (message) u.poser(err, html`${ic('warn')}<span>${message}</span>`);
    err.hidden = !message;
    if (message) inp.setAttribute('aria-invalid', 'true');
    else inp.removeAttribute('aria-invalid');
  }
  const annoncer = (t) => {
    const z = $('#vf-annonce');
    if (z) z.textContent = t;
  };
  const etatLecture = (t, ton = '') => {
    const z = $('#vf-etat-lecture');
    if (!z) return;
    z.textContent = t || '';
    z.className = `petit mb0 vf-etat ${ton}`;
  };

  /** Vérifie un texte (référence ou contenu du QR) ; origine : saisie, caméra, photo. */
  async function verifierTexte(t, origine) {
    const texte = String(t || '').trim();
    if (!texte) {
      erreurSaisie('Saisissez une référence ou collez le contenu du QR code.');
      const inp = $('#vf-texte');
      if (inp) inp.focus();
      return null;
    }
    erreurSaisie('');
    const n = ++enCours;
    await clesControlees;
    let R;
    try {
      R = await AK.verif.verifier(texte, source());
    } catch (e) {
      // seule cause attendue : Web Crypto indisponible pendant le contrôle d'une signature
      R = {
        entree: texte.slice(0, 600), verdict: 'douteux', titre: 'Vérification incomplète : prudence', resume: 'La signature n’a pas pu être contrôlée sur cet appareil.', ref: null,
        points: [{ cle: 'integrite', etat: 'av', titre: 'Intégrité', detail: (e && e.message) || 'Contrôle de la signature impossible dans ce navigateur.' }]
      };
    }
    if (n !== enCours) return R; // une vérification plus récente a été lancée entre-temps
    dernier = { R, t: Date.now(), origine };
    historique.unshift(dernier);
    if (historique.length > HISTORIQUE_MAX) historique.length = HISTORIQUE_MAX;
    afficher(dernier);
    dessinerHistorique();
    return R;
  }

  function afficher(item) {
    dernier = item;
    const z = $('#vf-resultat');
    if (!z) return;
    u.poser(z, resultatHtml(item.R));
    annoncer(`Résultat : ${item.R.titre}. ${item.R.ref ? item.R.resume : ''}`);
  }

  function dessinerHistorique() {
    const zone = $('#vf-historique-zone'), liste = $('#vf-historique');
    if (!zone || !liste) return;
    zone.hidden = !historique.length;
    u.poser(liste, historique.map((h, i) => {
      const [ton, lib] = VERDICTS[h.R.verdict] || VERDICTS.inconnu;
      const heure = new Date(h.t).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      return html`<li><button type="button" class="vf-hist" data-action="vf-revoir" data-i="${i}" aria-current="${h === dernier ? 'true' : 'false'}"><span class="tag ${ton}">${lib}</span><span class="mono vf-hist-ref">${h.R.ref || 'Contenu non reconnu'}</span><span class="mut petit">${h.origine} · ${heure}</span></button></li>`;
    }));
  }

  /* ---------- Caméra : lecture continue, arrêt propre ---------- */
  let camera = null; // { flux, actif, minuteur, n }
  let ouverture = false;
  let detecteur;

  /** Lecture rapide d'une image de la vidéo : lecteur intégré du navigateur s'il existe, sinon décodeur AKWA (une taille par image, en alternance). */
  async function lireImageVideo(video, n) {
    if (detecteur === undefined) {
      detecteur = null;
      try {
        if ('BarcodeDetector' in window) detecteur = new window.BarcodeDetector({ formats: ['qr_code'] });
      } catch (e) { /* lecteur intégré indisponible */ }
    }
    if (detecteur) {
      try {
        const r = await detecteur.detect(video);
        if (r && r[0] && r[0].rawValue) return r[0].rawValue;
      } catch (e) { /* image suivante */ }
    }
    return AK.qrdecode.decoder(AK.qrdecode.imageData(video, n % 2 ? 640 : 960));
  }

  function boutonCamera(actif) {
    const b = $('#vf-btn-camera');
    if (!b) return;
    b.setAttribute('aria-pressed', actif ? 'true' : 'false');
    b.lastElementChild.textContent = actif ? 'Arrêter la caméra' : 'Scanner avec la caméra';
  }

  async function demarrerCamera() {
    const zone = $('#vf-camera'), video = zone && $('video', zone), b = $('#vf-btn-camera');
    if (!video || ouverture || camera) return;
    ouverture = true;
    if (b) b.classList.add('occupe');
    etatLecture('Ouverture de la caméra…');
    let flux;
    try {
      flux = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', width: { ideal: 1280 } }, audio: false });
    } catch (e) {
      const nom = e && e.name;
      etatLecture(nom === 'NotAllowedError' || nom === 'SecurityError' ? 'Accès à la caméra refusé : autorisez-le dans le navigateur, ou importez une photo du QR code.'
        : nom === 'NotFoundError' || nom === 'OverconstrainedError' ? 'Aucune caméra trouvée sur cet appareil : importez une photo du QR code.'
          : nom === 'NotReadableError' ? 'La caméra est utilisée par une autre application : fermez-la, puis réessayez.'
            : 'Caméra indisponible : importez une photo du QR code.', 'erreur');
      return;
    } finally {
      ouverture = false;
      if (b) b.classList.remove('occupe');
    }
    const session = { flux, actif: true, minuteur: 0, n: 0 };
    camera = session;
    zone.hidden = false;
    video.srcObject = flux;
    await video.play().catch(() => {});
    if (camera !== session) return; // arrêtée pendant le démarrage
    boutonCamera(true);
    etatLecture('Caméra active : placez le QR code dans le cadre, bien éclairé et net.');
    const boucle = async () => {
      if (camera !== session || !session.actif) return;
      if (video.readyState >= 2 && video.videoWidth) {
        let t = null;
        try {
          t = await lireImageVideo(video, session.n++);
        } catch (e) { /* image suivante */ }
        if (camera !== session) return;
        if (t) {
          arreterCamera('QR code lu : caméra arrêtée.');
          if (navigator.vibrate) navigator.vibrate(80);
          const inp = $('#vf-texte');
          if (inp) inp.value = t;
          await verifierTexte(t, 'caméra');
          const titre = $('#vf-res-titre');
          if (titre) titre.focus();
          return;
        }
      }
      session.minuteur = setTimeout(boucle, 200);
    };
    boucle();
  }

  function arreterCamera(message) {
    const etaitActive = !!camera;
    if (camera) {
      camera.actif = false;
      clearTimeout(camera.minuteur);
      camera.flux.getTracks().forEach((t) => t.stop());
      camera = null;
    }
    const zone = $('#vf-camera'), video = zone && $('video', zone);
    if (video) {
      video.pause();
      video.srcObject = null;
    }
    if (zone) zone.hidden = true;
    boutonCamera(false);
    if (etaitActive) etatLecture(message || 'Caméra arrêtée.');
  }
  // libère la caméra dès que l'outil n'est plus visible (onglet changé, téléphone verrouillé, fermeture)
  document.addEventListener('visibilitychange', () => {
    if (document.hidden && camera) arreterCamera('Caméra arrêtée : l’outil n’était plus affiché.');
  });
  window.addEventListener('pagehide', () => arreterCamera());

  /* ---------- Photo : import, dépôt ou collage d'une image ---------- */
  async function lirePhoto(fichier) {
    if (!fichier) return;
    if (!/^image\//.test(fichier.type || '')) {
      etatLecture('Ce fichier n’est pas une image : choisissez une photo du QR code (JPEG, PNG…).', 'erreur');
      return;
    }
    if (camera) arreterCamera();
    etatLecture('Lecture de l’image…');
    let t = null;
    try {
      t = await AK.qrdecode.lireFichier(fichier);
    } catch (e) {
      etatLecture('Image illisible : le fichier est peut-être abîmé ou dans un format non pris en charge.', 'erreur');
      return;
    }
    if (!t) {
      etatLecture('Aucun QR code lisible dans cette image : reprenez la photo de plus près, bien éclairée et nette, ou saisissez la référence imprimée à côté du QR code.', 'erreur');
      return;
    }
    etatLecture('QR code lu dans l’image.', 'ok');
    const inp = $('#vf-texte');
    if (inp) inp.value = t;
    await verifierTexte(t, 'photo');
    const titre = $('#vf-res-titre');
    if (titre) titre.focus();
  }

  /* ---------- Copie du résultat ---------- */
  async function copierResultat() {
    if (!dernier) return;
    const texte = texteResultat(dernier.R, dernier.t);
    let ok = false;
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        await navigator.clipboard.writeText(texte);
        ok = true;
      }
    } catch (e) { /* méthode de secours ci-dessous */ }
    if (!ok) {
      const z = document.createElement('textarea');
      z.value = texte;
      z.setAttribute('readonly', '');
      z.className = 'sr';
      document.body.append(z);
      z.select();
      try {
        ok = document.execCommand('copy');
      } catch (e) {
        ok = false;
      }
      z.remove();
    }
    const etat = $('#vf-copie-etat');
    if (etat) etat.textContent = ok ? 'Résultat copié : collez-le dans un message ou un rapport.' : 'Copie impossible dans ce navigateur : sélectionnez le texte du résultat à la main.';
  }

  /* ---------- Thème ---------- */
  function themeSombre() {
    const t = document.documentElement.dataset.theme;
    if (t) return t === 'dark';
    return !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
  }
  function basculerTheme() {
    const sombre = !themeSombre();
    document.documentElement.dataset.theme = sombre ? 'dark' : 'light';
    u.$$('[data-action="vf-theme"]').forEach((b) => b.setAttribute('aria-pressed', sombre ? 'true' : 'false'));
  }

  /* ---------- Événements (délégation) ---------- */
  const ACTIONS = {
    'vf-camera': () => (camera ? arreterCamera('Caméra arrêtée.') : demarrerCamera()),
    'vf-effacer'() {
      const inp = $('#vf-texte');
      if (!inp) return;
      inp.value = '';
      erreurSaisie('');
      inp.focus();
    },
    'vf-copier': () => copierResultat(),
    'vf-revoir'(el) {
      const h = historique[Number(el.dataset.i)];
      if (!h) return;
      afficher(h);
      dessinerHistorique();
      const inp = $('#vf-texte');
      if (inp) inp.value = h.R.entree || '';
    },
    'vf-theme': () => basculerTheme()
  };
  const signaler = (e) => etatLecture((e && e.message) || 'Opération impossible.', 'erreur');

  function brancher() {
    document.addEventListener('click', (e) => {
      const el = e.target.closest('[data-action]');
      if (!el || !ACTIONS[el.dataset.action]) return;
      e.preventDefault();
      Promise.resolve().then(() => ACTIONS[el.dataset.action](el)).catch(signaler);
    });
    const form = $('#vf-form');
    if (form) {
      form.addEventListener('submit', (e) => {
        e.preventDefault();
        const inp = $('#vf-texte');
        verifierTexte(inp.value, 'saisie').then((R) => {
          if (R && inp === document.activeElement) inp.select(); // douchette : le scan suivant remplace le texte
        }).catch(signaler);
      });
      $('#vf-texte').addEventListener('input', () => erreurSaisie(''));
    }
    const photo = $('#vf-photo');
    if (photo) photo.addEventListener('change', () => {
      const f = photo.files && photo.files[0];
      photo.value = ''; // permet de choisir à nouveau la même image
      lirePhoto(f).catch(signaler);
    });
    // dépôt d'une image n'importe où sur la page (sans quitter l'outil)
    const depot = $('#vf-depot');
    window.addEventListener('dragover', (e) => {
      if (!e.dataTransfer || ![...e.dataTransfer.types].includes('Files')) return;
      e.preventDefault();
      if (depot) depot.classList.add('survol');
    });
    window.addEventListener('dragleave', (e) => {
      if (depot && !e.relatedTarget) depot.classList.remove('survol');
    });
    window.addEventListener('drop', (e) => {
      if (!e.dataTransfer || !e.dataTransfer.files || !e.dataTransfer.files.length) return;
      e.preventDefault();
      if (depot) depot.classList.remove('survol');
      lirePhoto(e.dataTransfer.files[0]).catch(signaler);
    });
    // collage d'une capture d'écran (le collage de texte dans la saisie reste normal)
    document.addEventListener('paste', (e) => {
      const items = e.clipboardData ? [...e.clipboardData.items] : [];
      const img = items.find((it) => it.kind === 'file' && /^image\//.test(it.type));
      if (!img) return;
      e.preventDefault();
      lirePhoto(img.getAsFile()).catch(signaler);
    });
  }

  /* ---------- Démarrage ---------- */
  function demarrer() {
    const racine = document.getElementById('vf-racine');
    if (!racine) return;
    if (D.etat === 'modele') {
      u.poser(racine, vueModele());
      document.title = 'Outil de vérification (modèle sans données) · AKWA SCHOOL';
    } else if (D.etat !== 'ok') {
      u.poser(racine, vueIllisible());
      document.title = 'Outil de vérification inutilisable · AKWA SCHOOL';
    } else {
      u.poser(racine, vuePrincipale());
      document.title = `Vérification des documents · ${ecoleNom()}`;
      clesControlees.then(() => {
        const zc = $('#vf-cles'), za = $('#vf-alertes');
        if (zc) u.poser(zc, bandeauCles());
        if (za) u.poser(za, alertesGenerales());
        const apropos = $('.vf-liste-cles');
        if (apropos) u.poser(apropos, D.cles.map(itemCle));
        document.documentElement.dataset.pret = '1';
      });
    }
    brancher();
    if (D.etat !== 'ok') document.documentElement.dataset.pret = '1';
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', demarrer);
  else demarrer();

  /* Accès pour les tests automatisés et le diagnostic (lecture seule). */
  AK.verificateur = { etat: () => D.etat, verifierTexte, arreterCamera, cameraActive: () => !!camera };
})(window.AK);

//# sourceURL=akwa/verifier/verifier.js
</script>
</body>
</html>
