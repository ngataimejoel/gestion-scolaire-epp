     2. Élèves & personnel   → Élèves · Classes · Personnel

     4. Absences             → Appel du jour · Autorisations

/* Mise en page : barre latérale à gauche, contenu en grille de panneaux, fiche détaillée qui glisse à droite */
:root{
 --acc-l:#0E6646;--acc-d:#43B98C;          /* vert AKWA (clair / sombre) */
 --bg:#F2F4EF;--surface:#FFFFFF;--sunk:#E9EDE6;--ink:#14201A;--mut:#5A6961;--line:#DCE3DA;
 --acc:var(--acc-l);--on-acc:#FFFFFF;
 --org:#E8892F;--org-ink:#9C520D;           /* orange AKWA */
 --cg:#08704B;--cf:#CC6E16;                 /* graphiques : garçons / filles */
 --ok:#11804F;--warn:#9F5C06;--bad:#BF3A33;
 --r:14px;
 --font:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
 --disp:"Segoe UI Variable Display","Segoe UI Semibold","Segoe UI",system-ui,-apple-system,sans-serif;
 color-scheme:light}
[data-accent=blue]{--acc-l:#2453B8;--acc-d:#7FA4F0}
[data-accent=violet]{--acc-l:#6A3BC0;--acc-d:#B193EC}
[data-accent=orange]{--acc-l:#B35A0E;--acc-d:#F0A050}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
 --bg:#0C110E;--surface:#141B17;--sunk:#1B241F;--ink:#E4ECE7;--mut:#91A098;--line:#27322C;
 --acc:var(--acc-d);--on-acc:#07130D;--org:#F0A050;--org-ink:#F0A863;--cg:#2FA87C;--cf:#C47228;
 --ok:#46C08A;--warn:#E3A44A;--bad:#EC6A60;color-scheme:dark}}
:root[data-theme=dark]{
 --bg:#0C110E;--surface:#141B17;--sunk:#1B241F;--ink:#E4ECE7;--mut:#91A098;--line:#27322C;
 --acc:var(--acc-d);--on-acc:#07130D;--org:#F0A050;--org-ink:#F0A863;--cg:#2FA87C;--cf:#C47228;
 --ok:#46C08A;--warn:#E3A44A;--bad:#EC6A60;color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font:14px/1.5 var(--font)}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.i{width:18px;height:18px;flex:none}
h1,h2,h3,h4{font-family:var(--disp);text-wrap:balance}
.num,td,.kv{font-variant-numeric:tabular-nums}

/* ---------- Ossature ---------- */
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
.side{background:var(--surface);border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:2px;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px 18px}
.brand img{width:40px;height:40px;border-radius:11px;object-fit:cover}
.brand b{display:block;font-family:var(--disp);letter-spacing:.8px;font-size:15px;line-height:1.1}.brand small{color:var(--mut);font-size:11.5px}
.ng{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:10px;color:var(--mut);font-weight:600}
.ng:hover{background:var(--sunk);color:var(--ink)}
.ng.on{background:color-mix(in srgb,var(--acc) 12%,var(--surface));color:var(--acc)}
.ns{display:grid;margin:2px 0 8px 29px;border-left:1px solid var(--line)}
.ns a{padding:5px 12px;font-size:13px;color:var(--mut);border-left:2px solid transparent;margin-left:-1px}
.ns a:hover{color:var(--ink)}.ns a.on{color:var(--ink);font-weight:650;border-left-color:var(--org)}
.schoolcard{margin-top:auto;padding:12px;border-radius:12px;background:var(--sunk);font-size:12px;color:var(--mut);display:grid;gap:4px}
.schoolcard b{color:var(--ink);font-size:13px}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:8;display:flex;align-items:center;gap:10px;min-height:58px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding-block:8px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.tlogo{display:none}.tlogo img{width:32px;height:32px;border-radius:9px}
.crumb{display:flex;align-items:center;gap:6px;color:var(--mut);font-size:13px;white-space:nowrap;overflow:hidden;min-width:0}
.crumb b{color:var(--ink)}.crumb a:hover{color:var(--acc)}
.sp{flex:1}
.srch{position:relative;width:min(340px,40vw)}
.srch>.i{position:absolute;left:11px;top:10px;color:var(--mut);width:16px;height:16px}
.srch input{width:100%;padding:8px 10px 8px 34px;border-radius:10px;background:var(--surface)}
.srch kbd{position:absolute;right:8px;top:8px;font:11px var(--font);color:var(--mut);border:1px solid var(--line);border-radius:5px;padding:1px 5px;background:var(--sunk)}
.sres{position:absolute;top:calc(100% + 6px);left:0;right:0;min-width:300px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px #0003;padding:6px;z-index:20;max-height:70vh;overflow:auto}
.sres button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;padding:7px 8px;border-radius:8px}
.sres button:hover,.sres button.hl{background:var(--sunk)}
.sres small{display:block;color:var(--mut);font-size:12px}.sres .k{margin-left:auto;font-size:11px;color:var(--mut)}
.sres .none{padding:10px;color:var(--mut)}
.view{width:100%;max-width:1320px;margin:0 auto;padding-block:22px 40px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.bnav{display:none}

/* ---------- Éléments communs ---------- */
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.ph h2{margin:0;font-size:22px;letter-spacing:-.3px}.ph p{margin:2px 0 0;color:var(--mut);max-width:70ch}
.seg{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto}
.seg a{padding:9px 14px;font-weight:600;color:var(--mut);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.seg a:hover{color:var(--ink)}.seg a.on{color:var(--acc);border-bottom-color:var(--acc)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.card>h3{margin:0;font-size:15px}.card .hd{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px}.card .hd h3{margin:0;font-size:15px}
.sub{color:var(--mut);font-size:12.5px}
.grid{display:grid;gap:14px}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.gauto{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.s2{grid-column:span 2}.mb{margin-bottom:14px}
.btn{border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:10px;font-weight:600;display:inline-flex;gap:7px;align-items:center;white-space:nowrap}
.btn:hover{border-color:var(--acc);color:var(--acc)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--on-acc)}.btn.pri:hover{filter:brightness(1.08);color:var(--on-acc)}
.btn.dng{color:var(--bad)}.btn.dng:hover{border-color:var(--bad)}
.btn.sm{padding:4px 9px;font-size:12.5px;border-radius:8px}.btn .i{width:16px;height:16px}
.btn[disabled]{opacity:.5;pointer-events:none}
.ib{border:0;background:transparent;padding:7px;border-radius:9px;color:var(--mut);display:inline-grid;place-items:center}.ib:hover{background:var(--sunk);color:var(--acc)}.ib.dng:hover{color:var(--bad)}
.lk{border:0;background:none;padding:0;font-weight:650;color:var(--ink);text-align:left}.lk:hover{color:var(--acc);text-decoration:underline;text-underline-offset:3px}
input,select,textarea{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:7px 10px;outline:none;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 20%,transparent)}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.pills{display:flex;gap:4px;flex-wrap:wrap;background:var(--sunk);padding:3px;border-radius:11px}
.pill{border:0;background:transparent;padding:5px 12px;border-radius:8px;font-weight:650;color:var(--mut);display:inline-flex;align-items:center;gap:5px}
.pill:hover{color:var(--ink)}.pill.on{background:var(--surface);color:var(--acc);box-shadow:0 1px 3px #0002}
.pill .d{width:6px;height:6px;border-radius:50%;background:var(--ok)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;background:var(--sunk);font-size:12.5px;font-weight:600;color:var(--mut)}
.tag{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border-radius:99px;font-size:11.5px;font-weight:700;background:color-mix(in srgb,var(--mut) 14%,var(--surface));color:var(--mut);white-space:nowrap}
.tag.ok{background:color-mix(in srgb,var(--ok) 14%,var(--surface));color:var(--ok)}
.tag.warn{background:color-mix(in srgb,var(--warn) 15%,var(--surface));color:var(--warn)}
.tag.bad{background:color-mix(in srgb,var(--bad) 14%,var(--surface));color:var(--bad)}
.tag.acc{background:color-mix(in srgb,var(--acc) 14%,var(--surface));color:var(--acc)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%}
.tw table{min-width:600px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--mut);font-weight:700;background:var(--sunk)}
tbody tr:last-child td{border-bottom:0}tbody tr:hover{background:color-mix(in srgb,var(--acc) 4%,var(--surface))}
tfoot td{background:var(--sunk);font-weight:700;border-bottom:0;border-top:1px solid var(--line)}
td.r,th.r{text-align:right}td.c,th.c{text-align:center}
.who{display:flex;align-items:center;gap:10px}
.av{width:30px;height:30px;border-radius:9px;background:color-mix(in srgb,var(--acc) 13%,var(--surface));color:var(--acc);display:inline-grid;place-items:center;font-size:11px;font-weight:800;flex:none;object-fit:cover}
.av.lg{width:64px;height:64px;border-radius:16px;font-size:20px}.av.xl{width:76px;height:76px;border-radius:18px;font-size:24px}
.empty{padding:28px;text-align:center;color:var(--mut)}
.note{background:color-mix(in srgb,var(--acc) 8%,var(--surface));border:1px solid color-mix(in srgb,var(--acc) 20%,var(--line));border-radius:10px;padding:9px 12px;font-size:13px;display:flex;gap:9px;align-items:flex-start}
.note .i{color:var(--acc);margin-top:1px}
.note.warn{background:color-mix(in srgb,var(--warn) 9%,var(--surface));border-color:color-mix(in srgb,var(--warn) 25%,var(--line))}.note.warn .i{color:var(--warn)}

/* ---------- Tableau de bord ---------- */
.hero{position:relative;overflow:hidden;border-radius:18px;padding:22px 24px;background:var(--acc-l);color:#fff;display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between;margin-bottom:14px}
.hero::after{content:"";position:absolute;right:-60px;top:-80px;width:280px;height:280px;border-radius:50%;border:38px solid var(--org);opacity:.22;pointer-events:none}
.hero h2{margin:0;font-size:26px;letter-spacing:-.4px}.hero p{margin:4px 0 10px;opacity:.85}
.hero .hc{display:flex;gap:6px;flex-wrap:wrap}
.hero .hc span{background:#ffffff22;border:1px solid #ffffff30;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600}
.hero .hc span.o{background:var(--org);border-color:var(--org);color:#1d1205}
.qa{display:flex;gap:8px;flex-wrap:wrap;position:relative;z-index:1}
.qa button{border:1px solid #ffffff40;background:#ffffff1a;color:#fff;padding:8px 13px;border-radius:11px;font-weight:650;display:inline-flex;gap:7px;align-items:center}
.qa button:hover{background:#ffffff30}
.qa button.o{background:#fff;color:#0b3d2a;border-color:#fff}
.kpi{position:relative;display:flex;flex-direction:column;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px 14px;min-width:0;transition:border-color .15s,transform .15s}
.kpi:hover{border-color:var(--acc);transform:translateY(-1px)}
.kl{display:flex;align-items:center;gap:7px;color:var(--mut);font-size:12.5px;font-weight:650}.kl .i{width:16px;height:16px;color:var(--acc)}
.kv{font-family:var(--disp);font-size:30px;font-weight:750;letter-spacing:-1px;line-height:1.15;margin-top:4px}
.kv small{font-size:14px;color:var(--mut);font-weight:600;letter-spacing:0;margin-left:3px}
.ks{font-size:12.5px;color:var(--mut)}
.kgo{position:absolute;right:12px;top:12px;color:var(--mut);opacity:0;transition:.15s}.kpi:hover .kgo{opacity:1;color:var(--acc)}
.split{display:flex;gap:2px;height:6px;margin-top:9px}.split i{display:block;height:100%;border-radius:3px}
.dots{display:flex;gap:4px;margin-top:9px}.dots i{flex:1;height:6px;border-radius:3px;background:var(--sunk)}.dots i.on{background:var(--acc)}
.g{background:var(--cg)}.f{background:var(--cf)}
.leg{display:flex;gap:14px;flex-wrap:wrap;color:var(--mut);font-size:12px}.leg span{display:inline-flex;align-items:center;gap:6px}.leg i{width:10px;height:10px;border-radius:3px;display:inline-block}
.hbars{display:grid;gap:6px}
.hrow{display:grid;grid-template-columns:42px minmax(0,1fr) 64px;gap:10px;align-items:center;border:0;background:none;padding:5px 6px;border-radius:8px;text-align:left;width:100%}
.hrow:hover{background:var(--sunk)}
.hbars.w .hrow{grid-template-columns:38px minmax(0,1fr) 112px}.hbars.lab .hrow{grid-template-columns:118px minmax(0,1fr) 46px}
.hrow .hl{font-weight:700;font-size:13px}.hrow .hv{text-align:right;font-size:12.5px;color:var(--mut);font-variant-numeric:tabular-nums}.hrow .hv b{color:var(--ink)}
.trk{position:relative;height:14px;display:flex;gap:2px}
.trk i{display:block;height:100%;border-radius:2px}.trk i:first-child{border-radius:4px 2px 2px 4px}.trk i:last-child{border-radius:2px 4px 4px 2px}.trk i:only-child{border-radius:4px}
.trk.bg{background:var(--sunk);border-radius:4px}
.trk .ref{position:absolute;top:-3px;bottom:-3px;width:0;border-left:1.5px dashed var(--mut)}
.trk .acc{background:var(--acc)}
.cols{display:flex;align-items:flex-end;gap:6px;height:150px;padding-top:6px;border-bottom:1px solid var(--line)}
.cols button{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:stretch;gap:2px;height:100%;border:0;background:none;padding:0;border-radius:6px 6px 0 0;position:relative}
.cols button:hover{background:var(--sunk)}
.cols i{display:block;border-radius:2px;min-height:0}.cols i:last-of-type{border-radius:4px 4px 2px 2px}
.cols b{font-size:11px;text-align:center;color:var(--ink);font-variant-numeric:tabular-nums}
.clab{display:flex;gap:6px;margin-top:6px}.clab span{flex:1;text-align:center;font-size:11px;color:var(--mut);white-space:nowrap;overflow:hidden}
.todo{display:grid}
.todo button{display:flex;align-items:center;gap:11px;border:0;background:none;padding:10px 6px;border-bottom:1px solid var(--line);text-align:left;width:100%;border-radius:0}
.todo button:last-child{border-bottom:0}.todo button:hover{background:var(--sunk)}
.todo .sv{width:8px;height:28px;border-radius:4px;flex:none;background:var(--ok)}.todo .sv.warn{background:var(--warn)}.todo .sv.bad{background:var(--bad)}
.todo div{flex:1;min-width:0}.todo b{display:block;font-size:13.5px}.todo small{color:var(--mut);font-size:12.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.todo .i{color:var(--mut)}
.lst{display:grid}
.lst>*{display:flex;align-items:center;gap:10px;padding:8px 4px;border-bottom:1px solid var(--line);font-size:13px;border-left:0;border-right:0;border-top:0;background:none;text-align:left;width:100%}
.lst>*:last-child{border-bottom:0}.lst button:hover{background:var(--sunk)}
.lst .m{margin-left:auto;color:var(--mut);font-size:12px;white-space:nowrap}
.lst .dt{width:44px;flex:none;text-align:center;border-radius:9px;background:var(--sunk);padding:3px 0;font-size:11px;color:var(--mut);line-height:1.2}.lst .dt b{display:block;font-size:16px;color:var(--ink)}
.donut{width:128px;height:128px;border-radius:50%;display:grid;place-items:center;flex:none}.donut span{width:84px;height:84px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-weight:800;font-size:20px;text-align:center;line-height:1.1}.donut small{display:block;font-size:11px;color:var(--mut);font-weight:600}

/* ---------- Saisie des notes ---------- */
.grade{width:66px;text-align:center;padding:5px 6px}
.grade.bad{border-color:var(--bad)}
.grade.okf{animation:okf .7s}
@keyframes okf{0%{background:color-mix(in srgb,var(--ok) 30%,var(--surface))}100%{background:var(--surface)}}
@media (prefers-reduced-motion:reduce){.grade.okf{animation:none}.kpi,.kgo{transition:none}}
.pa{border:1px solid var(--line);border-radius:99px;padding:3px 12px;font-weight:700;font-size:12px;min-width:96px;background:color-mix(in srgb,var(--ok) 13%,var(--surface));color:var(--ok)}
.pa.A{background:color-mix(in srgb,var(--bad) 13%,var(--surface));color:var(--bad)}
.pa.J{background:color-mix(in srgb,var(--warn) 14%,var(--surface));color:var(--warn)}

/* ---------- Fiche (tiroir à droite) ---------- */
.scrim{position:fixed;inset:0;background:#0007;z-index:30}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--surface);border-left:1px solid var(--line);z-index:31;overflow:auto;box-shadow:-12px 0 40px #0003;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.dh{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:1}
.dh span{font-size:12px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.6px}
.dbody{padding:18px;display:grid;gap:18px}
.dhero{display:flex;gap:14px;align-items:center}.dhero h2{margin:0;font-size:20px}
.dact{display:flex;gap:6px;flex-wrap:wrap}
.dbody h4{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--mut)}
.kvs{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0;font-size:13px}.kvs dt{color:var(--mut)}.kvs dd{margin:0;font-weight:600}
.mini{width:100%;font-size:13px}.mini th,.mini td{padding:6px 8px}

/* ---------- Fenêtres, bulles, notifications ---------- */
dialog{border:1px solid var(--line);border-radius:16px;padding:0;background:var(--surface);color:var(--ink);width:min(580px,94vw);max-height:92vh}
dialog::backdrop{background:#0008}
dialog.wide{width:min(820px,96vw)}
.mf{display:flex;flex-direction:column;max-height:92vh}
.mf header,.mf footer{display:flex;align-items:center;gap:8px;padding:14px 18px}.mf header{border-bottom:1px solid var(--line)}.mf header h3{margin:0;flex:1;font-size:16px}
.mf footer{border-top:1px solid var(--line);justify-content:flex-end}
.mb2{padding:18px;overflow:auto}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:12px}.fg .full{grid-column:1/-1}
.fd{display:grid;gap:4px;min-width:0}.fd label{font-size:12px;font-weight:700}.fd input,.fd select,.fd textarea{width:100%}
.chk{display:flex;align-items:center;gap:8px;font-weight:600}.chk input{width:auto}
.err{color:var(--bad);font-size:13px;font-weight:600}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translate(-50%,16px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;opacity:0;pointer-events:none;transition:.2s;z-index:60;font-weight:600;max-width:90vw}
.toast.on{opacity:1;transform:translate(-50%,0)}
.tip{position:fixed;z-index:70;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;font-weight:600;padding:6px 9px;border-radius:7px;max-width:260px;box-shadow:0 6px 18px #0003}
.sw{display:flex;gap:8px}.sw button{width:30px;height:30px;border-radius:50%;border:3px solid var(--surface);box-shadow:0 0 0 1px var(--line)}.sw button.on{box-shadow:0 0 0 2px var(--ink)}
.logo-box{display:flex;align-items:center;gap:12px;padding:10px;border:1px dashed var(--line);border-radius:12px}
.logo-box img,.logo-box .ph0{width:56px;height:56px;border-radius:10px;object-fit:contain;background:var(--sunk);display:grid;place-items:center;color:var(--mut);font-size:11px}

/* ---------- Document imprimable (bulletin, demande…) : sobre, lisible en noir et blanc ---------- */
#printArea{display:none}
.paper{background:#fff;color:#111;border:1px solid #d9d9d9;border-radius:8px;padding:22px;font-size:12.5px}
.paper table{min-width:0;width:100%}.paper th,.paper td{border:1px solid #888;padding:5px 8px;color:#111;background:#fff;white-space:normal}
.paper th{font-size:11px;letter-spacing:.3px}.paper tbody tr:last-child td{border-bottom:1px solid #888}.paper tbody tr:hover{background:none}
.ent{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;font-family:"Times New Roman",Times,serif;font-size:10.5px;line-height:1.3;color:#111;border-bottom:1.5px solid #111;padding-bottom:6px;margin-bottom:10px}
.ent .lf{display:flex;flex-direction:column;flex:0 1 58%;text-transform:uppercase}.ent .lf .ent-sep{margin-left:18%}
.ent .rt{display:flex;flex-direction:column;align-items:center;text-align:center;flex:0 0 auto;min-width:32%}.ent .rt .rep{font-size:13px}
.ent-sep{display:block;letter-spacing:-.5px;line-height:1.1;color:#333;font-weight:400}
.ent .arm{width:66px;height:auto;margin:2px 0}.ent .lgos{display:flex;gap:10px;margin:4px 0 0 18%}.ent .lgo{width:54px;height:54px;object-fit:contain}
.ent-x{text-align:center;font-size:11px;margin:-4px 0 8px}
.dtitle{text-align:center;margin:8px 0 12px}.dtitle h2{margin:0;font-size:16px;letter-spacing:.5px}
.dmeta{display:grid;grid-template-columns:1fr 1fr;gap:4px 18px;margin:8px 0 12px}
.dfoot{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-top:10px;border:1px solid #888;padding:8px}
.sig{display:flex;justify-content:space-between;margin-top:14px;font-size:12px;gap:10px}.sig span{flex:1;text-align:center}
.box{display:inline-block;width:12px;height:12px;border:1px solid #111;vertical-align:-2px;margin-right:4px}

/* ---------- Petits écrans ---------- */
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}.g3>.s3{grid-column:1/-1}}
@media (max-width:900px){
 .app{grid-template-columns:minmax(0,1fr)}.side{display:none}
 .tlogo{display:block}
 .top{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
 .crumb{display:none}.srch{width:auto;flex:1}.srch kbd{display:none}
 .view{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:96px}
 .bnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:9;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
 .bnav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px;font-size:11px;font-weight:600;color:var(--mut)}
 .bnav a.on{color:var(--acc)}
 .g2,.s2{grid-template-columns:minmax(0,1fr);grid-column:auto}.fg{grid-template-columns:1fr}
}
@media (max-width:560px){.g4,.g3{grid-template-columns:minmax(0,1fr)}.hero{padding:18px}.hero h2{font-size:22px}.kv{font-size:26px}.dmeta{grid-template-columns:1fr}}
@media print{
 html,body{background:#fff!important}body{color:#000}
 .app,.bnav,.toast,dialog,.drawer,.scrim,.tip{display:none!important}
 #printArea{display:block}
 #printArea .paper{border:0;padding:0;border-radius:0}
 .pb{page-break-after:always}.pb:last-child{page-break-after:auto}
}
.paperwrap{overflow-x:auto}.paper.land{min-width:900px}
.paper h3{font-size:13px;margin:14px 0 6px}
.paper .small th,.paper .small td{padding:3px 5px;font-size:11px;text-align:center}
.zone{margin:8px 0}.zone b{display:block;font-size:12px;margin-bottom:4px}
.zone textarea{width:100%;border:1px dashed #999;background:#fafaf7;color:#111;border-radius:4px;padding:6px;font:inherit;resize:vertical}
.zone .zp{white-space:pre-wrap;border-bottom:1px dotted #777;min-height:1.4em}
.note-small{font-size:11px;color:#333}
.ressig{display:grid;grid-template-columns:minmax(260px,1fr) 1.3fr 1fr;gap:18px;align-items:start;margin-top:10px}.ressig .sig{margin-top:0}.ressig .sig span:first-child{display:none}.paper .recap td,.paper .recap th{padding:3px 6px}
.obsig{display:grid;grid-template-columns:3fr 2fr;gap:24px;align-items:start}.obsig .sig{margin-top:0;line-height:1.2}.obsig .sig span:first-child{display:none}
.paper .top3 th:nth-child(odd):not([rowspan]),.paper .top3 tbody td:nth-child(even){width:24%}
.acte{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px;border-radius:10px;background:var(--sunk)}
.acte[hidden]{display:none}
@media (max-width:560px){.acte{grid-template-columns:1fr}}
/* Fiche scolaire (modèle officiel) */
.fs{font-family:"Times New Roman",Times,serif;font-size:12.5px;color:#111;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.fs p{margin:4px 0;font-weight:700;display:flex;flex-wrap:wrap;align-items:baseline;gap:0 4px}
.fs .fl{flex:1;min-width:60px;border-bottom:1px dotted #333;font-weight:400;padding:0 4px;margin-right:8px}
.fs-title{width:fit-content;margin:4px auto 10px;padding:4px 26px;border:2.5px solid #111;box-shadow:5px 5px 0 #999;font:700 26px/1.2 Arial,sans-serif;text-decoration:underline}
.fs-top{display:grid;grid-template-columns:33mm 1fr auto;gap:14px;align-items:start;margin-bottom:4px}
.fs-photo{width:33mm;height:40.5mm;border:1.5px solid #111;display:grid;place-items:center;text-align:center;color:#777;overflow:hidden}.fs-photo img{width:100%;height:100%;object-fit:cover}
.fs-mid p{font-weight:400;display:block}.fs-mid b{margin-right:4px}
.fs .cb{display:inline-block;width:10px;height:10px;border:1.2px solid #111;vertical-align:-1px;margin-left:4px;position:relative}.fs .cb.on::after{content:"";position:absolute;inset:1px;background:#111}
.fs-qrcap{font-size:11px;color:#333;margin-top:16px!important}.fs-qrcap span{color:#666}
.fs-right{display:grid;gap:6px;justify-items:end}
.fs-no{background:#bbb;border:1.5px solid #555;padding:8px 12px;font-weight:700;font-size:12px}
.fs-mat{display:grid;gap:3px;justify-items:end;font-size:12px}.fs-mat span{border:2px solid #111;padding:5px 12px;min-width:120px;text-align:center;font-weight:700}
.fs-par{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:6px 0}.fs-par h4{font-family:inherit;text-align:center;text-decoration:underline;margin:0 0 4px;font-size:13px}.fs-par p{margin:3px 0;font-size:12px}
.paper .fs-tab th,.paper .fs-tab td{border:1.5px solid #111;text-align:center;padding:4px;font-size:11.5px}.paper .fs-tab thead th{background:#bbb;color:#111}.fs-tab td:first-child{text-align:left}
.fs-fait{justify-content:flex-end;margin-top:8px!important}.fs-fait .fl{flex:0 1 auto}
.fs-sig{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:6px}.fs-sig div{border:1.5px solid #111;border-radius:8px;height:72px;text-align:center;font-weight:700;padding:6px;font-size:12px}.fs-sig span{font-weight:400}
.qrline{display:flex;gap:12px;align-items:center}.qrline .qr{flex:0 0 auto;border-radius:6px}
/* Rapports : portrait, zones côte à côte, générateur */
.paper.port{max-width:820px}
.zg2{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}.zg3{display:grid;grid-template-columns:repeat(3,1fr);gap:0 14px}
.gen{display:grid;grid-template-columns:270px minmax(0,1fr);gap:16px;align-items:start}
.glist button{width:100%;text-align:left}.glist button.on{background:color-mix(in srgb,var(--acc) 10%,var(--surface));border-radius:10px}
.gbl{display:grid;gap:8px}.gbi{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.gbi input{flex:1;min-width:160px}.gbi .sp{flex:1}.gnum{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--sunk);font-size:12px;font-weight:700}.gtype{font-weight:600;font-size:13px;min-width:150px}
.ib[disabled]{opacity:.35;pointer-events:none}
@media (max-width:900px){.gen{grid-template-columns:minmax(0,1fr)}.zg3{grid-template-columns:1fr}}

/* ---------- v7 : animations de survol et de sélection ---------- */
.btn,.ib,.lk,.ng,.ns a,.seg a,.pill,.kpi,.card,tbody tr,tbody td,.hrow,.todo button,.lst button,.cols button,.sres button,.qa button,.tag,input,select,textarea{transition:background-color .16s ease,border-color .16s ease,color .16s ease,box-shadow .18s ease,transform .16s ease}
.btn:hover{box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 16%,transparent);transform:translateY(-1px)}
.btn:active,.ib:active,.kpi:active{transform:translateY(0) scale(.97)}
.ib:hover{transform:scale(1.08)}
.ng:hover{transform:translateX(3px)}
.ng.on{box-shadow:inset 3px 0 0 var(--acc)}
.ns a:hover{border-left-color:color-mix(in srgb,var(--org) 50%,transparent);padding-left:15px}
.ns a{transition:padding .16s ease,border-color .16s ease,color .16s ease}
.kpi:hover{box-shadow:0 6px 18px color-mix(in srgb,var(--acc) 18%,transparent)}
.hrow:hover,.todo button:hover,.lst button:hover,.cols button:hover,.sres button:hover{box-shadow:inset 3px 0 0 var(--acc)}
tbody tr:hover td:first-child{box-shadow:inset 3px 0 0 var(--acc)}
tbody tr.sel,tbody tr:focus-within{background:color-mix(in srgb,var(--org) 9%,var(--surface))}
tbody tr.sel td:first-child,tbody tr:focus-within td:first-child{box-shadow:inset 3px 0 0 var(--org)}
::selection{background:color-mix(in srgb,var(--org) 35%,transparent)}
.enter{animation:enter .22s ease both}
@keyframes enter{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.drawer.slide{animation:slidein .2s ease both}
@keyframes slidein{from{transform:translateX(24px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}
/* ---------- v7 : matricules en tête du dossier élève ---------- */
.matbar{display:flex;flex-wrap:wrap;gap:8px 18px;padding:10px 12px;border-radius:10px;background:color-mix(in srgb,var(--acc) 8%,var(--surface));border:1px solid color-mix(in srgb,var(--acc) 25%,var(--line));font-size:13px}
input[name=matNat]{text-transform:uppercase}input[name=matNat]::placeholder{text-transform:none}
.matbar b{font-family:var(--mono,monospace);font-size:14px;letter-spacing:.4px}
/* ---------- v7 : documents plus aérés, noms en gras à gauche, signature et cachet agrandis ---------- */
.paper th,.paper td{padding:6px 9px;line-height:1.35}
.paper th,.paper td{vertical-align:middle}
.paper td.nm{font-weight:700;text-align:left;font-size:1.08em;white-space:normal}
.paper table.small td.nm{font-size:1.1em}
.paper h3{margin-top:16px}
.sig{margin-top:22px}
.sig span:last-child{min-height:120px;min-width:230px;flex:1.6}
.sig .cachet{display:block;height:121px}
.fs-sig{grid-template-columns:27fr 27fr 46fr}.fs-sig div{height:96px}.fs-sig div:last-child{height:151px}.fs-sig{align-items:start}
.fs{line-height:1.2}.fs p{margin:3px 0}.fs-par p{margin:2px 0}.fs-title{margin:2px auto 7px}.paper .fs-tab th,.paper .fs-tab td{line-height:1.2;padding:3px 4px}.fs-fait{margin-top:5px!important}
</style>
</head>

// Notes de démonstration : remplit les évaluations demandées (laisse quelques trous si « trous » est vrai)
function genNotes(students,grades,evals,trous){
 students.forEach((s,i)=>{if(s.statut!=='Inscrit')return;const b=(((i*29)%9)-4)/22;
  evals.forEach(n=>matieres(s.classe,n).forEach(([m,w],k)=>{
   if(trous&&i%11===4&&k>=2)return;const key=`${s.id}|${n}|${m}`;if(grades[key]!=null)return;
   const r=Math.max(.12,Math.min(.97,.56+b+(((k*7+i*3+n*5)%7)-3)/22));grades[key]=Math.round(r*noteMax(s.classe,w)*2)/2}))});
}

const startYear=()=>parseInt(S.school.year)||2026;
const active=()=>S.students.filter(s=>s.statut==='Inscrit');
const byName=(a,b)=>(a.nom+a.prenoms).localeCompare(b.nom+b.prenoms,'fr');
const byClass=(a,b)=>CLASSES.indexOf(a.classe)-CLASSES.indexOf(b.classe)||byName(a,b);
const fmtNais=s=>s.ageEstime&&s.naissance?`vers ${s.naissance.slice(0,4)} (sans extrait)`:fmtDate(s.naissance);
const ageOf=s=>{if(!s.naissance)return null;const b=parseISO(s.naissance),r=new Date(startYear(),9,1);let a=r.getFullYear()-b.getFullYear();if(r<new Date(r.getFullYear(),b.getMonth(),b.getDate()))a--;return a};
const ageAnom=s=>{const a=ageOf(s);return a!=null&&a-AGE_NORMAL[s.classe]>=3};

const isAbs=(id,n)=>!!S.compAbs[id+'|'+n];
// Total et moyenne d'une évaluation (COEF : Σ note×coef ÷ Σ coef ; BARÈME : Σ notes ÷ Σ barèmes × échelle). Absent = 0.
function evalRes(s,n){
 if(isAbs(s.id,n))return {total:0,moy:0,abs:true};
 const L=matieres(s.classe,n).map(([m,w])=>[gv(s.id,n,m),w]).filter(([v])=>v!=null);if(!L.length)return null;
 const g=grille(s.classe),den=L.reduce((a,[,w])=>a+w,0);
 if(g.mode==='COEF'){const p=L.reduce((a,[v,w])=>a+v*w,0);return {total:xr(p),moy:xr(p/den)}}
 const t=L.reduce((a,[v])=>a+v,0);return {total:xr(t),moy:xr(t/den*g.echelle)};
}
const moyEval=(s,n)=>evalRes(s,n)?.moy??null;
const moy3=s=>{const v=[1,2,3].map(n=>moyEval(s,n)).filter(x=>x!=null);return v.length?xr(mean(v)):null};
// MGA : CP1 à CM1 = (moyenne des 3 compositions + 2 × composition de passage) ÷ 3 ; CM2 = moyenne des 4 évaluations (toutes saisies)
function mga(s){
 const m=[1,2,3,4].map(n=>moyEval(s,n));
 if(info(s.classe).regle==='MOYENNE4')return m.every(v=>v!=null)?xr(mean(m)):null;
 const a=moy3(s);return a==null||m[3]==null?null:xr((a+2*m[3])/3);
}
const score=(s,per)=>per==='A'?mga(s):(isAbs(s.id,per)?null:moyEval(s,per));
// Mention de l'application (note ramenée sur 10)
const mention=(v,c)=>{if(v==null)return '—';const x=v/ech(c)*10;return x>=8?'Très bien':x>=7?'Bien':x>=6?'Assez bien':x>=5?'Passable':'Insuffisant'};
function ranking(cls,per){
 const L=active().filter(s=>s.classe===cls).map(s=>({s,avg:score(s,per)}));
 const w=L.filter(x=>x.avg!=null).sort((a,b)=>b.avg-a.avg||byName(a.s,b.s));
 w.forEach(x=>x.rank=1+w.filter(o=>o.avg>x.avg).length);
 return {w,all:[...w,...L.filter(x=>x.avg==null).sort((a,b)=>byName(a.s,b.s))]};
}
const rankTxt=r=>r?r+(r===1?'er':'e'):'—';
const classAvg=(cls,per)=>{const v=active().filter(s=>s.classe===cls).map(s=>score(s,per)).filter(v=>v!=null);return v.length?xr(mean(v)):null};
const reussite=(cls,per)=>{const v=active().filter(s=>s.classe===cls).map(s=>score(s,per)).filter(v=>v!=null);return {n:v.length,ok:v.filter(x=>x>=info(cls).seuil).length}};
const missingNotes=(cls,n)=>active().filter(s=>(!cls||s.classe===cls)&&!isAbs(s.id,n)).reduce((k,s)=>k+matieres(s.classe,n).filter(([m])=>gv(s.id,n,m)==null).length,0);
function decisionProp(s){if(s.statut!=='Inscrit')return s.statut;const a=mga(s);return a==null?'':a>=info(s.classe).seuil?'Admis':'Redoublant'}
const decisionOf=s=>s.decision||decisionProp(s);
const decTag=d=>d?`<span class="tag ${d==='Admis'?'ok':d==='Redoublant'?'warn':'bad'}">${d}</span>`:'<span class="tag">MGA incomplète</span>';
const teacherOf=c=>S.teachers.find(t=>t.classe===c);
const absOf=id=>Object.entries(S.att).filter(([,m])=>m[id]).map(([d,m])=>({d,v:m[id]})).sort((a,b)=>b.d.localeCompare(a.d));
const isFemme=t=>/^(mme|mlle)/i.test(t.nom)||/ice$|rice|adjointe|Directrice/.test(t.fonction);

// date d'entrée : date du jour, non modifiable, pour une inscription au CP1 ; à renseigner pour les autres classes
const entreeIn=(c,v,neuf)=>c==='CP1'?`<input type="date" name="entree" value="${esc(neuf||!v?today:v)}" readonly title="Inscription au CP1 : date du jour">`:`<input type="date" name="entree" value="${esc(v)}">`;

function stuErr(f){
 const ex=f.get('extrait')==='on',P=k=>(f.get(k+'_nom')||'').trim()&&(f.get(k+'_prenoms')||'').trim();
 if(ex){if(!f.get('naissance'))return 'Saisissez la date de naissance (jour, mois, année).';if(!P('pere')||!P('mere'))return 'Avec un extrait, les nom et prénoms du père et de la mère sont obligatoires.'}
 else{const a=Number(f.get('age'));if(!a||a<2||a>20)return 'Saisissez l’âge de l’enfant (en années).';if(!P('pere')&&!P('mere')&&!(f.get('tuteur')==='on'&&(f.get('parent')||'').trim()))return 'Sans extrait, le nom et les prénoms de l’un des parents ou du tuteur sont obligatoires.'}

  parent:tut?majNomComplet(f.get('parent').trim()):'',tel:tut?f.get('tel').trim():'',redoublant:f.get('redoublant')==='on',extrait:ex,

 if(ui.tmpPhoto!==undefined)s.photo=ui.tmpPhoto;if(ui.tmpExtrait!==undefined)s.extraitPhoto=ui.tmpExtrait;return s;

function blocSynthese(edit){

 return {table:`<table class="small"><thead><tr><th>N°</th><th>MATRICULE</th><th>NOM ET PRÉNOMS <span style="font-weight:400">(ordre alphabétique)</span></th>${M.map(([m,w])=>`<th>${MAT_COURT[m]||m}<br><span style="font-weight:400">/${noteMax(c,w)}</span></th>`).join('')}<th>TOTAL</th><th>MOYENNE<br><span style="font-weight:400">/${e}</span></th><th>OBS</th></tr></thead><tbody>${rows||`<tr><td colspan="${M.length+6}">Aucun élève inscrit.</td></tr>`}</tbody></table>`,recap};

const MM=96/25.4,pageW=p=>(p?273:186)*MM,pageH=p=>(p?186:273)*MM*.95;   // A4 moins les marges de 12 mm, avec une marge de sécurité
function fitScale(html,paysage){
 const m=document.createElement('div');m.className='paper';m.style.cssText=`position:absolute;left:-99999px;top:0;visibility:hidden;border:0;padding:0;border-radius:0;width:${pageW(paysage)}px`;
 m.innerHTML=html;document.body.appendChild(m);const H=pageH(paysage);let z=1,h=m.scrollHeight;
 for(let i=0;i<10&&h*z>H;i++){z=Math.max(.4,Math.min(z*.985,H/h));m.style.width=pageW(paysage)/z+'px';h=m.scrollHeight}
 m.remove();return z;
}
const fitWrap=(html,paysage)=>{const z=fitScale(html,paysage);return z<1?`<div style="zoom:${z.toFixed(3)};width:${(pageW(paysage)/z).toFixed(1)}px">${html}</div>`:html};
function pagesOf(html,paysage){const m=document.createElement('div');m.className='paper';m.style.cssText=`position:absolute;left:-99999px;top:0;visibility:hidden;border:0;padding:0;width:${pageW(paysage)}px`;m.innerHTML=html;document.body.appendChild(m);const h=m.scrollHeight;m.remove();return Math.max(1,Math.ceil(h/pageH(paysage)))}
const fitInfo=(html,paysage,fit=true)=>{if(!fit){const n=pagesOf(html,paysage);return `Impression : A4 ${paysage?'paysage':'portrait'}, ${plural(n,'page')} en taille normale`}
 const z=fitScale(html,paysage);return `Impression : A4 ${paysage?'paysage':'portrait'}, une seule page${z<.995?` (réduit à ${Math.round(z*100)} %)`:''}${z<.7?'. Texte très réduit : retirez un bloc ou passez en paysage':''}`};

function parseCSV(t){
 t=t.replace(/^﻿/,'');const first=t.split(/\r?\n/)[0]||'';const sep=first.split(';').length>=first.split(',').length?';':',';
 const rows=[];let row=[],cur='',q=false;
 for(let i=0;i<t.length;i++){const c=t[i];
  if(q){if(c==='"'){if(t[i+1]==='"'){cur+='"';i++}else q=false}else cur+=c}
  else if(c==='"')q=true;else if(c===sep){row.push(cur);cur=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(cur);rows.push(row);row=[];cur=''}else cur+=c}
 if(cur||row.length){row.push(cur);rows.push(row)}
 return rows.filter(r=>r.some(x=>x.trim()));
}

   return `<tr><td>${c} <span class="sub">${esc(teacherOf(c)?.nom||'')}</span></td><td class="c">${a||'—'}</td><td class="c"><button class="btn sm" data-act="ensSaisie" data-c="${c}">${x.fermee?'Rouvrir la saisie':'Fermer la saisie'}</button></td><td class="c"><input type="date" value="${x.fin||''}" data-ch="ensFin" data-c="${c}" aria-label="Date limite ${c}"></td><td class="r">${a?`<button class="btn sm pri" data-act="ensValider" data-c="${c}">${ic('check')}Valider ${a} note(s)</button>`:''}</td></tr>`}).join('')}</tbody></table></div>
  <p class="sub">Après la date limite, la saisie se ferme d’elle-même pour l’enseignant. Les téléphones des enseignants reçoivent un rappel 3 jours, 1 jour et le jour même.</p>`;
 }
 function ensMessages(){const dest=[['','Tous les enseignants'],...S.teachers.filter(t=>t.compte).map(t=>[t.id,t.nom])],nb=S.teachers.filter(t=>t.compte).length;
  return `<div class="grid g2"><form class="card" id="msgForm"><h3>Nouveau message</h3><div class="fg" style="margin-top:10px">${field('Destinataire',`<select name="dest">${opts(dest,'')}</select>`,1)}${field('Objet',`<input name="titre" required>`,1)}${field('Message',`<textarea name="texte" rows="4" required></textarea>`,1)}</div><button class="btn pri" type="submit" style="margin-top:10px">${ic('mail')}Envoyer</button></form>
  <div class="card"><h3>Messages envoyés</h3>${S.messages.length?S.messages.map(m=>{const lus=Object.keys(m.lus).length,att=m.dest?1:nb;return `<div style="border-top:1px solid var(--line);padding:8px 0"><b>${esc(m.titre)}</b> <span class="sub">· ${m.dest?esc(S.teachers.find(t=>t.id===m.dest)?.nom||''):'tous'} · ${new Date(m.t).toLocaleString('fr-FR')}</span><div>${esc(m.texte)}</div><div class="sub">Lu par ${lus}/${att}${lus?' : '+Object.keys(m.lus).map(id=>esc(S.teachers.find(t=>t.id===id)?.nom||'')).join(', '):''}</div></div>`}).join(''):'<p class="sub">Aucun message.</p>'}</div></div>`;
 }
 function ensJournal(){const L=S.teachers.filter(t=>t.compte);if(!ui.ensJ&&L[0])ui.ensJ=L[0].compte.login;
  const ent=S.log.filter(e=>e.m.startsWith('['+ui.ensJ+']'));
  return `<div class="bar"><select data-ch="ensJ" aria-label="Enseignant">${opts(L.map(t=>[t.compte.login,t.nom]),ui.ensJ)}</select></div><div class="card">${ent.length?ent.map(e=>`<div style="padding:6px 0;border-top:1px solid var(--line)"><span class="sub">${new Date(e.t).toLocaleString('fr-FR')}</span> · ${esc(e.m.replace(/^\[[^\]]*\]\s*/,''))}</div>`).join(''):'<p class="sub">Aucune action enregistrée pour ce compte. Passez sur son profil (en haut) et saisissez une note pour voir le journal se remplir.</p>'}</div>`;
 }
 // ---------- actions ----------
 Object.assign(acts,{
  ensCreer(t){const m=S.teachers.find(x=>x.id===t.dataset.id),mdp='Prov-'+Math.random().toString(36).slice(2,7).toUpperCase();
   modal('Créer le compte de '+esc(m.nom),field('Identifiant',`<input name="login" value="${esc(loginDe(m.nom))}" required autofocus>`)+`<p class="sub">Mot de passe provisoire : <b>${mdp}</b>. L’enseignant le changera à sa première connexion et recevra son code de secours.</p>`,
    {ok:'Créer',onok:f=>{const l=f.get('login').trim();if(S.teachers.some(x=>x.compte&&x.compte.login===l)){toast('Identifiant déjà utilisé');return false}m.compte={login:l,actif:true,cree:today};log(`Compte enseignant créé : ${l} (${m.classe})`);save();render()}})},
  ensReinit(t){const m=S.teachers.find(x=>x.id===t.dataset.id);modal('Mot de passe provisoire',`<p>Nouveau mot de passe provisoire de <b>${esc(m.nom)}</b> : <b>Prov-${Math.random().toString(36).slice(2,7).toUpperCase()}</b></p>`,{noFoot:true});log(`Mot de passe réinitialisé : ${m.compte.login}`)},
  ensActif(t){const m=S.teachers.find(x=>x.id===t.dataset.id);m.compte.actif=!m.compte.actif;log(`Compte ${m.compte.login} ${m.compte.actif?'activé':'désactivé (téléphones bloqués)'}`);save();render()},
  ensFiche(t){const m=S.teachers.find(x=>x.id===t.dataset.id);m.actif=!m.actif;if(!m.actif&&m.compte)m.compte.actif=false;log(`Fiche de ${m.nom} ${m.actif?'réactivée':'désactivée : compte et téléphones bloqués'}`);save();render()},
  ensSaisie(t){const x=sk(t.dataset.c,S.school.evalCourante);x.fermee=!x.fermee;log(`Saisie ${x.fermee?'fermée':'rouverte'} : ${t.dataset.c}`);save();render()},
  ensValider(t){const c=t.dataset.c,n=String(S.school.evalCourante);let k=0;Object.keys(S.attente).forEach(key=>{const[id,e]=key.split('|');if(e===n&&S.students.find(s=>s.id===id)?.classe===c){S.grades[key]=S.attente[key];delete S.attente[key];k++}});log(`${k} note(s) validée(s) : ${c}`);toast(`${k} note(s) validée(s) : elles comptent désormais`);save();render()},
  lireMsg(){const p=prof(),L=S.messages.filter(m=>!m.dest||m.dest===p.id);modal(`${ic('mail')} Messages du directeur`,L.map(m=>`<div style="border-top:1px solid var(--line);padding:8px 0"><b>${esc(m.titre)}</b> <span class="sub">${new Date(m.t).toLocaleString('fr-FR')}</span><div>${esc(m.texte)}</div></div>`).join(''),{noFoot:true,onclose:()=>{L.forEach(m=>{if(!m.lus[p.id])m.lus[p.id]=Date.now()});log(tag()+'Messages lus');save();render()}})},
  idUnlock(){askPwd('Les informations de l’école sont verrouillées depuis leur première saisie. Les modifier ?').then(ok=>{if(ok){ui.idUnlocked=true;render()}})},
  secoursNew(){askPwd('Créer un nouveau code de secours ? L’ancien ne servira plus.').then(ok=>{if(!ok)return;const A='23456789ABCDEFGHJKLMNPQRSTUVWXYZ';let c='';for(let i=0;i<12;i++)c+=A[Math.floor(Math.random()*32)];S.school.secours=c.match(/.{4}/g).join('-');save();montrerSecours()})},
  pwdOubli(){closeDlg();setTimeout(()=>modal(`${ic('key')} Mot de passe oublié`,`<p class="sub" style="margin-top:0">Saisissez le code de secours (remis à la création du compte, ou dans Paramètres), puis le nouveau mot de passe. Démonstration : ${esc(S.school.secours)}.</p>${field('Code de secours',`<input name="code" autofocus autocomplete="off" placeholder="XXXX-XXXX-XXXX">`,1)}${field('Nouveau mot de passe',`<input name="nw" type="password" required minlength="4">`,1)}`,
   {ok:'Valider',onok:f=>{const n=v=>String(v||'').toUpperCase().replace(/[^0-9A-Z]/g,'');if(n(f.get('code'))!==n(S.school.secours)){toast('Code de secours incorrect');return false}S.school.adminPwd=f.get('nw');const A='23456789ABCDEFGHJKLMNPQRSTUVWXYZ';let c='';for(let i=0;i<12;i++)c+=A[Math.floor(Math.random()*32)];S.school.secours=c.match(/.{4}/g).join('-');log('Mot de passe administrateur changé avec le code de secours');save();setTimeout(montrerSecours,50)}}),30)}
 });
 function montrerSecours(){modal(`${ic('key')} Code de secours`,`<p>Il permet de choisir un nouveau mot de passe en cas d’oubli, sans Internet. Notez-le et rangez-le en lieu sûr ; il ne sert qu’une fois.</p><p style="font-size:22px;font-weight:700;letter-spacing:2px;text-align:center">${esc(S.school.secours)}</p>`,{noFoot:true})}
 Object.assign(chs,{
  profil(t){const v=t.value;S.session=v==='dir'?{role:'dir'}:{role:'ens',tid:v.slice(4)};save();toast(v==='dir'?'Profil : directeur':'Profil : '+prof().nom);location.hash='#accueil';render()},
  ensValid(t){S.school.validation=t.checked;log(`Validation des notes par le directeur : ${t.checked?'oui':'non'}`);save()},
  ensFin(t){sk(t.dataset.c,S.school.evalCourante).fin=t.value;log(`Date limite de saisie ${t.dataset.c} : ${t.value?fmtDate(t.value):'aucune'}`);save()},
  ensJ(t){ui.ensJ=t.value;render()}
 });
 // notes saisies par un enseignant : en attente de validation
 const grade0=chs.grade;
 // Enseignant : ni inscription, ni modification ou suppression d’élève, ni changement de classe ; appel Présent / Absent, une absence est définitive.
 document.head.insertAdjacentHTML('beforeend','<style>body.ens [data-act=addStu],body.ens [data-act=delStu],body.ens [data-act=editStu],body.ens [data-act=depart],body.ens [data-act=editTea],body.ens [data-act=delTea]{display:none!important}body.ens #schoolChip .tag,body.ens [data-act=authOk],body.ens [data-act=authNo],body.ens [data-act=delAuth]{display:none!important}body.ens [data-ch=teach],body.ens [data-ch=stuSt]{pointer-events:none;appearance:none;border-color:transparent;background:none}</style>');
 const ENS_INTERDIT={addStu:'L’inscription des élèves est réservée au directeur.',delStu:'Seul le directeur peut supprimer un élève.',editStu:'Seul le directeur peut modifier un élève.',depart:'Seul le directeur peut modifier un élève.',editTea:'Seul le directeur peut modifier le personnel.',authOk:'Seul le directeur accorde ou refuse une demande.',authNo:'Seul le directeur accorde ou refuse une demande.',delAuth:'Seul le directeur peut supprimer une demande.',delTea:'Seul le directeur peut modifier le personnel.'};
 Object.keys(ENS_INTERDIT).forEach(k=>{const f=acts[k];if(f)acts[k]=function(t){if(prof()){toast(ENS_INTERDIT[k]);return}return f.apply(this,arguments)}});
 ['teach','stuSt'].forEach(k=>{const f=chs[k];chs[k]=function(t){if(prof()){toast(k==='teach'?'Seul le directeur affecte les classes.':'Seul le directeur peut modifier un élève.');render();return}return f.apply(this,arguments)}});
 // demandes d'autorisation : l'enseignant demande pour lui-même ou pour un élève de sa classe, et ne voit que celles-là
 window.authVisible=a=>{const p=prof();if(!p)return true;if(a.qui==='personnel')return a.pid===p.id;const s=S.students.find(x=>x.id===a.pid);return !!s&&s.classe===p.classe};
 const addAuth0=acts.addAuth;acts.addAuth=function(t){const p=prof();if(!p)return addAuth0.call(this,t);
  const id=t?.dataset?.id,qui=t?.dataset?.qui;addAuth0.call(this,qui?t:{dataset:{qui:'personnel',id:p.id}});
  $$('#dl-personnel option').forEach(o=>{if(o.value!==p.nom)o.remove()});$$('#dl-eleve option').forEach(o=>{if(!o.value.endsWith(' – '+p.classe))o.remove()});
  const i=$('#authNom');if(i&&$('[name=qui]').value==='personnel')i.value=p.nom};
 const authQui0=chs.authQui;chs.authQui=function(t){authQui0.call(this,t);const p=prof();if(p&&t.value==='personnel')$('#authNom').value=p.nom};
 // liste de la classe par ordre alphabétique
 const printStu0=acts.printStu;acts.printStu=function(){const p=prof();if(!p)return printStu0.call(this);printList(`Liste de la classe ${p.classe} · ordre alphabétique`,stuTable(active().filter(s=>s.classe===p.classe).sort(byName)))};
 const pa0=acts.pa;acts.pa=function(t){if(prof()&&(S.att[ui.aDate]||{})[t.dataset.id]){toast('Absence déjà enregistrée : elle ne peut plus être modifiée.');return}return pa0.call(this,t)};
 const allPres0=acts.allPres;acts.allPres=function(){if(!prof())return allPres0.call(this);(S.appel[ui.aDate]||(S.appel[ui.aDate]={}))[ui.aCls]=true;save();toast(`${ui.aCls} : les autres élèves sont présents`);render()};
 chs.grade=async function(t){const p=prof(),n=Number(ui.nEv);
  if(!p||!S.school.validation)return grade0(t).then(()=>{if(p)log(tag()+`Note saisie : ${t.dataset.m} (${ui.nCls})`)});
  if(!ouverte(ui.nCls,n)){toast('La saisie est fermée pour cette évaluation');return}
  const k=gk(t.dataset.id,n,t.dataset.m);if(S.grades[k]!=null)return grade0(t);
  const raw=t.value.trim().replace(',','.'),max=Number(t.dataset.max);
  if(raw===''){delete S.attente[k];save();return}
  const v=Number(raw);if(!/^\d+(\.\d+)?$/.test(raw)||v>max){toast(`Note invalide : entrez un nombre entre 0 et ${max}.`);t.value='';return}
  S.attente[k]=v;t.classList.add('att');const s=S.students.find(x=>x.id===t.dataset.id);log(tag()+`Note saisie : ${fullName(s)}, ${t.dataset.m} = ${fmt(v)} (en attente)`);save();
 };
 // ---------- Paramètres : identité verrouillée, code de secours ----------
 const IDF=['name','iepp','drenaet','localite','sp','codedren','codeiep','codeecole','ministere','direction','inspection'];
 function apresParametres(){
  const f=$('#setForm');if(!f)return;
  if(S.school.idLock&&!ui.idUnlocked){IDF.forEach(k=>{const i=f.elements[k];if(i)i.disabled=true});f.insertAdjacentHTML('afterbegin',`<div class="note mb">${ic('lock')}<span>Identité de l’école verrouillée depuis sa première saisie. <button type="button" class="btn sm" data-act="idUnlock">Modifier l’identité de l’école…</button></span></div>`)}
  const pf=$('#pwdForm');if(pf)pf.insertAdjacentHTML('afterend',`<div style="margin-top:12px"><b>Mot de passe oublié</b><p class="sub" style="margin:4px 0 8px">Le code de secours permet de choisir un nouveau mot de passe administrateur, sans Internet.</p><button class="btn sm" data-act="secoursNew">${ic('key')}Nouveau code de secours</button></div>`);
 }
 document.addEventListener('submit',e=>{if(e.target.id==='setForm'&&!ui.idUnlocked){IDF.forEach(k=>{const i=e.target.elements[k];if(i)i.disabled=false})}
  if(e.target.id==='setForm'){setTimeout(()=>{S.school.idLock=true;ui.idUnlocked=false;save();render()},0)}
  if(e.target.id==='msgForm'){e.preventDefault();const d=new FormData(e.target);S.messages.unshift({id:uid(),t:Date.now(),dest:d.get('dest'),titre:d.get('titre').trim(),texte:d.get('texte').trim(),lus:{}});log('Message envoyé : '+d.get('titre').trim());toast('Message envoyé');save();render()}},true);
 // ---------- « Mot de passe oublié ? » dans la fenêtre du mot de passe administrateur ----------
 const askPwd0=askPwd;
 askPwd=function(msg){const p=askPwd0(msg);const e=$('#pwdErr');if(e)e.insertAdjacentHTML('afterend','<button type="button" class="lk" data-act="pwdOubli" style="margin-top:8px">Mot de passe oublié ?</button>');return p};
 render();
})();

<script>
/* Aperçu A4 : sur un écran plus étroit qu'une page A4 (téléphone), le document garde sa mise en page A4
   (portrait 210 mm, paysage 297 mm) et est réduit à la largeur de l'écran, comme une page imprimée. */
function ajusterPapiers(){document.querySelectorAll('.paperwrap>.paper,#dlg .paper').forEach(p=>{
 const W=p.classList.contains('land')?1123:794;p.style.zoom='';p.style.width='';p.style.minWidth='';p.style.maxWidth='';
 const box=p.parentElement.clientWidth;if(!box||box>=W)return;
 p.style.width=W+'px';p.style.minWidth=W+'px';p.style.maxWidth='none';p.style.zoom=(box/W).toFixed(4)})}
(function(){const r=render,m=modal;render=function(){const x=r.apply(this,arguments);ajusterPapiers();return x};
 modal=function(){const x=m.apply(this,arguments);ajusterPapiers();return x};
 addEventListener('resize',ajusterPapiers);document.addEventListener('DOMContentLoaded',ajusterPapiers);ajusterPapiers()})();
</script>
