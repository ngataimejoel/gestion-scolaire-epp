plugins {
    id "com.android.application"
}

// Version : celle de l'application Windows (epp/__init__.py), pour qu'un même numéro désigne les deux.
def versionWindows = (file("../../epp/__init__.py").text =~ /__version__ = "([0-9.]+)"/)[0][1]
def parties = versionWindows.tokenize(".").collect { it as int } + [0, 0, 0]

// Codes hors ligne courts (25 caractères) : secret GitHub AKWA_CLES_CODES_COURTS (« 1:base64 », donné par le générateur
// du fournisseur), injecté masqué dans BuildConfig.AC ; jamais dans le dépôt public. Sans lui, ces codes sont refusés.
def masquerCles = { String texte ->
    (texte ?: "").split("[,;]").findAll { it.contains(":") }.collect { String p ->
        def (n, v) = p.trim().split(":", 2) as List
        byte[] brut = v.trim().decodeBase64()
        byte[] m = java.security.MessageDigest.getInstance("SHA-256").digest(("AKWA-AC|" + n.trim()).getBytes("US-ASCII"))
        byte[] r = new byte[brut.length]
        for (int i = 0; i < brut.length; i++) {
            r[i] = (byte) (brut[i] ^ m[i % m.length])
        }
        n.trim() + ":" + r.encodeBase64().toString()
    }.join(",")
}

android {
    namespace "com.akwaschool.mobile"
    compileSdk 35

    // BuildConfig.DEBUG : seule une compilation de débogage échappe au contrôle de signature (Integrite)
    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId "com.akwaschool.mobile"
        minSdk 26
        targetSdk 35
        versionCode parties[0] * 10000 + parties[1] * 100 + parties[2]
        versionName versionWindows
        buildConfigField "String", "AC", "\"${masquerCles(System.getenv("AKWA_CLES_CODES_COURTS"))}\""
    }

    // Signature : clé privée gardée hors du dépôt, fournie par les secrets GitHub (ANDROID_KEYSTORE_B64 décodé dans
    // ANDROID_KEYSTORE_FILE, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD). Sans elle, la
    // version publiable ne se construit pas ; la version de mise au point garde la clé de débogage d'Android.
    def cle = System.getenv("ANDROID_KEYSTORE_FILE")
    signingConfigs {
        if (cle) {
            publication {
                storeFile file(cle)
                storeType "pkcs12"
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (cle) signingConfig signingConfigs.publication
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    // scan des feuilles de notes et des extraits de naissance : lecture du texte sur le téléphone (modèle inclus,
    // sans Internet) et scanner de documents d'Android (bords, redressement, nettoyage de la page)
    implementation "com.google.mlkit:text-recognition:16.0.1"
    implementation "com.google.android.gms:play-services-mlkit-document-scanner:16.0.0-beta1"
}
